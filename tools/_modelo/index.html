<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Sem project.json, o explorador usa este <title> e a meta description -->
  <title>Título da página</title>
  <meta name="description" content="Uma frase curta explicando a página.">
  <style>
    /* Estilo só desta página. Cada página pode ter o visual que quiser. */
    body { margin: 0; font: 17px/1.7 system-ui, sans-serif; color: #f3e8ff; background: #14012b; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 20px; }
    a { color: #ff4fa3; }
    h1 { color: #ff1f4b; }
  </style>
</head>
<body>
  <main>
    <h1>Título da página</h1>
    <p>Este é o <strong>modelo</strong> da pasta <code>tools/</code>. Copie esta pasta <code>_modelo</code> para uma pasta nova
       (sem o <code>_</code> no começo, ex.: <code>tools/minha-pagina/</code>) e troque o conteúdo.</p>
    <p>Imagens e arquivos ficam dentro da própria pasta, com caminhos relativos (ex.: <code>img/print.webp</code>).</p>
  </main>
</body>
</html>
