# Gera o files.json a partir das pastas e publica o site no GitHub Pages.
# Requer: Settings > Pages > Source = "GitHub Actions".
name: Site (files.json + Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commitar o files.json atualizado
  pages: write      # publicar no Pages
  id-token: write   # exigido pelo deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # histórico completo: usado para as datas das páginas

      - name: Gerar files.json
        run: node scripts/build-files.mjs

      - name: Commitar files.json (se mudou)
        run: |
          git add files.json
          if git diff --cached --quiet; then
            echo "files.json já está em dia."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: atualiza files.json [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
