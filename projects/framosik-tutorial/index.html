i falsch zugeordneten Wiederholungsmustern. Prüfe bei einem plausiblen, aber abgelehnten Bild zuerst Beschnitt, Bewegung und Schrittweite. Senke erst danach um einige Punkte und vergleiche die Konturen.","overlap":"Verlangt einen Mindestanteil gemeinsam sichtbarer, ausreichend deckender Pixel. Bei 20 % muss ungefähr ein Fünftel des Arbeitsbilds überlappen. Ein höherer Wert schließt kleine, mehrdeutige Treffer aus. Bei großen Sprüngen reduziere zuerst die Schrittweite.","limit":"Begrenzt die Fläche des umschließenden Rechtecks einschließlich transparenter Lücken. 6000 × 4000 Pixel ergeben 24 MP. Eine höhere Grenze erlaubt größere Bilder und benötigt mehr Speicher. Bei einem Stopp kannst du die Auflösung senken oder den Bereich teilen.","skip":"Aktiviert vergleicht das Programm nach einem Fehlschlag das nächste Bild mit dem letzten angenommenen. Das hilft bei einem einzelnen unscharfen Bild. Deaktiviert stoppt es beim ersten verworfenen Bild mit einem Teilergebnis. Große Lücken bleiben problematisch.","mode":"Legt fest, wie ausgerichtete Pixel kombiniert werden. Vergleiche die Modi mit identischem Bereich und identischer Auflösung. Vergrößere eine feine Linie, die einen Übergang kreuzt, und prüfe, ob sie einfach und scharf bleibt.","preserve":"Füllt neu sichtbare Flächen und bewahrt bereits vorhandene Pixel. Gut für klare Zeichnungskonturen. Beim Zoom kann ein späteres Bild auch einen zuvor nur teilweise gedeckten Randpixel ergänzen.","feather":"Überblendet die Überlappung neben neu sichtbaren Flächen. Probiere es bei leichten Farbwechseln auf einer Wand. Erkennst du zwei versetzte Umrisse, kontrolliere die Ausrichtung vor dem Verbreitern der Übergangszone.","feather_width":"Nur beim Überblenden verfügbar. Gibt die Übergangsbreite in Arbeitspixeln an. Vergleiche 8 und 32 px an derselben Linie. Schmale Bänder bewahren feine Striche, breite verteilen einen Farbwechsel über mehr Pixel.","average":"Mischt bei jedem Schritt Mosaik und neues Bild in der Überlappung zu gleichen Teilen. Mehrfach bedeckte Punkte werden wiederholt gemischt. Das kann Farbschwankungen mildern oder eine bewegte Hand doppelt sichtbar machen.","left":"Entfernt vor der Ausrichtung Spalten am linken Rand. Trage für einen festen schwarzen Streifen von 12 px den Wert 12 ein. Miss im Original und erhalte benachbarte feste Merkmale für die Zuordnung.","top":"Entfernt Zeilen am oberen Rand, etwa für eine feste Leiste. Die Einheit ist der Quellpixel, auch bei 50 % Arbeitsauflösung. Der Beschnitt gilt beim nächsten Durchlauf für jedes ausgewählte Bild.","right":"Entfernt Spalten von rechts. Bei einem symmetrischen Rand von 8 px trägst du links und rechts je 8 ein. Von ursprünglich 480 px Breite bleiben vor der Skalierung 464 px.","bottom":"Entfernt Zeilen von unten. Für Untertitel in den untersten 32 px probiere 32 und prüfe die Montage auf Schriftreste. Nach allen vier Rändern müssen mindestens 32 × 32 Quellpixel übrig sein. Die Originalansicht zeigt weiterhin das ganze Bild.","stitch":"Startet eine neue Montage mit den aktuellen Einstellungen. Die Ergebnisansicht öffnet sich, während der Berechnung sind die Einstellungen gesperrt. Sichere Vergleichsversionen vor dem nächsten Durchlauf.","result":"Zeigt regelmäßig eine wachsende Vorschau. Während der Verarbeitung kann die längste Seite auf 1400 px reduziert sein. Am Ende erscheint das Ergebnis in seiner vollen Auflösung. Beurteile Übergänge dann.","fit":"Passt das gesamte Mosaik in den sichtbaren Bereich ein. Nutze dies nach dem Vergrößern einer Naht oder einer Größenänderung des Fensters. Die automatische Anpassung folgt der wachsenden Arbeitsfläche.","zoom":"Setzt die Ansicht auf 100 % zur Pixelkontrolle. Mit dem Mausrad zoomst du über dem Bild, durch Ziehen verschiebst du es. Über den Einstellungen scrollt das Rad durch die Optionen. Die PNG-Größe bleibt beim Ansichtszoom gleich.","log":"Lies Bildnummer, Übereinstimmung und Versatz Δ in X und Y zusammen. Ein angenommenes Bild mit fast keinem Versatz kann eine Wiederholung sein und kaum neue Fläche zeigen. Mehrere Ablehnungen weisen auf einen zu prüfenden Abschnitt hin.","cancel":"Fordert den Abbruch zwischen Bildern an. Warte vor dem Export auf das Ende der Aufgabe. Ein vorhandenes Teilergebnis lässt sich prüfen, nachbearbeiten und speichern. Lange Videos kannst du in weiteren Bereichen fortsetzen.","seam_soft":"Glättet feine Abweichungen nahe erkannten Übergängen mit einem kantensensitiven Filter. Vergleiche 0 % und 10 % bei 100 % Ansichtszoom. Erhöhe vorsichtig und senke den Wert, wenn feine Linien weich werden.","seam_color":"Nähert die Farbe am Übergang dem Median der Nachbarpixel an. Geeignet für eine schmale andersfarbige Linie vor ruhigem Hintergrund. Probiere 10–20 % bei Glättung null. Bearbeitet werden deckende Bereiche nahe markierten Nähten.","apply_finish":"Berechnet beide Effekte vom ursprünglichen Mosaik aus. Zweimaliges Anwenden identischer Werte ergibt dasselbe Bild. Setze zum Vergleich beide auf null und wende sie erneut an. Übernimm geänderte Werte vor dem Export.","export":"Speichert ein PNG mit der zuletzt angewendeten Nachbearbeitung. Ungedeckte Bereiche können transparent sein. Prüfe Kanten vor verschiedenen Hintergründen und speichere Vergleichsfassungen unter verschiedenen Namen. Tastenkürzel {ctrlS}.","report":"Schreibt einen JSON-Bericht. accepted und rejected enthalten Bildnummern, frames enthält einzelne Bewertungen und Verschiebungen, reason den Abbruchgrund. Die Listen zählen ab 1. In settings zählen first und last ab 0.","theme":"Wähle {dark} oder {light} passend zum Umgebungslicht. Das Design verändert die Bedienfläche und den Hintergrund um das Bild. Wechsle es, um transparente Kanten vor verschiedenen Hintergründen zu betrachten.","language":"Ändert Beschriftungen und Meldungen und merkt sich die Wahl beim nächsten Start. Dieses Handbuch hat oben eine eigene Sprachauswahl. Du kannst auf Deutsch lesen und gleichzeitig die englische Programmoberfläche verwenden.","gradients":"Aktiviert Verläufe und Leuchtränder an Titel und Bedienelementen. Beim Ausschalten wird die Darstellung statisch und die Animationsoption inaktiv. Die Auswahl bleibt gespeichert.","animations":"Animiert bei aktiven Verläufen den Pixeltitel und die Hervorhebungen. Schalte es für weniger Bewegung bei gleicher Farbgestaltung aus. Die Effekte pausieren während der Verarbeitung oder bei inaktivem Fenster.","about":"Zeigt installierte Version und Links zu Website, Repository und Spendenseite. Vergleiche bei unterschiedlichen Ergebnissen zweier Installationen zuerst die Versionsangaben und danach die Einstellungen."},"workshops":[{"title":"Die Bildauswahl prüfen","try":"Öffne {demoFile}. Wähle 2 bis 9, Schrittweite 3, {vertical}, 100 % Auflösung und {preserve}. Erstelle das Mosaik und öffne den JSON-Bericht.","expect":"In accepted stehen 2, 5, 8 und 9. Die 9 zeigt, dass der Endpunkt auch zwischen zwei regulären Schritten einbezogen wird."},{"title":"Die Ausgabeauflösung messen","try":"Wähle das gesamte GIF von 1 bis 37 mit Schrittweite 1 und {vertical}. Berechne es bei 100 % und erneut bei 50 % Arbeitsauflösung. Vergleiche die Endmaße.","expect":"Der Roboter misst zuerst 480 × 1080 px, dann 240 × 540 px. Der Ansichtszoom lässt diese Maße bestehen. Arbeitsauflösung ändern und neu berechnen verändert das PNG."},{"title":"Einen Streifen beim Herauszoomen untersuchen","try":"Wähle einen kurzen Zoom aus deinem Video, {zoom_motion} und Schrittweite 1. Vergleiche {preserve} und {feather}. Probiere am besser ausgerichteten Ergebnis erst nur 15 % Farbkorrektur, dann nur 10 % Glättung, jeweils separat anwenden.","expect":"Wird der Streifen schwächer und bleibt die Kontur einfach, vergleiche mit dem Original und exportiere. Bei Doppelkonturen prüfe Bereich, Beschnitt und Ausrichtung. Lokale Filter können versetzte Objekte kaum zusammenführen."}]}},"it":{"ui":{"guide":"Guida all’uso","hero1":"Dal movimento","hero2":"all’immagine intera.","intro":"Unisci i fotogrammi per rivelare tutta la scena percorsa dalla camera. Esplora la demo, poi ripeti i passaggi con un tuo GIF o video.","start":"Inizia il tutorial","download":"Scarica Framosik","demo":"Demo interattiva","source":"Fotogramma originale","panorama":"Immagine composta","scrub":"Trascina per esplorare i 37 fotogrammi.","contents":"In questa guida","help":"Domande frequenti","close":"Chiudi","enlarge":"Ingrandisci schermata","releases":"Versioni","links":"Link del progetto","skip":"Vai al tutorial","language":"Lingua del tutorial","back":"Torna in alto"},"sections":[{"title":"Apri Framosik","p":["Su Windows x64, estrai tutto lo ZIP e apri {exe}. Su Linux x86_64, estrai il file .tar.gz ed esegui {bin} dentro la cartella Framosik. Mantieni {internal} accanto all’eseguibile.","Seleziona {open} o premi {ctrlO} e apri {demoFile}, incluso nel pacchetto. Il primo fotogramma mostra i piedi del robot. La camera risale la stessa illustrazione in 37 fotogrammi."]},{"title":"Delimita una sola scena","p":["In {original}, trascina il cursore oppure usa {play} e le frecce per individuare gli estremi. Premi {mark_start} e {mark_end}, oppure inserisci i numeri in {first} e {last}. Entrambi gli estremi sono inclusi.","Per la demo scegli da 1 a 37 e lascia {step} a 1. Nel tuo filmato fermati prima di uno stacco o di una transizione. Un passo maggiore riduce il lavoro ma lascia meno dettagli comuni per l’allineamento."]},{"title":"Scegli allineamento e fusione","p":["In {movement}, usa {vertical} per il robot, {horizontal} per uno spostamento laterale o {free} per una diagonale. Scegli {zoom_motion} quando l’inquadratura si avvicina o si allontana con una variazione di scala uniforme.","In {mode}, {preserve} conserva i tratti già composti. {feather} sfuma i bordi per la larghezza impostata in {feather_width}. {average} mescola i pixel sovrapposti e può raddoppiare i contorni se il soggetto si muove.","Inizia con {similarity} al 65% e {overlap} al 20%. Il primo valore regola la somiglianza richiesta, il secondo l’area comune minima. Usa {crop} per togliere una fascia fissa di sottotitoli da ogni fotogramma, in pixel della sorgente."]},{"title":"Segui la composizione","p":["Premi {stitch}. La scheda {result} mostra l’immagine che cresce durante l’elaborazione. Il registro indica la confidenza e lo spostamento di ogni fotogramma. Usa {fit} per l’intera scena o {zoom} per esaminare i pixel.","La rotella sull’immagine cambia lo zoom e il trascinamento sposta la vista. Sul pannello delle opzioni la rotella scorre i controlli. {cancel} conserva il risultato parziale. La demo completa al 100% produce un’immagine di 480 × 1080 px."]},{"title":"Rifinisci ed esporta","p":["Al termine si attiva {finish} sulla sinistra. Esamina una giunzione al 100%. Prova un valore basso di {seam_soft} per attenuare una linea o di {seam_color} per correggere una differenza di colore locale. Premi {apply_finish}.","Ogni applicazione riparte dal mosaico originale. Per confrontare, riporta entrambi i valori a zero e applica di nuovo. {export} o {ctrlS} salva l’ultima rifinitura applicata, con trasparenza dove nessun fotogramma ha fornito pixel. {report} salva un JSON con parametri, fotogrammi accettati e scartati e motivo di un’interruzione."]},{"title":"Personalizza l’interfaccia","p":["In {view}, scegli {theme} e {language}. {gradients} controlla i bagliori. Con le sfumature attive, {animations} permette di attivare o disattivare il movimento del titolo e dei controlli. Le preferenze vengono salvate automaticamente.","Apri {about} per controllare la versione installata e accedere al sito, al repository e alla pagina delle donazioni. La lingua di questa guida si sceglie in alto ed è indipendente da quella dell’app."]}],"faq":[["La composizione si ferma su un fotogramma. Come continuo?","Controlla l’ultimo fotogramma accettato, accorcia l’intervallo e riporta il passo a 1. Per un errore isolato, {skip} confronta i fotogrammi successivi con l’ultimo accettato. Dopo un vero cambio di scena inizia un altro mosaico."],["Perché lo zoom lascia righe o contorni doppi?","Prova {zoom_motion} con fotogrammi ravvicinati e {feather}. Esamina le giunzioni e applica una rifinitura leggera. Rotazione, prospettiva, parallasse ed elementi animati possono impedire un allineamento unico per tutta la scena."],["Ho raggiunto il limite di dimensione o il video non si apre.","Riduci {resolution} o dividi l’intervallo. {limit} imposta la dimensione massima del mosaico in megapixel. La lettura video dipende dal codec. Prova una copia MP4 codificata in H.264."]],"captions":["Fotogramma originale della demo con l’intervallo impostato da 1 a 37.","Controlli di allineamento, fusione e ritaglio con la larghezza della sfumatura visibile.","Il robot completo nel mosaico, con i controlli di rifinitura e il registro.","Scheda dell’aspetto in tema chiaro con lingua, bagliori e animazioni."],"reference":{"ui":{"title":"Guida ai parametri","intro":"Apri un gruppo per capire l’effetto di ogni controllo. I valori iniziali si riferiscono a una nuova installazione. Cerca il nome inglese o italiano oppure l’effetto che vuoi regolare.","search":"Cerca un controllo","example":"Ad esempio sovrapposizione, sottotitoli, 24 px","empty":"Nessun controllo trovato. Prova un altro termine o cancella la ricerca.","matches":"Controlli trovati","range":"Intervallo","initial":"Predefinito","on":"Attivo","off":"Disattivato","workshop":"Esercizi guidati","expect":"Cosa osservare","jump":"Consulta i controlli di questo passaggio"},"groups":{"scene":"File e intervallo","motion":"Movimento e allineamento","blend":"Fusione delle immagini","crop":"Ritaglio sui quattro bordi","preview":"Composizione e navigazione","finish":"Rifinitura ed esportazione","appearance":"Aspetto, lingua e link"},"entries":{"open":"Apre GIF, WebP animati e video MP4, MKV, AVI, MOV, WebM o M4V secondo il codec. PNG e JPEG si aprono come immagini singole. Esporta il mosaico da conservare prima di caricare un altro file.","original":"Esamina un fotogramma con il cursore, i pulsanti ‹ e › o immettendo il numero. Dopo la barra compare il totale. Questa vista mostra i bordi originali anche quando hai impostato un ritaglio.","play":"Riproduce dalla posizione corrente. Metti in pausa dove inizia o termina il movimento. La riproduzione può superare il limite segnato e si ferma alla fine del file. Riporta indietro il cursore per rivedere il passaggio.","first":"Seleziona il primo fotogramma incluso. N è il totale e la numerazione inizia da 1. Digita il numero o marca la posizione corrente. Questo fotogramma stabilisce anche la scala di riferimento dello zoom.","last":"Seleziona l’ultimo fotogramma incluso. Se il fotogramma 90 è già nella scena successiva, termina a 89. Impostare gli stessi numeri agli estremi permette una composizione di un solo fotogramma.","step":"Indica la distanza fra i campioni. Da 2 a 9 con passo 3 vengono provati 2, 5, 8 e 9. L’estremo finale viene incluso anche fuori sequenza. Inizia da 1 con zoom o movimenti veloci. Aumenta il passo se ci sono molte ripetizioni.","movement":"Guarda un dettaglio fisso in due fotogrammi. Se cambia posizione conservando le dimensioni, scegli una traslazione. Se cresce o si restringe, prova lo zoom. Per applicare il cambio ricomponi l’immagine.","free":"Consente spostamenti sui due assi. Usalo per una diagonale o una salita con deriva laterale. Un dettaglio fisso dello sfondo aiuta a distinguere il movimento della camera da quello del soggetto.","vertical":"Limita lo spostamento all’asse verticale. Sceglilo quando un punto dello sfondo rimane nella stessa colonna durante la salita o la discesa. Se la deriva laterale causa scarti, prova il movimento libero.","horizontal":"Limita lo spostamento all’asse orizzontale. È adatto quando l’orizzonte mantiene la stessa altezza durante un movimento laterale. Se l’inquadratura sale o scende, abilita entrambi gli assi.","zoom_motion":"Stima la variazione uniforme di scala e lo spostamento tra fotogrammi accettati. Durante l’allontanamento la tela può crescere molto per mantenere la scala iniziale. Usa passo 1. Livelli con movimenti indipendenti possono lasciare doppi contorni.","resolution":"Ridimensiona dopo il ritaglio e modifica le dimensioni effettive del PNG. Al 50% larghezza e altezza si dimezzano e l’area scende a circa un quarto. Prova un filmato lungo a bassa risoluzione e ricomponi al 100% per il risultato finale.","similarity":"Imposta il punteggio minimo richiesto nell’area comune. Aumentalo se motivi ripetuti vengono abbinati nella posizione sbagliata. Prima di abbassarlo per uno scarto, controlla ritaglio, movimento e passo. Confronta i contorni con l’originale.","overlap":"Richiede una frazione minima dell’immagine di lavoro in comune con pixel abbastanza opachi. Al 20% serve circa un quinto. Aumentarla elimina coincidenze troppo piccole. Se la camera si sposta molto tra campioni, riduci prima il passo.","limit":"Limita l’area del rettangolo che racchiude il mosaico, inclusi i vuoti trasparenti. Un rettangolo di 6000 × 4000 occupa 24 MP. Alzare il limite consente immagini maggiori e richiede più memoria. Se la crescita si ferma, riduci la risoluzione o dividi la sequenza.","skip":"Quando è attivo, dopo uno scarto il prossimo candidato viene confrontato con l’ultimo accettato. Aiuta con un fotogramma sfocato isolato. Se disattivato, il primo scarto ferma la composizione e conserva il parziale. Un salto lungo può lasciare vuoti.","mode":"Stabilisce come unire pixel già allineati. Ricomponi lo stesso intervallo alla stessa risoluzione con ogni modalità. Ingrandisci una linea sottile che attraversa la giunzione e verifica se resta singola e nitida.","preserve":"Riempie le aree nuove mantenendo i pixel già presenti. Spesso conserva bene i disegni al tratto. In modalità zoom un fotogramma successivo può anche completare un pixel di bordo coperto solo in parte.","feather":"Sfuma la sovrapposizione vicino alla zona appena scoperta. Provalo se una parete cambia leggermente tonalità fra fotogrammi. Se compaiono due sagome distinte, ricontrolla l’allineamento prima di allargare la sfumatura.","feather_width":"Disponibile con la sfumatura delle giunzioni. Si misura in pixel di lavoro. Confronta 8 e 32 px sullo stesso contorno. Una fascia stretta tutela i tratti fini, una più larga distribuisce il cambio di tono.","average":"A ogni passaggio fa la media in parti uguali tra mosaico e nuovo fotogramma nella zona comune. I punti coperti più volte subiscono miscele successive. Riduce variazioni di colore, ma una mano in movimento può comparire due volte.","left":"Rimuove colonne da sinistra prima dell’allineamento. Per una fascia nera fissa di 12 px, inserisci 12. Misura sulla sorgente e conserva i dettagli fissi vicini che aiutano il confronto.","top":"Rimuove righe dall’alto, per esempio una barra superiore fissa. I valori sono in pixel sorgente anche se lavori al 50%. Il ritaglio si applica a ogni fotogramma selezionato alla prossima composizione.","right":"Rimuove colonne da destra. Per un bordo simmetrico di 8 px, imposta 8 sia a sinistra sia a destra. Su una fonte larga 480 px restano 464 px prima del ridimensionamento.","bottom":"Rimuove righe dal basso. Se i sottotitoli occupano gli ultimi 32 px, prova 32 e controlla eventuali lettere residue. I quattro margini devono lasciare almeno 32 × 32 px di sorgente. La vista originale rimane intera.","stitch":"Avvia una nuova composizione con le impostazioni attuali. La scheda del risultato si apre e i controlli di modifica si disabilitano durante il calcolo. Salva le versioni da confrontare prima di ricomporre.","result":"Mostra aggiornamenti periodici. Durante il calcolo l’anteprima può essere ridotta a 1400 px sul lato lungo. Alla fine viene mostrato il risultato a piena risoluzione. Ispeziona le giunzioni a quel punto.","fit":"Adatta tutta l’immagine allo spazio visibile. Usalo dopo aver ingrandito una giunzione o ridimensionato la finestra. L’inquadratura automatica segue la crescita del mosaico.","zoom":"Ripristina la vista al 100% per controllare i pixel. Sull’immagine usa la rotella per lo zoom e trascina per spostarti. Sul pannello la rotella scorre le opzioni. Lo zoom di visualizzazione agisce solo sullo schermo.","log":"Leggi insieme numero del fotogramma, confidenza e spostamento Δ in X e Y. Un fotogramma accettato con Δ quasi zero può essere ripetuto e aggiungere poca area. Scarti consecutivi identificano un tratto da ricontrollare.","cancel":"Richiede l’arresto tra fotogrammi. Attendi la fine del lavoro prima di esportare. Se è disponibile un mosaico parziale, puoi ispezionarlo, rifinirlo e salvarlo. Un altro intervallo può proseguire una sequenza lunga.","seam_soft":"Attenua piccole variazioni vicino alle giunzioni con un filtro sensibile ai bordi. Confronta 0% e 10% con zoom al 100%. Aumenta gradualmente e riduci se i tratti sottili perdono definizione.","seam_color":"Avvicina il colore della giunzione alla mediana dei pixel circostanti. È adatto a una riga stretta di colore anomalo su fondo uniforme. Prova 10–20% con levigatura a zero. Agisce sulle zone opache vicino alle giunzioni marcate.","apply_finish":"Ricalcola entrambi gli effetti dal mosaico originale. Ripetere l’applicazione con gli stessi valori dà lo stesso esito. Per confrontare azzera entrambi e riapplica. Applica le modifiche prima dell’esportazione.","export":"Salva un PNG con l’ultima rifinitura applicata. Le aree senza copertura possono essere trasparenti. Controlla i bordi su sfondi diversi e dai nomi distinti alle prove. Scorciatoia {ctrlS}.","report":"Registra un JSON. accepted e rejected elencano i fotogrammi, frames contiene punteggi e spostamenti individuali, reason spiega un’interruzione. Le liste partono da 1. In settings, first e last partono da 0.","theme":"Scegli {dark} o {light} in base alla luce ambientale. Il tema cambia pannelli e sfondo attorno all’immagine. Alternali per osservare un bordo trasparente su sfondi diversi.","language":"Cambia etichette e messaggi e ricorda la scelta al prossimo avvio. Questa guida ha il proprio selettore in alto. Puoi leggerla in italiano con l’app impostata in inglese.","gradients":"Attiva sfumature e bagliori del titolo e dei controlli. Disattivandoli, l’aspetto diventa statico e la casella delle animazioni si disabilita. La scelta viene salvata.","animations":"Con le sfumature attive anima il titolo in pixel e i riflessi dei controlli. Disattiva per conservare i colori riducendo il movimento. Gli effetti si fermano durante l’elaborazione o a finestra inattiva.","about":"Mostra versione installata e link a repository, sito e donazioni. Confrontando i risultati di due installazioni, verifica la versione prima dei parametri."},"workshops":[{"title":"Verificare i fotogrammi scelti dal passo","try":"Apri {demoFile}. Seleziona da 2 a 9, passo 3, {vertical}, risoluzione 100% e {preserve}. Componi e apri il rapporto JSON.","expect":"In accepted trovi 2, 5, 8 e 9. Il 9 mostra che l’ultimo fotogramma viene incluso anche quando il passo lo salterebbe."},{"title":"Misurare la risoluzione di uscita","try":"Usa tutto il GIF, da 1 a 37, passo 1 e {vertical}. Componi al 100%, poi al 50% di risoluzione di lavoro. Confronta le dimensioni finali.","expect":"Il robot misura prima 480 × 1080 px e poi 240 × 540 px. Lo zoom dell’anteprima mantiene queste misure. Cambiare risoluzione e ricomporre modifica il PNG."},{"title":"Esaminare una riga durante l’allontanamento","try":"Isola un breve tratto del tuo video. Prova {zoom_motion} a passo 1 e confronta {preserve} con {feather}. Sul risultato meglio allineato applica prima solo la correzione colore al 15%, poi solo la levigatura al 10%.","expect":"Se la riga si attenua e il contorno resta singolo, confronta con l’originale ed esporta. Se il contorno è doppio, rivedi intervallo, ritaglio o allineamento. La rifinitura locale incide poco su oggetti spostati."}]}},"ja":{"ui":{"guide":"操作ガイド","hero1":"カメラの動きから","hero2":"一枚の画像へ。","intro":"カメラが通った景色を、連続するフレームから一枚に再構成します。まずデモを動かし、次に自分の GIF や動画で試してみましょう。","start":"チュートリアルを始める","download":"Framosik をダウンロード","demo":"操作できるデモ","source":"元のフレーム","panorama":"合成画像","scrub":"スライダーを動かして全37フレームを確認できます。","contents":"目次","help":"よくある質問","close":"閉じる","enlarge":"スクリーンショットを拡大","releases":"リリース","links":"関連リンク","skip":"チュートリアルへ移動","language":"ガイドの言語","back":"先頭に戻る"},"sections":[{"title":"Framosik を起動する","p":["Windows x64 では ZIP 全体を展開し、{exe} を開きます。Linux x86_64 では .tar.gz を展開し、Framosik フォルダー内で {bin} を実行します。{internal} は実行ファイルと同じ場所に置いてください。","{open} または {ctrlO} から、同梱の {demoFile} を開きます。最初に映るのはロボットの足です。37枚のフレームを通して、カメラが同じイラストの上を足元から上へ移動します。"]},{"title":"ひと続きのシーンを指定する","p":["{original} でスライダーを動かすか、{play} と矢印で始点と終点を探します。{mark_start} と {mark_end} を押すか、{first} と {last} に番号を入力します。両端のフレームも含まれます。","デモでは1から37を選び、{step} を1にします。自分の動画では、場面が切り替わる直前で区切ります。間隔を広げると処理枚数は減りますが、位置合わせに使える共通部分も減ります。"]},{"title":"位置合わせと合成方法を選ぶ","p":["{movement} では、ロボットのデモには {vertical}、横移動には {horizontal}、斜め移動には {free} を選びます。一様に拡大・縮小しながら近づいたり遠ざかったりする場面には {zoom_motion} を使います。","{mode} の {preserve} は合成済みの線を保ちます。{feather} は {feather_width} の幅で境界をなじませます。{average} は重なった画素を混ぜます。被写体が動くと輪郭が二重になることがあります。","まず {similarity} を65%、{overlap} を20%にします。前者は要求する一致度、後者は最低限必要な重なり面積です。固定された字幕帯は {crop} で各フレームから取り除けます。値の単位は元画像のピクセルです。"]},{"title":"合成の進み具合を見る","p":["{stitch} を押すと、処理中も {result} に合成画像が少しずつ広がります。ログには各フレームの信頼度と移動量が表示されます。全体を見るには {fit}、画素を確認するには {zoom} を使います。","画像上ではホイールで拡大・縮小、ドラッグで表示位置を移動します。設定欄ではホイールで項目をスクロールします。途中で {cancel} を押しても、それまでの結果を保存できます。デモ全体を100%で処理した結果は480 × 1080ピクセルです。"]},{"title":"継ぎ目を整えて書き出す","p":["合成が終わると左側の {finish} が有効になります。継ぎ目を100%で確認し、筋を和らげるには {seam_soft}、局所的な色の差を整えるには {seam_color} を低い値から試します。{apply_finish} を押して反映します。","毎回、合成直後の画像を基に処理します。比較するには両方の値をゼロに戻して再適用します。{export} または {ctrlS} で最後に適用した仕上がりを保存します。どのフレームにも写らなかった部分は透明です。{report} で設定、採用・除外フレーム、中断理由を JSON に保存できます。"]},{"title":"表示を自分好みにする","p":["{view} で {theme} と {language} を選べます。{gradients} で光彩を設定し、グラデーションが有効なときは {animations} でタイトルや操作部のアニメーションを切り替えられます。設定は自動保存されます。","{about} にはインストールしたバージョンと、サイト、リポジトリ、寄付ページへのリンクがあります。このガイドの言語はアプリとは別に、ページ上部で変更できます。"]}],"faq":[["特定のフレームで合成が止まります。どうすればよいですか？","最後に採用されたフレームを調べ、範囲を短くし、間隔を1に戻します。単発の不一致なら {skip} で最後に採用した画像を基準に次のフレームを試せます。場面転換の後は別の画像として合成してください。"],["ズームで筋や二重の輪郭が出るのはなぜですか？","近いフレーム同士で {zoom_motion} と {feather} を試し、継ぎ目を確認して弱い仕上げをかけます。回転、遠近の変化、視差、動くレイヤーがあると、単一の変換で画面全体を合わせるのは難しくなります。"],["サイズの上限に達したり、動画を開けなかったりします。","{resolution} を下げるか範囲を分割します。{limit} は合成画像の上限をメガピクセルで指定します。動画の読み込みはコーデックに依存します。開けない場合は H.264 でエンコードした MP4 のコピーを試してください。"]],"captions":["デモの元フレームと、1から37に設定した処理範囲。","位置合わせ、合成、切り抜きの設定と、継ぎ目をぼかす幅。","完成したロボット全体と、有効になった仕上げ設定と処理ログ。","ライトテーマの表示設定。言語、光彩、アニメーションを変更できます。"],"reference":{"ui":{"title":"設定項目のリファレンス","intro":"グループを開くと各項目の働きがわかります。初期値は新規インストール時の値です。英語名、日本語名、調整したい効果で検索できます。","search":"項目を検索","example":"例：重なり、字幕、24 px","empty":"該当する項目がありません。別の語を試すか検索欄を空にしてください。","matches":"見つかった項目","range":"範囲","initial":"初期値","on":"オン","off":"オフ","workshop":"試して学ぶ","expect":"観察するポイント","jump":"この手順の設定を調べる"},"groups":{"scene":"ファイルとフレーム範囲","motion":"動きと位置合わせ","blend":"重なりの合成","crop":"四辺の切り抜き","preview":"合成と表示操作","finish":"仕上げと書き出し","appearance":"外観・言語・リンク"},"entries":{"open":"GIF、アニメーション WebP、MP4、MKV、AVI、MOV、WebM、M4V などを開きます。動画はコーデックによって読み込みの可否が変わります。PNG や JPEG は静止画として開けます。別のファイルを開く前に、残したい合成結果を書き出してください。","original":"スライダー、‹ と ›、またはフレーム番号の入力で元の絵を確認できます。スラッシュの後ろはファイル全体のフレーム数です。切り抜きを設定しても、この表示では元の四辺が見えます。","play":"現在位置から再生します。カメラが動き始める位置や止まる位置で一時停止します。再生は設定した終点を越えてファイルの末尾まで進みます。同じ範囲を見直すにはスライダーを戻してください。","first":"合成に含める最初のフレームです。N は総フレーム数で、表示番号は 1 から始まります。数値を入力するか、表示中のフレームを始点に指定します。ズーム合成ではこのフレームが大きさの基準にもなります。","last":"合成に含める最後のフレームです。90 枚目が次のカットなら 89 で終了します。始点と終点を同じ番号にすると、1 枚だけを対象にできます。","step":"使用するフレームの間隔です。2～9 を間隔 3 で処理すると、2、5、8、9 を試します。等間隔から外れても終点を含みます。ズームや速い動きは 1 から始め、同じような絵が続く場合は少し広げます。","movement":"2 枚のフレームで背景の同じ目印を見ます。大きさを保って位置だけ変わるなら平行移動、拡大・縮小するならズームを選びます。設定の変更は次に合成すると反映されます。","free":"横と縦の両方への移動を許します。斜めのパンや、上昇中に少し横へ流れる映像に使います。背景の固定物を見ると、カメラの動きとキャラクター自身の動きを区別できます。","vertical":"縦方向の移動に限定します。上下に動く目印が同じ列にとどまる映像向きです。横方向のずれによって正しいフレームが除外される場合は、自由移動を試します。","horizontal":"横方向の移動に限定します。水平線の高さを保ちながら左右に動く場面に適します。カメラが同時に上下する場合は、両軸を許すモードを使います。","zoom_motion":"採用したフレーム間で一様な拡大率と二方向の移動を推定します。カメラが引く場面では、最初の倍率を保つためキャンバスが大きく広がります。間隔は 1 から試します。背景と人物が別々に動く場面では輪郭が二重になることがあります。","resolution":"切り抜いた各フレームを縮小し、出力する PNG の寸法も変えます。50% では縦横が半分、面積は約 4 分の 1 です。長い場面は低めで試し、細部を残す書き出しでは 100% に戻して再合成します。","similarity":"共通部分に必要な最低一致度です。繰り返し模様が誤った位置で採用されるなら上げます。正しく見える組が落ちる場合は切り抜き・動き・間隔を確認してから数ポイント下げ、元絵と輪郭を比べます。","overlap":"十分に不透明な共通画素が作業フレームに占める最低割合です。20% なら約 5 分の 1 が必要です。上げると小さすぎる曖昧な一致を排除できます。サンプル間の移動が大きいときは、まず間隔を狭めます。","limit":"透明な空きも含め、合成画像を囲む長方形の面積を制限します。6000 × 4000 は 24 MP です。上限を上げると大きな画像を作れますが、必要なメモリも増えます。上限で止まったら、作業解像度を下げるか範囲を分けます。","skip":"オンの場合、位置合わせに失敗した画像を記録し、次の候補を直近の採用画像と比較します。単発のぼけに有効です。オフの場合は最初の不一致で止まり、途中結果が残ります。飛ばす距離が大きいと共通部分が失われます。","mode":"位置を合わせた後、重なった画素をどう組み合わせるかを選びます。同じ範囲・同じ作業解像度でモードごとに合成し直します。継ぎ目をまたぐ細い線を拡大し、くっきりした一本線か確認します。","preserve":"新しく見えた部分を埋め、すでにある画素を保ちます。線画の輪郭を維持したいときに向きます。ズームでは後続フレームが部分的にしか覆われていなかった端の画素を補うこともあります。","feather":"新しい領域に接する重なり部分を徐々になじませます。同じ壁の色が前後の画像でわずかに違う場合に試します。離れた二本の輪郭が見えるなら、幅を広げる前に位置合わせを確認します。","feather_width":"継ぎ目をなじませるモードのときに使えます。単位は作業解像度のピクセルです。同じ輪郭で 8 px と 32 px を比較します。狭い帯は細線を保ち、広い帯は色の変化を広く分散させます。","average":"各ステップで、現在の合成画像と新フレームを重なり部分で半分ずつ混ぜます。同じ位置が何度も映ると繰り返し混合されます。色むらを和らげられますが、動いた手が二重に残る場合もあります。","left":"位置合わせの前に左端から列を除きます。左に動かない 12 px の黒帯があれば 12 を入力します。元画像で幅を測り、付近の対応点となる固定模様はできるだけ残します。","top":"固定の上部バーなどを除くため、上端から行を切り取ります。作業解像度が 50% でも単位は元画像のピクセルです。再合成すると指定した全フレームに同じ値が使われます。","right":"右端から列を除きます。左右対称の 8 px の枠なら、左と右に各 8 を入力します。元画像の幅が 480 px なら、縮小する前に 464 px が残ります。","bottom":"下端から行を除きます。下 32 px を字幕が占めるなら 32 から試し、文字が残っていないか合成結果で確認します。四辺を切った後に元画像の 32 × 32 px 以上を残してください。元フレームの表示は全体のままです。","stitch":"現在の範囲と設定で新しく合成します。結果タブに自動で切り替わり、計算中は編集項目が一時的に無効になります。違いを比べたい画像は次の合成の前に保存します。","result":"処理中の広がり方を定期的に表示します。途中のプレビューは長辺 1400 px までに縮小されることがあります。完了時には最終解像度の画像に切り替わるので、継ぎ目はその時点で評価します。","fit":"画像全体を表示範囲に収めます。継ぎ目を拡大した後やウィンドウのサイズ変更後に便利です。自動調整中は、キャンバスが広がるのに合わせて全体が収まります。","zoom":"表示倍率を 100% に戻して画素を確認できます。画像上のホイールでズーム、ドラッグで移動し、設定欄のホイールでは項目をスクロールします。表示倍率は画面上の見え方に反映されます。","log":"フレーム番号と信頼度、X/Y の移動量 Δ を一緒に読みます。採用されても Δ がほぼゼロなら直前と同じ画像で、新たに広がる部分はわずかです。除外が続いた番号の範囲を見直してください。","cancel":"フレーム間の確認時に停止するよう要求します。処理が終わってから書き出してください。途中結果があれば確認、仕上げ、保存が可能です。長い動画は別の範囲に分けて続けられます。","seam_soft":"検出した継ぎ目付近の細かい変化を、輪郭を考慮するフィルターで和らげます。100% 表示で 0% と 10% を比べ、筋が残れば少しずつ上げます。細い線がぼやけたら値を下げます。","seam_color":"継ぎ目の画素を近隣画素の色の中央値に近づけます。平坦な背景に細い異色の線がある場合に向きます。滑らかさをゼロにし、色補正だけを 10～20% で試しましょう。対象は記録された継ぎ目付近の不透明部です。","apply_finish":"毎回、元の合成結果から二つの設定を計算し直します。同じ値で二度適用しても効果は重なりません。比較するには両方をゼロにして再適用します。値を変更したら書き出す前に適用してください。","export":"最後に適用した仕上がりを PNG に保存します。どのフレームにも写っていない部分は透明になることがあります。異なる背景色で端を確認し、比較用の画像には別のファイル名を付けます。ショートカットは {ctrlS} です。","report":"JSON 形式の記録を保存します。accepted と rejected はフレーム番号、frames は各画像の一致度と移動量、reason は停止理由です。リストは 1 始まりですが、settings 内の first と last は 0 から数えます。","theme":"環境の明るさに合わせて {dark} または {light} を選びます。パネルと画像の周囲の背景色が変わるので、テーマを切り替えて透明な輪郭を見比べられます。","language":"アプリの表示名やメッセージを変更し、次回の起動時にも設定を引き継ぎます。このガイドはページ上部に独立した言語選択があり、アプリを英語のまま日本語で読めます。","gradients":"タイトルや操作部のグラデーションと光彩を切り替えます。オフにすると静的な表示になり、アニメーションのチェック欄も無効になります。選択は保存されます。","animations":"グラデーションがオンのときに、ピクセルタイトルや操作部の光を動かします。色は保って動きを減らしたいならオフにします。処理中やウィンドウが非アクティブのときも効果は一時停止します。","about":"インストール済みのバージョンと、リポジトリ・サイト・寄付ページへのリンクがあります。二つの環境で結果を比較するときは、パラメーターを比べる前にここでバージョンを確認します。"},"workshops":[{"title":"間隔で選ばれるフレームを調べる","try":"{demoFile} を開きます。範囲を 2～9、間隔を 3 にし、{vertical}、解像度 100%、{preserve} で合成して JSON を開きます。","expect":"accepted に 2、5、8、9 が並びます。9 が入っているのは、通常の間隔から外れても終点を使うためです。"},{"title":"出力解像度を比べる","try":"GIF 全体の 1～37、間隔 1、{vertical} で、作業解像度 100% と 50% の 2 回合成します。完了時の寸法を比べてください。","expect":"ロボット全体は最初が 480 × 1080 px、次が 240 × 540 px です。プレビューのズームでは寸法は変わりません。作業解像度を変えて合成し直すと PNG の寸法が変わります。"},{"title":"カメラが引く場面の筋を調べる","try":"自分の動画から短い引きの場面を選び、{zoom_motion}、間隔 1 で {preserve} と {feather} を比較します。位置がよく合う結果で、色補正だけ 15%、次に滑らかさだけ 10% を別々に適用します。","expect":"筋が薄くなり輪郭が一本のままなら、元画像と比べて好みの方を書き出します。輪郭自体が二重なら範囲・切り抜き・位置合わせを見直します。位置の違う物体には局所的な仕上げの効果は限られます。"}]}},"ko":{"ui":{"guide":"사용 안내서","hero1":"카메라의 움직임을","hero2":"한 장의 이미지로.","intro":"카메라가 훑고 지나간 장면을 여러 프레임에서 한 장으로 복원합니다. 데모를 살펴본 뒤 같은 과정을 내 GIF나 동영상에 적용해 보세요.","start":"튜토리얼 시작","download":"Framosik 다운로드","demo":"직접 움직이는 데모","source":"원본 프레임","panorama":"합성 이미지","scrub":"슬라이더를 끌어 37개 프레임을 살펴보세요.","contents":"목차","help":"자주 묻는 질문","close":"닫기","enlarge":"스크린샷 확대","releases":"릴리스","links":"프로젝트 링크","skip":"튜토리얼로 건너뛰기","language":"튜토리얼 언어","back":"맨 위로"},"sections":[{"title":"Framosik 실행하기","p":["Windows x64에서는 ZIP 전체를 압축 해제하고 {exe}를 엽니다. Linux x86_64에서는 .tar.gz를 풀고 Framosik 폴더 안에서 {bin}을 실행합니다. {internal} 폴더를 실행 파일과 같은 위치에 두세요.","{open}을 누르거나 {ctrlO}를 눌러 패키지에 포함된 {demoFile}을 엽니다. 첫 프레임에는 로봇의 발이 보입니다. 카메라가 37개 프레임에 걸쳐 같은 그림을 위로 훑습니다."]},{"title":"한 장면의 범위 정하기","p":["{original}에서 슬라이더를 끌거나 {play}와 화살표를 사용해 양 끝을 찾습니다. {mark_start}와 {mark_end}를 누르거나 {first}와 {last}에 번호를 입력합니다. 양 끝 프레임도 합성에 포함됩니다.","데모에서는 1부터 37까지 선택하고 {step}을 1로 둡니다. 내 영상에서는 컷이나 전환 효과 직전에 끝내세요. 간격을 높이면 처리량은 줄지만 정렬에 쓸 공통 영역도 감소합니다."]},{"title":"정렬과 혼합 방식 선택하기","p":["{movement}에서 로봇에는 {vertical}, 옆으로 움직이는 장면에는 {horizontal}, 대각선 이동에는 {free}를 선택합니다. 일정한 비율로 확대 또는 축소되는 장면에는 {zoom_motion}을 사용합니다.","{mode}에서 {preserve}는 이미 합성한 선을 유지합니다. {feather}는 {feather_width}로 정한 폭 안에서 경계를 섞습니다. {average}는 겹치는 픽셀을 혼합하므로 피사체가 움직이면 윤곽선이 이중으로 보일 수 있습니다.","{similarity}는 65%, {overlap}은 20%에서 시작하세요. 첫 번째는 일치 기준을, 두 번째는 필요한 최소 겹침 면적을 정합니다. 고정 자막 띠는 {crop}에서 원본 픽셀 단위로 모든 프레임에서 잘라낼 수 있습니다."]},{"title":"합성 과정 지켜보기","p":["{stitch}를 누르면 처리 중에 {result}에서 이미지가 커지는 과정을 볼 수 있습니다. 로그에는 프레임별 신뢰도와 이동량이 나타납니다. {fit}으로 전체를 보고 {zoom}으로 픽셀을 확인하세요.","이미지 위에서는 휠로 확대하거나 축소하고 드래그로 이동합니다. 옵션 패널 위에서는 휠로 항목을 스크롤합니다. {cancel}을 누르면 그때까지의 결과를 보존합니다. 데모 전체를 100%로 합성하면 480 × 1080픽셀 이미지가 됩니다."]},{"title":"경계 다듬고 내보내기","p":["합성이 끝나면 왼쪽에 {finish}가 활성화됩니다. 경계를 100%로 확인하세요. 가느다란 선은 {seam_soft}, 국소적인 색 차이는 {seam_color}를 낮은 값부터 조절한 뒤 {apply_finish}를 누릅니다.","매번 합성 원본에서 다시 적용합니다. 비교하려면 두 값을 모두 0으로 되돌려 다시 적용하세요. {export} 또는 {ctrlS}는 마지막으로 적용한 결과를 저장하며, 어떤 프레임에도 없던 부분은 투명하게 남습니다. {report}는 설정, 채택 및 제외된 프레임, 중단 사유를 JSON으로 저장합니다."]},{"title":"화면 설정 바꾸기","p":["{view}에서 {theme}와 {language}를 선택하세요. {gradients}로 발광 효과를 설정합니다. 그라데이션을 켜면 {animations}로 제목과 컨트롤의 움직임을 조절할 수 있습니다. 설정은 자동 저장됩니다.","{about}에서 설치한 버전을 확인하고 웹사이트, 저장소, 후원 페이지로 이동할 수 있습니다. 이 안내서의 언어는 앱과 별도로 페이지 맨 위에서 바꿀 수 있습니다."]}],"faq":[["특정 프레임에서 합성이 멈추면 어떻게 하나요?","마지막으로 채택된 프레임을 확인하고 범위를 줄인 뒤 간격을 1로 되돌리세요. 한 프레임만 맞지 않으면 {skip}으로 마지막 채택 프레임을 기준 삼아 다음 프레임을 시도할 수 있습니다. 장면이 바뀌었다면 새로 합성하세요."],["줌 장면에 줄무늬나 이중 윤곽선이 생기는 이유는 무엇인가요?","가까운 프레임과 {zoom_motion}, {feather}를 사용해 보세요. 경계를 확인하고 약하게 보정하세요. 회전, 원근 변화, 시차, 움직이는 레이어는 하나의 변환으로 장면 전체를 맞추기 어렵게 만듭니다."],["크기 상한에 도달했거나 동영상이 열리지 않아요.","{resolution}을 낮추거나 구간을 나누세요. {limit}는 합성 이미지의 최대 메가픽셀을 정합니다. 동영상은 코덱에 따라 지원 여부가 다릅니다. 열리지 않으면 H.264로 인코딩한 MP4 사본을 사용해 보세요."]],"captions":["원본 프레임과 1부터 37까지로 설정한 데모 범위.","혼합 폭이 표시된 정렬, 혼합 및 자르기 설정.","완성된 로봇과 활성화된 마무리 컨트롤 및 처리 로그.","밝은 테마에서 언어, 발광, 애니메이션을 설정하는 화면."],"reference":{"ui":{"title":"설정 항목 안내","intro":"그룹을 열어 각 항목의 효과를 확인하세요. 기본값은 새로 설치했을 때의 값입니다. 화면의 영어명이나 한국어명, 조절하고 싶은 효과로 검색할 수 있습니다.","search":"항목 검색","example":"예: 겹침, 자막, 24 px","empty":"일치하는 항목이 없습니다. 다른 단어를 입력하거나 검색어를 지우세요.","matches":"검색된 항목","range":"범위","initial":"기본값","on":"켜짐","off":"꺼짐","workshop":"따라 하는 실습","expect":"확인할 점","jump":"이 단계의 항목 살펴보기"},"groups":{"scene":"파일과 프레임 범위","motion":"움직임과 정렬","blend":"이미지 혼합","crop":"네 가장자리 자르기","preview":"합성과 화면 탐색","finish":"마무리와 내보내기","appearance":"모양, 언어와 링크"},"entries":{"open":"GIF, 움직이는 WebP와 MP4, MKV, AVI, MOV, WebM, M4V 같은 동영상을 엽니다. 지원 여부는 코덱에 따라 달라집니다. PNG와 JPEG는 정지 이미지로 열립니다. 다른 파일을 열기 전에 보관할 합성 결과를 내보내세요.","original":"슬라이더를 끌거나 ‹, › 버튼을 누르거나 번호를 입력해 원본 프레임을 봅니다. 빗금 다음 숫자는 전체 프레임 수입니다. 자르기를 설정한 뒤에도 이 화면에는 원래 가장자리까지 표시됩니다.","play":"현재 위치부터 재생합니다. 카메라가 움직이기 시작하거나 멈추는 지점에서 일시 정지하세요. 재생은 표시한 끝점을 지나 파일의 마지막 프레임까지 이어집니다. 같은 부분을 다시 보려면 슬라이더를 되돌리세요.","first":"합성에 포함할 첫 번째 프레임입니다. N은 전체 프레임 수이고 번호는 1부터 시작합니다. 숫자를 입력하거나 화면에 나온 지점을 시작으로 지정하세요. 줌 합성에서는 이 프레임의 크기가 기준이 됩니다.","last":"합성에 포함할 마지막 프레임입니다. 90번째 프레임이 이미 다음 장면이라면 89에서 끝내세요. 시작과 끝을 같은 번호로 지정하면 한 프레임 결과를 얻을 수 있습니다.","step":"사용할 프레임 사이의 간격입니다. 2~9에서 간격이 3이면 2, 5, 8, 9를 시도합니다. 등간격에서 벗어나도 끝점은 포함됩니다. 빠른 이동이나 줌은 1부터 시작하고 비슷한 프레임이 많으면 늘려 보세요.","movement":"두 프레임에서 같은 배경 지점을 관찰하세요. 크기는 그대로이고 위치만 달라지면 이동 모드를, 커지거나 작아지면 줌 모드를 선택합니다. 설정을 바꾼 뒤 다시 합성하면 반영됩니다.","free":"X와 Y 방향 이동을 모두 허용합니다. 대각선 이동이나 옆으로 조금 흐르는 상승 장면에 적합합니다. 배경의 고정된 지점을 보면 카메라 이동과 인물 자신의 움직임을 구별하기 쉽습니다.","vertical":"세로 방향만 사용합니다. 배경의 한 점이 위아래로 움직이면서 같은 열에 머무는 장면에 쓰세요. 옆으로 밀리는 구간에서 정상 프레임이 제외된다면 자유 이동을 시도하세요.","horizontal":"가로 방향만 사용합니다. 수평선의 높이가 일정한 좌우 이동 장면에 적합합니다. 카메라가 동시에 위아래로 움직이면 두 축을 모두 허용하세요.","zoom_motion":"채택한 프레임 사이에서 균일한 배율 변화와 양축 이동을 추정합니다. 카메라가 멀어지면 첫 프레임의 축척을 유지하기 위해 캔버스가 크게 자랄 수 있습니다. 간격은 1부터 시작하세요. 배경과 인물이 따로 움직이면 윤곽이 겹칠 수 있습니다.","resolution":"잘라낸 뒤 각 프레임의 크기를 바꾸며 최종 PNG의 크기에도 영향을 줍니다. 50%면 가로와 세로가 각각 절반, 면적은 약 4분의 1입니다. 긴 장면은 낮춰서 시험하고 최종본은 100%로 다시 합성하세요.","similarity":"겹치는 부분에서 필요한 최소 일치 점수입니다. 반복 무늬가 엉뚱한 위치에 붙으면 높이세요. 맞아 보이는 프레임이 거부되면 자르기, 이동 모드와 간격을 먼저 확인한 뒤 몇 포인트 낮춰 원본과 윤곽을 비교하세요.","overlap":"작업 프레임에서 충분히 불투명한 공통 픽셀이 차지해야 할 최소 비율입니다. 20%면 약 5분의 1이 겹쳐야 합니다. 높이면 좁고 모호한 일치를 걸러냅니다. 샘플 사이 이동이 크다면 먼저 간격을 줄이세요.","limit":"투명한 빈 공간을 포함해 모자이크를 둘러싼 사각형의 면적을 제한합니다. 6000 × 4000은 24 MP입니다. 상한을 높이면 더 큰 이미지를 만들 수 있고 메모리도 더 필요합니다. 한계에 걸리면 작업 해상도를 낮추거나 구간을 나누세요.","skip":"켜면 정렬에 실패한 프레임을 기록하고 다음 후보를 마지막 채택 프레임과 비교합니다. 한 장만 흐릿한 경우에 유용합니다. 끄면 첫 거부에서 멈추고 부분 결과를 보존합니다. 너무 길게 건너뛰면 공통 영역이 사라질 수 있습니다.","mode":"정렬된 픽셀을 섞는 방식을 정합니다. 같은 구간과 해상도를 유지하고 모드별로 다시 합성하세요. 경계를 가로지르는 가는 선을 확대해 한 줄로 선명하게 이어지는지 비교합니다.","preserve":"새로 드러난 부분을 채우고 기존 픽셀을 유지해 선화의 윤곽을 보존하기 좋습니다. 줌에서는 나중 프레임이 일부만 덮였던 가장자리 픽셀을 추가로 채울 수 있습니다.","feather":"새 영역과 맞닿은 겹침 부분을 점진적으로 섞습니다. 같은 벽의 색이 프레임마다 약간 달라지면 시도하세요. 윤곽 두 개가 분명히 어긋나 있다면 혼합 폭을 넓히기 전에 정렬을 확인하세요.","feather_width":"경계를 부드럽게 섞는 모드에서만 사용할 수 있으며 단위는 작업 픽셀입니다. 같은 윤곽에서 8 px와 32 px를 비교하세요. 좁은 폭은 가는 선을 보존하고 넓은 폭은 색 변화를 분산시킵니다.","average":"매 단계에서 겹치는 영역의 기존 모자이크와 새 프레임을 반씩 섞습니다. 여러 번 덮인 픽셀은 반복해서 혼합됩니다. 색 변동은 완화할 수 있지만 움직인 손이 두 개로 보일 수 있습니다.","left":"정렬하기 전에 왼쪽 끝부터 열을 제거합니다. 고정된 12 px 검은 띠라면 12를 입력하세요. 원본에서 폭을 재고 일치점을 찾는 데 도움이 되는 주변의 고정 무늬는 남겨 두세요.","top":"위에서부터 행을 잘라 고정 상단 바 등을 제거합니다. 작업 해상도가 50%여도 원본 픽셀 단위로 입력하며 재합성할 때 선택된 모든 프레임에 적용됩니다.","right":"오른쪽 끝에서 열을 제거합니다. 양쪽에 8 px 테두리가 있으면 왼쪽과 오른쪽에 각각 8을 입력합니다. 원본 폭이 480 px이면 해상도 조절 전 464 px가 남습니다.","bottom":"아래에서 행을 제거합니다. 자막이 맨 아래 32 px를 차지하면 32부터 시도하고 합성본에 글씨가 남는지 보세요. 네 변을 모두 자른 뒤 원본이 적어도 32 × 32 px 남아야 합니다. 원본 프레임 미리보기는 전체를 보여 줍니다.","stitch":"현재 범위와 설정으로 새 합성을 시작합니다. 결과 탭이 자동으로 열리며 계산 중에는 편집 컨트롤이 잠시 비활성화됩니다. 비교할 결과는 다음 합성을 시작하기 전에 저장하세요.","result":"합성 이미지가 커지는 과정을 주기적으로 보여 줍니다. 작업 도중 미리보기의 긴 변이 최대 1400 px로 줄어들 수 있습니다. 완료되면 최종 해상도로 표시되므로 경계 평가는 이때 하세요.","fit":"전체 이미지가 보이도록 화면에 맞춥니다. 경계를 확대한 뒤나 창 크기를 변경한 뒤 사용하세요. 자동 맞춤 상태에서는 캔버스가 커질 때도 전체 구도가 보입니다.","zoom":"픽셀 단위로 확인하도록 보기 배율을 100%로 되돌립니다. 이미지 위에서 휠로 확대·축소하고 드래그로 이동합니다. 옵션 위의 휠은 패널을 스크롤합니다. 화면 배율은 출력 PNG 크기에 영향을 주지 않습니다.","log":"프레임 번호, 신뢰도, X/Y 이동량 Δ를 함께 읽으세요. 채택됐어도 Δ가 거의 0이면 반복 프레임이라 새 영역이 거의 없을 수 있습니다. 연속으로 거부된 번호를 찾아 해당 구간을 다시 확인하세요.","cancel":"프레임 사이에 중지하도록 요청합니다. 현재 작업이 끝난 뒤 내보내세요. 부분 모자이크가 있으면 확인하고 마무리해 저장할 수 있습니다. 긴 동영상은 다른 구간을 선택해 이어서 작업할 수 있습니다.","seam_soft":"가장자리를 고려하는 필터로 감지된 경계 주변의 잔 변화를 줄입니다. 화면 배율 100%에서 0%와 10%를 비교하세요. 줄이 남으면 조금씩 높이고 원래 가는 선이 흐려지면 낮추세요.","seam_color":"경계 색상을 주변 픽셀의 중앙값에 가깝게 맞춥니다. 고른 배경에서 가는 색 줄만 튈 때 유용합니다. 부드럽게 하는 값을 0으로 두고 색 보정만 10~20%로 시험하세요. 표시된 경계 주위의 불투명 영역에 적용됩니다.","apply_finish":"매번 원래 모자이크에서 두 설정을 다시 계산합니다. 같은 값을 두 번 적용해도 같은 결과를 얻습니다. 비교하려면 둘 다 0으로 되돌려 다시 적용하세요. 내보내기 전에는 바꾼 값을 적용해야 합니다.","export":"마지막으로 적용한 마무리 결과를 PNG로 저장합니다. 어떤 프레임도 덮지 않은 곳은 투명할 수 있습니다. 여러 배경색에서 가장자리를 보고 비교본에는 서로 다른 이름을 붙이세요. 단축키 {ctrlS}.","report":"JSON 보고서를 만듭니다. accepted와 rejected에는 프레임 번호, frames에는 개별 일치도와 이동량, reason에는 중단 사유가 있습니다. 목록은 1부터 세고 settings의 first와 last는 0부터 셉니다.","theme":"주변 조명에 맞춰 {dark} 또는 {light}를 선택합니다. 패널과 이미지 주위 배경이 달라집니다. 두 테마를 번갈아 보며 투명한 가장자리를 확인할 수 있습니다.","language":"앱의 레이블과 메시지 언어를 바꾸고 다음 실행에도 기억합니다. 이 가이드는 맨 위에 별도 언어 선택기가 있어 앱 화면은 영어로 두고 설명은 한국어로 읽을 수 있습니다.","gradients":"제목과 컨트롤의 그라데이션과 빛 효과를 켭니다. 끄면 정적인 모양이 되고 애니메이션 체크 상자도 비활성화됩니다. 선택은 다음 실행에도 유지됩니다.","animations":"그라데이션이 켜져 있을 때 픽셀 제목과 컨트롤 강조 효과를 움직입니다. 색은 유지하면서 움직임을 줄이려면 끄세요. 처리 중이거나 창이 비활성 상태일 때에도 효과가 일시 정지됩니다.","about":"설치 버전과 저장소, 웹사이트, 후원 링크를 보여 줍니다. 두 설치 환경의 결과를 비교할 때는 매개변수를 비교하기 전에 이곳에서 버전을 확인하세요."},"workshops":[{"title":"간격으로 선택되는 프레임 확인","try":"{demoFile}을 엽니다. 2~9, 간격 3, {vertical}, 해상도 100%, {preserve}로 합성한 뒤 JSON 보고서를 엽니다.","expect":"accepted에 2, 5, 8, 9가 있습니다. 끝점인 9는 일정 간격에서 벗어나도 포함된다는 것을 확인할 수 있습니다."},{"title":"출력 해상도 재기","try":"GIF 전체 1~37, 간격 1, {vertical}을 사용하세요. 작업 해상도 100%와 50%로 각각 합성하여 최종 치수를 비교합니다.","expect":"완성된 로봇은 처음에 480 × 1080 px, 다음에는 240 × 540 px입니다. 미리보기 확대는 이 치수를 유지합니다. 작업 해상도를 바꾸고 다시 합성하면 PNG 치수가 바뀝니다."},{"title":"카메라가 멀어질 때 생기는 줄 확인","try":"본인의 동영상에서 짧은 줌 아웃 구간을 선택하세요. {zoom_motion}과 간격 1로 {preserve}와 {feather}를 비교합니다. 더 잘 맞은 결과에 색 보정만 15%, 다음엔 부드럽게 하기만 10%로 각각 적용하세요.","expect":"줄이 옅어지고 윤곽이 한 줄이면 원본과 비교해 마음에 드는 결과를 내보내세요. 윤곽 자체가 겹치면 범위, 자르기, 정렬을 다시 확인하세요. 국소 보정으로 위치가 다른 물체를 맞추기는 어렵습니다."}]}},"zh":{"ui":{"guide":"使用指南","hero1":"从镜头移动","hero2":"到一张完整图像。","intro":"把同一场景的连续画面拼成一张图，重现镜头扫过的全貌。先体验演示，再用自己的 GIF 或视频跟着操作。","start":"开始教程","download":"下载 Framosik","demo":"交互演示","source":"原始帧","panorama":"拼接图像","scrub":"拖动滑块，浏览全部 37 帧。","contents":"指南目录","help":"常见问题","close":"关闭","enlarge":"放大截图","releases":"发行版本","links":"项目链接","skip":"跳转到教程","language":"教程语言","back":"返回顶部"},"sections":[{"title":"打开 Framosik","p":["在 Windows x64 上解压整个 ZIP 文件，然后打开 {exe}。在 Linux x86_64 上解压 .tar.gz 文件，在 Framosik 文件夹内运行 {bin}。请将 {internal} 文件夹与可执行文件放在一起。","点击 {open} 或按 {ctrlO}，打开软件包附带的 {demoFile}。第一帧显示机器人的脚。镜头用 37 帧从下往上扫过同一幅画。"]},{"title":"选取一个连续场景","p":["在 {original} 中拖动时间轴，也可以用 {play} 和方向按钮寻找起点与终点。点击 {mark_start} 和 {mark_end}，或在 {first} 和 {last} 中输入编号。首尾两帧都会参与拼接。","演示请选择第 1 到 37 帧，并把 {step} 保持为 1。处理自己的视频时，在切镜或转场前结束取样。步长越大，处理的帧数越少，但相邻采样画面的共同细节也越少。"]},{"title":"选择对齐与混合方式","p":["在 {movement} 中，机器人演示用 {vertical}，横向移动用 {horizontal}，斜向移动用 {free}。画面均匀放大或缩小时，选择 {zoom_motion}。","在 {mode} 中，{preserve} 会保留已拼好的线条。{feather} 会按 {feather_width} 设置的宽度混合边缘。{average} 会混合重叠像素，主体移动时可能出现双重轮廓。","可以先将 {similarity} 设为 65%，{overlap} 设为 20%。前者决定匹配要求，后者规定必须重叠的最小面积。使用 {crop} 可从每一帧裁掉固定的字幕区域，单位为原始图像像素。"]},{"title":"观察拼接过程","p":["点击 {stitch}。处理过程中，{result} 会逐步显示扩大后的图像。日志记录每一帧的匹配置信度和位移。使用 {fit} 查看全貌，或使用 {zoom} 检查像素细节。","在图像上滚动鼠标滚轮可以缩放，拖动可以平移。在选项面板上，滚轮用于滚动设置项。点击 {cancel} 可保留已完成的部分。以 100% 分辨率拼接完整演示，可得到 480 × 1080 像素的图像。"]},{"title":"修整接缝并导出","p":["拼接结束后，左侧的 {finish} 就可以使用。在 100% 下观察接缝，从较低的 {seam_soft} 开始淡化细线，或用较低的 {seam_color} 修正局部色差。点击 {apply_finish} 应用。","每次修整都从原始拼接图开始。要对比效果，可将两项都归零后再次应用。{export} 或 {ctrlS} 会保存上一次实际应用的效果，所有帧都未覆盖的区域保持透明。{report} 会将参数、接受和拒绝的帧及中断原因写入 JSON 文件。"]},{"title":"调整界面外观","p":["在 {view} 中选择 {theme} 和 {language}。{gradients} 控制发光效果。启用渐变后，可以用 {animations} 开关标题和控件的动画。偏好设置会自动保存。","打开 {about} 可查看已安装的版本，并访问网站、代码仓库和捐助页面。教程可以在页面顶部独立切换语言，无需更改应用的语言。"]}],"faq":[["拼接在某一帧停下了，该怎么办？","检查最后一个被接受的帧，缩短范围，并将步长调回 1。如果只是个别帧不匹配，可用 {skip} 让后续帧与上一个被接受的帧对齐。真正切换场景后，请开始新的拼接。"],["为什么缩放镜头会出现条纹或双重轮廓？","试用 {zoom_motion}，选取间隔较小的帧，并使用 {feather}。检查接缝后再做轻微修整。旋转、透视变化、视差或运动图层都可能使整幅画面无法用同一种变换对齐。"],["达到尺寸上限或视频无法打开。","降低 {resolution} 或将片段分段处理。{limit} 以百万像素为单位限制拼接图的大小。视频是否能读取取决于编码。无法打开时可尝试 H.264 编码的 MP4 副本。"]],"captions":["演示的原始帧，左侧范围设置为第 1 到 37 帧。","对齐、混合及裁剪设置，并显示了羽化宽度。","拼接完成的机器人全身图，附已启用的修整控件和处理日志。","浅色主题的外观页，包含语言、发光效果与动画设置。"],"reference":{"ui":{"title":"参数参考","intro":"展开分组即可查看每项控件的作用。默认值以全新安装为准。可以用英文名称、中文名称或想调整的效果搜索。","search":"查找控件","example":"例如：重叠、字幕、24 px","empty":"没有匹配的控件。请换一个词或清空搜索框。","matches":"匹配的控件","range":"范围","initial":"默认值","on":"开启","off":"关闭","workshop":"动手练习","expect":"观察结果","jump":"查看本步骤的控件"},"groups":{"scene":"文件与帧范围","motion":"运动和对齐","blend":"图像混合","crop":"裁剪四条边","preview":"拼接与浏览","finish":"修整与导出","appearance":"外观、语言和链接"},"entries":{"open":"打开 GIF、动态 WebP，以及 MP4、MKV、AVI、MOV、WebM 或 M4V 视频。视频能否读取取决于编码。PNG 和 JPEG 会作为单帧图像打开。加载其他文件前，请先导出想保留的拼接结果。","original":"拖动时间轴、点击 ‹ 和 ›，或输入帧号，就能查看特定细节。斜杠后的数字是文件总帧数。即使设置了裁剪，这个视图仍显示原始边缘。","play":"从当前帧开始播放，在镜头开始或停止移动的位置暂停。播放会继续经过标记的终点，直到文件的最后一帧。要重看某一段，请将滑块拖回起点。","first":"设定参与拼接的第一帧。N 是文件的总帧数，帧号从 1 开始。可以输入帧号，也可以浏览到合适的位置再标记。缩放镜头以这一帧的大小作为参考。","last":"设定参与拼接的最后一帧。如果第 90 帧已经切到新镜头，请选第 89 帧。起点和终点设为同一个数，就能得到单帧结果。","step":"决定取样间隔。范围为 2 到 9、步长为 3 时，会尝试第 2、5、8、9 帧。即使最后一帧不在等距序列中也会纳入。快速移动或缩放时从 1 开始，重复帧很多时可以增大步长。","movement":"在两帧中观察同一个固定细节。位置变化而大小不变时，选平移模式；细节变大或变小时，试用缩放模式。更改此项后重新拼接即可看到效果。","free":"允许沿 X 和 Y 同时移动，适合斜向移动或向上移动时略带横移的镜头。跟踪背景上的固定点，有助于区分镜头运动和角色自己的动作。","vertical":"只沿竖直方向对齐。如果背景点上下移动时始终位于同一列，就选这个模式。如果镜头还有横向漂移并导致好帧被拒绝，请尝试自由移动。","horizontal":"只沿水平方向对齐，适合镜头左右摇动且地平线高度不变的场景。如果画面同时上升或下降，请允许两个方向的移动。","zoom_motion":"估算已接受帧之间的均匀缩放和双轴位移。镜头拉远时，为保留首帧的比例，画布可能扩大很多。先使用步长 1。如果背景对齐但角色出现重影，请检查两者是否独立运动。","resolution":"裁剪后对每帧缩放，同时改变最终 PNG 的尺寸。设为 50% 时，宽高各减半，像素面积约为四分之一。可以低分辨率试拼长镜头，再回到 100% 重新拼接以保留细节。","similarity":"规定重叠区域所需的最低匹配分数。如果重复纹理被错误对齐，提高此值。如果明显相同的画面被拒绝，先检查裁剪、运动模式和步长，再小幅降低门槛并与原图轮廓比较。","overlap":"规定工作帧中有足够不透明度的共同像素至少占多大比例。设为 20% 时约需五分之一。提高可以排除范围过小的模糊匹配。如果相邻样本相距很远，先减小步长。","limit":"限制包围整张拼接图的矩形面积，其中包括透明空隙。6000 × 4000 像素就是 24 MP。提高上限可以拼更大的图，也需要更多内存。达到上限时可以降低工作分辨率或分段处理。","skip":"开启后，某帧匹配失败时，后面的候选帧会继续与最后一个被接受的帧比较。适合跳过偶尔模糊的一帧。关闭时，首次拒绝即停止，并保留已有结果。跨度过大仍可能缺少画面。","mode":"决定已对齐的像素如何合并。固定帧范围和分辨率，分别用各模式重新拼接。放大一条跨过接缝的细线，观察它能否保持清晰、连续且只有一条。","preserve":"填入新出现的区域，同时保留已覆盖区域，通常适合线条清晰的插画。在缩放模式中，后来的帧还可补全先前仅部分覆盖的边缘像素。","feather":"在新区域附近逐渐混合重叠部分，适合淡化同一面墙在相邻帧中的轻微色差。如果有两条明显错开的轮廓，应先检查对齐，再考虑增加过渡宽度。","feather_width":"仅在启用接缝柔化时可调，以工作分辨率的像素为单位。在同一轮廓上比较 8 和 32 px。较窄的过渡保留细线，较宽的过渡可将色调变化分散到更多像素。","average":"每次把现有拼接图与新帧的重叠像素各取一半。一个位置若被反复覆盖，就会连续混合多次。这能减轻色彩波动，但移动的手也可能显示成两只。","left":"在对齐前从左侧去掉若干列。若有固定的 12 px 黑边，这里填 12。请在原图上测量，并尽量保留黑边旁有助于匹配的固定细节。","top":"从上方去掉若干行，例如去除固定的顶栏。即使工作分辨率是 50%，数值仍按原始像素计算。重新拼接时会应用到范围内的每一帧。","right":"从右侧向内去掉若干列。两侧各有 8 px 边框时，左右各填 8。原图宽 480 px 时，缩放前会剩下 464 px。","bottom":"从底部向上裁剪。如果字幕占据最后 32 px，先试 32，再查看拼接图是否残留文字。四边裁完后，原图至少要剩 32 × 32 像素。原始帧预览仍会显示完整画面。","stitch":"用当前范围和参数开始新的拼接。结果标签页会自动打开，处理期间暂时停用编辑控件。如需与旧结果比较，先导出再重新拼接。","result":"定期显示逐渐扩大的图像。处理中的预览可能缩小到最长边 1400 px。结束后显示最终分辨率的结果，此时再检查接缝细节。","fit":"将整张图放入当前可视区域。放大检查接缝或改变窗口大小后，可以用它回到全景。启用自动适应时，视图会跟随画布的增长。","zoom":"将视图恢复到 100% 以检查像素。在图像上滚动可缩放，拖动可平移。在设置面板上，滚轮用于上下浏览选项。视图缩放只影响屏幕显示。","log":"结合帧号、匹配置信度和 X/Y 位移 Δ 阅读日志。若一帧已接受但 Δ 接近零，它可能与前一帧重复，新增区域很少。连续拒绝可以帮助定位需要检查的片段。","cancel":"请求在帧与帧之间停止。导出前请等到当前任务结束。已有的部分拼接结果仍可查看、修整和保存。处理长视频时，可以从该处另选一段继续拼接。","seam_soft":"用考虑边缘的滤波器减少已检测接缝附近的细微变化。用 100% 视图比较 0% 和 10% 的效果。若细纹仍在，可小幅提高；若画面的细线变软，则降低。","seam_color":"将接缝颜色向邻近像素的中值靠拢。适合修补均匀背景中的细小异色线。将柔化设为零，单独试用 10–20% 的颜色修复，以观察其作用。修整针对标记接缝附近的不透明区域。","apply_finish":"每次都从原始拼接图重新计算这两个参数。用相同数值应用两次，结果相同。要作对照，可将两项归零并再次应用。导出前记得应用刚刚调整的数值。","export":"将上一次已应用的修整结果存为 PNG。未被任何帧覆盖的区域可能透明。可在不同底色上检查边缘，并给各个试验版本取不同文件名。快捷键 {ctrlS}。","report":"保存 JSON 报告。accepted 和 rejected 列出帧号，frames 记录各帧分数与位移，reason 说明中断原因。帧列表从 1 起算，settings 中的 first 和 last 从 0 起算。","theme":"根据环境光选择 {dark} 或 {light}。主题改变面板以及图像周围的背景。切换主题便于在不同底色上检查透明边缘。","language":"更换界面标签和提示语言，并在下次启动时记住选择。本教程顶部另有语言选择器，因此可以用中文阅读，同时对照英文界面。","gradients":"启用标题和控件的渐变与光晕。关闭后外观变为静态，动画复选框也会停用。此设置会保存到下次使用。","animations":"启用渐变后，可控制像素标题和控件高光的动画。关闭它可以保留色彩、减少动态效果。处理任务期间或窗口不活动时，特效也会暂停。","about":"查看安装版本，并打开代码仓库、网站与捐助页面。比较两台设备的拼接结果时，先在此确认版本，再比较参数。"},"workshops":[{"title":"核对步长选中了哪些帧","try":"打开 {demoFile}。设为第 2 到 9 帧、步长 3、{vertical}、分辨率 100% 和 {preserve}。拼接后打开 JSON 报告。","expect":"accepted 中是 2、5、8、9。最后的 9 说明即使终点不落在等距取样的位置，也会被纳入。"},{"title":"测量输出分辨率","try":"选择完整 GIF 的第 1 到 37 帧、步长 1 和 {vertical}。先以 100% 工作分辨率拼接，再改成 50% 重做，比较两次结束时的尺寸。","expect":"完整机器人先是 480 × 1080 px，再是 240 × 540 px。缩放预览会保留这些尺寸。调整工作分辨率并重新拼接才会改变 PNG。"},{"title":"检查拉远镜头中的条纹","try":"在自己的视频中选一小段拉远镜头，使用 {zoom_motion} 和步长 1。比较 {preserve} 与 {feather}。在对齐较好的结果上，先单独试 15% 颜色修复，再单独试 10% 柔化，每次都应用。","expect":"如果条纹减淡而轮廓仍只有一条，就对照原图后导出。若轮廓本身重叠成两条，重新检查范围、裁剪或对齐。局部修整对位置不同的物体作用有限。"}]}},"ru":{"ui":{"guide":"Руководство","hero1":"От движения камеры","hero2":"к целому изображению.","intro":"Соберите кадры одной сцены и увидите всё, по чему прошла камера. Изучите пример, а затем повторите шаги со своим GIF или видео.","start":"Начать обучение","download":"Скачать Framosik","demo":"Интерактивный пример","source":"Исходный кадр","panorama":"Собранное изображение","scrub":"Передвигайте ползунок, чтобы увидеть все 37 кадров.","contents":"Содержание","help":"Частые вопросы","close":"Закрыть","enlarge":"Увеличить снимок","releases":"Релизы","links":"Ссылки проекта","skip":"Перейти к руководству","language":"Язык руководства","back":"Наверх"},"sections":[{"title":"Запустите Framosik","p":["В Windows x64 распакуйте весь ZIP-архив и откройте {exe}. В Linux x86_64 распакуйте .tar.gz и запустите {bin} в папке Framosik. Оставьте папку {internal} рядом с исполняемым файлом.","Нажмите {open} или {ctrlO} и выберите файл {demoFile} из комплекта. В первом кадре видны ступни робота. За 37 кадров камера пройдёт снизу вверх по одному рисунку."]},{"title":"Выделите одну сцену","p":["На вкладке {original} перемещайте ползунок или используйте {play} и стрелки, чтобы найти начало и конец. Нажмите {mark_start} и {mark_end} или введите номера в {first} и {last}. Обе границы включаются в сборку.","Для примера выберите кадры с 1 по 37 и оставьте {step} равным 1. В своём видео завершите диапазон до склейки или перехода. Большой шаг сокращает число кадров, но уменьшает общую область для совмещения."]},{"title":"Выберите совмещение и смешивание","p":["В поле {movement} выберите {vertical} для примера с роботом, {horizontal} для сдвига вбок и {free} для диагонали. Используйте {zoom_motion} при приближении или отдалении с равномерным изменением масштаба.","В поле {mode} режим {preserve} сохраняет уже собранные контуры. {feather} смешивает края в полосе шириной {feather_width}. {average} усредняет общие пиксели и может дать двойной контур у движущегося персонажа.","Начните с 65% для {similarity} и 20% для {overlap}. Первое значение определяет требуемое сходство, второе — минимальную общую площадь. С помощью {crop} можно убрать неподвижную полосу субтитров из каждого кадра, указав размер в пикселях исходника."]},{"title":"Следите за сборкой","p":["Нажмите {stitch}. На вкладке {result} изображение растёт по мере обработки. В журнале видны степень совпадения и смещение для каждого кадра. Выберите {fit}, чтобы увидеть всю сцену, или {zoom}, чтобы рассмотреть пиксели.","Колесо мыши над изображением меняет масштаб, перетаскивание двигает область просмотра. Над панелью настроек колесо прокручивает список. {cancel} сохраняет промежуточный результат. Полный пример при 100% даёт изображение 480 × 1080 пикселей."]},{"title":"Обработайте стыки и сохраните","p":["Когда сборка закончится, слева станет доступна группа {finish}. Рассмотрите стык при 100%. Попробуйте небольшое значение {seam_soft}, чтобы смягчить полоску, или {seam_color} для местного перепада цвета. Нажмите {apply_finish}.","Каждая обработка начинается с исходной мозаики. Для сравнения обнулите оба значения и примените их снова. {export} или {ctrlS} сохранит последний применённый вариант с прозрачностью в непокрытых областях. {report} запишет в JSON настройки, принятые и отклонённые кадры и причину остановки."]},{"title":"Настройте интерфейс","p":["На вкладке {view} выберите {theme} и {language}. За свечение отвечает {gradients}. При включённых градиентах параметр {animations} управляет движением заголовка и элементов управления. Настройки сохраняются автоматически.","На вкладке {about} можно проверить установленную версию и перейти на сайт, в репозиторий и на страницу поддержки. Язык этого руководства можно переключить вверху страницы независимо от приложения."]}],"faq":[["Сборка останавливается на одном кадре. Что делать?","Проверьте последний принятый кадр, сократите диапазон и верните шаг к 1. При единичном сбое {skip} попробует совместить следующие кадры с последним принятым. После смены сцены начните новую сборку."],["Почему при изменении масштаба видны полосы или двойные контуры?","Попробуйте {zoom_motion} с близкими кадрами и режимом {feather}. Проверьте стыки и примените лёгкую обработку. Вращение, перспектива, параллакс и движущиеся слои могут помешать совмещению всей сцены одним преобразованием."],["Достигнут предел размера или не открывается видео.","Уменьшите {resolution} или разделите отрезок. {limit} ограничивает размер мозаики в мегапикселях. Поддержка видео зависит от кодека. Попробуйте копию в формате MP4 с кодеком H.264."]],"captions":["Исходный кадр примера с диапазоном от 1 до 37.","Настройки совмещения, смешивания и обрезки с полем ширины растушёвки.","Робот целиком на собранном изображении, доступные параметры обработки и журнал.","Вкладка оформления в светлой теме с настройками языка, свечения и анимации."],"reference":{"ui":{"title":"Справочник параметров","intro":"Откройте группу, чтобы узнать, как работает каждый элемент. Начальные значения приведены для новой установки. Ищите по английскому или русскому названию либо по нужному эффекту.","search":"Найти параметр","example":"Например, перекрытие, субтитры, 24 px","empty":"Ничего не найдено. Попробуйте другое слово или очистите поле поиска.","matches":"Найдено элементов","range":"Диапазон","initial":"По умолчанию","on":"Включено","off":"Выключено","workshop":"Практические упражнения","expect":"На что обратить внимание","jump":"Посмотреть параметры этого шага"},"groups":{"scene":"Файл и диапазон кадров","motion":"Движение и совмещение","blend":"Смешивание изображений","crop":"Обрезка с четырёх сторон","preview":"Сборка и навигация","finish":"Обработка и экспорт","appearance":"Оформление, язык и ссылки"},"entries":{"open":"Открывает GIF, анимированный WebP и видео MP4, MKV, AVI, MOV, WebM или M4V при поддержке кодека. PNG и JPEG открываются как отдельные кадры. Прежде чем выбрать другой файл, экспортируйте нужную мозаику.","original":"Для просмотра кадра перетащите ползунок, нажмите ‹ или › либо введите номер. После косой черты указано общее количество кадров. Здесь видны исходные края даже при заданной обрезке.","play":"Воспроизведение начинается с текущего кадра. Нажмите паузу в начале или конце движения камеры. Просмотр может выйти за отмеченную границу и заканчивается в конце файла. Для повтора верните ползунок назад.","first":"Первый кадр, входящий в сборку. N обозначает количество кадров в файле, отсчёт начинается с 1. Введите номер или отметьте текущую позицию. Этот кадр также задаёт исходный масштаб при сборке с зумом.","last":"Последний кадр, входящий в сборку. Если с кадра 90 начинается другой план, завершите диапазон на 89. Одинаковые номера в обоих полях позволяют получить результат из одного кадра.","step":"Задаёт расстояние между выбранными кадрами. В диапазоне 2–9 с шагом 3 программа попробует 2, 5, 8 и 9. Конец включается, даже если не попал в последовательность. Для зума и быстрого движения начните с 1. При множестве повторов шаг можно увеличить.","movement":"Сравните неподвижную деталь на двух кадрах. Если меняется её положение при постоянном размере, выберите сдвиг. Если меняется размер, попробуйте зум. Изменение действует при следующей сборке.","free":"Допускает сдвиг по X и Y. Подходит для диагонального движения и подъёма с небольшим уходом в сторону. Следите за фиксированной точкой фона, чтобы отличить движение камеры от движения персонажа.","vertical":"Ограничивает сдвиг вертикалью. Подходит, если точка фона движется вверх или вниз в одном столбце. Если из-за бокового смещения подходящие кадры отклоняются, попробуйте свободное движение.","horizontal":"Ограничивает сдвиг горизонталью. Используйте для движения влево или вправо, при котором высота горизонта постоянна. Если камера одновременно поднимается или опускается, разрешите обе оси.","zoom_motion":"Оценивает равномерное изменение масштаба и сдвиг по двум осям между принятыми кадрами. При отдалении холст может сильно вырасти, сохраняя масштаб первого кадра. Начните с шага 1. Независимое движение слоёв может давать двойные контуры.","resolution":"Меняет размер каждого кадра после обрезки, а с ним и размеры итогового PNG. При 50% ширина и высота уменьшаются вдвое, площадь примерно вчетверо. Длинную сцену удобно проверить в уменьшенном виде, затем собрать заново при 100%.","similarity":"Задаёт минимальную оценку совпадения в общей области. Повышайте, если повторяющийся узор привязывается не к тому месту. Если подходящие кадры отклоняются, проверьте обрезку, режим и шаг, затем снизьте порог на несколько пунктов и сравните контуры с оригиналом.","overlap":"Задаёт минимальную долю площади рабочего кадра с общими достаточно непрозрачными пикселями. При 20% нужна примерно пятая часть. Повышение отсеивает маленькие неоднозначные совпадения. Если соседние образцы далеко друг от друга, сначала уменьшите шаг.","limit":"Ограничивает площадь прямоугольника вокруг мозаики, включая прозрачные промежутки. Изображение 6000 × 4000 занимает 24 Мп. Повышение лимита позволяет собрать более крупное изображение и требует больше памяти. При остановке уменьшите разрешение или разделите диапазон.","skip":"При включении после ошибки следующий кандидат сравнивается с последним принятым кадром. Полезно для одиночного смазанного кадра. При выключении первый отказ останавливает сборку с сохранением частичного результата. Слишком большой пропуск может нарушить перекрытие.","mode":"Определяет, как смешивать уже совмещённые пиксели. Сравнивайте режимы на одном диапазоне и разрешении, каждый раз выполняя сборку заново. Увеличьте тонкую линию поперёк стыка и проверьте, осталась ли она чёткой и одинарной.","preserve":"Заполняет новые области и сохраняет ранее покрытые пиксели. Подходит для чётких рисованных контуров. В режиме зума поздний кадр может дополнительно заполнить частично покрытый пиксель на краю.","feather":"Плавно смешивает перекрытие возле вновь открытой области. Попробуйте, если оттенок одной стены немного меняется между кадрами. Если видны две раздельные границы, проверьте совмещение до расширения перехода.","feather_width":"Доступно при сглаживании стыков. Ширина задаётся в рабочих пикселях. Сравните 8 и 32 пикселя на одном контуре. Узкая полоса лучше сохраняет тонкий штрих, широкая распределяет смену оттенка на большее расстояние.","average":"На каждом шаге поровну смешивает общие пиксели текущей мозаики и нового кадра. Многократно покрытые точки смешиваются повторно. Это ослабляет цветовые колебания, но движущаяся рука может появиться дважды.","left":"Удаляет столбцы слева до поиска совпадений. Для постоянной чёрной полосы в 12 пикселей введите 12. Измеряйте по исходнику и сохраняйте соседние неподвижные детали для совмещения.","top":"Удаляет строки сверху, например неподвижную верхнюю панель. Величина задаётся в исходных пикселях даже при рабочем разрешении 50%. При следующей сборке обрезка применяется ко всем выбранным кадрам.","right":"Удаляет столбцы от правого края. Для симметричной рамки по 8 пикселей укажите 8 с обеих сторон. При исходной ширине 480 до масштабирования останется 464 пикселя.","bottom":"Удаляет строки снизу. Если субтитры занимают нижние 32 пикселя, попробуйте 32 и проверьте мозаику на остатки букв. После обрезки с четырёх сторон должно остаться не менее 32 × 32 исходных пикселей. Исходный кадр в просмотре остаётся целым.","stitch":"Начинает новую сборку с текущими настройками. Вкладка результата открывается автоматически, а изменение параметров на время вычислений блокируется. Экспортируйте вариант для сравнения перед следующим запуском.","result":"Периодически показывает растущую мозаику. В процессе сборки предпросмотр может уменьшаться до 1400 пикселей по длинной стороне. По завершении появляется результат в полном разрешении. Оценивайте стыки на этом этапе.","fit":"Вписывает всё изображение в область просмотра. Используйте после увеличения стыка или изменения размера окна. При автоматической подгонке в кадре остаётся вся растущая мозаика.","zoom":"Возвращает масштаб просмотра к 100% для проверки пикселей. Над изображением колесо меняет масштаб, перетаскивание перемещает вид. Над настройками колесо прокручивает панель. Масштаб просмотра влияет только на отображение.","log":"Читайте номер кадра, степень совпадения и сдвиг Δ по X и Y вместе. Принятый кадр с почти нулевым сдвигом может повторять предыдущий и добавлять мало новой площади. Несколько отказов подряд указывают на диапазон для проверки.","cancel":"Запрашивает остановку между кадрами. Дождитесь завершения задачи перед экспортом. Если уже есть частичная мозаика, её можно осмотреть, обработать и сохранить. Длинный ролик можно продолжить отдельным диапазоном.","seam_soft":"Смягчает мелкие перепады возле найденных стыков с помощью фильтра, учитывающего границы. Сравните 0% и 10% при масштабе просмотра 100%. Повышайте постепенно и уменьшите значение, если тонкие линии теряют резкость.","seam_color":"Приближает цвет на стыке к медиане соседних пикселей. Полезно для тонкой полоски другого оттенка на ровном фоне. Попробуйте 10–20% при нулевом сглаживании. Обработка затрагивает непрозрачные области рядом с отмеченными стыками.","apply_finish":"Оба эффекта пересчитываются от исходной мозаики. Повторное применение одинаковых значений даёт тот же результат. Для сравнения обнулите оба и примените снова. Перед экспортом примените последние изменения.","export":"Сохраняет PNG с последней применённой обработкой. Там, куда не попал ни один кадр, возможна прозрачность. Проверьте края на разных фонах и дайте сравнительным вариантам разные имена. Сочетание клавиш {ctrlS}.","report":"Сохраняет JSON. В accepted и rejected находятся номера кадров, в frames — отдельные оценки и сдвиги, в reason — причина остановки. В списках кадры нумеруются с 1. Параметры first и last внутри settings отсчитываются от 0.","theme":"Выберите {dark} или {light} с учётом освещения. Тема меняет панели и фон вокруг изображения. Переключайте их, чтобы оценить прозрачный край на разных фонах.","language":"Меняет подписи и сообщения программы и запоминает выбор до следующего запуска. У руководства сверху свой переключатель. Можно читать по-русски, оставив программу на английском.","gradients":"Включает градиенты и свечение заголовка и элементов управления. При выключении оформление становится статическим, а флажок анимации недоступен. Выбор сохраняется между запусками.","animations":"При включённых градиентах анимирует пиксельный заголовок и подсветку элементов. Отключите для меньшего движения с теми же цветами. Эффекты также приостанавливаются во время обработки и в неактивном окне.","about":"Показывает установленную версию и ссылки на репозиторий, сайт и страницу поддержки. Если сопоставляете результаты двух установок, сначала сверьте здесь версии, а затем настройки."},"workshops":[{"title":"Проверить, какие кадры даёт шаг","try":"Откройте {demoFile}. Выберите 2–9, шаг 3, {vertical}, разрешение 100% и {preserve}. Соберите изображение и откройте отчёт JSON.","expect":"В accepted будут 2, 5, 8 и 9. Последняя позиция показывает, что конечный кадр учитывается, даже если на него не попадает обычный шаг."},{"title":"Измерить выходное разрешение","try":"Возьмите весь GIF, кадры 1–37, шаг 1 и {vertical}. Выполните сборку при рабочем разрешении 100%, затем при 50%. Сравните размеры по завершении.","expect":"Размер целого робота составит сначала 480 × 1080, затем 240 × 540 пикселей. Масштаб предпросмотра сохраняет эти размеры. Новый PNG меняется после смены рабочего разрешения и повторной сборки."},{"title":"Исследовать полосу при отдалении","try":"Возьмите короткий отъезд камеры из своего видео. Выберите {zoom_motion} с шагом 1 и сравните {preserve} с {feather}. На лучше совмещённом результате отдельно примените 15% коррекции цвета, затем только 10% сглаживания.","expect":"Если полоса ослабла, а контур остался одинарным, сравните с оригиналом и экспортируйте. Если контур двоится, проверьте диапазон, обрезку и совмещение. Локальная обработка слабо влияет на объекты в разных положениях."}]}}},"controls":[{"id":"scene","items":[{"labels":["open"]},{"labels":["original","frame"]},{"labels":["play","pause"]},{"labels":["first","mark_start"],"range":"1–N","initial":"1"},{"labels":["last","mark_end"],"range":"1–N","initial":"N"},{"labels":["step"],"range":"1–120","initial":"1"}]},{"id":"motion","items":[{"labels":["movement"],"initial":"{free}"},{"labe <script>
'use strict';
const {names, app, guides, controls} = JSON.parse(document.getElementById('texts').textContent);
const assets = JSON.parse(document.getElementById('assets').textContent);
const $ = id => document.getElementById(id);
const sectionIds = ['install','range','alignment','stitch','finish','appearance'];
const shots = {1:['workspace',0],2:['blending',1],4:['result',2],5:['appearance',3]};
const literals = {exe:'Framosik.exe',bin:'./Framosik',internal:'_internal',demoFile:'examples/demo_vertical.gif',ctrlO:'Ctrl+O',ctrlS:'Ctrl+S'};
const cfg = FRAMOSIK_CONFIG;
const repo = cfg.repository.replace(/\/+$/,'');
const releases = cfg.releases || repo + '/releases';
const prefix = repo + '/releases/download/v' + cfg.version + '/Framosik-' + cfg.version;
const urls = {website:cfg.website,repository:repo,donate:cfg.donate,releases,
  download:cfg.download || repo + '/releases/tag/v' + cfg.version,
  windows:cfg.windows || prefix + '-Windows-x64.zip',linux:cfg.linux || prefix + '-Linux-x86_64.tar.gz'};
const tag = {pt:'pt-BR',zh:'zh-CN'};
function element(name, text, cls) {
  const node = document.createElement(name);
  if (text != null) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}
function link(label, url) {
  const a = element('a',label); a.href = url; return a;
}
function fillText(node, text, lang) {
  for (const part of text.split(/(\{[A-Za-z_]+\})/g)) {
    if (!part.startsWith('{')) { node.append(part); continue; }
    const key = part.slice(1,-1);
    if (Object.hasOwn(literals,key)) {
      node.append(element(key.startsWith('ctrl')?'kbd':'code',literals[key]));
      continue;
    }
    const label = element('span',app.en[key],'control');
    label.lang = 'en'; node.append(label);
    if (lang !== 'en' && app[lang][key] !== app.en[key]) node.append(element('span',' (' + app[lang][key] + ')','localized'));
  }
}
function figure(key, caption, ui) {
  const fig = element('figure'), btn = element('button',null,'shot'), im = element('img');
  btn.type = 'button'; btn.setAttribute('aria-label',ui.enlarge + ' · ' + caption);
  im.src = assets[key]; im.alt = caption; im.width = 1250; im.height = 840; im.loading = 'lazy';
  btn.append(im); btn.onclick = () => {
    $('fullshot').src = assets[key]; $('fullshot').alt = caption;
    $('viewerCaption').textContent = caption; $('viewer').showModal(); $('close').focus();
  };
  const cap = element('figcaption',null,'figure-foot'), magnify = element('span','⤢');
  magnify.setAttribute('aria-hidden','true'); cap.append(element('span',caption),magnify); fig.append(btn,cap); return fig;
}
let playback = null;
function showPlayState() {
  const playing = playback !== null;
  $('demoPlay').setAttribute('aria-pressed',String(playing));
  $('demoPlay').textContent = app[$('language').value][playing?'pause':'play'];
}
function stopDemo() {
  clearInterval(playback); playback=null; showPlayState();
}
function toggleDemo() {
  if (playback !== null) { stopDemo(); return; }
  if (Number($('scrub').value) === 37) { $('scrub').value=1; setFrame(); }
  playback=setInterval(()=>{
    $('scrub').stepUp(); setFrame();
    if (Number($('scrub').value) === 37) stopDemo();
  },140);
  showPlayState();
}
function setFrame() {
  const frame = Number($('scrub').value), ratio = (37-frame)/36;
  $('position').textContent = String(frame).padStart(2,'0') + ' / 37';
  $('tile').style.backgroundPosition = 'center ' + (ratio*100) + '%';
  $('band').style.top = (ratio*100*2/3) + '%';
}
function searchText(value) {
  return value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase();
}
function applySearch() {
  const reference = guides[$('language').value].reference;
  const terms = searchText($('controlSearch').value.trim()).split(/\s+/).filter(Boolean);
  let count = 0;
  for (const group of $('referenceGroups').children) {
    const name = searchText(group.querySelector('summary').textContent);
    let visible = 0;
    for (const row of group.querySelectorAll('.ref-row')) {
      const text = name + ' ' + row.dataset.search;
      row.hidden = !terms.every(term => text.includes(term));
      if (!row.hidden) visible++;
    }
    count += visible;
    group.hidden = visible === 0;
    if (terms.length) {
      if (!group.hasAttribute('data-previous')) group.dataset.previous = String(group.open);
      group.open = visible > 0;
    } else if (group.hasAttribute('data-previous')) {
      group.open = group.dataset.previous === 'true';
      delete group.dataset.previous;
    }
  }
  $('matchCount').textContent = count ? reference.ui.matches + ' · ' + count : reference.ui.empty;
}
function renderReference(lang) {
  const ref = guides[lang].reference, ui = ref.ui;
  const labels = {referenceTitle:'title',referenceIntro:'intro',referenceLink:'title',searchLabel:'search',
                  workshopTitle:'workshop',workshopLink:'workshop'};
  for (const [id,key] of Object.entries(labels)) $(id).textContent = ui[key];
  $('controlSearch').placeholder = ui.example;
  const host = $('referenceGroups');
  const expanded = new Set(Array.from(host.querySelectorAll('details')).filter(g =>
    g.hasAttribute('data-previous') ? g.dataset.previous === 'true' : g.open).map(g => g.id));
  host.replaceChildren();
  for (const {id,items} of controls) {
    const group = element('details',null,'ref-group'), dl = element('dl');
    group.id = 'group-' + id; group.open = expanded.has(group.id);
    group.append(element('summary',ref.groups[id]),dl);
    for (const item of items) {
      const key = item.labels[0];
      const row = element('div',null,'ref-row'), title = element('dt'), desc = element('dd');
      row.id = 'control-' + key;
      fillText(title,item.labels.map(label => '{'+label+'}').join(' · '),lang);
      const meta = [];
      if (item.range) meta.push(ui.range + ' ' + item.range);
      if (Object.hasOwn(item,'initial')) {
        const value = typeof item.initial === 'boolean' ? ui[item.initial ? 'on' : 'off'] : item.initial;
        meta.push(ui.initial + ' ' + value);
      }
      if (meta.length) {
        const values = element('span',null,'ref-meta'); fillText(values,meta.join(' · '),lang); title.append(values);
      }
      fillText(desc,ref.entries[key],lang);
      row.dataset.search = searchText(title.textContent + ' ' + desc.textContent);
      row.append(title,desc); dl.append(row);
    }
    host.append(group);
  }
  $('exercises').replaceChildren();
  for (const ex of ref.workshops) {
    const article = element('article',null,'exercise'), steps = element('p'), outcome = element('p');
    fillText(steps,ex.try,lang); outcome.append(element('strong',ui.expect + ' · ')); fillText(outcome,ex.expect,lang);
    article.append(element('h3',ex.title),steps,outcome); $('exercises').append(article);
  }
  applySearch();
}
function openReferenceTarget(hash) {
  if (!/^#(?:group|control)-[a-z_]+$/.test(hash)) return;
  const target = document.getElementById(hash.slice(1));
  if (!target) return;
  if ($('controlSearch').value) { $('controlSearch').value = ''; applySearch(); }
  const group = target.closest('details'); group.open = true;
  target.scrollIntoView({block:'start'});
}
function render(lang) {
  const {ui,sections,faq,captions} = guides[lang];
  document.documentElement.lang = tag[lang] || lang;
  document.title = 'Framosik · ' + ui.guide;
  $('language').value = lang; showPlayState();
  const labels = {skip:'skip',guideName:'guide',hero1:'hero1',hero2:'hero2',intro:'intro',start:'start',get:'download',demoName:'demo',sourceLabel:'source',panLabel:'panorama',scrubLabel:'scrub',navguide:'contents',navhelp:'help',langlabel:'language',indexHeading:'contents',helpHeading:'help',linkHeading:'links',back:'back',close:'close'};
  for (const [id,key] of Object.entries(labels)) $(id).textContent = ui[key];
  $('version').textContent = 'v' + cfg.version; $('get').href = urls.download;
  $('chapters').replaceChildren(); $('steps').replaceChildren();
  sections.forEach(({title,p},i) => {
    const id = sectionIds[i], li = element('li'); li.append(link(title,'#'+id)); $('chapters').append(li);
    const s = element('section',null,shots[i]?'chapter':'chapter plain'); s.id = id;
    const copy = element('div',null,'copy'), h = element('h2',null,'stephead');
    const num = element('small',String(i+1).padStart(2,'0')); num.setAttribute('aria-hidden','true'); h.append(num,title);
    if (shots[i]) copy.append(h); else s.append(h);
    for (const line of p) { const para = element('p'); fillText(para,line,lang); copy.append(para); }
    if (i === 0) { const d = element('div',null,'packages'); d.append(link('Windows x64 · ZIP',urls.windows),link('Linux x86_64 · tar.gz',urls.linux)); copy.append(d); }
    const related = ['scene','scene','motion','preview','finish','appearance'][i];
    const refLink = link(guides[lang].reference.ui.jump, '#group-'+related);
    refLink.className = 'step-reference'; copy.append(refLink);
    s.append(copy);
    if (shots[i]) { const [key,index] = shots[i]; s.append(figure(key,captions[index],ui)); }
    $('steps').append(s);
  });
  renderReference(lang);
  $('questions').replaceChildren();
  for (const [q,a] of faq) { const d=element('details'), p=element('p',null,'answer'); fillText(p,a,lang); d.append(element('summary',q),p); $('questions').append(d); }
  $('external').replaceChildren(...['website','repository','releases','donate'].map(k=>link(k==='releases'?ui.releases:app[lang][k],urls[k])));
}
const selector = $('language');
for (const [key,name] of Object.entries(names)) { const opt = element('option',name); opt.value=key; opt.lang=tag[key]||key; selector.append(opt); }
const normalise = value => (value||'').toLowerCase().split(/[-_]/)[0];
const prefs = [new URLSearchParams(location.search).get('lang')];
try { prefs.push(localStorage.getItem('framosik-guide-language')); } catch {}
prefs.push(...(navigator.languages||[navigator.language]),'pt');
const initial = prefs.map(normalise).find(l=>Object.hasOwn(guides,l));
selector.onchange=() => {
  render(selector.value);
  try { localStorage.setItem('framosik-guide-language',selector.value); } catch {}
  try { const u=new URL(location.href); u.searchParams.set('lang',selector.value); history.replaceState(null,'',u); } catch {}
};
$('demoPlay').onclick=toggleDemo; $('scrub').oninput=()=>{stopDemo();setFrame();};
document.addEventListener('visibilitychange',()=>{if(document.hidden) stopDemo();});
 $('close').onclick=()=>$('viewer').close();
$('viewer').addEventListener('click',e=>{ if(e.target === $('viewer')) { const r=$('viewer').getBoundingClientRect(); if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) $('viewer').close(); } });
$('brandicon').src=document.querySelector('link[rel="icon"]').href;
document.querySelector('.demo-stage').style.setProperty('--art','url("'+assets.robot+'")');
$('controlSearch').oninput = applySearch;
window.addEventListener('hashchange',()=>openReferenceTarget(location.hash));
$('steps').addEventListener('click',e=>{
  const a=e.target.closest('.step-reference');
  if(a && a.hash === location.hash) openReferenceTarget(a.hash);
});
render(initial); setFrame(); openReferenceTarget(location.hash);
</script>
</body></html>
