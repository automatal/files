/* Extend the guide with the same surfaces, type and accent colours as the chapters. */
.reference{padding:38px 0;border-bottom:1px solid var(--line)}
.reference h2{font-size:clamp(1.6rem,2.7vw,2.32rem);letter-spacing:-.04em;line-height:1.18;margin:0 0 14px}
.reference>p{color:var(--muted);max-width:77ch;margin:0 0 16px}
.reference-links{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px}
.reference-links a,.step-reference{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.step-reference{display:inline-block;margin-top:12px;font-size:.9rem}
#searchLabel{display:block;margin:0 0 5px;font-weight:650}
#controlSearch{width:min(100%,470px);padding:9px 12px;border:1px solid #665475;border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
#controlSearch::placeholder{color:var(--muted)}
#matchCount{margin:8px 0;font-size:.85rem;min-height:1.4em}
.ref-group{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:7px 0;overflow-wrap:anywhere}
.ref-group>summary{padding:12px 15px;color:var(--ink)}
.ref-group>summary::marker{color:var(--accent)}
.ref-group dl{margin:0 15px}
.ref-row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,2fr);gap:8px 24px;border-top:1px solid var(--line);padding:12px 0}
.ref-row dt{font-weight:650;line-height:1.45}.ref-row dd{margin:0;color:var(--muted)}
.ref-meta{display:block;color:var(--gold);font-size:.8rem;font-weight:500;margin-top:4px}
.ref-meta .control,.ref-meta .localized{color:inherit}
.ref-row[hidden],.ref-group[hidden]{display:none}
.exercise{padding:16px 0;max-width:80ch}.exercise+.exercise{border-top:1px solid var(--line)}
.exercise h3{font-size:1.12rem;margin:0 0 6px}.exercise p{margin:4px 0;color:var(--muted)}
.exercise strong{color:var(--gold);font-weight:600}
@media(max-width:680px){.ref-row{grid-template-columns:1fr;gap:5px}.reference{padding:30px 0}}
@media print{#controlSearch,#searchLabel,#matchCount,.reference-links,.step-reference{display:none}.ref-row dt,.ref-row dd,.exercise p{color:#222}.ref-group{break-inside:auto}}

NG","feather":"Сглаживать стыки","feather_width":"Ширина сглаживания","finish":"Обработка","first":"Первый кадр","fit":"По размеру окна","frame":"Кадр","free":"Свободное (X и Y)","gradients":"Градиенты и свечение","horizontal":"Только по горизонтали","language":"Язык","last":"Последний кадр","left":"Слева","light":"Светлая","limit":"Лимит изображения","log":"Ход работы и уведомления","mark_end":"Отметить конец","mark_start":"Отметить начало","mode":"Режим","movement":"Движение","open":"Открыть GIF / видео","original":"Исходный кадр","overlap":"Минимальное перекрытие","pause":"Пауза","play":"Воспроизвести","preserve":"Сохранять существующее","report":"Сохранить отчёт","repository":"Репозиторий","resolution":"Рабочее разрешение","result":"Собранное изображение","right":"Справа","seam_color":"Коррекция цвета стыков","seam_soft":"Сглаживание","similarity":"Минимальное сходство","skip":"Пропускать несопоставленные кадры","step":"Брать каждый N-й кадр","stitch":"Собрать изображение","theme":"Тема","top":"Сверху","vertical":"Только по вертикали","view":"Оформление","website":"Сайт","workspace":"Сборка","zoom":"Масштаб 100%","zoom_motion":"Масштаб + X/Y (экспериментально)"}},"guides":{"pt":{"ui":{"guide":"Guia de uso","hero1":"Do movimento","hero2":"à imagem inteira.","intro":"Junte os quadros de uma cena para revelar o que a câmera percorreu. Experimente a demonstração e depois repita a montagem com seu próprio GIF ou vídeo.","start":"Começar o tutorial","download":"Baixar Framosik","demo":"Demonstração interativa","source":"Quadro original","panorama":"Imagem montada","scrub":"Arraste para explorar os 37 quadros.","contents":"Neste guia","help":"Dúvidas frequentes","close":"Fechar","enlarge":"Ampliar captura","releases":"Releases","links":"Links do projeto","skip":"Pular para o tutorial","language":"Idioma do tutorial","back":"Voltar ao início"},"sections":[{"title":"Abra o Framosik","p":["No Windows x64, extraia o ZIP inteiro e abra {exe}. No Linux x86_64, extraia o arquivo .tar.gz e execute {bin} dentro da pasta Framosik. Mantenha a pasta {internal} ao lado do executável.","Use {open} ou {ctrlO} e escolha {demoFile}, incluído no pacote. O primeiro quadro mostra os pés do robô. A câmera sobe pela mesma ilustração ao longo de 37 quadros."]},{"title":"Marque uma única cena","p":["Em {original}, arraste a régua ou use {play} e as setas para encontrar as extremidades. Clique em {mark_start} e {mark_end}, ou digite os números em {first} e {last}. Os dois limites entram na montagem.","Para a demonstração, use 1 a 37 e mantenha {step} em 1. No seu vídeo, termine antes de um corte ou transição. Um passo maior acelera a leitura, mas deixa menos área em comum entre os quadros."]},{"title":"Escolha como alinhar e mesclar","p":["Em {movement}, use {vertical} para o robô, {horizontal} para um movimento lateral ou {free} para diagonais. Escolha {zoom_motion} quando o enquadramento se aproxima ou se afasta com escala uniforme.","Em {mode}, {preserve} mantém o traço já montado. {feather} mistura as bordas em uma faixa definida por {feather_width}. {average} combina os pixels da área comum e pode duplicar contornos se o personagem se mover.","Comece com {similarity} em 65% e {overlap} em 20%. A primeira define a exigência de correspondência, a segunda define a área comum mínima. Use {crop} para retirar uma legenda fixa de cada quadro, em pixels da fonte."]},{"title":"Acompanhe a montagem","p":["Clique em {stitch}. A aba {result} mostra a imagem crescendo durante o processamento. O registro indica a confiança e o deslocamento de cada quadro. Use {fit} para ver a cena inteira ou {zoom} para conferir os pixels.","A roda do mouse amplia a imagem e o arraste desloca a vista. No painel de opções, a roda percorre os controles. Se precisar parar, {cancel} conserva o resultado parcial. Com a demonstração completa a 100%, espere uma imagem de 480 × 1080 px."]},{"title":"Dê acabamento e exporte","p":["Quando a montagem termina, {finish} fica disponível à esquerda. Inspecione uma emenda a 100%. Comece com um valor baixo de {seam_soft} para suavizar o risco ou de {seam_color} para corrigir uma diferença de cor local. Clique em {apply_finish}.","Cada aplicação parte da montagem original. Para comparar, volte ambos os valores a zero e aplique outra vez. {export} ou {ctrlS} salva o último acabamento aplicado, com transparência onde nenhum quadro alcançou. {report} grava um JSON com parâmetros, quadros aceitos e rejeitados e o motivo de uma interrupção."]},{"title":"Personalize a interface","p":["Em {view}, escolha {theme} e {language}. {gradients} controla os brilhos. {animations} ativa ou desativa a animação do título e dos controles quando os gradientes estão ligados. As preferências são salvas automaticamente.","Abra {about} para conferir a versão instalada e acessar o site, o repositório e a página de apoio. O idioma deste tutorial pode ser alterado no topo da página, independentemente do idioma do aplicativo."]}],"faq":[["A montagem parou em determinado quadro. E agora?","Confira o último quadro aceito, encurte o intervalo e volte o passo para 1. Se o problema for isolado, {skip} tenta os próximos quadros usando o último aceito como referência. Um corte real de cena pede uma nova montagem."],["Por que aparecem listras ou contornos duplos no zoom?","Teste {zoom_motion} com quadros próximos e {feather}. Depois, inspecione as emendas e aplique um acabamento leve. Rotação, perspectiva, paralaxe e partes animadas podem impedir que uma única transformação alinhe a cena inteira."],["Atingi o limite de tamanho ou o vídeo não abre.","Reduza {resolution} ou divida o trecho. {limit} controla o tamanho máximo do mosaico em megapixels. A leitura de vídeo depende do codec. Se o arquivo não abrir, tente uma cópia em MP4 com vídeo H.264."]],"captions":["Quadro original da demonstração, com o intervalo de 1 a 37 à esquerda.","Painéis de alinhamento, mesclagem e recorte, com a faixa de suavização visível.","Robô inteiro na imagem montada, com o acabamento habilitado e o registro da montagem.","Aba de visualização em tema claro, com idioma, gradientes e animações."],"reference":{"ui":{"title":"Referência de parâmetros","intro":"Abra um grupo para ver o que cada controle muda. Os padrões valem para uma instalação nova. Busque pelo nome em inglês, em português ou pelo efeito que você quer ajustar.","search":"Buscar um controle","example":"Ex.: sobreposição, legenda, 24 px","empty":"Nenhum controle encontrado. Tente outro termo ou limpe a busca.","matches":"Controles encontrados","range":"Faixa","initial":"Padrão","on":"Ligado","off":"Desligado","workshop":"Experimentos guiados","expect":"O que observar","jump":"Consultar os controles desta etapa"},"groups":{"scene":"Arquivo e intervalo da cena","motion":"Movimento e alinhamento","blend":"Mesclagem da imagem","crop":"Recorte nas quatro bordas","preview":"Montagem e navegação","finish":"Acabamento e exportação","appearance":"Aparência, idioma e links"},"entries":{"open":"Abre GIF, WebP animado e vídeos como MP4, MKV, AVI, MOV, WebM e M4V. O codec precisa ser legível no computador. PNG e JPEG também abrem como imagens estáticas. Ao carregar outro arquivo, a montagem anterior é descartada da janela. Exporte antes de trocar.","original":"Mostra um quadro da fonte. Arraste a régua, use as setas ‹ e › ou digite o número do quadro para inspecionar um detalhe. A indicação “/ N” mostra quantos quadros há no arquivo. Esta vista mantém as bordas originais, mesmo com recorte configurado.","play":"Reproduz a fonte a partir do quadro atual. Pause quando a câmera começar ou terminar o movimento. A reprodução pode passar do fim marcado e para no último quadro do arquivo. Para rever o trecho, volte ao início na régua.","first":"Define o primeiro quadro incluído. N representa o total do arquivo e a numeração começa em 1. Digite o número ou navegue até a pose desejada e marque o início. Esse quadro também define a escala de referência para uma montagem com zoom.","last":"Define o último quadro incluído. Pare no último instante em que o desenho e o fundo ainda pertencem à mesma cena. Se o corte entra no quadro 90, marque 89. Use o mesmo número no início e no fim para trabalhar com um único quadro.","step":"Define a distância entre os quadros usados. De 2 a 9 com passo 3, o programa tenta 2, 5, 8 e 9. O último entra mesmo fora da sequência. Comece em 1 para zoom ou movimentos rápidos. Suba para reduzir o trabalho quando houver muita repetição.","movement":"Escolha observando um detalhe fixo em dois quadros distantes. Se ele anda e mantém o tamanho, use um modo de deslocamento. Se o próprio detalhe cresce ou encolhe, experimente o modo com zoom. Uma mudança desse campo vale na próxima montagem.","free":"Permite deslocamento simultâneo em X e Y. É a escolha para um passeio diagonal ou uma câmera que sobe e deriva um pouco de lado. Detalhes fixos do fundo ajudam a distinguir o movimento da câmera do movimento do personagem.","vertical":"Restringe a montagem ao eixo vertical. Use se um ponto do cenário permanece na mesma coluna enquanto sobe ou desce. Se quadros bons começam a ser rejeitados quando a câmera deriva de lado, experimente o modo livre.","horizontal":"Restringe a montagem ao eixo horizontal. Use quando o horizonte permanece na mesma altura e a câmera vai para a esquerda ou a direita. Uma tomada que também sobe ou desce pede os dois eixos.","zoom_motion":"Estima mudança uniforme de escala e deslocamento nos dois eixos, quadro a quadro. Ao afastar a câmera, a moldura pode crescer bastante para preservar a escala do primeiro quadro. Use passo 1. Se o fundo se alinha, mas o personagem se duplica, verifique se as camadas se movem separadamente.","resolution":"Redimensiona cada quadro depois do recorte e afeta a resolução final do PNG. A 50%, largura e altura caem pela metade e a área fica em torno de um quarto. Use para ensaiar um trecho longo. Volte a 100% e monte de novo para exportar mais detalhes.","similarity":"Exige uma pontuação mínima de semelhança entre as regiões comparadas. Aumente se padrões repetidos forem aceitos no lugar errado. Se um par legítimo falhar, confira o recorte, o movimento e o passo antes de reduzir alguns pontos. Compare o contorno obtido com a fonte.","overlap":"Exige que uma parte mínima da área do quadro de trabalho seja compartilhada por pixels suficientemente opacos. Com 20%, é preciso aproximadamente um quinto da área. Aumentar descarta correspondências pequenas e ambíguas. Se a câmera percorre muito espaço entre quadros, reduza primeiro o passo.","limit":"Limita a área do retângulo que contém o mosaico, inclusive espaços transparentes. Um retângulo de 6000 × 4000 ocupa 24 MP. Aumentar o limite permite imagens maiores e exige mais memória. Se o crescimento parar, reduza a resolução de trabalho ou divida o intervalo.","skip":"Com a opção ligada, uma falha de alinhamento é registrada e o próximo candidato é comparado ao último quadro aceito. Pode salvar um trecho com um único quadro borrado. Desligada, a primeira rejeição encerra a tentativa e conserva o parcial. Um salto longo pode deixar uma lacuna na cobertura.","mode":"Controla como combinar pixels de quadros já alinhados. Compare os modos no mesmo trecho e na mesma resolução, montando novamente a cada mudança. Para escolher, amplie uma linha fina que atravesse a emenda e observe se permanece única e nítida.","preserve":"Preenche as áreas novas e mantém os pixels já cobertos. Costuma conservar melhor os contornos de anime. No modo com zoom, um quadro posterior também pode completar um pixel de borda que antes tinha cobertura parcial.","feather":"Faz uma transição gradual na sobreposição junto à área recém-revelada. Ajuda quando a mesma parede muda levemente de tom entre quadros. Se aparecem dois contornos distantes, reveja o alinhamento antes de aumentar a faixa.","feather_width":"Só fica disponível no modo de suavizar emendas. Mede, em pixels de trabalho, a largura da transição. Compare 8 e 32 px ao redor do mesmo contorno. Uma faixa curta preserva o traço, uma mais larga espalha a mudança de tom por mais pixels.","average":"Em cada passo, combina meio a meio o mosaico atual e o novo quadro na área comum. Um ponto coberto várias vezes recebe misturas sucessivas. Pode suavizar diferenças de cor, mas uma mão que muda de posição pode aparecer duas vezes.","left":"Remove uma faixa da esquerda de cada quadro antes de procurar correspondências. Um trilho preto de 12 px pede 12 aqui. Meça na fonte e preserve detalhes fixos próximos à margem que possam ajudar no alinhamento.","top":"Remove linhas do topo, por exemplo uma barra fixa na borda superior. A medida usa os pixels originais, inclusive se a resolução de trabalho for 50%. Aplique o mesmo valor a todo o intervalo selecionado por meio de uma nova montagem.","right":"Remove colunas contadas a partir da direita. Para uma moldura simétrica de 8 px, coloque 8 à esquerda e 8 à direita. Se um quadro tem 480 px de largura, sobram 464 antes da redução de escala.","bottom":"Remove linhas de baixo para cima. Se uma legenda ocupa os 32 px inferiores, comece em 32 e confira se as letras sumiram na montagem. As quatro margens juntas precisam preservar pelo menos 32 × 32 px da fonte. O quadro original continua inteiro na prévia.","stitch":"Inicia uma nova montagem com o intervalo e os ajustes atuais. A aba de resultado abre automaticamente e os controles de edição ficam ocupados durante o cálculo. Salve um resultado que deseja comparar antes de montar de novo.","result":"Mostra a imagem crescendo em atualizações periódicas. A prévia em andamento pode ser reduzida para caber em até 1400 px no maior lado. Ao terminar, a vista recebe a imagem na resolução final. Avalie o acabamento nessa etapa.","fit":"Enquadra toda a imagem na área visível. Use depois de ampliar uma emenda ou redimensionar a janela. Com o ajuste ativo, o enquadramento acompanha o crescimento do mosaico.","zoom":"Retorna a vista à escala de 100% para inspecionar detalhes. Sobre a imagem, a roda altera o zoom e o arraste move a vista. Sobre o painel de opções, a roda percorre o painel. Ampliar a vista só muda a inspeção na tela.","log":"Leia em conjunto o número do quadro, a confiança e o deslocamento Δ em X e Y. Um quadro aceito com Δ próximo de zero pode repetir o anterior e acrescentar pouca área. Uma sequência de rejeições indica onde rever o trecho ou o movimento escolhido.","cancel":"Solicita a parada na próxima verificação entre quadros. Aguarde o fim da tarefa antes de exportar. Se já houver uma imagem parcial, você pode inspecioná-la, aplicar acabamento e salvá-la. Divida um vídeo longo nesse ponto se quiser trabalhar por partes.","seam_soft":"Suaviza variações finas perto das emendas detectadas com um filtro que leva as bordas em conta. Comece comparando 0% e 10% a 100% de zoom. Suba aos poucos se o risco persistir e reduza se linhas finas perderem definição.","seam_color":"Aproxima a cor dos pixels da emenda da mediana dos vizinhos. É útil para um filete de cor destoante num fundo quase uniforme. Experimente 10–20% mantendo a suavização em zero para enxergar o efeito isolado. Atua na vizinhança opaca das emendas marcadas.","apply_finish":"Recalcula a partir do mosaico original com os dois valores atuais. Repetir a mesma aplicação produz o mesmo resultado. Para comparar com o original, zere ambos e aplique outra vez. Alterar os números só aparece no PNG depois de aplicar.","export":"Grava o mosaico em PNG com o último acabamento aplicado. Onde nenhum quadro chegou, o arquivo pode conter transparência. Confira o resultado sobre fundos de cores diferentes e dê nomes diferentes às exportações que quiser comparar. Atalho {ctrlS}.","report":"Salva um JSON para reproduzir e investigar a tentativa. Veja accepted e rejected para os números dos quadros, frames para confiança e deslocamento, e reason para a causa de uma parada. As listas usam numeração a partir de 1. Em settings, first e last contam a partir de 0.","theme":"Escolha {dark} ou {light} conforme a iluminação do ambiente. O tema afeta os painéis e o fundo ao redor da imagem. Para avaliar uma borda transparente em outro fundo, alterne o tema e compare o mesmo resultado.","language":"Troca os rótulos e mensagens da interface. As preferências de idioma ficam salvas para a próxima abertura. Este guia tem um seletor próprio no topo, então você pode ler em português e acompanhar o aplicativo em inglês.","gradients":"Ativa os gradientes e brilhos do título e dos controles. Ao desligar, o visual fica estático e a caixa de animações deixa de estar disponível. A escolha é salva entre sessões.","animations":"Com os gradientes ativos, anima a formação do nome em pixels e os realces dos controles. Desligue para manter as cores com menos movimento. Os efeitos animados também pausam durante tarefas de processamento ou quando a janela fica inativa.","about":"Mostra a versão instalada e os botões do repositório, site e página de apoio. Se comparar resultados entre duas instalações, confira aqui o número da versão antes de comparar os parâmetros."},"workshops":[{"title":"Ver quais quadros o passo escolhe","try":"Abra {demoFile}. Selecione os quadros 2 a 9, passo 3, {vertical}, resolução 100% e {preserve}. Monte e abra o relatório JSON.","expect":"A lista accepted permite conferir 2, 5, 8 e 9. Procure o 9 no final. Ele mostra como o programa inclui o último quadro quando o passo não chega exatamente nele."},{"title":"Medir a resolução de saída","try":"Use o mesmo GIF completo, de 1 a 37, passo 1 e {vertical}. Monte uma vez a 100% e outra a 50% de resolução de trabalho. Compare as dimensões indicadas ao fim de cada montagem.","expect":"O robô inteiro ocupa 480 × 1080 px na primeira e 240 × 540 px na segunda. Usar o zoom da prévia mantém essas dimensões. Mudar a resolução de trabalho e remontar é o que altera o PNG."},{"title":"Investigar uma listra no afastamento","try":"Num trecho seu em que a câmera se afasta, isole poucos quadros e use {zoom_motion} com passo 1. Compare {preserve} e {feather}. No resultado mais alinhado, teste primeiro só 15% de correção de cor e depois só 10% de suavização, aplicando cada vez.","expect":"Se a linha de cor diminui e o contorno continua único, compare com o original e exporte sua opção preferida. Se o próprio contorno está duplicado, volte ao intervalo, recorte ou alinhamento. Um acabamento local tem pouca ação sobre objetos em posições diferentes."}]}},"en":{"ui":{"guide":"User guide","hero1":"From a camera pan","hero2":"to one image.","intro":"Join the frames of a scene to reveal everything the camera travelled across. Explore the demo, then follow the same steps with your own GIF or video.","start":"Start the tutorial","download":"Download Framosik","demo":"Interactive demo","source":"Source frame","panorama":"Stitched image","scrub":"Drag to explore all 37 frames.","contents":"In this guide","help":"Troubleshooting","close":"Close","enlarge":"Enlarge screenshot","releases":"Releases","links":"Project links","skip":"Skip to the tutorial","language":"Tutorial language","back":"Back to top"},"sections":[{"title":"Launch Framosik","p":["On Windows x64, extract the entire ZIP and open {exe}. On Linux x86_64, extract the .tar.gz and run {bin} inside the Framosik folder. Keep {internal} next to the executable.","Choose {open} or press {ctrlO} and open {demoFile} from the package. The first frame shows the robot’s feet. The camera travels up the same illustration over 37 frames."]},{"title":"Mark a single scene","p":["In {original}, scrub the timeline or use {play} and the arrows to find both ends. Click {mark_start} and {mark_end}, or type the numbers into {first} and {last}. Both endpoints are included.","For the demo, use 1 through 37 and leave {step} at 1. In your own clip, stop before a cut or transition. A larger step processes fewer frames but leaves less shared detail for alignment."]},{"title":"Choose alignment and blending","p":["Under {movement}, pick {vertical} for the robot, {horizontal} for a sideways pan, or {free} for a diagonal pan. Use {zoom_motion} when the view moves closer or farther away with a uniform change in scale.","Under {mode}, {preserve} keeps existing linework. {feather} blends edges across the distance set by {feather_width}. {average} mixes shared pixels and can double outlines if the subject moves.","Start with {similarity} at 65% and {overlap} at 20%. The first sets how closely frames must match, the second how much area they must share. Use {crop} to remove a fixed subtitle strip from each frame, measured in source pixels."]},{"title":"Watch the image grow","p":["Click {stitch}. The {result} tab shows the growing image during processing. The log records confidence and displacement for each frame. Use {fit} for the whole scene or {zoom} to inspect individual pixels.","Scroll over the image to zoom and drag to pan. Over the options panel, the wheel scrolls through the controls. If you need to stop, {cancel} keeps the partial result. The full demo at 100% produces a 480 × 1080 px image."]},{"title":"Finish and export","p":["Once stitching ends, {finish} becomes available on the left. Inspect a seam at 100%. Start with a low {seam_soft} value to soften a line or use {seam_color} for a local colour difference. Click {apply_finish}.","Each application starts from the original mosaic. To compare, return both values to zero and apply again. {export} or {ctrlS} saves the last applied finish, with transparency in areas no frame covered. {report} writes a JSON file with settings, accepted and rejected frames, and the reason for an interruption."]},{"title":"Make it your workspace","p":["Open {view} to select the {theme} and {language}. {gradients} controls the glow. With gradients enabled, {animations} switches motion in the title and controls on or off. Preferences are saved automatically.","Open {about} to check the installed version or visit the website, repository and donation page. The language selector at the top of this guide works independently of the app."]}],"faq":[["Stitching stopped at a particular frame. What can I do?","Check the last accepted frame, shorten the range and return the step to 1. For an isolated mismatch, {skip} tries subsequent frames against the last accepted one. Start a new mosaic after a true scene cut."],["Why do I see stripes or double outlines in a zoom?","Try {zoom_motion} with closely spaced frames and {feather}. Inspect the seams, then apply a light finish. Rotation, perspective, parallax and animated layers can prevent one transform from aligning the entire scene."],["I reached the size limit or my video will not open.","Lower {resolution} or split the range. {limit} caps the mosaic size in megapixels. Video support depends on the codec. If a file will not open, try an MP4 copy encoded with H.264."]],"captions":["The original demo frame with the range set to frames 1 through 37.","Alignment, blending and crop controls with the feather width visible.","The complete robot in the stitched view with finishing controls enabled and the processing log below.","The Appearance tab in the light theme, with language, glow and animation controls."],"reference":{"ui":{"title":"Parameter reference","intro":"Open a group to see what each control changes. Defaults refer to a fresh installation. Search by the label on screen or the effect you want to adjust.","search":"Find a control","example":"Try overlap, subtitles or 24 px","empty":"No matching controls. Try another term or clear the search.","matches":"Matching controls","range":"Range","initial":"Default","on":"On","off":"Off","workshop":"Guided experiments","expect":"What to look for","jump":"Explore the controls for this step"},"groups":{"scene":"File and scene range","motion":"Motion and alignment","blend":"Image blending","crop":"Cropping the four edges","preview":"Stitching and navigation","finish":"Finishing and export","appearance":"Appearance, language and links"},"entries":{"open":"Open a GIF, animated WebP, or a video such as MP4, MKV, AVI, MOV, WebM or M4V. Video decoding depends on the codec. A PNG or JPEG opens as a single frame. Export any mosaic you want to keep before loading another file.","original":"Inspect one source frame. Scrub the timeline, click ‹ or ›, or enter a frame number to check a specific detail. The number after the slash is the total frame count. This view shows the original edges even when a crop is set.","play":"Play from the current frame and pause where the camera starts or stops moving. Playback continues through the source file, even beyond the marked end. Move the slider back to review the same passage.","first":"Choose the first frame to include. N is the number of frames in the file and numbering starts at 1. Type its number or mark the current pose as the start. This frame also establishes the reference scale for a zoom.","last":"Choose the last frame to include. If frame 90 is the first shot of a new scene, end the range at 89. Set both endpoints to the same number to inspect a single-frame result.","step":"Set the interval between sampled frames. From 2 through 9 with a step of 3, the app tries 2, 5, 8 and 9. It includes the endpoint even when the step misses it. Start at 1 for fast motion or zoom. Increase it for a clip with many near-duplicates.","movement":"Watch one stationary detail in two different frames. If its position changes while its size stays constant, choose a translation mode. If it grows or shrinks, try zoom. Changing the mode takes effect the next time you stitch.","free":"Allow both horizontal and vertical displacement. Use this for a diagonal pan or an upward pan that drifts sideways. Check a fixed detail in the background to tell camera motion from a character moving independently.","vertical":"Constrain displacement to the vertical axis. Use it when a background point stays in the same column as it travels up or down. If sideways drift causes good frames to be rejected, try free movement.","horizontal":"Constrain displacement to the horizontal axis. Use it when the horizon stays at the same height in a left or right pan. A shot that also climbs or falls needs both axes.","zoom_motion":"Estimate uniform scale and displacement on both axes between consecutive accepted frames. A pullback can grow the canvas considerably to retain the scale of the opening frame. Use step 1. Different motion in the subject and background can leave double outlines.","resolution":"Resize each frame after cropping. This changes the actual PNG dimensions. At 50%, both dimensions are halved and the pixel area is about one quarter. Try a long scene at reduced resolution, then return to 100% and stitch again for the final export.","similarity":"Require a minimum match score for the shared region. Raise it if a repeating pattern is accepted in the wrong place. If a good pair is rejected, check the crop, motion mode and step before lowering the threshold a few points. Compare the resulting linework with the source.","overlap":"Require a minimum fraction of the working frame to contain shared, sufficiently opaque pixels. At 20%, about one fifth must overlap. Raising it rejects tiny, ambiguous matches. If the camera jumps far between samples, first try a smaller frame step.","limit":"Limit the area of the rectangle enclosing the mosaic, including transparent gaps. A 6000 × 4000 rectangle is 24 MP. A higher cap allows a larger mosaic and uses more memory. If growth stops, reduce working resolution or split the range.","skip":"When enabled, a failed alignment is logged and the next candidate is compared with the last accepted frame. This helps with an isolated blurred frame. When disabled, the first rejection stops the run and keeps the partial mosaic. A long gap can still break coverage.","mode":"Choose how to combine pixels once frames have aligned. Rebuild the same range at the same resolution for each comparison. Magnify a thin line that crosses a seam and check whether it remains a single sharp contour.","preserve":"Fill newly revealed areas and retain existing pixels. This usually keeps drawn outlines crisp. In zoom mode, a later frame can also complete a partially covered edge pixel.","feather":"Blend overlap gradually near newly exposed areas. Try it where a wall changes shade slightly between frames. If two distinct outlines are visible, revisit alignment before increasing the transition width.","feather_width":"Available with seam softening. Sets the transition width in working pixels. Compare 8 and 32 px at the same contour. Narrow bands protect fine strokes, while wider bands spread a tonal change over more pixels.","average":"At each step, mix the current mosaic and incoming frame equally in the overlap. A point covered several times is mixed repeatedly. This can soften colour fluctuations or double a hand that has moved between frames.","left":"Remove columns from the left before matching. For a stationary 12 px black strip, enter 12 here. Measure against the source and keep nearby fixed details that can help with matching.","top":"Remove rows from the top, for example a fixed upper bar. Values always use source pixels, including at 50% working resolution. The crop applies to every selected frame when you stitch again.","right":"Remove columns measured from the right edge. For an 8 px border on both sides, set left and right to 8. A 480 px source will have 464 px of width before scaling.","bottom":"Remove rows from the bottom. If subtitles occupy the bottom 32 px, try 32 and inspect the mosaic for leftover lettering. Together the four margins must leave at least 32 × 32 source pixels. The original-frame view still shows the full frame.","stitch":"Start a new mosaic with the current range and settings. The result tab opens automatically and editing controls are temporarily disabled during processing. Save a version you want to compare before starting another run.","result":"Follow periodic updates as the mosaic grows. While running, preview images can be reduced to a maximum of 1400 px on their longer side. On completion, the view receives the full result. Inspect seams at this point.","fit":"Fit the whole mosaic in the available space. Use this after enlarging a seam or resizing the window. With automatic fitting active, the view follows the expanding canvas.","zoom":"Restore the view to 100% for a pixel-level inspection. Scroll over the picture to zoom or drag to pan. Over the controls the wheel scrolls the panel. Magnifying the view changes only what you see on screen.","log":"Read the frame number, confidence and X/Y displacement Δ together. An accepted frame with near-zero displacement may repeat the previous frame and add little area. Several rejections in a row identify a range worth reviewing.","cancel":"Request a stop between frames. Wait for the current task to end before exporting. If a partial mosaic is available, you can inspect, finish and save it. You can start a second range at that point when processing a long clip.","seam_soft":"Soften fine variations near detected seams with an edge-aware filter. Compare 0% and 10% at 100% zoom. Increase gradually if the line remains, and reduce the value if fine strokes lose definition.","seam_color":"Bring seam colours closer to the median of nearby pixels. Try it on a narrow off-colour stripe in a fairly uniform background. Start at 10–20% with smoothing at zero to isolate its effect. It acts in opaque areas near marked seams.","apply_finish":"Recalculate both settings from the original mosaic. Applying the same values twice gives the same result. To compare with the original, set both to zero and apply again. Apply edited values before exporting the PNG.","export":"Save the mosaic as PNG with the last finish you applied. Areas no frame reached may be transparent. Inspect edges over different background colours and give comparisons separate filenames. Shortcut {ctrlS}.","report":"Save a JSON record of the run. Use accepted and rejected for frame numbers, frames for individual scores and displacements, and reason for an interruption. The frame lists start at 1. In settings, first and last are stored starting at 0.","theme":"Choose {dark} or {light} for the lighting in your room. The theme changes the panels and the background surrounding the image. Switch between them to inspect a transparent edge against different backgrounds.","language":"Change the interface labels and messages. The language is remembered for the next launch. This guide has a separate selector at the top, so you can read in one language while using the app in another.","gradients":"Enable colour gradients and glow on the title and controls. Turning them off gives a static appearance and disables the animation checkbox. This preference is saved between sessions.","animations":"With gradients enabled, animate the pixel title and control highlights. Turn this off to keep the colours with less motion. The effects also pause while a task runs or the window is inactive.","about":"Find the installed version and links to the repository, website and donation page. When comparing output from two installations, check the version here before comparing settings."},"workshops":[{"title":"See which frames the step selects","try":"Open {demoFile}. Use frames 2 through 9, step 3, {vertical}, 100% resolution and {preserve}. Stitch and open the JSON report.","expect":"The accepted list shows 2, 5, 8 and 9. The last entry demonstrates that the endpoint is included even when the regular step would miss it."},{"title":"Measure the output resolution","try":"Use the whole GIF, frames 1 through 37, step 1 and {vertical}. Stitch once at 100% and again at 50% working resolution. Compare the dimensions reported after each run.","expect":"The full robot measures 480 × 1080 px in the first run and 240 × 540 px in the second. The preview zoom leaves those numbers alone. Changing working resolution and rebuilding changes the PNG."},{"title":"Inspect a stripe during a pullback","try":"Choose a short pullback from your own clip. Use {zoom_motion} with step 1 and compare {preserve} with {feather}. On the better-aligned result, try colour repair alone at 15%, then smoothing alone at 10%, applying each separately.","expect":"If the stripe fades while the outline stays single, compare with the original and export the version you prefer. If the outline itself is doubled, revisit the range, crop or alignment. Local finishing has little effect on objects in different positions."}]}},"es":{"ui":{"guide":"Guía de uso","hero1":"De un movimiento","hero2":"a una sola imagen.","intro":"Une los fotogramas de una escena para revelar todo el recorrido de la cámara. Explora la demostración y repite el proceso con tu propio GIF o vídeo.","start":"Empezar el tutorial","download":"Descargar Framosik","demo":"Demostración interactiva","source":"Fotograma original","panorama":"Imagen compuesta","scrub":"Arrastra para recorrer los 37 fotogramas.","contents":"En esta guía","help":"Preguntas frecuentes","close":"Cerrar","enlarge":"Ampliar captura","releases":"Versiones","links":"Enlaces del proyecto","skip":"Ir al tutorial","language":"Idioma del tutorial","back":"Volver al inicio"},"sections":[{"title":"Abre Framosik","p":["En Windows x64, extrae el ZIP completo y abre {exe}. En Linux x86_64, extrae el .tar.gz y ejecuta {bin} dentro de la carpeta Framosik. Conserva {internal} junto al ejecutable.","Pulsa {open} o {ctrlO} y elige {demoFile}, incluido en el paquete. El primer fotograma muestra los pies del robot. La cámara recorre la misma ilustración de abajo arriba en 37 fotogramas."]},{"title":"Delimita una sola escena","p":["En {original}, mueve el cursor de la línea de tiempo o usa {play} y las flechas para encontrar los extremos. Pulsa {mark_start} y {mark_end}, o introduce los números en {first} y {last}. Se incluyen ambos extremos.","Para la demostración, usa del 1 al 37 y deja {step} en 1. En tu vídeo, termina antes de un corte o una transición. Un paso mayor reduce el trabajo, pero también el detalle compartido entre fotogramas."]},{"title":"Elige la alineación y la mezcla","p":["En {movement}, usa {vertical} para el robot, {horizontal} para un recorrido lateral o {free} para una diagonal. Elige {zoom_motion} cuando la cámara se acerque o aleje con un cambio de escala uniforme.","En {mode}, {preserve} conserva los trazos existentes. {feather} mezcla los bordes en una franja definida por {feather_width}. {average} combina los píxeles comunes y puede duplicar los contornos si el personaje se mueve.","Empieza con {similarity} al 65% y {overlap} al 20%. El primero exige un grado de coincidencia, el segundo una superficie común mínima. Con {crop} puedes quitar una franja fija de subtítulos de cada fotograma en píxeles de origen."]},{"title":"Observa cómo crece la imagen","p":["Pulsa {stitch}. La pestaña {result} muestra el montaje mientras se procesa. El registro indica la confianza y el desplazamiento de cada fotograma. Usa {fit} para ver la escena completa o {zoom} para inspeccionar los píxeles.","Gira la rueda sobre la imagen para ampliarla y arrastra para desplazarte. En el panel de opciones, la rueda recorre los controles. {cancel} conserva el resultado parcial. La demostración completa al 100% produce una imagen de 480 × 1080 px."]},{"title":"Ajusta el acabado y exporta","p":["Al terminar el montaje se activa {finish} a la izquierda. Inspecciona una unión al 100%. Prueba un valor bajo de {seam_soft} para suavizar una línea o de {seam_color} para corregir una diferencia de color local. Pulsa {apply_finish}.","Cada aplicación parte del montaje original. Para comparar, pon ambos valores a cero y vuelve a aplicar. {export} o {ctrlS} guarda el último acabado aplicado, con transparencia en las zonas sin cobertura. {report} guarda los ajustes, los fotogramas aceptados y rechazados y el motivo de una interrupción en un archivo JSON."]},{"title":"Personaliza la interfaz","p":["En {view}, elige {theme} y {language}. {gradients} controla el brillo. Con los degradados activos, {animations} permite activar o desactivar el movimiento del título y los controles. Las preferencias se guardan automáticamente.","En {about} puedes comprobar la versión instalada y visitar el sitio, el repositorio y la página de donaciones. El idioma de esta guía se elige en la parte superior, independientemente del de la aplicación."]}],"faq":[["El montaje se detuvo en un fotograma. ¿Qué hago?","Revisa el último fotograma aceptado, acorta el intervalo y vuelve al paso 1. Para un fallo aislado, {skip} intenta alinear los siguientes con el último aceptado. Después de un corte real, inicia otro montaje."],["¿Por qué aparecen rayas o contornos dobles al usar zoom?","Prueba {zoom_motion} con fotogramas próximos y {feather}. Revisa las uniones y aplica un acabado suave. La rotación, la perspectiva, el paralaje y las capas animadas dificultan la alineación simultánea de toda la escena."],["He alcanzado el límite de tamaño o no puedo abrir el vídeo.","Reduce {resolution} o divide el intervalo. {limit} limita los megapíxeles del montaje. La compatibilidad con vídeo depende del códec. Prueba una copia MP4 con vídeo H.264."]],"captions":["Fotograma original de la demostración, con el intervalo del 1 al 37.","Controles de alineación, mezcla y recorte con el ancho de suavizado visible.","Robot completo en el montaje, con los controles de acabado y el registro.","Pestaña de apariencia con el tema claro, el idioma y los controles de animación."],"reference":{"ui":{"title":"Referencia de parámetros","intro":"Abre un grupo para ver qué cambia cada control. Los valores iniciales corresponden a una instalación nueva. Busca por la etiqueta en inglés o español, o por el efecto que quieres ajustar.","search":"Buscar un control","example":"Ej.: solapamiento, subtítulos, 24 px","empty":"No se encontraron controles. Prueba otro término o borra la búsqueda.","matches":"Controles encontrados","range":"Intervalo","initial":"Valor inicial","on":"Activado","off":"Desactivado","workshop":"Experimentos guiados","expect":"Qué observar","jump":"Consultar los controles de este paso"},"groups":{"scene":"Archivo e intervalo","motion":"Movimiento y alineación","blend":"Mezcla de imágenes","crop":"Recorte de los cuatro bordes","preview":"Montaje y navegación","finish":"Acabado y exportación","appearance":"Apariencia, idioma y enlaces"},"entries":{"open":"Abre GIF, WebP animado y vídeos MP4, MKV, AVI, MOV, WebM o M4V, según el códec. PNG y JPEG se abren como imágenes fijas. Exporta el montaje que quieras conservar antes de cargar otro archivo.","original":"Inspecciona un fotograma arrastrando la barra, pulsando ‹ y › o escribiendo su número. La cifra tras la barra indica el total de fotogramas. Esta vista muestra los bordes originales aunque hayas configurado un recorte.","play":"Reproduce desde la posición actual. Pausa donde empieza o acaba el movimiento. La reproducción puede superar el fin marcado y termina en el último fotograma del archivo. Retrocede con la barra para repetir el tramo.","first":"Incluye este fotograma como inicio. N es el total del archivo y la numeración empieza en 1. Introduce el número o marca la posición actual. En una toma con zoom, este fotograma también establece la escala de referencia.","last":"Incluye este fotograma como final. Si el fotograma 90 ya pertenece al plano siguiente, termina en el 89. Usa el mismo número en ambos campos para obtener un resultado de un solo fotograma.","step":"Indica la distancia entre muestras. Del 2 al 9 con paso 3 se intentan 2, 5, 8 y 9. El extremo final entra aunque el paso lo salte. Usa 1 en movimientos rápidos o con zoom y aumenta el paso si abundan los fotogramas repetidos.","movement":"Observa un detalle fijo en dos fotogramas. Si cambia de posición y conserva el tamaño, elige un modo de desplazamiento. Si crece o mengua, prueba el zoom. Vuelve a montar para aplicar el cambio.","free":"Admite desplazamiento en X e Y. Sirve para recorridos diagonales o un ascenso con deriva lateral. Sigue un punto fijo del fondo para distinguir el movimiento de cámara del de un personaje.","vertical":"Limita la alineación al eje vertical. Funciona si un punto del fondo permanece en la misma columna al subir o bajar. Si una deriva lateral provoca rechazos, prueba el movimiento libre.","horizontal":"Limita la alineación al eje horizontal. Úsalo cuando el horizonte mantiene su altura durante el desplazamiento lateral. Si la cámara también sube o baja, permite ambos ejes.","zoom_motion":"Calcula escala uniforme y desplazamiento entre fotogramas aceptados. Al alejarse la cámara, el lienzo puede crecer mucho para conservar la escala inicial. Empieza con paso 1. Dos capas que se mueven por separado pueden dejar contornos dobles.","resolution":"Redimensiona tras el recorte y cambia el tamaño real del PNG. Al 50%, se reducen a la mitad el ancho y el alto, y el área queda aproximadamente en un cuarto. Ensaya a baja resolución y vuelve a montar al 100% para conservar el detalle.","similarity":"Fija la puntuación mínima de coincidencia en la región compartida. Sube el valor si un patrón repetido encaja en el lugar equivocado. Antes de bajarlo por un rechazo, revisa el recorte, el movimiento y el paso. Compara el contorno con la fuente.","overlap":"Exige una fracción mínima de píxeles compartidos suficientemente opacos. Al 20% se necesita aproximadamente un quinto del fotograma de trabajo. Sube el valor para descartar coincidencias pequeñas y ambiguas. Si la cámara avanza mucho entre muestras, acorta primero el paso.","limit":"Limita el rectángulo que contiene el mosaico, incluidos huecos transparentes. Un rectángulo de 6000 × 4000 ocupa 24 MP. Elevar el límite admite imágenes mayores y consume más memoria. Si la imagen deja de crecer, reduce la resolución o divide la escena.","skip":"Al activarlo, el siguiente candidato se compara con el último aceptado después de un fallo. Ayuda con un fotograma borroso aislado. Desactivado, el primer rechazo detiene el proceso y conserva el parcial. Un salto largo puede interrumpir la cobertura.","mode":"Decide cómo combinar los píxeles ya alineados. Vuelve a montar el mismo tramo a la misma resolución con cada modo. Amplía una línea fina que cruce la unión y comprueba si se mantiene única y nítida.","preserve":"Rellena las áreas nuevas y conserva lo ya cubierto. Suele preservar bien los trazos de dibujo. En modo zoom, un fotograma posterior también puede completar un píxel de borde parcialmente cubierto.","feather":"Mezcla gradualmente la zona compartida junto al área recién descubierta. Pruébalo si una pared cambia ligeramente de tono. Si se ven dos siluetas separadas, revisa la alineación antes de ensanchar la transición.","feather_width":"Se habilita al suavizar uniones y se mide en píxeles de trabajo. Compara 8 y 32 px sobre el mismo contorno. Una banda corta protege los trazos finos y una ancha reparte el cambio de tono.","average":"En cada paso combina a partes iguales el mosaico actual y el fotograma nuevo en el área común. Los puntos cubiertos varias veces se mezclan repetidamente. Atenúa diferencias de color, pero una mano en movimiento puede aparecer dos veces.","left":"Quita columnas desde la izquierda antes de alinear. Si hay una franja negra fija de 12 px, introduce 12. Mide sobre el original y conserva detalles fijos cercanos que ayuden a alinear.","top":"Quita filas de arriba, por ejemplo para ocultar una barra superior fija. Se usan píxeles de la fuente incluso al trabajar al 50%. El recorte afecta a todos los fotogramas al volver a montar.","right":"Quita columnas desde la derecha. Para un marco simétrico de 8 px, introduce 8 a la izquierda y a la derecha. De una fuente de 480 px quedarán 464 antes de escalar.","bottom":"Quita filas desde abajo. Para subtítulos en los últimos 32 px, prueba 32 y busca letras residuales en el mosaico. Entre los cuatro márgenes deben quedar al menos 32 × 32 px de la fuente. La vista original sigue completa.","stitch":"Inicia un montaje con los ajustes actuales y abre la pestaña de resultado. Durante el cálculo se bloquean temporalmente los controles de edición. Exporta cualquier versión que quieras comparar antes de iniciar otra.","result":"Muestra avances periódicos. Durante la operación la vista previa puede reducirse a 1400 px en el lado mayor. Al finalizar se carga el resultado a resolución completa. Examina entonces las uniones.","fit":"Ajusta toda la imagen al espacio visible. Úsalo tras ampliar una unión o cambiar el tamaño de la ventana. Con el ajuste activo, la vista sigue el crecimiento del mosaico.","zoom":"Restablece la vista al 100% para revisar píxeles. La rueda sobre la imagen acerca o aleja y el arrastre desplaza la vista. Sobre las opciones, la rueda recorre el panel. La ampliación en pantalla conserva las dimensiones del PNG.","log":"Lee juntos el número de fotograma, la confianza y el desplazamiento Δ en X e Y. Un fotograma aceptado con Δ casi cero puede añadir poca área. Varios rechazos consecutivos señalan un tramo que conviene revisar.","cancel":"Solicita la parada entre fotogramas. Espera a que termine la tarea para exportar. Si se obtuvo un mosaico parcial, puedes examinarlo, aplicar acabado y guardarlo. Un vídeo largo puede continuarse en otro tramo.","seam_soft":"Atenúa variaciones finas cerca de las uniones con un filtro sensible a los bordes. Compara 0% y 10% con el zoom al 100%. Aumenta poco a poco y reduce si los trazos finos pierden definición.","seam_color":"Acerca el color de la unión a la mediana de sus vecinos. Ayuda con una franja estrecha de otro tono en un fondo uniforme. Prueba 10–20% con el suavizado a cero. Se aplica en zonas opacas cercanas a las uniones marcadas.","apply_finish":"Recalcula ambos ajustes desde el mosaico original. Aplicar dos veces los mismos valores da el mismo resultado. Para comparar, vuelve a cero y aplica otra vez. Aplica los nuevos valores antes de exportar.","export":"Guarda un PNG con el último acabado aplicado y transparencia en las zonas sin cobertura. Compara sus bordes sobre fondos distintos y usa nombres diferentes para conservar tus pruebas. Atajo {ctrlS}.","report":"Guarda un JSON. accepted y rejected enumeran los fotogramas, frames registra confianza y desplazamiento, y reason indica la causa de una parada. Las listas cuentan desde 1. En settings, first y last cuentan desde 0.","theme":"Elige {dark} o {light} según la iluminación. El tema cambia los paneles y el fondo visible alrededor de la imagen. Alterna entre ambos para inspeccionar un borde transparente.","language":"Cambia los textos del programa y recuerda la elección. Esta guía tiene su propio selector arriba, así que puedes leer en español aunque la aplicación muestre las etiquetas en inglés.","gradients":"Activa los degradados y el brillo del título y de los controles. Al desactivarlos, la apariencia queda estática y se deshabilita la casilla de animaciones. La preferencia se guarda.","animations":"Con los degradados activos, anima el título en píxeles y los controles. Desactívalo para conservar los colores con menos movimiento. Los efectos se pausan durante el procesamiento o si la ventana está inactiva.","about":"Muestra la versión instalada y enlaces al repositorio, sitio y donaciones. Si comparas resultados de dos instalaciones, comprueba la versión antes de comparar sus ajustes."},"workshops":[{"title":"Ver qué fotogramas selecciona el paso","try":"Abre {demoFile}. Usa del 2 al 9, paso 3, {vertical}, resolución al 100% y {preserve}. Monta y abre el informe JSON.","expect":"La lista accepted contiene 2, 5, 8 y 9. El 9 demuestra que el extremo final se incluye aunque no coincida con el paso."},{"title":"Medir la resolución de salida","try":"Usa el GIF entero, de 1 a 37, con paso 1 y {vertical}. Monta al 100% y después al 50% de resolución de trabajo. Compara las dimensiones finales.","expect":"El robot mide 480 × 1080 px y después 240 × 540 px. El zoom de la vista previa conserva estas medidas. Cambiar la resolución y montar de nuevo modifica el PNG."},{"title":"Investigar una raya al alejarse la cámara","try":"Aísla un tramo corto de tu vídeo y usa {zoom_motion} con paso 1. Compara {preserve} y {feather}. Sobre la mejor alineación prueba solo corrección de color al 15%, luego solo suavizado al 10%, aplicando por separado.","expect":"Si la raya se atenúa y el contorno se mantiene único, compara y exporta. Si el contorno está duplicado, revisa intervalo, recorte o alineación. El acabado local apenas afecta a objetos en posiciones diferentes."}]}},"fr":{"ui":{"guide":"Guide d’utilisation","hero1":"D’un mouvement","hero2":"à une image entière.","intro":"Assemblez les images d’une scène pour retrouver tout ce que la caméra a parcouru. Essayez la démonstration, puis reprenez les étapes avec votre GIF ou votre vidéo.","start":"Commencer le tutoriel","download":"Télécharger Framosik","demo":"Démonstration interactive","source":"Image source","panorama":"Image assemblée","scrub":"Faites glisser le curseur pour parcourir les 37 images.","contents":"Dans ce guide","help":"Questions fréquentes","close":"Fermer","enlarge":"Agrandir la capture","releases":"Versions","links":"Liens du projet","skip":"Accéder au tutoriel","language":"Langue du tutoriel","back":"Retour en haut"},"sections":[{"title":"Ouvrir Framosik","p":["Sous Windows x64, extrayez tout le ZIP et ouvrez {exe}. Sous Linux x86_64, extrayez le .tar.gz et lancez {bin} dans le dossier Framosik. Gardez {internal} à côté de l’exécutable.","Choisissez {open} ou appuyez sur {ctrlO}, puis ouvrez {demoFile}, fourni avec l’application. La première image montre les pieds du robot. La caméra remonte la même illustration en 37 images."]},{"title":"Délimiter une seule scène","p":["Dans {original}, déplacez le curseur ou utilisez {play} et les flèches pour repérer les deux extrémités. Cliquez sur {mark_start} et {mark_end}, ou saisissez les numéros dans {first} et {last}. Les deux bornes sont incluses.","Pour la démo, choisissez les images 1 à 37 et laissez {step} à 1. Dans votre vidéo, arrêtez-vous avant un changement de plan. Un pas plus grand réduit le nombre d’images à traiter, mais aussi la zone commune."]},{"title":"Régler l’alignement et la fusion","p":["Dans {movement}, utilisez {vertical} pour le robot, {horizontal} pour un déplacement latéral ou {free} pour une diagonale. Choisissez {zoom_motion} pour un rapprochement ou un éloignement avec un changement d’échelle uniforme.","Dans {mode}, {preserve} garde les traits déjà assemblés. {feather} fond les bords sur la largeur définie par {feather_width}. {average} mélange les pixels communs et peut dédoubler les contours d’un sujet en mouvement.","Commencez avec {similarity} à 65 % et {overlap} à 20 %. Le premier règle la ressemblance exigée, le second la surface commune minimale. Avec {crop}, retirez de chaque image une bande de sous-titres fixe, en pixels de la source."]},{"title":"Suivre l’assemblage","p":["Cliquez sur {stitch}. L’onglet {result} montre l’image qui grandit pendant le calcul. Le journal indique la confiance et le déplacement pour chaque image. Utilisez {fit} pour voir toute la scène ou {zoom} pour examiner les pixels.","La molette zoome sur l’image et le glisser permet de se déplacer. Sur le panneau des réglages, la molette fait défiler les options. {cancel} conserve le résultat partiel. La démo entière à 100 % donne une image de 480 × 1080 px."]},{"title":"Ajuster la finition et exporter","p":["À la fin du calcul, {finish} devient disponible à gauche. Examinez un raccord à 100 %. Essayez une faible valeur de {seam_soft} pour atténuer une ligne, ou de {seam_color} pour corriger un écart de couleur local. Cliquez sur {apply_finish}.","Chaque application repart de l’assemblage initial. Pour comparer, remettez les deux valeurs à zéro et appliquez à nouveau. {export} ou {ctrlS} enregistre la dernière finition appliquée, avec de la transparence dans les zones non couvertes. {report} crée un JSON contenant les réglages, les images acceptées ou rejetées et la cause d’un arrêt."]},{"title":"Adapter l’interface","p":["Dans {view}, choisissez {theme} et {language}. {gradients} règle les lueurs. Lorsque les dégradés sont actifs, {animations} anime ou immobilise le titre et les commandes. Les préférences sont enregistrées automatiquement.","Ouvrez {about} pour vérifier la version installée et accéder au site, au dépôt ou à la page de dons. Vous pouvez choisir la langue de ce guide en haut de la page indépendamment de l’application."]}],"faq":[["L’assemblage s’arrête sur une image. Que faire ?","Repérez la dernière image acceptée, raccourcissez la séquence et ramenez le pas à 1. Pour un échec isolé, {skip} essaie les images suivantes à partir de la dernière acceptée. Après un changement de plan, commencez un autre assemblage."],["Pourquoi le zoom laisse-t-il des rayures ou des contours doubles ?","Essayez {zoom_motion} avec des images rapprochées et {feather}. Examinez les raccords puis appliquez une finition légère. Rotation, perspective, parallaxe et éléments animés peuvent empêcher un alignement uniforme de la scène."],["La limite de taille est atteinte ou la vidéo ne s’ouvre pas.","Réduisez {resolution} ou divisez la séquence. {limit} fixe la taille maximale en mégapixels. La lecture vidéo dépend du codec. Essayez une copie MP4 encodée en H.264."]],"captions":["Image source de la démo avec l’intervalle réglé de 1 à 37.","Réglages d’alignement, de fusion et de recadrage avec la largeur de transition visible.","Robot assemblé en entier avec les réglages de finition et le journal.","Onglet d’apparence en thème clair, avec les réglages de langue, de lueur et d’animation."],"reference":{"ui":{"title":"Référence des réglages","intro":"Ouvrez un groupe pour découvrir l’effet de chaque commande. Les valeurs initiales correspondent à une installation neuve. Recherchez un libellé anglais ou français, ou l’effet recherché.","search":"Rechercher une commande","example":"Par exemple, recouvrement, sous-titres, 24 px","empty":"Aucun résultat. Essayez un autre terme ou effacez la recherche.","matches":"Commandes trouvées","range":"Plage","initial":"Par défaut","on":"Activé","off":"Désactivé","workshop":"Exercices guidés","expect":"Résultat à observer","jump":"Consulter les commandes de cette étape"},"groups":{"scene":"Fichier et intervalle","motion":"Mouvement et alignement","blend":"Fusion des images","crop":"Recadrage des quatre bords","preview":"Assemblage et navigation","finish":"Finition et exportation","appearance":"Apparence, langue et liens"},"entries":{"open":"Ouvre les GIF, WebP animés et vidéos MP4, MKV, AVI, MOV, WebM ou M4V selon le codec. Un PNG ou un JPEG apparaît comme une image fixe. Exportez tout assemblage à conserver avant d’ouvrir un autre fichier.","original":"Examinez une image source avec le curseur, les flèches ‹ et › ou son numéro. Le nombre après la barre indique le total. Cette vue conserve les bords d’origine, même si un recadrage est défini.","play":"Lancez la lecture à partir de la position actuelle. Faites une pause au début ou à la fin du mouvement. La lecture peut dépasser la fin marquée et s’arrête à la dernière image du fichier. Reculez le curseur pour revoir le passage.","first":"Inclut cette image au début. N est le nombre total d’images, numérotées à partir de 1. Saisissez le numéro ou marquez la position courante. Cette image fixe aussi l’échelle de référence du zoom.","last":"Inclut cette image à la fin. Si l’image 90 appartient au plan suivant, arrêtez-vous à 89. Choisir le même numéro aux deux extrémités donne un résultat à une seule image.","step":"Règle l’intervalle entre échantillons. De 2 à 9 avec un pas de 3, les images 2, 5, 8 et 9 sont essayées. La dernière est incluse même hors de la progression. Commencez à 1 pour un zoom ou un mouvement rapide. Augmentez le pas si les images se répètent.","movement":"Observez un détail immobile sur deux images. S’il change de position en gardant sa taille, choisissez une translation. S’il grandit ou rétrécit, essayez le zoom. Relancez l’assemblage pour appliquer ce choix.","free":"Autorise les déplacements en X et en Y. Convient aux diagonales ou à une montée avec dérive latérale. Suivez un détail fixe du décor pour distinguer le mouvement de la caméra de celui du personnage.","vertical":"Limite la recherche à l’axe vertical. Utilisez-le si un point reste dans la même colonne en montant ou descendant. Si une dérive latérale provoque des rejets, essayez le déplacement libre.","horizontal":"Limite la recherche à l’axe horizontal. Convient aux panoramiques latéraux dont l’horizon reste à la même hauteur. Une trajectoire qui monte ou descend en même temps demande les deux axes.","zoom_motion":"Estime un changement d’échelle uniforme et un déplacement entre images acceptées. Lors d’un recul, le canevas peut beaucoup grandir pour garder l’échelle initiale. Utilisez un pas de 1. Des plans qui bougent indépendamment peuvent créer des contours doubles.","resolution":"Redimensionne chaque image après recadrage et change les dimensions du PNG. À 50 %, la hauteur et la largeur sont divisées par deux, et la surface environ par quatre. Essayez d’abord une longue scène à petite échelle puis recalculez à 100 %.","similarity":"Fixe le score minimal sur la région commune. Augmentez-le si un motif répétitif est accepté au mauvais endroit. Avant de le réduire de quelques points, vérifiez le recadrage, le mouvement et le pas. Comparez le tracé obtenu à la source.","overlap":"Exige une fraction minimale de pixels communs suffisamment opaques. À 20 %, environ un cinquième de l’image de travail doit se recouvrir. Augmentez pour écarter les petites correspondances ambiguës. Si les positions sont très éloignées, diminuez d’abord le pas.","limit":"Limite la surface du rectangle englobant la mosaïque, vides transparents compris. Une image de 6000 × 4000 représente 24 MP. Relever la limite permet des images plus grandes et demande davantage de mémoire. En cas d’arrêt, réduisez la résolution ou divisez le passage.","skip":"Si cette option est active, après un échec l’image suivante est comparée à la dernière acceptée. C’est utile pour une image floue isolée. Sinon, le premier rejet arrête le calcul et conserve le résultat partiel. Un grand saut peut laisser un manque.","mode":"Détermine comment combiner les pixels déjà alignés. Recalculez le même passage à résolution identique pour comparer les modes. Agrandissez un trait fin traversant un raccord et vérifiez qu’il reste net et unique.","preserve":"Remplit les nouvelles zones en conservant les pixels déjà couverts. Convient aux dessins au trait. En mode zoom, une image ultérieure peut aussi compléter un pixel de bord partiellement couvert.","feather":"Fond progressivement le recouvrement près de la nouvelle zone. Essayez-le si un mur change légèrement de teinte. Si deux silhouettes distinctes apparaissent, revoyez d’abord l’alignement.","feather_width":"Disponible pour le fondu des raccords. La largeur est mesurée en pixels de travail. Comparez 8 et 32 px au même endroit. Une bande étroite préserve mieux les traits fins, une bande large étale la transition de couleur.","average":"À chaque étape, mélange à parts égales les pixels communs de la mosaïque actuelle et de l’image entrante. Une zone vue plusieurs fois est donc mélangée plusieurs fois. Cela peut atténuer une variation de teinte ou dédoubler une main en mouvement.","left":"Retire des colonnes depuis la gauche avant l’alignement. Saisissez 12 pour une bande noire fixe de 12 px. Mesurez sur l’original en conservant les détails fixes voisins qui facilitent les correspondances.","top":"Retire des lignes depuis le haut, par exemple une barre fixe. Les valeurs se mesurent en pixels source, même à une résolution de travail de 50 %. Le recadrage affecte chaque image du prochain assemblage.","right":"Retire des colonnes depuis la droite. Pour une bordure symétrique de 8 px, saisissez 8 à gauche et à droite. Une source de 480 px conserve 464 px de largeur avant redimensionnement.","bottom":"Retire des lignes depuis le bas. Pour des sous-titres occupant les 32 derniers pixels, essayez 32 et cherchez les lettres restantes dans la mosaïque. Les quatre marges doivent laisser au moins 32 × 32 px dans la source. La vue originale reste entière.","stitch":"Lance un nouvel assemblage avec l’intervalle et les paramètres actuels. La vue de résultat s’ouvre et les réglages sont temporairement désactivés. Exportez le résultat à comparer avant de recommencer.","result":"Montre la mosaïque à intervalles réguliers. Pendant le calcul, l’aperçu peut être réduit à 1400 px sur le plus grand côté. À la fin, la vue reçoit l’image à sa résolution finale. Examinez alors les raccords.","fit":"Cadre toute l’image dans l’espace disponible. Utilisez cette commande après avoir agrandi un raccord ou redimensionné la fenêtre. Le cadrage automatique suit la croissance de la mosaïque.","zoom":"Rétablit l’échelle de 100 % pour inspecter les pixels. Sur l’image, la molette zoome et le glisser déplace la vue. Sur les options, la molette fait défiler le panneau. Le zoom de la vue agit sur l’affichage.","log":"Lisez ensemble numéro d’image, confiance et décalage Δ en X et Y. Une image acceptée avec un décalage proche de zéro peut être un doublon et ajouter peu de surface. Plusieurs rejets successifs indiquent un passage à examiner.","cancel":"Demande l’arrêt entre deux images. Attendez la fin de la tâche avant d’exporter. Si une mosaïque partielle existe, vous pouvez l’inspecter, la retoucher et l’enregistrer. Un autre intervalle peut prendre le relais pour une longue vidéo.","seam_soft":"Atténue les variations fines près des raccords détectés avec un filtre sensible aux contours. Comparez 0 % et 10 % au zoom 100 %. Augmentez progressivement et revenez en arrière si des traits s’effacent.","seam_color":"Rapproche la couleur du raccord de la médiane de ses voisins. Utile contre un filet de couleur isolé sur un fond uniforme. Essayez 10–20 % avec le lissage à zéro. Le traitement vise les zones opaques près des raccords marqués.","apply_finish":"Recalcule les deux effets à partir de la mosaïque originale. Deux applications avec les mêmes valeurs donnent le même résultat. Pour comparer, remettez les valeurs à zéro et appliquez. Appliquez les modifications avant l’export.","export":"Enregistre le PNG avec la dernière finition appliquée. Les zones restées hors champ peuvent être transparentes. Comparez les bords sur plusieurs fonds et donnez des noms différents à vos essais. Raccourci {ctrlS}.","report":"Produit un JSON. accepted et rejected listent les images, frames décrit les scores et décalages individuels, reason explique un arrêt. Les listes numérotent à partir de 1. Dans settings, first et last commencent à 0.","theme":"Choisissez {dark} ou {light} selon la lumière ambiante. Le thème modifie les panneaux et le fond autour de l’image. Passez de l’un à l’autre pour voir un bord transparent sur des fonds différents.","language":"Change les libellés et les messages, avec mémorisation au prochain lancement. Ce guide possède son propre sélecteur en haut de page. Vous pouvez le lire en français avec l’application en anglais.","gradients":"Active les dégradés et l’éclat du titre et des commandes. Les désactiver rend l’apparence statique et désactive la case d’animation. Ce réglage est mémorisé.","animations":"Avec les dégradés actifs, anime le titre en pixels et les reflets des commandes. Désactivez pour conserver les couleurs avec moins de mouvement. Les effets se mettent aussi en pause pendant le calcul ou lorsque la fenêtre est inactive.","about":"Indique la version installée avec les liens du dépôt, du site et des dons. Si vous comparez deux installations, vérifiez leur version avant leurs paramètres."},"workshops":[{"title":"Vérifier les images choisies par le pas","try":"Ouvrez {demoFile}. Choisissez 2 à 9, pas de 3, {vertical}, résolution à 100 % et {preserve}. Assemblez et ouvrez le rapport JSON.","expect":"La liste accepted contient 2, 5, 8 et 9. Le 9 montre que la borne finale est incluse même quand elle tombe entre deux pas."},{"title":"Mesurer la résolution de sortie","try":"Prenez tout le GIF, de 1 à 37, avec un pas de 1 et {vertical}. Assemblez à 100 %, puis à 50 % de résolution de travail. Comparez les dimensions finales.","expect":"Le robot mesure 480 × 1080 px puis 240 × 540 px. Le zoom d’affichage conserve ces valeurs. Un changement de résolution suivi d’un nouvel assemblage modifie le PNG."},{"title":"Examiner une rayure lors d’un recul","try":"Isolez un court recul dans votre vidéo. Essayez {zoom_motion} au pas de 1 et comparez {preserve} à {feather}. Sur le meilleur alignement, appliquez la correction de couleur seule à 15 %, puis le lissage seul à 10 %.","expect":"Si la rayure se réduit et que le contour reste unique, comparez à l’original et exportez. Si le contour est dédoublé, revoyez l’intervalle, le recadrage ou l’alignement. Une finition locale agit peu sur deux objets décalés."}]}},"de":{"ui":{"guide":"Benutzerhandbuch","hero1":"Vom Kameraschwenk","hero2":"zum Gesamtbild.","intro":"Setze die Einzelbilder einer Szene zusammen und mache den gesamten Kameraschwenk sichtbar. Probiere die Demo aus und wiederhole die Schritte mit deinem eigenen GIF oder Video.","start":"Anleitung starten","download":"Framosik herunterladen","demo":"Interaktive Demo","source":"Einzelbild","panorama":"Gesamtbild","scrub":"Ziehe den Regler durch alle 37 Einzelbilder.","contents":"In diesem Handbuch","help":"Häufige Fragen","close":"Schließen","enlarge":"Bildschirmfoto vergrößern","releases":"Versionen","links":"Projektlinks","skip":"Zur Anleitung springen","language":"Sprache der Anleitung","back":"Nach oben"},"sections":[{"title":"Framosik öffnen","p":["Entpacke unter Windows x64 die ganze ZIP-Datei und öffne {exe}. Entpacke unter Linux x86_64 die .tar.gz-Datei und starte {bin} im Ordner Framosik. Der Ordner {internal} muss neben der Programmdatei liegen.","Wähle {open} oder drücke {ctrlO} und öffne die mitgelieferte Datei {demoFile}. Das erste Bild zeigt die Füße des Roboters. In 37 Einzelbildern fährt die Kamera an derselben Zeichnung nach oben."]},{"title":"Eine Szene eingrenzen","p":["Verschiebe in {original} den Regler oder suche mit {play} und den Pfeilen den Anfang und das Ende. Klicke auf {mark_start} und {mark_end} oder trage die Nummern in {first} und {last} ein. Beide Grenzen gehören zur Auswahl.","Wähle für die Demo 1 bis 37 und lasse {step} auf 1. Beende eine eigene Szene vor dem nächsten Schnitt. Eine größere Schrittweite spart Rechenzeit, verringert aber den gemeinsamen Bildausschnitt."]},{"title":"Ausrichtung und Überblendung wählen","p":["Wähle unter {movement} für den Roboter {vertical}, für einen seitlichen Schwenk {horizontal} und für einen diagonalen {free}. Nutze {zoom_motion}, wenn das Motiv gleichmäßig größer oder kleiner wird.","Unter {mode} erhält {preserve} bereits zusammengesetzte Konturen. {feather} überblendet die Ränder auf der unter {feather_width} gewählten Breite. {average} mischt die überlappenden Pixel und kann bei bewegten Figuren Doppelkonturen erzeugen.","Beginne mit 65 % für {similarity} und 20 % für {overlap}. Der erste Wert bestimmt die geforderte Ähnlichkeit, der zweite die gemeinsame Mindestfläche. Über {crop} kannst du einen festen Untertitelstreifen in Quellpixeln von jedem Bild abschneiden."]},{"title":"Den Aufbau verfolgen","p":["Klicke auf {stitch}. Unter {result} wächst das Bild während der Verarbeitung. Das Protokoll zeigt Übereinstimmung und Versatz für jedes Bild. Mit {fit} siehst du die ganze Szene, mit {zoom} prüfst du einzelne Pixel.","Mit dem Mausrad zoomst du im Bild, durch Ziehen verschiebst du die Ansicht. Über dem Einstellungsbereich scrollt das Rad durch die Optionen. {cancel} erhält das Teilergebnis. Die vollständige Demo ergibt bei 100 % ein Bild mit 480 × 1080 px."]},{"title":"Übergänge verbessern und exportieren","p":["Nach dem Zusammenfügen ist links {finish} verfügbar. Prüfe einen Übergang bei 100 %. Probiere einen niedrigen Wert für {seam_soft} gegen eine sichtbare Linie oder für {seam_color} gegen einen lokalen Farbunterschied. Klicke auf {apply_finish}.","Jede Anwendung geht vom ursprünglichen Mosaik aus. Setze zum Vergleich beide Werte auf null und wende sie erneut an. {export} oder {ctrlS} speichert die zuletzt angewendete Fassung mit transparenten unbedeckten Bereichen. {report} schreibt Einstellungen, angenommene und verworfene Bilder sowie den Grund eines Abbruchs in eine JSON-Datei."]},{"title":"Die Oberfläche anpassen","p":["Unter {view} wählst du {theme} und {language}. {gradients} steuert den Leuchteffekt. Bei aktiven Farbverläufen schaltet {animations} die Bewegung von Titel und Bedienelementen um. Die Einstellungen werden automatisch gespeichert.","Unter {about} findest du die installierte Version und Links zu Website, Repository und Spendenseite. Die Sprache dieser Anleitung lässt sich oben auf der Seite unabhängig vom Programm einstellen."]}],"faq":[["Die Verarbeitung stoppt bei einem bestimmten Bild. Was hilft?","Prüfe das letzte angenommene Bild, verkürze den Bereich und setze die Schrittweite auf 1. Bei einem einzelnen Ausreißer vergleicht {skip} die folgenden Bilder mit dem letzten angenommenen Bild. Beginne nach einem Szenenschnitt ein neues Mosaik."],["Warum entstehen Streifen oder Doppelkonturen beim Zoom?","Probiere {zoom_motion} mit eng aufeinanderfolgenden Bildern und {feather}. Prüfe die Übergänge und bearbeite sie nur leicht. Rotation, Perspektive, Parallaxe und animierte Ebenen erschweren die Ausrichtung mit einer einzigen Transformation."],["Das Größenlimit ist erreicht oder das Video lässt sich nicht öffnen.","Verringere {resolution} oder teile die Szene auf. {limit} begrenzt die Mosaikgröße in Megapixeln. Die Videowiedergabe hängt vom Codec ab. Probiere eine mit H.264 kodierte MP4-Kopie."]],"captions":["Einzelbild der Demo mit dem ausgewählten Bereich von 1 bis 37.","Ausrichtung, Überblendung und Beschnitt mit sichtbarer Übergangsbreite.","Vollständiger Roboter im Mosaik mit aktivierter Nachbearbeitung und Protokoll.","Darstellung im hellen Design mit Sprache, Leuchteffekten und Animationen."],"reference":{"ui":{"title":"Nachschlagewerk für Einstellungen","intro":"Öffne eine Gruppe, um die Wirkung der einzelnen Bedienelemente nachzulesen. Die Vorgaben gelten für eine neue Installation. Suche nach einem englischen oder deutschen Namen oder nach dem gewünschten Effekt.","search":"Bedienelement suchen","example":"Zum Beispiel Überlappung, Untertitel, 24 px","empty":"Kein Treffer. Probiere einen anderen Begriff oder leere die Suche.","matches":"Gefundene Bedienelemente","range":"Bereich","initial":"Vorgabe","on":"Ein","off":"Aus","workshop":"Praktische Übungen","expect":"Darauf kannst du achten","jump":"Bedienelemente zu diesem Schritt"},"groups":{"scene":"Datei und Bildbereich","motion":"Bewegung und Ausrichtung","blend":"Zusammenfügen der Pixel","crop":"Beschnitt an vier Seiten","preview":"Zusammenfügen und Navigation","finish":"Nachbearbeitung und Export","appearance":"Darstellung, Sprache und Links"},"entries":{"open":"Öffnet GIFs, animierte WebPs und Videos wie MP4, MKV, AVI, MOV, WebM und M4V, sofern der Codec unterstützt wird. PNG und JPEG öffnen sich als Einzelbilder. Exportiere dein Mosaik, bevor du eine andere Datei lädst.","original":"Untersuche ein Quellbild mit dem Regler, den Pfeilen ‹ und › oder durch Eingabe der Bildnummer. Hinter dem Schrägstrich steht die Gesamtzahl. Die Ansicht zeigt auch bei eingestelltem Beschnitt die ursprünglichen Ränder.","play":"Spiele ab der aktuellen Position ab und pausiere am Beginn oder Ende der Bewegung. Die Wiedergabe kann über das markierte Ende hinauslaufen und stoppt am Dateiende. Schiebe den Regler zum Wiederholen zurück.","first":"Bestimmt das erste einbezogene Bild. N ist die Bildanzahl der Datei, die Zählung beginnt bei 1. Gib die Nummer ein oder markiere die aktuelle Position. Dieses Bild bestimmt beim Zoom auch den Bezugsmaßstab.","last":"Bestimmt das letzte einbezogene Bild. Gehört Bild 90 bereits zur nächsten Einstellung, beende den Bereich bei 89. Gleiche Nummern in beiden Feldern wählen ein einzelnes Bild aus.","step":"Bestimmt den Abstand der untersuchten Bilder. Von 2 bis 9 mit Schrittweite 3 werden 2, 5, 8 und 9 versucht. Der Endpunkt ist immer dabei. Beginne bei Zoom oder schneller Bewegung mit 1. Erhöhe den Abstand bei vielen nahezu gleichen Bildern.","movement":"Beobachte ein festes Detail in zwei Bildern. Wandert es bei gleichbleibender Größe, wähle einen Verschiebungsmodus. Wird es größer oder kleiner, probiere Zoom. Eine Änderung greift beim nächsten Zusammenfügen.","free":"Erlaubt Verschiebungen in X und Y. Geeignet für diagonale Fahrten oder eine Aufwärtsfahrt mit seitlicher Drift. Ein fester Hintergrundpunkt hilft, Kamerabewegung und Figurenbewegung zu unterscheiden.","vertical":"Beschränkt die Verschiebung auf die Senkrechte. Nutze dies, wenn ein Hintergrundpunkt beim Auf- oder Abwärtsschwenk in derselben Spalte bleibt. Führt seitliche Drift zu Ablehnungen, probiere die freie Bewegung.","horizontal":"Beschränkt die Verschiebung auf die Waagerechte. Nützlich, wenn der Horizont bei einem Schwenk nach links oder rechts auf gleicher Höhe bleibt. Bei gleichzeitiger Höhenänderung brauchst du beide Achsen.","zoom_motion":"Schätzt eine einheitliche Skalierung und die Verschiebung auf beiden Achsen. Beim Herauszoomen kann die Arbeitsfläche stark wachsen, um den Maßstab des ersten Bildes zu halten. Verwende Schrittweite 1. Unabhängig bewegte Ebenen können Doppelkonturen erzeugen.","resolution":"Skaliert die Bilder nach dem Beschnitt und verändert damit die PNG-Abmessungen. Bei 50 % halbieren sich Breite und Höhe, die Fläche beträgt etwa ein Viertel. Teste lange Szenen verkleinert und berechne für den Export erneut bei 100 %.","similarity":"Verlangt eine Mindestähnlichkeit im gemeinsamen Ausschnitt. Erhöhe den Wert be
