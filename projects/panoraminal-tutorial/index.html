<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<script>
/* ======================================================================
   PANORAMINAL — CONFIGURAÇÃO DA PÁGINA (edite somente aqui)
   ----------------------------------------------------------------------
   • Nova versão? Troque apenas `version`. Todo texto, botão, nome de
     arquivo e link que tiver {version} é atualizado automaticamente.
   • Para mudar um link (site, doação, download…), edite o valor em `links`.
   • Em `files` você pode deixar só o nome do arquivo (será usado
     `files.base` na frente) ou colar um link completo começando com https://.
   • `defaultLanguage` é o idioma usado quando o navegador do visitante
     não fala nenhum dos 8 idiomas da página.
   • `imagesPath` é a pasta das imagens (relativa a este arquivo).
   ====================================================================== */
const PANORAMINAL_CONFIG = {
  version: '1.2.0',
  links: {
    site:     'https://www.bugzinho.com/',
    donate:   'https://www.bugzinho.com/donate',
    repo:     'https://github.com/cleitinhodev/panoraminal',
    releases: 'https://github.com/cleitinhodev/panoraminal/releases',
    download: 'https://github.com/cleitinhodev/panoraminal/releases/tag/v{version}',
    issues:   'https://github.com/cleitinhodev/panoraminal/issues',
  },
  files: {
    base:        'https://github.com/cleitinhodev/panoraminal/releases/download/v{version}/',
    winSetup:    'Panoraminal-Setup-{version}-x64.exe',
    winPortable: 'Panoraminal-{version}-windows-x64-portable.zip',
    appImage:    'Panoraminal-{version}-x86_64.AppImage',
    deb:         'panoraminal_{version}_amd64.deb',
    tarGz:       'panoraminal-{version}-linux-x86_64.tar.gz',
    mac:         'Panoraminal-{version}-macos-universal.zip',
    checksums:   'SHA256SUMS.txt',
  },
  defaultLanguage: 'pt-BR',
  imagesPath: 'img/',
};
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panoraminal — Tutorial</title>
<meta name="description" content="Panoraminal tutorial">

<script>
/* Applies the saved theme / motion before first paint (no flash). */
(function(){try{var d=document.documentElement,t=localStorage.getItem('panoraminal-tutorial-theme'),m=localStorage.getItem('panoraminal-tutorial-motion');
if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';d.dataset.theme=t;
if(!m)m=matchMedia('(prefers-reduced-motion: reduce)').matches?'off':'on';d.dataset.motion=m;}catch(e){}})();
</script>
<style>
/* ---------- Palette (from crates/panoraminal/src/theme.rs) ---------- */
:root{
  --deep:#0130a0;--royal:#0660e9;--electric:#0039e8;--azure:#1b99f9;--cyan:#5fd0fd;--ice:#a1dbfb;--snow:#e8f4fa;
  --grad:linear-gradient(90deg,var(--deep),var(--royal),var(--azure),var(--cyan));
  --radius:16px;--radius-s:10px;--maxw:1180px;
  --font:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,"Noto Sans","Helvetica Neue",Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","PingFang SC","Microsoft YaHei","Noto Sans CJK JP","Noto Sans CJK SC","Source Han Sans",sans-serif;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,"SFMono-Regular",Menlo,"Noto Sans Mono",monospace;
}
html[data-theme=dark]{
  --bg:#060a18;--panel:#0b1430;--panel-hi:#101d42;--raised:#162757;--stroke:#223a78;
  --text:#e8f4fa;--weak:#8fb0d8;--accent:#1b99f9;--accent2:#0660e9;--neon:#5fd0fd;--ok:#4de0b0;--warn:#ffc14d;--danger:#ff5c7a;
  --hdr-a:#081236;--hdr-b:#0a2466;--glass:rgba(11,20,48,.72);--card:rgba(16,29,66,.78);--shadow:0 18px 50px rgba(0,0,0,.45);
  --glow:0 0 0 1px rgba(95,208,253,.35),0 0 22px rgba(95,208,253,.35),0 0 60px rgba(27,153,249,.18);
  --hero-veil:linear-gradient(180deg,rgba(6,10,24,.35) 0%,rgba(6,10,24,.55) 55%,var(--bg) 100%);
}
html[data-theme=light]{
  --bg:#e6f0fb;--panel:#f6faff;--panel-hi:#e7f1fc;--raised:#ffffff;--stroke:#bfd5f0;
  --text:#0b1a3a;--weak:#4a6390;--accent:#0660e9;--accent2:#0058fc;--neon:#1b99f9;--ok:#119a6e;--warn:#b7791f;--danger:#d62a4e;
  --hdr-a:#f9fcff;--hdr-b:#d9eafd;--glass:rgba(246,250,255,.8);--card:rgba(255,255,255,.88);--shadow:0 14px 40px rgba(11,26,58,.14);
  --glow:0 0 0 1px rgba(27,153,249,.35),0 0 18px rgba(27,153,249,.25),0 0 46px rgba(6,96,233,.12);
  --hero-veil:linear-gradient(180deg,rgba(6,10,24,.25) 0%,rgba(6,10,24,.45) 60%,var(--bg) 100%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
html[data-motion=off]{scroll-behavior:auto}
html[data-motion=off] *,html[data-motion=off] *::before,html[data-motion=off] *::after{animation:none!important;transition:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 var(--font);overflow-x:hidden;transition:background .35s,color .35s}
html:lang(ja) body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans CJK JP","Noto Sans JP",var(--font)}
html:lang(zh-CN) body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",var(--font)}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--neon)}
img{max-width:100%;height:auto;display:block}
code{font-family:var(--mono);font-size:.88em;background:var(--panel-hi);border:1px solid var(--stroke);border-radius:6px;padding:.08em .4em}
b,strong{font-weight:650}
:focus-visible{outline:2px solid var(--neon);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes gradShift{to{background-position:100% 0}}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.ambient::before,.ambient::after{content:"";position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.22}
.ambient::before{background:var(--royal);top:-25vmax;left:-20vmax;animation:float1 26s ease-in-out infinite alternate}
.ambient::after{background:var(--cyan);bottom:-30vmax;right:-25vmax;opacity:.14;animation:float2 30s ease-in-out infinite alternate}
html[data-theme=light] .ambient::before{opacity:.16}html[data-theme=light] .ambient::after{opacity:.12}
@keyframes float1{to{transform:translate(12vmax,8vmax)}}@keyframes float2{to{transform:translate(-10vmax,-6vmax)}}
header.top{position:sticky;top:0;z-index:50;background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);transition:box-shadow .3s}
header.top.scrolled{box-shadow:0 6px 24px rgba(0,0,0,.18)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad);opacity:.85}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:700;font-size:1.15rem;letter-spacing:.2px;white-space:nowrap}
.brand:hover{color:var(--text)}
.brand img{width:34px;height:34px;filter:drop-shadow(0 0 8px rgba(95,208,253,.5))}
.ver{font:600 .72rem/1 var(--mono);padding:.35em .6em;border-radius:99px;border:1px solid var(--stroke);color:var(--neon);background:var(--panel-hi)}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{color:var(--weak);padding:8px 11px;border-radius:9px;font-size:.93rem;font-weight:550;transition:color .2s,background .2s}
nav.main a:hover,nav.main a.active{color:var(--text);background:var(--panel-hi)}
nav.main a.active{box-shadow:inset 0 -2px 0 var(--accent)}
.ctrls{display:flex;gap:6px;align-items:center}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--stroke);background:var(--panel);color:var(--text);cursor:pointer;transition:box-shadow .25s,border-color .25s,transform .15s;padding:0}
.icon-btn:hover{border-color:var(--neon);box-shadow:var(--glow);color:var(--text)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:19px;height:19px}
.icon-btn[aria-pressed=false] .on,.icon-btn[aria-pressed=true] .off{display:none}
.lang{position:relative}
.lang select{appearance:none;-webkit-appearance:none;height:38px;padding:0 30px 0 34px;border-radius:10px;border:1px solid var(--stroke);background:var(--panel);color:var(--text);font:inherit;font-size:.9rem;cursor:pointer;max-width:180px}
html[data-theme=dark]{color-scheme:dark}html[data-theme=light]{color-scheme:light}
.lang select:hover{border-color:var(--neon);box-shadow:var(--glow)}
.lang svg{position:absolute;pointer-events:none;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--weak)}
.lang .g{left:10px}.lang .c{right:9px;width:13px}
.burger{display:none}
@media (max-width:1060px){
  nav.main{position:fixed;top:64px;left:0;right:0;flex-direction:column;background:var(--panel);padding:10px 16px 18px;border-bottom:1px solid var(--stroke);transform:translateY(-130%);transition:transform .3s;margin:0;box-shadow:var(--shadow)}
  nav.main.open{transform:none}
  nav.main a{padding:12px}
  .burger{display:grid}
  .ctrls{margin-left:auto}
}
@media (max-width:520px){.brand span.name{display:none}.lang select{max-width:96px;padding-right:24px}.bar{gap:8px}.ctrls{gap:4px}.icon-btn{width:36px;height:36px}}
.hero{position:relative;min-height:min(88vh,820px);display:grid;align-items:center;overflow:hidden;isolation:isolate}
.hero canvas,.hero .pano-fallback{position:absolute;inset:0;width:100%;height:100%;z-index:-2;cursor:grab;touch-action:pan-y}
.hero canvas{display:none}
.hero canvas.drag,.hero .pano-fallback.drag{cursor:grabbing}
.pano-fallback{background:#020615 var(--pano) repeat-x 0 50%/auto 150%;animation:panPan 120s linear infinite}
@keyframes panPan{to{background-position:-300vh 50%}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--hero-veil);pointer-events:none}
.hero .inner{position:relative;padding:90px 22px 120px;text-align:center;pointer-events:none;color:#e8f4fa}
.hero .inner a,.hero .inner button{pointer-events:auto}
.logo-orb{width:132px;height:132px;margin:0 auto 18px;position:relative;display:grid;place-items:center}
.logo-orb img{width:112px;height:112px;position:relative;z-index:1;filter:drop-shadow(0 0 22px rgba(95,208,253,.6));animation:bob 6s ease-in-out infinite}
.logo-orb::before,.logo-orb::after{content:"";position:absolute;inset:0;border-radius:50%;padding:2px;background:conic-gradient(from 0deg,transparent,var(--cyan),var(--royal),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 6s linear infinite}
.logo-orb::after{inset:-12px;opacity:.45;animation-duration:11s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-6px)}}
.kicker{display:inline-flex;align-items:center;gap:8px;font:600 .8rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:.6em 1em;border-radius:99px;background:rgba(8,18,54,.55);border:1px solid rgba(95,208,253,.35);color:#a1dbfb;backdrop-filter:blur(6px)}
.kicker i{width:8px;height:8px;border-radius:50%;background:#4de0b0;box-shadow:0 0 10px #4de0b0;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.hero h1{font-size:clamp(2.7rem,8vw,5.6rem);line-height:1.05;margin:.32em 0 .12em;letter-spacing:-.02em;font-weight:800;filter:drop-shadow(0 0 30px rgba(27,153,249,.45))}
.hero h1 span{background:linear-gradient(90deg,#a1dbfb,#5fd0fd,#1b99f9,#e8f4fa,#5fd0fd);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradShift 7s ease-in-out infinite alternate}
.hero .tag{font-size:clamp(1.15rem,2.6vw,1.55rem);font-weight:600;margin:0 0 .4em;color:#e8f4fa;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero .sub{max-width:680px;margin:0 auto 1.8em;color:#d3e4f6;font-size:1.05rem;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 22px;border-radius:12px;font-weight:650;font-size:1rem;border:1px solid var(--stroke);background:var(--panel);color:var(--text);cursor:pointer;transition:transform .2s,box-shadow .25s,border-color .25s,background .25s;position:relative;overflow:hidden}
.btn svg{width:19px;height:19px;flex:none}
.btn:hover{transform:translateY(-2px);border-color:var(--neon);box-shadow:var(--glow);color:var(--text)}
.btn.primary{background:linear-gradient(135deg,var(--royal),var(--azure));border-color:transparent;color:#fff;box-shadow:0 8px 28px rgba(6,96,233,.45)}
.btn.primary:hover{color:#fff;box-shadow:0 0 0 1px rgba(161,219,251,.6),0 0 30px rgba(95,208,253,.6),0 12px 34px rgba(6,96,233,.5)}
.btn.primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.hero .btn:not(.primary){background:rgba(8,18,54,.55);color:#e8f4fa;border-color:rgba(95,208,253,.35);backdrop-filter:blur(6px)}
.btn.donate{background:linear-gradient(135deg,#e2365a,#ff7a95);border-color:transparent;color:#fff}
.btn.donate:hover{color:#fff;box-shadow:0 0 0 1px rgba(255,180,195,.6),0 0 28px rgba(255,92,122,.55)}
.stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.stats span{font-size:.86rem;padding:.4em .9em;border-radius:99px;background:rgba(8,18,54,.55);border:1px solid rgba(95,208,253,.25);color:#d3e4f6;backdrop-filter:blur(6px)}
.drag-hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;color:#a1dbfb;font-size:.85rem;pointer-events:none;opacity:.9;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.drag-hint svg{width:34px;height:20px;animation:sway 2.8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
section.sec{padding:90px 0 30px;position:relative}
.sec-head{max-width:780px;margin:0 0 34px}
.eyebrow{font:700 .78rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:12px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--grad);border-radius:2px;box-shadow:0 0 10px var(--neon)}
h2{font-size:clamp(1.75rem,3.6vw,2.5rem);line-height:1.18;margin:0 0 .4em;letter-spacing:-.01em}
.lead{color:var(--weak);font-size:1.08rem;margin:0}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);position:relative;transition:border-color .3s,box-shadow .3s,transform .3s}
.card.hov:hover{border-color:color-mix(in srgb,var(--neon) 60%,var(--stroke));box-shadow:var(--shadow),var(--glow);transform:translateY(-3px)}
.term{font-weight:600;color:var(--text);background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 24%,transparent) 0);border-radius:2px;padding:0 .08em}
kbd{display:inline-block;min-width:1.75em;text-align:center;font:600 .8em/1 var(--mono);padding:.38em .5em .32em;margin:0 .06em;border-radius:7px;background:var(--raised);color:var(--text);border:1px solid color-mix(in srgb,var(--accent) 65%,var(--stroke));box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 45%,transparent),0 0 12px color-mix(in srgb,var(--neon) 18%,transparent);vertical-align:.08em;white-space:nowrap}
.kplus{color:var(--weak);font-size:.8em;margin:0 .05em}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
html[data-motion=off] .reveal{opacity:1;transform:none}
.what-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:38px;align-items:center}
.what-grid p{margin:0 0 1em}
.flat-demo{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--stroke);box-shadow:var(--shadow),var(--glow);aspect-ratio:2/1;background:#020615 var(--pano) repeat-x 0 50%/200% 100%;animation:wrapScroll 40s linear infinite}
@keyframes wrapScroll{to{background-position:-200% 50%}}
.flat-demo .lbl{position:absolute;left:12px;top:12px;font:600 .76rem/1 var(--mono);padding:.5em .7em;border-radius:8px;background:rgba(6,10,24,.7);color:#a1dbfb;border:1px solid rgba(95,208,253,.3)}
.flat-demo .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(161,219,251,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(161,219,251,.16) 1px,transparent 1px);background-size:calc(100%/24) calc(100%/12)}
.flat-demo .eq{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(95,208,253,.6);box-shadow:0 0 10px var(--cyan)}
.seam-note{display:flex;gap:10px;align-items:flex-start;margin-top:14px;color:var(--weak);font-size:.94rem}
.seam-note svg{flex:none;width:22px;height:22px;color:var(--accent);margin-top:2px}
.ratio{display:flex;gap:14px;margin-top:14px}
.ratio div{flex:1;text-align:center;padding:12px;border-radius:12px;background:var(--panel-hi);border:1px solid var(--stroke)}
.ratio b{display:block;font-size:1.4rem;color:var(--accent)}
.ratio span{font-size:.82rem;color:var(--weak)}
.os-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.os{min-width:0}
.os h3{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:1.15rem}
.os h3 .osi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--royal),var(--azure));color:#fff;box-shadow:0 0 18px rgba(27,153,249,.45);flex:none}
.os h3 svg{width:22px;height:22px}
.os p{margin:0 0 10px;font-size:.95rem}
.os .item{padding:14px 0;border-top:1px dashed var(--stroke)}
.os .item:first-of-type{border-top:0;padding-top:4px}
.dl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--panel-hi);border:1px solid var(--stroke);color:var(--text);font:600 .8rem/1.3 var(--mono);word-break:break-all;transition:border-color .2s,box-shadow .2s}
.dl:hover{border-color:var(--neon);box-shadow:var(--glow);color:var(--text)}
.dl svg{width:18px;height:18px;flex:none;color:var(--accent)}
.cmd{position:relative;margin-top:8px;background:#050a1c;border:1px solid #1a2d63;border-radius:10px;padding:10px 46px 10px 12px;font:500 .78rem/1.5 var(--mono);color:#a1dbfb;white-space:pre-wrap;word-break:break-all;min-height:46px;display:flex;align-items:center}
.cmd>span.c{display:block}
.cmd .p{color:#4de0b0;user-select:none}
.copy{position:absolute;right:6px;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:8px;border:1px solid #223a78;background:#0b1430;color:#a1dbfb;cursor:pointer;display:grid;place-items:center;padding:0}
.copy:hover{border-color:#5fd0fd;box-shadow:0 0 12px rgba(95,208,253,.5)}
.copy svg{width:15px;height:15px}
.copy.ok{color:#4de0b0;border-color:#4de0b0}
.note{display:flex;gap:10px;margin-top:12px;padding:12px 14px;border-radius:12px;font-size:.9rem;background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.note>svg{flex:none;width:20px;height:20px;color:var(--warn);margin-top:2px}

.note.info>svg{color:var(--accent)}
.req{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:20px}
.tour{display:grid;grid-template-columns:1.65fr 1fr;gap:28px;align-items:start}
.shot{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--stroke);box-shadow:var(--shadow),var(--glow);background:var(--panel)}
.shot img{width:100%;cursor:zoom-in}
.hs{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--royal),var(--azure));color:#fff;font:800 .85rem/30px var(--font);text-align:center;cursor:pointer;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 18px rgba(95,208,253,.9);padding:0;transition:transform .2s}
.hs::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--cyan);animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(1.8);opacity:0}}
.hs:hover,.hs.on{transform:scale(1.25)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.legend li{display:flex;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid transparent;transition:background .2s,border-color .2s,box-shadow .2s;font-size:.93rem}
.legend li i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 .8rem/1 var(--font);font-style:normal;color:#fff;background:linear-gradient(135deg,var(--royal),var(--azure))}
.legend li.on{background:var(--panel-hi);border-color:var(--accent);box-shadow:var(--glow)}
.steps{display:grid;gap:70px}
.step{display:grid;grid-template-columns:1fr 1.15fr;gap:36px;align-items:start}
.step:nth-child(even) .media{order:-1}
.step .media{position:sticky;top:90px}
.step .num{display:inline-flex;align-items:center;gap:10px;font:700 .78rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.step .num b{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:1.05rem;color:#fff;background:linear-gradient(135deg,var(--deep),var(--royal) 50%,var(--azure));box-shadow:0 0 18px rgba(27,153,249,.5)}
.step h3{font-size:1.5rem;line-height:1.25;margin:0 0 .5em}
.step p{margin:0 0 .9em}
.step ul{margin:0 0 1em;padding:0;list-style:none;display:grid;gap:9px}
.step li{position:relative;padding-left:22px;font-size:.96rem}
.step li::before{content:"";position:absolute;left:3px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--neon)}
.tips{margin-top:10px;display:grid;gap:10px}
.tip{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--stroke));font-size:.92rem}
.tip svg{flex:none;width:19px;height:19px;color:var(--warn);margin-top:2px}
.tip-h{font:700 .72rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--weak);margin:14px 0 8px}
figure{margin:0}
figure.f{border-radius:14px;overflow:hidden;border:1px solid var(--stroke);background:var(--panel);box-shadow:var(--shadow);transition:box-shadow .3s,border-color .3s}
figure.f:hover{box-shadow:var(--shadow),var(--glow);border-color:color-mix(in srgb,var(--neon) 55%,var(--stroke))}
figure.f img{cursor:zoom-in;width:100%}
figcaption{padding:9px 14px;font-size:.84rem;color:var(--weak);border-top:1px solid var(--stroke);display:flex;justify-content:space-between;gap:10px}
.gal{display:grid;gap:14px}
.gal.two{grid-template-columns:1fr 1fr}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:.88rem;font-weight:600;padding:8px 14px;border-radius:10px;border:1px solid var(--stroke);background:var(--panel);color:var(--weak);cursor:pointer;transition:all .2s}
.tabs button[aria-selected=true]{color:#fff;background:linear-gradient(135deg,var(--royal),var(--azure));border-color:transparent;box-shadow:0 0 16px rgba(27,153,249,.45)}
.stack{display:grid}
.stack>figure{grid-area:1/1;transition:opacity .45s}
.stack>figure[hidden]{display:block;opacity:0;pointer-events:none;visibility:hidden}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:6px 0 14px}
.tools.one{grid-template-columns:1fr}
.tool{display:flex;gap:11px;padding:11px;border-radius:12px;background:var(--panel-hi);border:1px solid var(--stroke);font-size:.85rem;color:var(--weak);transition:border-color .2s,box-shadow .2s}
.tool:hover{border-color:var(--neon);box-shadow:var(--glow)}
.tool .ti{flex:none;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--royal),var(--azure))}
.tool .ti svg{width:20px;height:20px}
.tool b{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--text);font-size:.93rem;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 14px}
.chips span{font-size:.8rem;padding:.35em .75em;border-radius:99px;border:1px solid var(--stroke);background:var(--panel-hi);transition:all .2s}
.chips span:hover{border-color:var(--neon);color:var(--neon);box-shadow:0 0 12px color-mix(in srgb,var(--neon) 40%,transparent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 12px}
.mode{padding:14px;border-radius:12px;background:var(--panel-hi);border:1px solid var(--stroke);font-size:.9rem;color:var(--weak)}
.mode b{display:block;color:var(--text);font-size:1rem;margin-bottom:4px}
.mode b::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;background:var(--grad);box-shadow:0 0 8px var(--neon)}
.cmp{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--stroke);box-shadow:var(--shadow),var(--glow);--pos:50%;user-select:none}
.cmp img{width:100%;pointer-events:none}
.cmp .top{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.cmp .line{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;margin-left:-1px;background:var(--cyan);box-shadow:0 0 14px var(--cyan);pointer-events:none}
.cmp .knob{position:absolute;top:50%;left:var(--pos);width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:linear-gradient(135deg,var(--royal),var(--azure));box-shadow:0 0 0 3px #fff,0 0 22px var(--cyan);display:grid;place-items:center;color:#fff;pointer-events:none}
.cmp .knob svg{width:22px;height:22px}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cmp .tagl,.cmp .tagr{position:absolute;bottom:10px;font:700 .75rem/1 var(--mono);padding:.5em .7em;border-radius:8px;background:rgba(6,10,24,.78);color:#a1dbfb;pointer-events:none}
.cmp .tagl{left:10px}.cmp .tagr{right:10px}
.cmp-hint{font-size:.82rem;color:var(--weak);margin:8px 2px 14px}
.tdemo{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;border:1px solid var(--stroke);box-shadow:var(--shadow),var(--glow);background:#020615 var(--pano) 30% 45%/auto 170%}
.tdemo svg{position:absolute;inset:0;width:100%;height:100%}
.tdemo .obj{transform-box:fill-box;transform-origin:center;animation:tmove 9s ease-in-out infinite}
@keyframes tmove{0%,8%{transform:translate(0,0) rotate(0) scale(1)}25%,33%{transform:translate(60px,-10px) rotate(0) scale(1)}50%,58%{transform:translate(60px,-10px) rotate(0) scale(1.25)}75%,83%{transform:translate(60px,-10px) rotate(-12deg) scale(1.25)}100%{transform:translate(0,0) rotate(0) scale(1)}}
.tdemo .hint{position:absolute;left:10px;right:10px;bottom:10px;font-size:.8rem;padding:8px 10px;border-radius:9px;background:rgba(6,10,24,.8);color:#d3e4f6;border:1px solid rgba(95,208,253,.25)}
.ktools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--stroke);background:var(--panel);color:var(--text);font:inherit;padding:0 14px 0 42px}
.search input:focus{outline:0;border-color:var(--neon);box-shadow:var(--glow)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--weak)}
.seg{display:inline-flex;border:1px solid var(--stroke);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:.86rem;font-weight:600;padding:0 14px;height:42px;border:0;background:transparent;color:var(--weak);cursor:pointer}
.seg button[aria-pressed=true]{background:linear-gradient(135deg,var(--royal),var(--azure));color:#fff}
.kgrid{columns:3 310px;column-gap:18px}
.kcard{break-inside:avoid;margin:0 0 18px;padding:18px 18px 10px;display:inline-block;width:100%}
.kcard h3{margin:0 0 10px;font-size:1rem;display:flex;align-items:center;gap:10px}
.kcard h3::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--grad);box-shadow:0 0 10px var(--neon)}
.krow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--stroke) 60%,transparent);font-size:.9rem}
.krow:first-of-type{border-top:0}
.krow .k{flex:none;text-align:right}
.krow .sl{color:var(--weak);margin:0 .25em}
.kempty{color:var(--weak);display:none}
.faq{display:grid;gap:12px;max-width:900px}
.faq details{border:1px solid var(--stroke);border-radius:14px;background:var(--card);transition:border-color .25s,box-shadow .25s}
.faq details[open]{border-color:color-mix(in srgb,var(--accent) 60%,var(--stroke));box-shadow:var(--glow)}
.faq summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:650;display:flex;justify-content:space-between;gap:12px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";flex:none;width:10px;height:10px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);transition:transform .25s;margin-top:-4px}
.faq details[open] summary::after{transform:rotate(225deg);margin-top:4px}
.faq .a{padding:0 18px 16px;color:var(--weak);font-size:.95rem}
footer{margin-top:90px;padding:60px 0 40px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--hdr-b) 55%,transparent));border-top:1px solid var(--stroke);position:relative}
footer::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--grad);box-shadow:0 0 18px var(--neon)}
.cta{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;padding:28px}
.cta img{width:72px;height:72px;filter:drop-shadow(0 0 16px rgba(95,208,253,.55))}
.cta h3{margin:0 0 4px;font-size:1.35rem}
.cta p{margin:0;color:var(--weak)}
.heart{display:inline-block;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.flinks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:34px 0 18px}
.flinks a{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid var(--stroke);background:var(--panel);color:var(--text);font-weight:600;font-size:.92rem;transition:all .25s}
.flinks a:hover{border-color:var(--neon);box-shadow:var(--glow);transform:translateY(-2px)}
.flinks svg{width:17px;height:17px;color:var(--accent)}
.made{text-align:center;color:var(--weak);font-size:.85rem}
.totop{position:fixed;right:18px;bottom:18px;z-index:40;opacity:0;pointer-events:none;transform:translateY(10px);transition:all .3s}
.totop.show{opacity:1;pointer-events:auto;transform:none}
dialog.lb{border:0;padding:0;background:transparent;max-width:96vw;max-height:94vh;overflow:visible}
dialog.lb::backdrop{background:rgba(2,6,21,.88);backdrop-filter:blur(6px)}
dialog.lb img{max-width:94vw;max-height:86vh;width:auto;border-radius:12px;box-shadow:0 0 0 1px rgba(95,208,253,.4),0 0 60px rgba(27,153,249,.35)}
dialog.lb p{color:#d3e4f6;text-align:center;margin:10px 0 0;font-size:.9rem}
dialog.lb .icon-btn{position:absolute;top:-14px;right:-14px;background:#0b1430;color:#e8f4fa;border-color:#223a78}
@media (max-width:980px){
  .what-grid,.tour,.step,.req{grid-template-columns:1fr}
  .step:nth-child(even) .media{order:0}
  .step .media{position:static}
  .os-grid{grid-template-columns:1fr}
  .cta{grid-template-columns:1fr;text-align:center;justify-items:center}
  .steps{gap:56px}
}
@media (max-width:560px){
  section.sec{padding-top:70px}
  .gal.two,.modes{grid-template-columns:1fr}
  .card{padding:18px}
  .hero .inner{padding:56px 16px 110px}
  .logo-orb{width:104px;height:104px}.logo-orb img{width:88px;height:88px}
  .hs{width:22px;height:22px;margin:-11px 0 0 -11px;line-height:22px;font-size:.7rem}
  .ratio{gap:8px}
  .btn{padding:12px 18px}
}
@media print{.ambient,header.top,.hero canvas,.totop{display:none}.reveal{opacity:1;transform:none}}
</style>
</head>

ush":"喷枪","tool.airbrush.desc":"非常柔和、低流量的喷涂,逐渐叠加颜色。","tool.brush":"画笔","tool.brush.desc":"带防抖的柔和圆形画笔——日常主力工具。","tool.custom":"自定义画笔","tool.custom.desc":"使用库中的任意画笔绘制——内置、Photoshop ABR、GIMP GBR/GIH 或你自己的图像——支持间距、角度、散布和抖动。","tool.eraser":"橡皮擦","tool.eraser.desc":"在当前图层上擦除为透明。拥有独立的大小和柔和度。","tool.eyedropper":"吸管","tool.eyedropper.desc":"在全景图上点击或拖动以拾取可见颜色。使用任意画笔时按住 Alt 可快速取色。","tool.fill":"油漆桶","tool.fill.desc":"用主色填充相连区域。填充会跨越 360° 接缝。","tool.pen":"钢笔","tool.pen.desc":"边缘清晰的硬线条,适合勾线和细节。","view.flat":"平面视图(等距柱状投影)","view.sphere":"360° 球面视图"}};
const TEXT = {"pt-BR":{"meta.title":"Panoraminal — Tutorial","meta.desc":"Aprenda a pintar panoramas 360° com o Panoraminal: instalação, interface, pincéis, camadas, inserção de imagens, distorção e exportação 360°.","nav.what":"360°?","nav.install":"Instalar","nav.tour":"Interface","nav.guide":"Tutorial","nav.keys":"Atalhos","nav.faq":"Dúvidas","ui.menu":"Menu","ui.top":"Voltar ao topo","ui.close":"Fechar","ui.copy":"Copiar","ui.copied":"Copiado!","ui.zoom":"Clique para ampliar","ui.compare":"Arraste o controle para comparar","ui.filter":"Filtrar atalhos…","ui.step":"Passo {n}","hero.kicker":"Tutorial oficial · versão {v}","hero.download":"Baixar v{v}","hero.releases":"Todas as versões","hero.drag":"Arraste para olhar em volta","hero.s1":"8 idiomas","hero.s2":"até 64 camadas","hero.s3":"grátis e de código aberto","what.title":"O que é um panorama 360°?","what.p1":"Um panorama 360° é uma imagem de tudo o que existe ao redor de um ponto: frente, costas, os dois lados, o céu e o chão. Ele é guardado como uma imagem plana com o dobro de largura em relação à altura (2:1) — a projeção <b>equirretangular</b>, igual a um mapa-múndi.","what.p2":"Visualizadores como Facebook, Google Fotos e óculos de VR envolvem essa imagem numa esfera ao seu redor. Pintar direto na imagem plana é difícil: as linhas entortam, as bordas esquerda e direita precisam se encaixar e os polos ficam esticados.","what.p3":"O Panoraminal coloca você <b>dentro da esfera</b>: você olha em volta e pinta o que vê, e cada pincelada é projetada de volta na imagem equirretangular com a distorção correta — linhas retas, emenda invisível e polos bem-comportados.","what.seam":"As bordas esquerda e direita são o mesmo lugar: a imagem dá a volta.","install.title":"Instalação","install.lead":"Escolha o arquivo do seu sistema. A versão {v} é a versão estável atual; todos os arquivos também estão na página de versões.","install.win.t":"Windows 10 / 11 (x64)","install.win.setup":"<b>Instalador</b> — execute o arquivo abaixo. Ele cria atalhos no menu Iniciar e na área de trabalho e abre arquivos <code>.pano</code> com o Panoraminal.","install.win.portable":"<b>Portátil</b> — extraia o zip em qualquer pasta e execute o <code>panoraminal.exe</code>. Nada é instalado.","install.win.note":"Os arquivos não têm assinatura digital, então o Windows SmartScreen pode avisar na primeira execução: clique em <b>Mais informações</b> → <b>Executar assim mesmo</b>.","install.linux.t":"Linux (x86_64)","install.linux.appimage":"<b>AppImage</b> — funciona na maioria das distribuições:","install.linux.deb":"<b>.deb</b> — Debian, Ubuntu, Mint e derivados:","install.linux.tar":"<b>.tar.gz</b> — extraia e execute o binário:","install.mac.t":"macOS (Intel e Apple Silicon)","install.mac.zip":"Descompacte o arquivo e arraste o <b>Panoraminal.app</b> para <b>Aplicativos</b>.","install.mac.note":"<b>Gatekeeper:</b> o app não é assinado com um Apple Developer ID nem notarizado, então o macOS bloqueia a primeira abertura. Clique com o botão direito (ou Ctrl+clique) no Panoraminal.app → <b>Abrir</b> → <b>Abrir</b>. Nas versões recentes do macOS use Ajustes do Sistema → Privacidade e Segurança → <b>Abrir Mesmo Assim</b>, ou rode no Terminal:","install.req":"<b>Requisitos:</b> recomenda-se uma GPU com Vulkan, Metal, DirectX 12 ou OpenGL 3.3+. Renderizadores por software também funcionam, só que devagar.","install.sha":"Cada versão traz um arquivo <code>SHA256SUMS.txt</code> para verificar o download.","install.get":"Baixar","tour.title":"Conhecendo a interface","tour.lead":"Passe o mouse ou toque nos números para ver o que cada parte da janela faz.","tour.1":"<b>Barra de menus</b> — {{menu.file}}, {{menu.edit}}, {{menu.layer}}, {{menu.view}} e {{menu.help}}.","tour.2":"<b>Ferramentas</b> — {{tool.pen}}, {{tool.brush}}, {{tool.airbrush}}, {{tool.custom}}, {{tool.eraser}}, {{tool.eyedropper}} e {{tool.fill}}, com as cores primária e secundária logo abaixo.","tour.3":"<b>Botões rápidos</b> — desfazer / refazer, {{view.sphere}} / {{view.flat}}, {{menu.view.grid}}, {{action.toggle_theme}} e {{menu.help.help}}.","tour.4":"<b>Tela</b> — pinte com o botão esquerdo; arraste com o botão direito ou do meio para olhar em volta.","tour.5":"<b>{{panel.color}}</b> — seletor de cor, código hexadecimal, {{color.palette}} e {{color.recent}}.","tour.6":"<b>{{help.group.brush}}</b> — {{brush.size}}, {{brush.opacity}}, {{brush.flow}}, {{brush.hardness}} e as opções em {{brush.advanced}}.","tour.7":"<b>{{panel.layers}}</b> — adicionar, duplicar, mesclar e reordenar camadas; {{layer.opacity}}, {{layer.blend}}, visibilidade e {{layer.alpha_lock}}.","tour.8":"<b>Barra de status</b> — ferramenta e tamanho ativos, longitude / latitude do cursor, campo de visão, memória de desfazer, tamanho do documento e placa de vídeo.","guide.title":"Tutorial passo a passo","guide.lead":"Da primeira pincelada até a imagem 360° pronta para compartilhar.","s1.t":"Olhe em volta: vistas de esfera e plana","s1.p":"O Panoraminal tem duas vistas. Na <b>{{view.sphere}}</b> você fica no centro do panorama e pinta sobre o que vê. A <b>{{view.flat}}</b> mostra a imagem inteira de uma vez.","s1.l1":"[[V]] alterna entre as duas vistas.","s1.l2":"Arraste com o botão direito ou do meio, ou [[Space]] + arrastar, para girar a vista; as setas do teclado também funcionam.","s1.l3":"Roda do mouse ou [[+]] / [[-]] dá zoom (campo de visão até 120°); use pinça em telas sensíveis ao toque.","s1.l4":"[[0]] redefine a vista, [[G]] mostra a grade, [[Tab]] esconde a interface e [[F11]] liga a tela cheia.","s2.t":"Pinte: ferramentas, cores e camadas","s2.p":"Escolha uma ferramenta na barra da esquerda. Todos os pincéis pintam na esfera, então os traços ficam corretos na emenda e perto dos polos.","s2.l1":"[[[]] / [[]]] mudam o {{brush.size}}; [[{]] / [[}]] mudam a {{brush.hardness}}.","s2.l2":"[[Shift]] + clique desenha uma linha reta a partir do último traço — um círculo máximo na esfera.","s2.l3":"[[Alt]] + clique pega uma cor enquanto pinta; [[X]] troca as cores primária e secundária.","s2.l4":"{{brush.advanced}}: {{brush.spacing}}, {{brush.smoothing}}, {{brush.polar}} e pressão da caneta ({{brush.pressure_size}} / {{brush.pressure_opacity}}).","s2.l5":"{{panel.layers}}: até 64, com {{layer.opacity}}, visibilidade, reordenação por arrastar e soltar, {{layer.alpha_lock}} e 9 modos de mesclagem. [[Ctrl+Shift+N]] {{menu.layer.new}}, [[Ctrl+J]] {{menu.layer.duplicate}}, [[Ctrl+M]] {{menu.layer.merge_down}}.","s2.l6":"[[Ctrl+Z]] desfaz, [[Ctrl+Shift+Z]] / [[Ctrl+Y]] refazem.","s2.blends":"Modos de mesclagem","s3.t":"Pincéis personalizados e importação de .abr / .gbr / .gih","s3.p":"A ferramenta <b>{{tool.custom}}</b> ([[C]]) pinta com qualquer pincel da sua biblioteca.","s3.l1":"Importe em {{menu.file}} › {{menu.file.import_brushes}} ([[Ctrl+Shift+B]]) ou solte os arquivos na janela: <code>.abr</code> do Photoshop (v1/v2 e v6+), <code>.gbr</code> / <code>.gih</code> do GIMP, ou qualquer imagem PNG / JPEG / WebP como ponta.","s3.l2":"A biblioteca tem miniaturas, traço de prévia ao vivo, renomear, categorias, {{brushlib.favorites}} e busca.","s3.l3":"{{brushlib.dynamics}}: {{brush.spacing}}, {{brushlib.angle}}, {{brushlib.roundness}}, variação de tamanho / ângulo / arredondamento, {{brushlib.scatter}}, {{brushlib.count}}, variação de opacidade / fluxo, espelhamentos aleatórios e pressão da caneta.","s3.l4":"Recursos do Photoshop que ainda não têm equivalente (pincel duplo, textura, bordas molhadas, ruído…) são ignorados e listados num aviso no pincel.","s3.l5":"{{settings.embed_brushes}}: {{settings.embed_brushes_tip}}","s4.t":"Insira imagens na cena","s4.p":"Traga uma foto, um logo ou uma textura para o panorama. Ela flutua sobre a cena como um objeto não destrutivo até você mesclar.","s4.l1":"{{menu.file}} › {{menu.file.insert_image}} ([[Ctrl+Shift+I]]), arraste e solte um arquivo na janela, ou cole da área de transferência ([[Ctrl+Shift+V]]).","s4.modes":"Duas projeções","s5.t":"Transforme: mover, escalar, girar","s5.p":"Enquanto a imagem flutua, as alças na tela funcionam nas duas vistas:","s5.l1":"Arraste dentro da imagem para movê-la; arraste um canto para escalar (segure [[Shift]] para escala livre); o botão redondo gira a imagem ([[Shift]]: passos de 15°).","s5.l2":"No painel lateral: {{place.size}}, {{place.rotation}}, {{place.opacity}}, {{place.flip_h}} e {{place.flip_v}}.","s5.l3":"[[Enter]] — <b>{{place.merge}}</b>: {{place.merge.desc}}","s5.l4":"<b>{{place.as_layer}}</b> coloca a imagem numa camada nova; [[Esc]] cancela, e desfazer / refazer funcionam durante o posicionamento.","s6.t":"Distorça: pinos nos cantos (D) e malha (W)","s6.p":"{{place.distort.desc}} Para paredes e outras superfícies planas, use a projeção <b>{{place.mode.persistent}}</b> olhando para a parede.","s6.l1":"Aperte [[D]] enquanto posiciona uma imagem: aparecem quatro pinos nos cantos. Arraste cada um até um canto da parede, da tela ou do chão.","s6.l2":"<b>{{place.distort.perspective}}</b> — {{place.distort.perspective.desc}}","s6.l3":"[[Shift]] trava um eixo ao arrastar; arraste por dentro para mover a forma inteira; [[D]] volta para a transformação.","s6.l4":"<b>{{place.distort.numeric}}</b> — digite posições exatas para {{place.pin.tl}}, {{place.pin.tr}}, {{place.pin.br}} e {{place.pin.bl}}.","s6.l5":"[[W]] — <b>{{place.distort.warp}}</b>: {{place.distort.warp.desc}}","s6.l6":"{{place.distort.reset}} / {{place.distort.reset_warp}} recomeçam. Pinos que se cruzam ou dobram a imagem são recusados e a última forma válida é mantida.","s6.l7":"A distorção faz parte do desfazer do posicionamento e é mantida ao mover, escalar, girar e trocar de projeção. [[Enter]] mescla.","s7.t":"Salvar, abrir e exportar","s7.l1":"[[Ctrl+N]] {{menu.file.new}} — escolha uma predefinição 2:1, de {{new.preset.small}} (2048 × 1024) a {{new.preset.huge}} (8192 × 4096), e um fundo.","s7.l2":"[[Ctrl+S]] / [[Ctrl+Shift+S]] salvam um projeto <code>.pano</code>: um ZIP com cada camada em PNG, um manifesto JSON e uma prévia.","s7.l3":"[[Ctrl+O]] abre projetos <code>.pano</code>, imagens (PNG, JPEG, WebP, BMP, TIFF) e projetos antigos do Paint360 (<code>.p360.json</code>); [[Ctrl+I]] {{menu.file.import}}","s7.l4":"Backups automáticos e recuperação após falhas protegem seu trabalho, e o Panoraminal pergunta antes de fechar com alterações não salvas.","s7.l5":"[[Ctrl+Shift+E]] <b>{{menu.file.export_jpg}}</b> — {{export.desc}} Deixe <b>{{export.gpano}}</b> ligado.","s7.l6":"[[Ctrl+E]] <b>{{menu.file.export_png}}</b> — uma imagem plana comum.","s7.l7":"{{menu.edit}} › <b>{{menu.edit.offset}}</b> — {{offset.desc}} {{menu.edit}} › {{menu.edit.flip}} espelha o panorama.","s8.t":"Configurações: tema, animações e idioma","s8.p":"Abra {{menu.file}} › {{menu.file.settings}} ([[Ctrl+,]]).","s8.l1":"<b>{{settings.theme}}</b>: {{settings.theme.dark}}, {{settings.theme.light}} ou {{settings.theme.system}} — o botão na barra superior troca rapidamente.","s8.l2":"<b>{{settings.glow}}</b>: {{settings.glow.full}}, {{settings.glow.reduced}} ou {{settings.glow.off}}.","s8.l3":"<b>{{settings.animations}}</b>: {{settings.anim.auto}}, {{settings.anim.on}} ou {{settings.anim.off}}. {{settings.anim_tip}}","s8.l4":"<b>{{settings.language}}</b>: 8 idiomas, trocados na hora; {{settings.language.auto}} segue o sistema.","s8.l5":"Também: {{settings.ui_scale}}, {{settings.splash}}, {{settings.autosave}}, {{settings.undo_memory}}, {{settings.zoom_speed}}, {{settings.pen_pressure}} e {{settings.invert_drag}}.","s8.l6":"[[F1]] abre <b>{{menu.help.help}}</b> (atalhos, ferramentas e dicas de 360°); {{menu.help}} › {{menu.help.about}} tem os links do site, do código-fonte e das doações.","tips":"Dicas do programa","cap.light":"{{settings.theme.light}} · Português","cap.brushes":"Biblioteca de pincéis","cap.distort":"Pinos nos cantos de uma parede ({{place.mode.persistent}})","cap.merged":"Mesclada na parede","cap.distort_flat":"Pinos na {{view.flat}}","cap.before":"Pinos","cap.after":"Mesclada","keys.title":"Atalhos de teclado","keys.empty":"Nenhum atalho encontrado.","faq.title":"Dúvidas e limitações conhecidas","faq.q1":"Que tamanho meu panorama deve ter?","faq.a1":"{{help.tip.4}} Os documentos vão até 8192 × 4096 pixels, com até 64 camadas.","faq.q2":"Como publico no Facebook ou no Google Fotos?","faq.a2":"Use {{menu.file.export_jpg}} com <b>{{export.gpano}}</b> ligado: os metadados GPano fazem esses sites mostrarem a imagem como uma foto 360° interativa.","faq.q3":"A pressão da minha caneta não funciona.","faq.a3":"A pressão vem do sistema operacional. Funciona com canetas Windows Ink / pointer e dispositivos com força de toque; drivers só Wintab e muitas mesas no X11 / Wayland ainda não informam pressão — aí os traços usam pressão máxima.","faq.q4":"Meu pincel .abr ficou diferente.","faq.a4":"São lidas as pontas amostradas e computadas e as predefinições comuns. Pincel duplo, textura, pontas de cerdas / erodíveis, dinâmica de cor, bordas molhadas e ruído ainda não têm equivalente e aparecem num aviso no pincel; pontas coloridas viram máscaras. O importador foi testado com arquivos sintetizados — abra uma issue com qualquer .abr que não carregar.","faq.q5":"A distorção funciona no modo {{place.mode.wrap}}?","faq.a5":"Sim, mas a perspectiva é só aproximada em imagens grandes — use {{place.mode.persistent}} para paredes. A malha é uma grade fixa de 4×4, a prévia ao vivo usa no máximo 2048 px (a mesclagem usa a imagem inteira) e imagens posicionadas são limitadas a 4096 px no lado maior.","faq.q6":"Está lento ou não abre.","faq.a6":"Com renderizador por software (llvmpipe, WARP) documentos grandes ficam lentos. Ao iniciar, o Panoraminal troca de backend sozinho (DirectX 12 → Vulkan → OpenGL no Windows, Vulkan → OpenGL no Linux). Para forçar um, defina <code>WGPU_BACKEND</code> como <code>vulkan</code>, <code>dx12</code>, <code>gl</code> ou <code>metal</code>.","faq.q7":"O macOS diz que o app não pode ser aberto.","faq.a7":"A versão para macOS não é assinada com Developer ID nem notarizada — siga a nota sobre o Gatekeeper na seção de instalação.","faq.q8":"É grátis?","faq.a8":"{{about.license}} O código-fonte está no GitHub. Se o Panoraminal for útil para você, considere fazer uma doação.","foot.cta.t":"Curtindo o Panoraminal?","foot.cta.p":"O Panoraminal é gratuito e de código aberto. Uma doação ajuda o projeto a continuar crescendo.","foot.made":"Feito por cleitinhodev / bugzinho · licença MIT","foot.releases":"Versões"},"en":{"meta.title":"Panoraminal — Tutorial","meta.desc":"Learn to paint 360° panoramas with Panoraminal: installation, interface, brushes, layers, image placement, distortion and 360° export.","nav.what":"360°?","nav.install":"Install","nav.tour":"Interface","nav.guide":"Tutorial","nav.keys":"Shortcuts","nav.faq":"FAQ","ui.menu":"Menu","ui.top":"Back to top","ui.close":"Close","ui.copy":"Copy","ui.copied":"Copied!","ui.zoom":"Click to enlarge","ui.compare":"Drag the slider to compare","ui.filter":"Filter shortcuts…","ui.step":"Step {n}","hero.kicker":"Official tutorial · version {v}","hero.download":"Download v{v}","hero.releases":"All releases","hero.drag":"Drag to look around","hero.s1":"8 languages","hero.s2":"up to 64 layers","hero.s3":"free & open source","what.title":"What is a 360° panorama?","what.p1":"A 360° panorama is a picture of everything around a single point: front, back, both sides, the sky and the floor. It is stored as a flat image twice as wide as it is tall (2:1) — the <b>equirectangular</b> projection, just like a world map.","what.p2":"Viewers such as Facebook, Google Photos and VR headsets wrap that image onto a sphere around you. Painting directly on the flat image is hard: lines bend, the left and right edges must match and the poles get stretched.","what.p3":"Panoraminal puts you <b>inside the sphere</b>: you look around and paint what you see, and every stroke is projected back onto the equirectangular image with the right distortion — straight lines, an invisible seam and well-behaved poles.","what.seam":"The left and right edges are the same place: the image wraps around.","install.title":"Installation","install.lead":"Choose the file for your system. Version {v} is the current stable release; every file is also on the releases page.","install.win.t":"Windows 10 / 11 (x64)","install.win.setup":"<b>Installer</b> — run the file below. It creates Start menu and desktop shortcuts and opens <code>.pano</code> files with Panoraminal.","install.win.portable":"<b>Portable</b> — extract the zip anywhere and run <code>panoraminal.exe</code>. Nothing is installed.","install.win.note":"The files are not code-signed, so Windows SmartScreen may warn on the first run: click <b>More info</b> → <b>Run anyway</b>.","install.linux.t":"Linux (x86_64)","install.linux.appimage":"<b>AppImage</b> — works on most distributions:","install.linux.deb":"<b>.deb</b> — Debian, Ubuntu, Mint and derivatives:","install.linux.tar":"<b>.tar.gz</b> — extract it and run the binary:","install.mac.t":"macOS (Intel and Apple Silicon)","install.mac.zip":"Unzip the file and drag <b>Panoraminal.app</b> into <b>Applications</b>.","install.mac.note":"<b>Gatekeeper:</b> the app is not signed with an Apple Developer ID nor notarised, so macOS blocks the first launch. Right-click (or Ctrl-click) Panoraminal.app → <b>Open</b> → <b>Open</b>. On recent macOS versions use System Settings → Privacy &amp; Security → <b>Open Anyway</b>, or run in Terminal:","install.req":"<b>Requirements:</b> a GPU with Vulkan, Metal, DirectX 12 or OpenGL 3.3+ is recommended. Software renderers work too, just slowly.","install.sha":"Each release includes a <code>SHA256SUMS.txt</code> file to verify your download.","install.get":"Download","tour.title":"Interface tour","tour.lead":"Hover over or tap the numbers to see what each part of the window does.","tour.1":"<b>Menu bar</b> — {{menu.file}}, {{menu.edit}}, {{menu.layer}}, {{menu.view}} and {{menu.help}}.","tour.2":"<b>Tools</b> — {{tool.pen}}, {{tool.brush}}, {{tool.airbrush}}, {{tool.custom}}, {{tool.eraser}}, {{tool.eyedropper}} and {{tool.fill}}, with the primary and secondary colors below.","tour.3":"<b>Quick buttons</b> — undo / redo, {{view.sphere}} / {{view.flat}}, {{menu.view.grid}}, {{action.toggle_theme}} and {{menu.help.help}}.","tour.4":"<b>Canvas</b> — paint with the left button; drag with the right or middle button to look around.","tour.5":"<b>{{panel.color}}</b> — color picker, hex code, {{color.palette}} and {{color.recent}}.","tour.6":"<b>{{help.group.brush}}</b> — {{brush.size}}, {{brush.opacity}}, {{brush.flow}}, {{brush.hardness}} and the {{brush.advanced}} options.","tour.7":"<b>{{panel.layers}}</b> — add, duplicate, merge and reorder layers; {{layer.opacity}}, {{layer.blend}}, visibility and {{layer.alpha_lock}}.","tour.8":"<b>Status bar</b> — active tool and size, cursor longitude / latitude, field of view, undo memory, document size and graphics adapter.","guide.title":"Step-by-step tutorial","guide.lead":"From the first stroke to a 360° image ready to share.","s1.t":"Look around: sphere and flat views","s1.p":"Panoraminal has two views. In the <b>{{view.sphere}}</b> you stand in the centre of the panorama and paint on what you see. The <b>{{view.flat}}</b> shows the whole image at once.","s1.l1":"[[V]] switches between the two views.","s1.l2":"Drag with the right or middle button, or [[Space]] + drag, to rotate the view; the arrow keys work too.","s1.l3":"Mouse wheel or [[+]] / [[-]] zooms (field of view up to 120°); pinch on touch screens.","s1.l4":"[[0]] resets the view, [[G]] shows the grid, [[Tab]] hides the interface and [[F11]] toggles fullscreen.","s2.t":"Paint: tools, colors and layers","s2.p":"Pick a tool in the left bar. Every brush paints on the sphere, so strokes stay correct across the seam and near the poles.","s2.l1":"[[[]] / [[]]] change the {{brush.size}}; [[{]] / [[}]] change the {{brush.hardness}}.","s2.l2":"[[Shift]] + click draws a straight line from the last stroke — a great circle on the sphere.","s2.l3":"[[Alt]] + click picks a color while painting; [[X]] swaps the primary and secondary colors.","s2.l4":"{{brush.advanced}}: {{brush.spacing}}, {{brush.smoothing}}, {{brush.polar}} and pen pressure ({{brush.pressure_size}} / {{brush.pressure_opacity}}).","s2.l5":"{{panel.layers}}: up to 64, with {{layer.opacity}}, visibility, drag-and-drop reordering, {{layer.alpha_lock}} and 9 blend modes. [[Ctrl+Shift+N]] {{menu.layer.new}}, [[Ctrl+J]] {{menu.layer.duplicate}}, [[Ctrl+M]] {{menu.layer.merge_down}}.","s2.l6":"[[Ctrl+Z]] undoes, [[Ctrl+Shift+Z]] / [[Ctrl+Y]] redoes.","s2.blends":"Blend modes","s3.t":"Custom brushes and .abr / .gbr / .gih import","s3.p":"The <b>{{tool.custom}}</b> tool ([[C]]) paints with any brush from your library.","s3.l1":"Import with {{menu.file}} › {{menu.file.import_brushes}} ([[Ctrl+Shift+B]]) or drop the files onto the window: Photoshop <code>.abr</code> (v1/v2 and v6+), GIMP <code>.gbr</code> / <code>.gih</code>, or any PNG / JPEG / WebP image as a tip.","s3.l2":"The library has thumbnails, a live preview stroke, rename, categories, {{brushlib.favorites}} and search.","s3.l3":"{{brushlib.dynamics}}: {{brush.spacing}}, {{brushlib.angle}}, {{brushlib.roundness}}, size / angle / roundness jitter, {{brushlib.scatter}}, {{brushlib.count}}, opacity / flow jitter, random flips and pen pressure.","s3.l4":"Photoshop features with no equivalent yet (dual brush, texture, wet edges, noise…) are skipped and listed in a notice on the brush.","s3.l5":"{{settings.embed_brushes}}: {{settings.embed_brushes_tip}}","s4.t":"Insert images into the scene","s4.p":"Bring a photo, a logo or a texture into the panorama. It floats over the scene as a non-destructive object until you merge it.","s4.l1":"{{menu.file}} › {{menu.file.insert_image}} ([[Ctrl+Shift+I]]), drag and drop a file onto the window, or paste from the clipboard ([[Ctrl+Shift+V]]).","s4.modes":"Two projections","s5.t":"Transform: move, scale, rotate","s5.p":"While the image floats, the handles on the canvas work in both views:","s5.l1":"Drag inside the image to move it; drag a corner to scale it (hold [[Shift]] for free scaling); the round knob rotates it ([[Shift]]: 15° steps).","s5.l2":"In the side panel: {{place.size}}, {{place.rotation}}, {{place.opacity}}, {{place.flip_h}} and {{place.flip_v}}.","s5.l3":"[[Enter]] — <b>{{place.merge}}</b>: {{place.merge.desc}}","s5.l4":"<b>{{place.as_layer}}</b> puts it on a new layer instead; [[Esc]] cancels, and undo / redo work while you place.","s6.t":"Distort: corner pins (D) and mesh warp (W)","s6.p":"{{place.distort.desc}} For walls and other flat surfaces, use the <b>{{place.mode.persistent}}</b> projection looking at the wall.","s6.l1":"Press [[D]] while placing an image: four pins appear on its corners. Drag each one onto a corner of the wall, screen or floor.","s6.l2":"<b>{{place.distort.perspective}}</b> — {{place.distort.perspective.desc}}","s6.l3":"[[Shift]] locks an axis while dragging; drag inside to move the whole shape; [[D]] returns to the transform.","s6.l4":"<b>{{place.distort.numeric}}</b> — type exact positions for {{place.pin.tl}}, {{place.pin.tr}}, {{place.pin.br}} and {{place.pin.bl}}.","s6.l5":"[[W]] — <b>{{place.distort.warp}}</b>: {{place.distort.warp.desc}}","s6.l6":"{{place.distort.reset}} / {{place.distort.reset_warp}} start over. Pins that cross or fold the image are refused and the last valid shape is kept.","s6.l7":"The distortion is part of the placement's undo and survives moving, scaling, rotating and switching projection. [[Enter]] merges it.","s7.t":"Save, open and export","s7.l1":"[[Ctrl+N]] {{menu.file.new}} — pick a 2:1 preset, from {{new.preset.small}} (2048 × 1024) to {{new.preset.huge}} (8192 × 4096), and a background.","s7.l2":"[[Ctrl+S]] / [[Ctrl+Shift+S]] save a <code>.pano</code> project: a ZIP with every layer as PNG, a JSON manifest and a preview.","s7.l3":"[[Ctrl+O]] opens <code>.pano</code> projects, images (PNG, JPEG, WebP, BMP, TIFF) and old Paint360 <code>.p360.json</code> projects; [[Ctrl+I]] {{menu.file.import}}","s7.l4":"Automatic backups and crash recovery protect your work, and Panoraminal asks before closing with unsaved changes.","s7.l5":"[[Ctrl+Shift+E]] <b>{{menu.file.export_jpg}}</b> — {{export.desc}} Keep <b>{{export.gpano}}</b> on.","s7.l6":"[[Ctrl+E]] <b>{{menu.file.export_png}}</b> — a plain flat image.","s7.l7":"{{menu.edit}} › <b>{{menu.edit.offset}}</b> — {{offset.desc}} {{menu.edit}} › {{menu.edit.flip}} mirrors the panorama.","s8.t":"Settings: theme, animations and language","s8.p":"Open {{menu.file}} › {{menu.file.settings}} ([[Ctrl+,]]).","s8.l1":"<b>{{settings.theme}}</b>: {{settings.theme.dark}}, {{settings.theme.light}} or {{settings.theme.system}} — the button in the top bar switches quickly.","s8.l2":"<b>{{settings.glow}}</b>: {{settings.glow.full}}, {{settings.glow.reduced}} or {{settings.glow.off}}.","s8.l3":"<b>{{settings.animations}}</b>: {{settings.anim.auto}}, {{settings.anim.on}} or {{settings.anim.off}}. {{settings.anim_tip}}","s8.l4":"<b>{{settings.language}}</b>: 8 languages, switched instantly; {{settings.language.auto}} follows the system.","s8.l5":"Also: {{settings.ui_scale}}, {{settings.splash}}, {{settings.autosave}}, {{settings.undo_memory}}, {{settings.zoom_speed}}, {{settings.pen_pressure}} and {{settings.invert_drag}}.","s8.l6":"[[F1]] opens <b>{{menu.help.help}}</b> (shortcuts, tools and 360° tips); {{menu.help}} › {{menu.help.about}} has the links to the website, the source code and donations.","tips":"Tips from the app","cap.light":"{{settings.theme.light}} · Português","cap.brushes":"Brush library","cap.distort":"Corner pins on a room wall ({{place.mode.persistent}})","cap.merged":"Merged onto the wall","cap.distort_flat":"Corner pins in the {{view.flat}}","cap.before":"Pins","cap.after":"Merged","keys.title":"Keyboard shortcuts","keys.empty":"No shortcut matches.","faq.title":"FAQ and known limitations","faq.q1":"What size should my panorama be?","faq.a1":"{{help.tip.4}} Documents go up to 8192 × 4096 pixels, with up to 64 layers.","faq.q2":"How do I post it on Facebook or Google Photos?","faq.a2":"Use {{menu.file.export_jpg}} with <b>{{export.gpano}}</b> enabled: the GPano metadata makes those sites show the image as an interactive 360° photo.","faq.q3":"My pen pressure doesn't work.","faq.a3":"Pressure comes from the operating system. It works with Windows Ink / pointer pens and touch-force devices; Wintab-only drivers and many X11 / Wayland tablets don't report pressure yet — strokes then use full pressure.","faq.q4":"My .abr brush looks different.","faq.a4":"Sampled and computed tips and the common presets are read. Dual brush, texture, bristle / erodible tips, color dynamics, wet edges and noise have no equivalent yet and are listed in a notice on the brush; color tips are used as masks. The importer was tested with synthesized files — please open an issue with any .abr that doesn't load.","faq.q5":"Does distortion work in {{place.mode.wrap}} mode?","faq.a5":"Yes, but it is only approximately perspective-correct for large images — use {{place.mode.persistent}} for walls. The mesh is a fixed 4×4 grid, the live preview uses at most 2048 px (merging uses the full image) and placed images are limited to 4096 px on the longest side.","faq.q6":"It's slow or doesn't start.","faq.a6":"With a software renderer (llvmpipe, WARP) large documents are slow. At startup Panoraminal falls back automatically (DirectX 12 → Vulkan → OpenGL on Windows, Vulkan → OpenGL on Linux). To force one, set <code>WGPU_BACKEND</code> to <code>vulkan</code>, <code>dx12</code>, <code>gl</code> or <code>metal</code>.","faq.q7":"macOS says the app can't be opened.","faq.a7":"The macOS build is not signed with a Developer ID nor notarised — follow the Gatekeeper note in the installation section.","faq.q8":"Is it free?","faq.a8":"{{about.license}} The source code is on GitHub. If Panoraminal is useful to you, consider a donation.","foot.cta.t":"Enjoying Panoraminal?","foot.cta.p":"Panoraminal is free and open source. A donation helps keep it growing.","foot.made":"Made by cleitinhodev / bugzinho · MIT license","foot.releases":"Releases"},"es":{"meta.title":"Panoraminal — Tutorial","meta.desc":"Aprende a pintar panoramas 360° con Panoraminal: instalación, interfaz, pinceles, capas, inserción de imágenes, distorsión y exportación 360°.","nav.what":"¿360°?","nav.install":"Instalar","nav.tour":"Interfaz","nav.guide":"Tutorial","nav.keys":"Atajos","nav.faq":"Preguntas","ui.menu":"Menú","ui.top":"Volver arriba","ui.close":"Cerrar","ui.copy":"Copiar","ui.copied":"¡Copiado!","ui.zoom":"Haz clic para ampliar","ui.compare":"Arrastra el control para comparar","ui.filter":"Filtrar atajos…","ui.step":"Paso {n}","hero.kicker":"Tutorial oficial · versión {v}","hero.download":"Descargar v{v}","hero.releases":"Todas las versiones","hero.drag":"Arrastra para mirar alrededor","hero.s1":"8 idiomas","hero.s2":"hasta 64 capas","hero.s3":"libre y de código abierto","what.title":"¿Qué es un panorama 360°?","what.p1":"Un panorama 360° es una imagen de todo lo que rodea a un punto: delante, detrás, ambos lados, el cielo y el suelo. Se guarda como una imagen plana el doble de ancha que de alta (2:1): la proyección <b>equirrectangular</b>, igual que un mapamundi.","what.p2":"Visores como Facebook, Google Fotos y los cascos de RV envuelven esa imagen en una esfera a tu alrededor. Pintar directamente sobre la imagen plana es difícil: las líneas se curvan, los bordes izquierdo y derecho deben coincidir y los polos se estiran.","what.p3":"Panoraminal te pone <b>dentro de la esfera</b>: miras alrededor y pintas lo que ves, y cada trazo se proyecta de vuelta sobre la imagen equirrectangular con la distorsión correcta: líneas rectas, costura invisible y polos bien resueltos.","what.seam":"Los bordes izquierdo y derecho son el mismo lugar: la imagen da la vuelta.","install.title":"Instalación","install.lead":"Elige el archivo para tu sistema. La versión {v} es la versión estable actual; todos los archivos están también en la página de versiones.","install.win.t":"Windows 10 / 11 (x64)","install.win.setup":"<b>Instalador</b>: ejecuta el archivo de abajo. Crea accesos directos en el menú Inicio y el escritorio y abre los archivos <code>.pano</code> con Panoraminal.","install.win.portable":"<b>Portátil</b>: extrae el zip en cualquier carpeta y ejecuta <code>panoraminal.exe</code>. No se instala nada.","install.win.note":"Los archivos no están firmados digitalmente, así que Windows SmartScreen puede avisar la primera vez: haz clic en <b>Más información</b> → <b>Ejecutar de todas formas</b>.","install.linux.t":"Linux (x86_64)","install.linux.appimage":"<b>AppImage</b>: funciona en la mayoría de distribuciones:","install.linux.deb":"<b>.deb</b>: Debian, Ubuntu, Mint y derivadas:","install.linux.tar":"<b>.tar.gz</b>: extráelo y ejecuta el binario:","install.mac.t":"macOS (Intel y Apple Silicon)","install.mac.zip":"Descomprime el archivo y arrastra <b>Panoraminal.app</b> a <b>Aplicaciones</b>.","install.mac.note":"<b>Gatekeeper:</b> la app no está firmada con un Apple Developer ID ni notarizada, así que macOS bloquea la primera apertura. Haz clic derecho (o Ctrl+clic) en Panoraminal.app → <b>Abrir</b> → <b>Abrir</b>. En versiones recientes de macOS usa Ajustes del Sistema → Privacidad y seguridad → <b>Abrir igualmente</b>, o ejecuta en la Terminal:","install.req":"<b>Requisitos:</b> se recomienda una GPU con Vulkan, Metal, DirectX 12 u OpenGL 3.3+. Los renderizadores por software también funcionan, aunque lentos.","install.sha":"Cada versión incluye un archivo <code>SHA256SUMS.txt</code> para verificar la descarga.","install.get":"Descargar","tour.title":"Recorrido por la interfaz","tour.lead":"Pasa el ratón o toca los números para ver qué hace cada parte de la ventana.","tour.1":"<b>Barra de menús</b>: {{menu.file}}, {{menu.edit}}, {{menu.layer}}, {{menu.view}} y {{menu.help}}.","tour.2":"<b>Herramientas</b>: {{tool.pen}}, {{tool.brush}}, {{tool.airbrush}}, {{tool.custom}}, {{tool.eraser}}, {{tool.eyedropper}} y {{tool.fill}}, con los colores principal y secundario debajo.","tour.3":"<b>Botones rápidos</b>: deshacer / rehacer, {{view.sphere}} / {{view.flat}}, {{menu.view.grid}}, {{action.toggle_theme}} y {{menu.help.help}}.","tour.4":"<b>Lienzo</b>: pinta con el botón izquierdo; arrastra con el botón derecho o central para mirar alrededor.","tour.5":"<b>{{panel.color}}</b>: selector de color, código hexadecimal, {{color.palette}} y {{color.recent}}.","tour.6":"<b>{{help.group.brush}}</b>: {{brush.size}}, {{brush.opacity}}, {{brush.flow}}, {{brush.hardness}} y las opciones de {{brush.advanced}}.","tour.7":"<b>{{panel.layers}}</b>: añadir, duplicar, combinar y reordenar capas; {{layer.opacity}}, {{layer.blend}}, visibilidad y {{layer.alpha_lock}}.","tour.8":"<b>Barra de estado</b>: herramienta y tamaño activos, longitud / latitud del cursor, campo de visión, memoria de deshacer, tamaño del documento y tarjeta gráfica.","guide.title":"Tutorial paso a paso","guide.lead":"Del primer trazo a una imagen 360° lista para compartir.","s1.t":"Mira alrededor: vista esfera y vista plana","s1.p":"Panoraminal tiene dos vistas. En la <b>{{view.sphere}}</b> estás en el centro del panorama y pintas sobre lo que ves. La <b>{{view.flat}}</b> muestra la imagen entera de una vez.","s1.l1":"[[V]] cambia entre las dos vistas.","s1.l2":"Arrastra con el botón derecho o central, o [[Space]] + arrastrar, para girar la vista; las flechas del teclado también sirven.","s1.l3":"La rueda del ratón o [[+]] / [[-]] hacen zoom (campo de visión hasta 120°); pellizca en pantallas táctiles.","s1.l4":"[[0]] restablece la vista, [[G]] muestra la cuadrícula, [[Tab]] oculta la interfaz y [[F11]] activa la pantalla completa.","s2.t":"Pinta: herramientas, colores y capas","s2.p":"Elige una herramienta en la barra izquierda. Todos los pinceles pintan sobre la esfera, así que los trazos quedan bien en la costura y cerca de los polos.","s2.l1":"[[[]] / [[]]] cambian el {{brush.size}}; [[{]] / [[}]] cambian la {{brush.hardness}}.","s2.l2":"[[Shift]] + clic traza una línea recta desde el último trazo: un círculo máximo en la esfera.","s2.l3":"[[Alt]] + clic toma un color mientras pintas; [[X]] intercambia los colores principal y secundario.","s2.l4":"{{brush.advanced}}: {{brush.spacing}}, {{brush.smoothing}}, {{brush.polar}} y presión del lápiz ({{brush.pressure_size}} / {{brush.pressure_opacity}}).","s2.l5":"{{panel.layers}}: hasta 64, con {{layer.opacity}}, visibilidad, reordenación arrastrando, {{layer.alpha_lock}} y 9 modos de fusión. [[Ctrl+Shift+N]] {{menu.layer.new}}, [[Ctrl+J]] {{menu.layer.duplicate}}, [[Ctrl+M]] {{menu.layer.merge_down}}.","s2.l6":"[[Ctrl+Z]] deshace, [[Ctrl+Shift+Z]] / [[Ctrl+Y]] rehacen.","s2.blends":"Modos de fusión","s3.t":"Pinceles personalizados e importación de .abr / .gbr / .gih","s3.p":"La herramienta <b>{{tool.custom}}</b> ([[C]]) pinta con cualquier pincel de tu biblioteca.","s3.l1":"Importa desde {{menu.file}} › {{menu.file.import_brushes}} ([[Ctrl+Shift+B]]) o suelta los archivos en la ventana: <code>.abr</code> de Photoshop (v1/v2 y v6+), <code>.gbr</code> / <code>.gih</code> de GIMP, o cualquier imagen PNG / JPEG / WebP como punta.","s3.l2":"La biblioteca tiene miniaturas, trazo de vista previa en vivo, renombrar, categorías, {{brushlib.favorites}} y búsqueda.","s3.l3":"{{brushlib.dynamics}}: {{brush.spacing}}, {{brushlib.angle}}, {{brushlib.roundness}}, variación de tamaño / ángulo / redondez, {{brushlib.scatter}}, {{brushlib.count}}, variación de opacidad / flujo, volteos aleatorios y presión del lápiz.","s3.l4":"Las funciones de Photoshop sin equivalente todavía (pincel doble, textura, bordes húmedos, ruido…) se omiten y se listan en un aviso en el pincel.","s3.l5":"{{settings.embed_brushes}}: {{settings.embed_brushes_tip}}","s4.t":"Inserta imágenes en la escena","s4.p":"Trae una foto, un logotipo o una textura al panorama. Flota sobre la escena como un objeto no destructivo hasta que lo combines.","s4.l1":"{{menu.file}} › {{menu.file.insert_image}} ([[Ctrl+Shift+I]]), arrastra y suelta un archivo en la ventana, o pega desde el portapapeles ([[Ctrl+Shift+V]]).","s4.modes":"Dos proyecciones","s5.t":"Transforma: mover, escalar, rotar","s5.p":"Mientras la imagen flota, los controles del lienzo funcionan en las dos vistas:","s5.l1":"Arrastra dentro de la imagen para moverla; arrastra una esquina para escalarla (mantén [[Shift]] para escala libre); el tirador redondo la rota ([[Shift]]: pasos de 15°).","s5.l2":"En el panel lateral: {{place.size}}, {{place.rotation}}, {{place.opacity}}, {{place.flip_h}} y {{place.flip_v}}.","s5.l3":"[[Enter]] — <b>{{place.merge}}</b>: {{place.merge.desc}}","s5.l4":"<b>{{place.as_layer}}</b> la pone en una capa nueva; [[Esc]] cancela, y deshacer / rehacer funcionan mientras colocas.","s6.t":"Distorsiona: pines de esquina (D) y malla (W)","s6.p":"{{place.distort.desc}} Para paredes y otras superficies planas, usa la proyección <b>{{place.mode.persistent}}</b> mirando hacia la pared.","s6.l1":"Pulsa [[D]] mientras colocas una imagen: aparecen cuatro pines en sus esquinas. Arrastra cada uno a una esquina de la pared, la pantalla o el suelo.","s6.l2":"<b>{{place.distort.perspective}}</b>: {{place.distort.perspective.desc}}","s6.l3":"[[Shift]] bloquea un eje al arrastrar; arrastra por dentro para mover toda la forma; [[D]] vuelve a la transformación.","s6.l4":"<b>{{place.distort.numeric}}</b>: escribe posiciones exactas para {{place.pin.tl}}, {{place.pin.tr}}, {{place.pin.br}} y {{place.pin.bl}}.","s6.l5":"[[W]] — <b>{{place.distort.warp}}</b>: {{place.distort.warp.desc}}","s6.l6":"{{place.distort.reset}} / {{place.distort.reset_warp}} empiezan de nuevo. Los pines que se cruzan o pliegan la imagen se rechazan y se conserva la última forma válida.","s6.l7":"La distorsión forma parte del deshacer de la colocación y se mantiene al mover, escalar, rotar y cambiar de proyección. [[Enter]] la combina.","s7.t":"Guardar, abrir y exportar","s7.l1":"[[Ctrl+N]] {{menu.file.new}}: elige un ajuste 2:1, de {{new.preset.small}} (2048 × 1024) a {{new.preset.huge}} (8192 × 4096), y un fondo.","s7.l2":"[[Ctrl+S]] / [[Ctrl+Shift+S]] guardan un proyecto <code>.pano</code>: un ZIP con cada capa en PNG, un manifiesto JSON y una vista previa.","s7.l3":"[[Ctrl+O]] abre proyectos <code>.pano</code>, imágenes (PNG, JPEG, WebP, BMP, TIFF) y proyectos antiguos de Paint360 (<code>.p360.json</code>); [[Ctrl+I]] {{menu.file.import}}","s7.l4":"Las copias automáticas y la recuperación tras fallos protegen tu trabajo, y Panoraminal pregunta antes de cerrar con cambios sin guardar.","s7.l5":"[[Ctrl+Shift+E]] <b>{{menu.file.export_jpg}}</b>: {{export.desc}} Deja activado <b>{{export.gpano}}</b>.","s7.l6":"[[Ctrl+E]] <b>{{menu.file.export_png}}</b>: una imagen plana normal.","s7.l7":"{{menu.edit}} › <b>{{menu.edit.offset}}</b>: {{offset.desc}} {{menu.edit}} › {{menu.edit.flip}} refleja el panorama.","s8.t":"Ajustes: tema, animaciones e idioma","s8.p":"Abre {{menu.file}} › {{menu.file.settings}} ([[Ctrl+,]]).","s8.l1":"<b>{{settings.theme}}</b>: {{settings.theme.dark}}, {{settings.theme.light}} o {{settings.theme.system}}; el botón de la barra superior cambia rápidamente.","s8.l2":"<b>{{settings.glow}}</b>: {{settings.glow.full}}, {{settings.glow.reduced}} o {{settings.glow.off}}.","s8.l3":"<b>{{settings.animations}}</b>: {{settings.anim.auto}}, {{settings.anim.on}} o {{settings.anim.off}}. {{settings.anim_tip}}","s8.l4":"<b>{{settings.language}}</b>: 8 idiomas, que cambian al instante; {{settings.language.auto}} sigue al sistema.","s8.l5":"Además: {{settings.ui_scale}}, {{settings.splash}}, {{settings.autosave}}, {{settings.undo_memory}}, {{settings.zoom_speed}}, {{settings.pen_pressure}} y {{settings.invert_drag}}.","s8.l6":"[[F1]] abre <b>{{menu.help.help}}</b> (atajos, herramientas y consejos 360°); {{menu.help}} › {{menu.help.about}} tiene los enlaces al sitio web, al código fuente y a las donaciones.","tips":"Consejos del programa","cap.light":"{{settings.theme.light}} · Português","cap.brushes":"Biblioteca de pinceles","cap.distort":"Pines en las esquinas de una pared ({{place.mode.persistent}})","cap.merged":"Combinada en la pared","cap.distort_flat":"Pines en la {{view.flat}}","cap.before":"Pines","cap.after":"Combinada","keys.title":"Atajos de teclado","keys.empty":"Ningún atajo coincide.","faq.title":"Preguntas frecuentes y limitaciones conocidas","faq.q1":"¿Qué tamaño debe tener mi panorama?","faq.a1":"{{help.tip.4}} Los documentos llegan hasta 8192 × 4096 píxeles, con hasta 64 capas.","faq.q2":"¿Cómo lo publico en Facebook o Google Fotos?","faq.a2":"Usa {{menu.file.export_jpg}} con <b>{{export.gpano}}</b> activado: los metadatos GPano hacen que esos sitios muestren la imagen como una foto 360° interactiva.","faq.q3":"La presión de mi lápiz no funciona.","faq.a3":"La presión viene del sistema operativo. Funciona con lápices Windows Ink / pointer y dispositivos con fuerza táctil; los controladores solo Wintab y muchas tabletas en X11 / Wayland aún no informan la presión, y entonces los trazos usan presión máxima.","faq.q4":"Mi pincel .abr se ve distinto.","faq.a4":"Se leen las puntas muestreadas y calculadas y los ajustes comunes. Pincel doble, textura, puntas de cerdas / erosionables, dinámica de color, bordes húmedos y ruido aún no tienen equivalente y se listan en un aviso en el pincel; las puntas de color se usan como máscaras. El importador se probó con archivos sintetizados: abre un issue con cualquier .abr que no cargue.","faq.q5":"¿La distorsión funciona en modo {{place.mode.wrap}}?","faq.a5":"Sí, pero la perspectiva solo es aproximada en imágenes grandes; usa {{place.mode.persistent}} para paredes. La malla es una cuadrícula fija de 4×4, la vista previa en vivo usa como máximo 2048 px (la combinación usa la imagen completa) y las imágenes colocadas se limitan a 4096 px en el lado mayor.","faq.q6":"Va lento o no arranca.","faq.a6":"Con un renderizador por software (llvmpipe, WARP) los documentos grandes van lentos. Al iniciar, Panoraminal cambia de backend automáticamente (DirectX 12 → Vulkan → OpenGL en Windows, Vulkan → OpenGL en Linux). Para forzar uno, define <code>WGPU_BACKEND</code> como <code>vulkan</code>, <code>dx12</code>, <code>gl</code> o <code>metal</code>.","faq.q7":"macOS dice que la app no se puede abrir.","faq.a7":"La versión para macOS no está firmada con Developer ID ni notarizada: sigue la nota sobre Gatekeeper en la sección de instalación.","faq.q8":"¿Es gratis?","faq.a8":"{{about.license}} El código fuente está en GitHub. Si Panoraminal te resulta útil, considera hacer una donación.","foot.cta.t":"¿Te gusta Panoraminal?","foot.cta.p":"Panoraminal es libre y de código abierto. Una donación ayuda a que siga creciendo.","foot.made":"Hecho por cleitinhodev / bugzinho · licencia MIT","foot.releases":"Versiones"},"fr":{"meta.title":"Panoraminal — Tutoriel","meta.desc":"Apprenez à peindre des panoramas 360° avec Panoraminal : installation, interface, brosses, calques, insertion d’images, déformation et export 360°.","nav.what":"360° ?","nav.install":"Installer","nav.tour":"Interface","nav.guide":"Tutoriel","nav.keys":"Raccourcis","nav.faq":"FAQ","ui.menu":"Menu","ui.top":"Retour en haut","ui.close":"Fermer","ui.copy":"Copier","ui.copied":"Copié !","ui.zoom":"Cliquer pour agrandir","ui.compare":"Faites glisser le curseur pour comparer","ui.filter":"Filtrer les raccourcis…","ui.step":"Étape {n}","hero.kicker":"Tutoriel officiel · version {v}","hero.download":"Télécharger v{v}","hero.releases":"Toutes les versions","hero.drag":"Faites glisser pour regarder autour","hero.s1":"8 langues","hero.s2":"jusqu’à 64 calques","hero.s3":"libre et open source","what.title":"Qu’est-ce qu’un panorama 360° ?","what.p1":"Un panorama 360° est une image de tout ce qui entoure un point : devant, derrière, les deux côtés, le ciel et le sol. Il est enregistré comme une image plate deux fois plus large que haute (2:1) — la projection <b>équirectangulaire</b>, comme un planisphère.","what.p2":"Les visionneuses comme Facebook, Google Photos et les casques VR enroulent cette image sur une sphère autour de vous. Peindre directement sur l’image plate est difficile : les lignes se courbent, les bords gauche et droit doivent se raccorder et les pôles sont étirés.","what.p3":"Panoraminal vous place <b>à l’intérieur de la sphère</b> : vous regardez autour de vous et peignez ce que vous voyez, et chaque trait est reprojeté sur l’image équirectangulaire avec la bonne déformation — lignes droites, raccord invisible et pôles maîtrisés.","what.seam":"Les bords gauche et droit sont le même endroit : l’image fait le tour.","install.title":"Installation","install.lead":"Choisissez le fichier de votre système. La version {v} est la version stable actuelle ; tous les fichiers sont aussi sur la page des versions.","install.win.t":"Windows 10 / 11 (x64)","install.win.setup":"<b>Installateur</b> — lancez le fichier ci-dessous. Il crée des raccourcis dans le menu Démarrer et sur le bureau et associe les fichiers <code>.pano</code> à Panoraminal.","install.win.portable":"<b>Portable</b> — extrayez le zip n’importe où et lancez <code>panoraminal.exe</code>. Rien n’est installé.","install.win.note":"Les fichiers ne sont pas signés, Windows SmartScreen peut donc afficher un avertissement au premier lancement : cliquez sur <b>Informations complémentaires</b> → <b>Exécuter quand même</b>.","install.linux.t":"Linux (x86_64)","install.linux.appimage":"<b>AppImage</b> — fonctionne sur la plupart des distributions :","install.linux.deb":"<b>.deb</b> — Debian, Ubuntu, Mint et dérivées :","install.linux.tar":"<b>.tar.gz</b> — extrayez-le et lancez le binaire :","install.mac.t":"macOS (Intel et Apple Silicon)","install.mac.zip":"Décompressez le fichier et glissez <b>Panoraminal.app</b> dans <b>Applications</b>.","install.mac.note":"<b>Gatekeeper :</b> l’app n’est ni signée avec un Appl
