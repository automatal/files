e Developer ID ni notarisée, macOS bloque donc le premier lancement. Clic droit (ou Ctrl+clic) sur Panoraminal.app → <b>Ouvrir</b> → <b>Ouvrir</b>. Sur les versions récentes de macOS, passez par Réglages Système → Confidentialité et sécurité → <b>Ouvrir quand même</b>, ou lancez dans le Terminal :","install.req":"<b>Configuration :</b> un GPU compatible Vulkan, Metal, DirectX 12 ou OpenGL 3.3+ est recommandé. Les rendus logiciels fonctionnent aussi, mais lentement.","install.sha":"Chaque version contient un fichier <code>SHA256SUMS.txt</code> pour vérifier votre téléchargement.","install.get":"Télécharger","tour.title":"Visite de l’interface","tour.lead":"Survolez ou touchez les numéros pour voir le rôle de chaque partie de la fenêtre.","tour.1":"<b>Barre de menus</b> — {{menu.file}}, {{menu.edit}}, {{menu.layer}}, {{menu.view}} et {{menu.help}}.","tour.2":"<b>Outils</b> — {{tool.pen}}, {{tool.brush}}, {{tool.airbrush}}, {{tool.custom}}, {{tool.eraser}}, {{tool.eyedropper}} et {{tool.fill}}, avec les couleurs principale et secondaire en dessous.","tour.3":"<b>Boutons rapides</b> — annuler / rétablir, {{view.sphere}} / {{view.flat}}, {{menu.view.grid}}, {{action.toggle_theme}} et {{menu.help.help}}.","tour.4":"<b>Canevas</b> — peignez avec le bouton gauche ; faites glisser avec le bouton droit ou central pour regarder autour.","tour.5":"<b>{{panel.color}}</b> — sélecteur de couleur, code hexadécimal, {{color.palette}} et {{color.recent}}.","tour.6":"<b>{{help.group.brush}}</b> — {{brush.size}}, {{brush.opacity}}, {{brush.flow}}, {{brush.hardness}} et les options {{brush.advanced}}.","tour.7":"<b>{{panel.layers}}</b> — ajouter, dupliquer, fusionner et réordonner les calques ; {{layer.opacity}}, {{layer.blend}}, visibilité et {{layer.alpha_lock}}.","tour.8":"<b>Barre d’état</b> — outil et taille actifs, longitude / latitude du curseur, champ de vision, mémoire d’annulation, taille du document et carte graphique.","guide.title":"Tutoriel pas à pas","guide.lead":"Du premier trait à une image 360° prête à partager.","s1.t":"Regarder autour : vues sphère et plate","s1.p":"Panoraminal a deux vues. Dans la <b>{{view.sphere}}</b>, vous êtes au centre du panorama et peignez ce que vous voyez. La <b>{{view.flat}}</b> montre toute l’image d’un coup.","s1.l1":"[[V]] bascule entre les deux vues.","s1.l2":"Faites glisser avec le bouton droit ou central, ou [[Space]] + glisser, pour faire pivoter la vue ; les flèches du clavier aussi.","s1.l3":"La molette ou [[+]] / [[-]] zooment (champ de vision jusqu’à 120°) ; pincez sur les écrans tactiles.","s1.l4":"[[0]] réinitialise la vue, [[G]] affiche la grille, [[Tab]] masque l’interface et [[F11]] passe en plein écran.","s2.t":"Peindre : outils, couleurs et calques","s2.p":"Choisissez un outil dans la barre de gauche. Toutes les brosses peignent sur la sphère : les traits restent justes sur le raccord et près des pôles.","s2.l1":"[[[]] / [[]]] changent la {{brush.size}} ; [[{]] / [[}]] changent la {{brush.hardness}}.","s2.l2":"[[Shift]] + clic trace une ligne droite depuis le dernier trait — un grand cercle sur la sphère.","s2.l3":"[[Alt]] + clic prélève une couleur pendant que vous peignez ; [[X]] échange les couleurs principale et secondaire.","s2.l4":"{{brush.advanced}} : {{brush.spacing}}, {{brush.smoothing}}, {{brush.polar}} et pression du stylet ({{brush.pressure_size}} / {{brush.pressure_opacity}}).","s2.l5":"{{panel.layers}} : jusqu’à 64, avec {{layer.opacity}}, visibilité, réorganisation par glisser-déposer, {{layer.alpha_lock}} et 9 modes de fusion. [[Ctrl+Shift+N]] {{menu.layer.new}}, [[Ctrl+J]] {{menu.layer.duplicate}}, [[Ctrl+M]] {{menu.layer.merge_down}}.","s2.l6":"[[Ctrl+Z]] annule, [[Ctrl+Shift+Z]] / [[Ctrl+Y]] rétablissent.","s2.blends":"Modes de fusion","s3.t":"Brosses personnalisées et import .abr / .gbr / .gih","s3.p":"L’outil <b>{{tool.custom}}</b> ([[C]]) peint avec n’importe quelle brosse de votre bibliothèque.","s3.l1":"Importez via {{menu.file}} › {{menu.file.import_brushes}} ([[Ctrl+Shift+B]]) ou déposez les fichiers sur la fenêtre : <code>.abr</code> de Photoshop (v1/v2 et v6+), <code>.gbr</code> / <code>.gih</code> de GIMP, ou n’importe quelle image PNG / JPEG / WebP comme pointe.","s3.l2":"La bibliothèque propose miniatures, trait d’aperçu en direct, renommage, catégories, {{brushlib.favorites}} et recherche.","s3.l3":"{{brushlib.dynamics}} : {{brush.spacing}}, {{brushlib.angle}}, {{brushlib.roundness}}, variation de taille / angle / rondeur, {{brushlib.scatter}}, {{brushlib.count}}, variation d’opacité / de flux, retournements aléatoires et pression du stylet.","s3.l4":"Les fonctions de Photoshop sans équivalent pour l’instant (double brosse, texture, bords humides, bruit…) sont ignorées et listées dans un avis sur la brosse.","s3.l5":"{{settings.embed_brushes}} : {{settings.embed_brushes_tip}}","s4.t":"Insérer des images dans la scène","s4.p":"Ajoutez une photo, un logo ou une texture au panorama. Elle flotte au-dessus de la scène comme un objet non destructif jusqu’à la fusion.","s4.l1":"{{menu.file}} › {{menu.file.insert_image}} ([[Ctrl+Shift+I]]), glissez-déposez un fichier sur la fenêtre, ou collez depuis le presse-papiers ([[Ctrl+Shift+V]]).","s4.modes":"Deux projections","s5.t":"Transformer : déplacer, mettre à l’échelle, pivoter","s5.p":"Tant que l’image flotte, les poignées du canevas fonctionnent dans les deux vues :","s5.l1":"Faites glisser l’intérieur de l’image pour la déplacer ; un coin pour la redimensionner (maintenez [[Shift]] pour une échelle libre) ; la poignée ronde la fait pivoter ([[Shift]] : pas de 15°).","s5.l2":"Dans le panneau latéral : {{place.size}}, {{place.rotation}}, {{place.opacity}}, {{place.flip_h}} et {{place.flip_v}}.","s5.l3":"[[Enter]] — <b>{{place.merge}}</b> : {{place.merge.desc}}","s5.l4":"<b>{{place.as_layer}}</b> la place plutôt sur un nouveau calque ; [[Esc]] annule, et annuler / rétablir fonctionnent pendant le placement.","s6.t":"Déformer : épingles d’angle (D) et maillage (W)","s6.p":"{{place.distort.desc}} Pour les murs et autres surfaces planes, utilisez la projection <b>{{place.mode.persistent}}</b> en regardant le mur.","s6.l1":"Appuyez sur [[D]] pendant le placement d’une image : quatre épingles apparaissent aux coins. Faites glisser chacune sur un coin du mur, de l’écran ou du sol.","s6.l2":"<b>{{place.distort.perspective}}</b> — {{place.distort.perspective.desc}}","s6.l3":"[[Shift]] verrouille un axe pendant le glissement ; glissez à l’intérieur pour déplacer toute la forme ; [[D]] revient à la transformation.","s6.l4":"<b>{{place.distort.numeric}}</b> — saisissez des positions exactes pour {{place.pin.tl}}, {{place.pin.tr}}, {{place.pin.br}} et {{place.pin.bl}}.","s6.l5":"[[W]] — <b>{{place.distort.warp}}</b> : {{place.distort.warp.desc}}","s6.l6":"{{place.distort.reset}} / {{place.distort.reset_warp}} recommencent. Les épingles qui se croisent ou replient l’image sont refusées et la dernière forme valide est conservée.","s6.l7":"La déformation fait partie de l’annulation du placement et est conservée lors du déplacement, de la mise à l’échelle, de la rotation et du changement de projection. [[Enter]] la fusionne.","s7.t":"Enregistrer, ouvrir et exporter","s7.l1":"[[Ctrl+N]] {{menu.file.new}} — choisissez un préréglage 2:1, de {{new.preset.small}} (2048 × 1024) à {{new.preset.huge}} (8192 × 4096), et un fond.","s7.l2":"[[Ctrl+S]] / [[Ctrl+Shift+S]] enregistrent un projet <code>.pano</code> : un ZIP avec chaque calque en PNG, un manifeste JSON et un aperçu.","s7.l3":"[[Ctrl+O]] ouvre les projets <code>.pano</code>, les images (PNG, JPEG, WebP, BMP, TIFF) et les anciens projets Paint360 (<code>.p360.json</code>) ; [[Ctrl+I]] {{menu.file.import}}","s7.l4":"Les sauvegardes automatiques et la récupération après plantage protègent votre travail, et Panoraminal demande confirmation avant de fermer avec des modifications non enregistrées.","s7.l5":"[[Ctrl+Shift+E]] <b>{{menu.file.export_jpg}}</b> — {{export.desc}} Laissez <b>{{export.gpano}}</b> activé.","s7.l6":"[[Ctrl+E]] <b>{{menu.file.export_png}}</b> — une image plate classique.","s7.l7":"{{menu.edit}} › <b>{{menu.edit.offset}}</b> — {{offset.desc}} {{menu.edit}} › {{menu.edit.flip}} met le panorama en miroir.","s8.t":"Paramètres : thème, animations et langue","s8.p":"Ouvrez {{menu.file}} › {{menu.file.settings}} ([[Ctrl+,]]).","s8.l1":"<b>{{settings.theme}}</b> : {{settings.theme.dark}}, {{settings.theme.light}} ou {{settings.theme.system}} — le bouton de la barre du haut bascule rapidement.","s8.l2":"<b>{{settings.glow}}</b> : {{settings.glow.full}}, {{settings.glow.reduced}} ou {{settings.glow.off}}.","s8.l3":"<b>{{settings.animations}}</b> : {{settings.anim.auto}}, {{settings.anim.on}} ou {{settings.anim.off}}. {{settings.anim_tip}}","s8.l4":"<b>{{settings.language}}</b> : 8 langues, changées instantanément ; {{settings.language.auto}} suit le système.","s8.l5":"Aussi : {{settings.ui_scale}}, {{settings.splash}}, {{settings.autosave}}, {{settings.undo_memory}}, {{settings.zoom_speed}}, {{settings.pen_pressure}} et {{settings.invert_drag}}.","s8.l6":"[[F1]] ouvre <b>{{menu.help.help}}</b> (raccourcis, outils et astuces 360°) ; {{menu.help}} › {{menu.help.about}} contient les liens vers le site, le code source et les dons.","tips":"Astuces de l’application","cap.light":"{{settings.theme.light}} · Português","cap.brushes":"Bibliothèque de brosses","cap.distort":"Épingles aux coins d’un mur ({{place.mode.persistent}})","cap.merged":"Fusionnée sur le mur","cap.distort_flat":"Épingles dans la {{view.flat}}","cap.before":"Épingles","cap.after":"Fusionnée","keys.title":"Raccourcis clavier","keys.empty":"Aucun raccourci ne correspond.","faq.title":"FAQ et limites connues","faq.q1":"Quelle taille pour mon panorama ?","faq.a1":"{{help.tip.4}} Les documents vont jusqu’à 8192 × 4096 pixels, avec jusqu’à 64 calques.","faq.q2":"Comment le publier sur Facebook ou Google Photos ?","faq.a2":"Utilisez {{menu.file.export_jpg}} avec <b>{{export.gpano}}</b> activé : les métadonnées GPano font afficher l’image comme une photo 360° interactive.","faq.q3":"La pression de mon stylet ne fonctionne pas.","faq.a3":"La pression vient du système d’exploitation. Elle fonctionne avec les stylets Windows Ink / pointer et les appareils à force tactile ; les pilotes uniquement Wintab et de nombreuses tablettes sous X11 / Wayland ne la transmettent pas encore — les traits utilisent alors la pression maximale.","faq.q4":"Ma brosse .abr est différente.","faq.a4":"Les pointes échantillonnées et calculées et les préréglages courants sont lus. Double brosse, texture, pointes à poils / érodables, dynamique de couleur, bords humides et bruit n’ont pas encore d’équivalent et sont listés dans un avis sur la brosse ; les pointes en couleur servent de masques. L’importateur a été testé avec des fichiers synthétisés — ouvrez une issue pour tout .abr qui ne se charge pas.","faq.q5":"La déformation fonctionne-t-elle en mode {{place.mode.wrap}} ?","faq.a5":"Oui, mais la perspective n’est qu’approximative pour les grandes images — utilisez {{place.mode.persistent}} pour les murs. Le maillage est une grille fixe 4×4, l’aperçu en direct utilise au plus 2048 px (la fusion utilise l’image complète) et les images placées sont limitées à 4096 px sur le plus grand côté.","faq.q6":"C’est lent ou ça ne démarre pas.","faq.a6":"Avec un rendu logiciel (llvmpipe, WARP), les grands documents sont lents. Au démarrage, Panoraminal change de backend automatiquement (DirectX 12 → Vulkan → OpenGL sous Windows, Vulkan → OpenGL sous Linux). Pour en forcer un, définissez <code>WGPU_BACKEND</code> sur <code>vulkan</code>, <code>dx12</code>, <code>gl</code> ou <code>metal</code>.","faq.q7":"macOS dit que l’app ne peut pas être ouverte.","faq.a7":"La version macOS n’est ni signée avec un Developer ID ni notarisée — suivez la note Gatekeeper de la section installation.","faq.q8":"Est-ce gratuit ?","faq.a8":"{{about.license}} Le code source est sur GitHub. Si Panoraminal vous est utile, pensez à faire un don.","foot.cta.t":"Vous aimez Panoraminal ?","foot.cta.p":"Panoraminal est libre et open source. Un don l’aide à continuer de grandir.","foot.made":"Créé par cleitinhodev / bugzinho · licence MIT","foot.releases":"Versions"},"de":{"meta.title":"Panoraminal — Tutorial","meta.desc":"Lerne, 360°-Panoramen mit Panoraminal zu malen: Installation, Oberfläche, Pinsel, Ebenen, Bilder einfügen, Verzerren und 360°-Export.","nav.what":"360°?","nav.install":"Installieren","nav.tour":"Oberfläche","nav.guide":"Tutorial","nav.keys":"Tastenkürzel","nav.faq":"FAQ","ui.menu":"Menü","ui.top":"Nach oben","ui.close":"Schließen","ui.copy":"Kopieren","ui.copied":"Kopiert!","ui.zoom":"Zum Vergrößern klicken","ui.compare":"Regler ziehen zum Vergleichen","ui.filter":"Tastenkürzel filtern…","ui.step":"Schritt {n}","hero.kicker":"Offizielles Tutorial · Version {v}","hero.download":"v{v} herunterladen","hero.releases":"Alle Versionen","hero.drag":"Ziehen, um sich umzusehen","hero.s1":"8 Sprachen","hero.s2":"bis zu 64 Ebenen","hero.s3":"frei & quelloffen","what.title":"Was ist ein 360°-Panorama?","what.p1":"Ein 360°-Panorama ist ein Bild von allem rund um einen Punkt: vorne, hinten, beide Seiten, Himmel und Boden. Es wird als flaches Bild gespeichert, das doppelt so breit wie hoch ist (2:1) — die <b>equirektangulare</b> Projektion, wie eine Weltkarte.","what.p2":"Betrachter wie Facebook, Google Fotos und VR-Brillen legen dieses Bild als Kugel um dich herum. Direkt auf dem flachen Bild zu malen ist schwierig: Linien biegen sich, linker und rechter Rand müssen zusammenpassen und die Pole werden gestreckt.","what.p3":"Panoraminal stellt dich <b>in die Kugel</b>: Du schaust dich um und malst, was du siehst, und jeder Strich wird mit der richtigen Verzerrung auf das equirektangulare Bild zurückprojiziert — gerade Linien, unsichtbare Naht und saubere Pole.","what.seam":"Linker und rechter Rand sind derselbe Ort: Das Bild läuft rundherum.","install.title":"Installation","install.lead":"Wähle die Datei für dein System. Version {v} ist die aktuelle stabile Version; alle Dateien findest du auch auf der Release-Seite.","install.win.t":"Windows 10 / 11 (x64)","install.win.setup":"<b>Installer</b> — führe die Datei unten aus. Er legt Verknüpfungen im Startmenü und auf dem Desktop an und öffnet <code>.pano</code>-Dateien mit Panoraminal.","install.win.portable":"<b>Portabel</b> — entpacke das Zip an einen beliebigen Ort und starte <code>panoraminal.exe</code>. Es wird nichts installiert.","install.win.note":"Die Dateien sind nicht signiert, daher kann Windows SmartScreen beim ersten Start warnen: Klicke auf <b>Weitere Informationen</b> → <b>Trotzdem ausführen</b>.","install.linux.t":"Linux (x86_64)","install.linux.appimage":"<b>AppImage</b> — läuft auf den meisten Distributionen:","install.linux.deb":"<b>.deb</b> — Debian, Ubuntu, Mint und Derivate:","install.linux.tar":"<b>.tar.gz</b> — entpacken und das Programm starten:","install.mac.t":"macOS (Intel und Apple Silicon)","install.mac.zip":"Entpacke die Datei und ziehe <b>Panoraminal.app</b> in <b>Programme</b>.","install.mac.note":"<b>Gatekeeper:</b> Die App ist weder mit einer Apple Developer ID signiert noch notarisiert, daher blockiert macOS den ersten Start. Rechtsklick (oder Ctrl-Klick) auf Panoraminal.app → <b>Öffnen</b> → <b>Öffnen</b>. Unter neueren macOS-Versionen: Systemeinstellungen → Datenschutz &amp; Sicherheit → <b>Dennoch öffnen</b>, oder im Terminal:","install.req":"<b>Voraussetzungen:</b> Empfohlen wird eine GPU mit Vulkan, Metal, DirectX 12 oder OpenGL 3.3+. Software-Renderer funktionieren auch, nur langsam.","install.sha":"Jede Version enthält eine <code>SHA256SUMS.txt</code>, um den Download zu prüfen.","install.get":"Herunterladen","tour.title":"Rundgang durch die Oberfläche","tour.lead":"Fahre über die Nummern oder tippe sie an, um zu sehen, was jeder Bereich des Fensters macht.","tour.1":"<b>Menüleiste</b> — {{menu.file}}, {{menu.edit}}, {{menu.layer}}, {{menu.view}} und {{menu.help}}.","tour.2":"<b>Werkzeuge</b> — {{tool.pen}}, {{tool.brush}}, {{tool.airbrush}}, {{tool.custom}}, {{tool.eraser}}, {{tool.eyedropper}} und {{tool.fill}}, darunter Primär- und Sekundärfarbe.","tour.3":"<b>Schnellknöpfe</b> — Rückgängig / Wiederholen, {{view.sphere}} / {{view.flat}}, {{menu.view.grid}}, {{action.toggle_theme}} und {{menu.help.help}}.","tour.4":"<b>Leinwand</b> — mit der linken Taste malen; mit der rechten oder mittleren Taste ziehen, um sich umzusehen.","tour.5":"<b>{{panel.color}}</b> — Farbwähler, Hex-Code, {{color.palette}} und {{color.recent}}.","tour.6":"<b>{{help.group.brush}}</b> — {{brush.size}}, {{brush.opacity}}, {{brush.flow}}, {{brush.hardness}} und die Optionen unter {{brush.advanced}}.","tour.7":"<b>{{panel.layers}}</b> — Ebenen hinzufügen, duplizieren, zusammenführen und umsortieren; {{layer.opacity}}, {{layer.blend}}, Sichtbarkeit und {{layer.alpha_lock}}.","tour.8":"<b>Statusleiste</b> — aktives Werkzeug und Größe, Länge / Breite des Cursors, Sichtfeld, Rückgängig-Speicher, Dokumentgröße und Grafikadapter.","guide.title":"Schritt-für-Schritt-Tutorial","guide.lead":"Vom ersten Strich bis zum fertigen 360°-Bild zum Teilen.","s1.t":"Umsehen: Kugel- und Flachansicht","s1.p":"Panoraminal hat zwei Ansichten. In der <b>{{view.sphere}}</b> stehst du in der Mitte des Panoramas und malst auf das, was du siehst. Die <b>{{view.flat}}</b> zeigt das ganze Bild auf einmal.","s1.l1":"[[V]] wechselt zwischen den beiden Ansichten.","s1.l2":"Mit der rechten oder mittleren Taste ziehen, oder [[Space]] + Ziehen, dreht die Ansicht; die Pfeiltasten gehen auch.","s1.l3":"Mausrad oder [[+]] / [[-]] zoomen (Sichtfeld bis 120°); auf Touchscreens mit zwei Fingern zoomen.","s1.l4":"[[0]] setzt die Ansicht zurück, [[G]] zeigt das Raster, [[Tab]] blendet die Oberfläche aus und [[F11]] schaltet Vollbild um.","s2.t":"Malen: Werkzeuge, Farben und Ebenen","s2.p":"Wähle ein Werkzeug in der linken Leiste. Alle Pinsel malen auf der Kugel, daher bleiben Striche an der Naht und an den Polen korrekt.","s2.l1":"[[[]] / [[]]] ändern die {{brush.size}}; [[{]] / [[}]] ändern die {{brush.hardness}}.","s2.l2":"[[Shift]] + Klick zeichnet eine gerade Linie vom letzten Strich aus — einen Großkreis auf der Kugel.","s2.l3":"[[Alt]] + Klick nimmt beim Malen eine Farbe auf; [[X]] tauscht Primär- und Sekundärfarbe.","s2.l4":"{{brush.advanced}}: {{brush.spacing}}, {{brush.smoothing}}, {{brush.polar}} und Stiftdruck ({{brush.pressure_size}} / {{brush.pressure_opacity}}).","s2.l5":"{{panel.layers}}: bis zu 64, mit {{layer.opacity}}, Sichtbarkeit, Umsortieren per Drag &amp; Drop, {{layer.alpha_lock}} und 9 Mischmodi. [[Ctrl+Shift+N]] {{menu.layer.new}}, [[Ctrl+J]] {{menu.layer.duplicate}}, [[Ctrl+M]] {{menu.layer.merge_down}}.","s2.l6":"[[Ctrl+Z]] macht rückgängig, [[Ctrl+Shift+Z]] / [[Ctrl+Y]] wiederholen.","s2.blends":"Mischmodi","s3.t":"Eigene Pinsel und Import von .abr / .gbr / .gih","s3.p":"Das Werkzeug <b>{{tool.custom}}</b> ([[C]]) malt mit jedem Pinsel aus deiner Bibliothek.","s3.l1":"Importiere über {{menu.file}} › {{menu.file.import_brushes}} ([[Ctrl+Shift+B]]) oder ziehe die Dateien ins Fenster: Photoshop-<code>.abr</code> (v1/v2 und v6+), GIMP-<code>.gbr</code> / <code>.gih</code> oder ein beliebiges PNG- / JPEG- / WebP-Bild als Spitze.","s3.l2":"Die Bibliothek bietet Vorschaubilder, einen Live-Vorschaustrich, Umbenennen, Kategorien, {{brushlib.favorites}} und Suche.","s3.l3":"{{brushlib.dynamics}}: {{brush.spacing}}, {{brushlib.angle}}, {{brushlib.roundness}}, Größen- / Winkel- / Rundungsstreuung, {{brushlib.scatter}}, {{brushlib.count}}, Deckkraft- / Flussstreuung, zufälliges Spiegeln und Stiftdruck.","s3.l4":"Photoshop-Funktionen ohne Entsprechung (Dualer Pinsel, Struktur, Nasse Kanten, Rauschen …) werden übersprungen und in einem Hinweis am Pinsel aufgelistet.","s3.l5":"{{settings.embed_brushes}}: {{settings.embed_brushes_tip}}","s4.t":"Bilder in die Szene einfügen","s4.p":"Hol ein Foto, ein Logo oder eine Textur ins Panorama. Es schwebt als nicht-destruktives Objekt über der Szene, bis du es zusammenführst.","s4.l1":"{{menu.file}} › {{menu.file.insert_image}} ([[Ctrl+Shift+I]]), eine Datei ins Fenster ziehen oder aus der Zwischenablage einfügen ([[Ctrl+Shift+V]]).","s4.modes":"Zwei Projektionen","s5.t":"Transformieren: verschieben, skalieren, drehen","s5.p":"Solange das Bild schwebt, funktionieren die Griffe auf der Leinwand in beiden Ansichten:","s5.l1":"Innen ziehen verschiebt das Bild; eine Ecke ziehen skaliert es (mit [[Shift]] frei); der runde Knopf dreht es ([[Shift]]: 15°-Schritte).","s5.l2":"In der Seitenleiste: {{place.size}}, {{place.rotation}}, {{place.opacity}}, {{place.flip_h}} und {{place.flip_v}}.","s5.l3":"[[Enter]] — <b>{{place.merge}}</b>: {{place.merge.desc}}","s5.l4":"<b>{{place.as_layer}}</b> legt es stattdessen auf eine neue Ebene; [[Esc]] bricht ab, und Rückgängig / Wiederholen funktionieren beim Platzieren.","s6.t":"Verzerren: Eckpins (D) und Gitter (W)","s6.p":"{{place.distort.desc}} Für Wände und andere ebene Flächen nutze die Projektion <b>{{place.mode.persistent}}</b> mit Blick auf die Wand.","s6.l1":"Drücke beim Platzieren eines Bildes [[D]]: An den Ecken erscheinen vier Pins. Ziehe jeden auf eine Ecke der Wand, des Bildschirms oder des Bodens.","s6.l2":"<b>{{place.distort.perspective}}</b> — {{place.distort.perspective.desc}}","s6.l3":"[[Shift]] sperrt beim Ziehen eine Achse; innen ziehen verschiebt die ganze Form; [[D]] kehrt zur Transformation zurück.","s6.l4":"<b>{{place.distort.numeric}}</b> — exakte Positionen für {{place.pin.tl}}, {{place.pin.tr}}, {{place.pin.br}} und {{place.pin.bl}} eintippen.","s6.l5":"[[W]] — <b>{{place.distort.warp}}</b>: {{place.distort.warp.desc}}","s6.l6":"{{place.distort.reset}} / {{place.distort.reset_warp}} fangen neu an. Pins, die sich kreuzen oder das Bild falten, werden abgelehnt; die letzte gültige Form bleibt erhalten.","s6.l7":"Die Verzerrung gehört zum Rückgängig der Platzierung und bleibt beim Verschieben, Skalieren, Drehen und Wechseln der Projektion erhalten. [[Enter]] führt sie zusammen.","s7.t":"Speichern, öffnen und exportieren","s7.l1":"[[Ctrl+N]] {{menu.file.new}} — wähle eine 2:1-Vorgabe von {{new.preset.small}} (2048 × 1024) bis {{new.preset.huge}} (8192 × 4096) und einen Hintergrund.","s7.l2":"[[Ctrl+S]] / [[Ctrl+Shift+S]] speichern ein <code>.pano</code>-Projekt: ein ZIP mit jeder Ebene als PNG, einem JSON-Manifest und einer Vorschau.","s7.l3":"[[Ctrl+O]] öffnet <code>.pano</code>-Projekte, Bilder (PNG, JPEG, WebP, BMP, TIFF) und alte Paint360-Projekte (<code>.p360.json</code>); [[Ctrl+I]] {{menu.file.import}}","s7.l4":"Automatische Sicherungen und Absturz-Wiederherstellung schützen deine Arbeit, und Panoraminal fragt vor dem Schließen mit ungespeicherten Änderungen nach.","s7.l5":"[[Ctrl+Shift+E]] <b>{{menu.file.export_jpg}}</b> — {{export.desc}} Lass <b>{{export.gpano}}</b> eingeschaltet.","s7.l6":"[[Ctrl+E]] <b>{{menu.file.export_png}}</b> — ein normales flaches Bild.","s7.l7":"{{menu.edit}} › <b>{{menu.edit.offset}}</b> — {{offset.desc}} {{menu.edit}} › {{menu.edit.flip}} spiegelt das Panorama.","s8.t":"Einstellungen: Design, Animationen und Sprache","s8.p":"Öffne {{menu.file}} › {{menu.file.settings}} ([[Ctrl+,]]).","s8.l1":"<b>{{settings.theme}}</b>: {{settings.theme.dark}}, {{settings.theme.light}} oder {{settings.theme.system}} — der Knopf in der oberen Leiste wechselt schnell.","s8.l2":"<b>{{settings.glow}}</b>: {{settings.glow.full}}, {{settings.glow.reduced}} oder {{settings.glow.off}}.","s8.l3":"<b>{{settings.animations}}</b>: {{settings.anim.auto}}, {{settings.anim.on}} oder {{settings.anim.off}}. {{settings.anim_tip}}","s8.l4":"<b>{{settings.language}}</b>: 8 Sprachen, sofort umschaltbar; {{settings.language.auto}} folgt dem System.","s8.l5":"Außerdem: {{settings.ui_scale}}, {{settings.splash}}, {{settings.autosave}}, {{settings.undo_memory}}, {{settings.zoom_speed}}, {{settings.pen_pressure}} und {{settings.invert_drag}}.","s8.l6":"[[F1]] öffnet <b>{{menu.help.help}}</b> (Tastenkürzel, Werkzeuge und 360°-Tipps); {{menu.help}} › {{menu.help.about}} enthält die Links zur Website, zum Quellcode und zu Spenden.","tips":"Tipps aus dem Programm","cap.light":"{{settings.theme.light}} · Português","cap.brushes":"Pinselbibliothek","cap.distort":"Eckpins an einer Zimmerwand ({{place.mode.persistent}})","cap.merged":"Auf die Wand zusammengeführt","cap.distort_flat":"Eckpins in der {{view.flat}}","cap.before":"Pins","cap.after":"Zusammengeführt","keys.title":"Tastenkürzel","keys.empty":"Kein Tastenkürzel gefunden.","faq.title":"FAQ und bekannte Einschränkungen","faq.q1":"Wie groß sollte mein Panorama sein?","faq.a1":"{{help.tip.4}} Dokumente können bis zu 8192 × 4096 Pixel groß sein, mit bis zu 64 Ebenen.","faq.q2":"Wie veröffentliche ich es auf Facebook oder Google Fotos?","faq.a2":"Nutze {{menu.file.export_jpg}} mit aktiviertem <b>{{export.gpano}}</b>: Die GPano-Metadaten sorgen dafür, dass diese Seiten das Bild als interaktives 360°-Foto zeigen.","faq.q3":"Mein Stiftdruck funktioniert nicht.","faq.a3":"Der Druck kommt vom Betriebssystem. Er funktioniert mit Windows-Ink- / Pointer-Stiften und Geräten mit Touch-Kraft; reine Wintab-Treiber und viele Tablets unter X11 / Wayland melden noch keinen Druck — Striche nutzen dann vollen Druck.","faq.q4":"Mein .abr-Pinsel sieht anders aus.","faq.a4":"Gelesen werden gesampelte und berechnete Spitzen sowie die üblichen Vorgaben. Dualer Pinsel, Struktur, Borsten- / Erodierende Spitzen, Farbeinstellungen, Nasse Kanten und Rauschen haben noch keine Entsprechung und werden in einem Hinweis am Pinsel aufgelistet; Farbspitzen werden als Masken verwendet. Der Importer wurde mit synthetischen Dateien getestet — bitte öffne ein Issue für jede .abr, die nicht lädt.","faq.q5":"Funktioniert Verzerren im Modus {{place.mode.wrap}}?","faq.a5":"Ja, aber bei großen Bildern ist die Perspektive nur näherungsweise korrekt — nutze {{place.mode.persistent}} für Wände. Das Gitter ist fest 4×4, die Live-Vorschau nutzt höchstens 2048 px (das Zusammenführen nutzt das volle Bild), und platzierte Bilder sind auf 4096 px an der längsten Seite begrenzt.","faq.q6":"Es ist langsam oder startet nicht.","faq.a6":"Mit einem Software-Renderer (llvmpipe, WARP) sind große Dokumente langsam. Beim Start wechselt Panoraminal automatisch das Backend (DirectX 12 → Vulkan → OpenGL unter Windows, Vulkan → OpenGL unter Linux). Um eines zu erzwingen, setze <code>WGPU_BACKEND</code> auf <code>vulkan</code>, <code>dx12</code>, <code>gl</code> oder <code>metal</code>.","faq.q7":"macOS sagt, die App kann nicht geöffnet werden.","faq.a7":"Die macOS-Version ist weder mit einer Developer ID signiert noch notarisiert — folge dem Gatekeeper-Hinweis im Abschnitt Installation.","faq.q8":"Ist es kostenlos?","faq.a8":"{{about.license}} Der Quellcode liegt auf GitHub. Wenn dir Panoraminal hilft, denk über eine Spende nach.","foot.cta.t":"Gefällt dir Panoraminal?","foot.cta.p":"Panoraminal ist frei und quelloffen. Eine Spende hilft, dass es weiter wächst.","foot.made":"Erstellt von cleitinhodev / bugzinho · MIT-Lizenz","foot.releases":"Versionen"},"it":{"meta.title":"Panoraminal — Tutorial","meta.desc":"Impara a dipingere panorami a 360° con Panoraminal: installazione, interfaccia, pennelli, livelli, inserimento di immagini, distorsione ed esportazione 360°.","nav.what":"360°?","nav.install":"Installa","nav.tour":"Interfaccia","nav.guide":"Tutorial","nav.keys":"Scorciatoie","nav.faq":"FAQ","ui.menu":"Menu","ui.top":"Torna su","ui.close":"Chiudi","ui.copy":"Copia","ui.copied":"Copiato!","ui.zoom":"Clicca per ingrandire","ui.compare":"Trascina il cursore per confrontare","ui.filter":"Filtra scorciatoie…","ui.step":"Passo {n}","hero.kicker":"Tutorial ufficiale · versione {v}","hero.download":"Scarica v{v}","hero.releases":"Tutte le versioni","hero.drag":"Trascina per guardarti intorno","hero.s1":"8 lingue","hero.s2":"fino a 64 livelli","hero.s3":"libero e open source","what.title":"Che cos’è un panorama a 360°?","what.p1":"Un panorama a 360° è un’immagine di tutto ciò che circonda un punto: davanti, dietro, entrambi i lati, il cielo e il pavimento. Viene salvato come un’immagine piatta larga il doppio dell’altezza (2:1) — la proiezione <b>equirettangolare</b>, come un planisfero.","what.p2":"Visualizzatori come Facebook, Google Foto e i visori VR avvolgono l’immagine su una sfera intorno a te. Dipingere direttamente sull’immagine piatta è difficile: le linee si curvano, i bordi sinistro e destro devono combaciare e i poli si allungano.","what.p3":"Panoraminal ti mette <b>dentro la sfera</b>: ti guardi intorno e dipingi ciò che vedi, e ogni pennellata viene riproiettata sull’immagine equirettangolare con la distorsione corretta — linee dritte, giunzione invisibile e poli sotto controllo.","what.seam":"I bordi sinistro e destro sono lo stesso punto: l’immagine fa il giro.","install.title":"Installazione","install.lead":"Scegli il file per il tuo sistema. La versione {v} è l’attuale versione stabile; tutti i file sono anche nella pagina delle versioni.","install.win.t":"Windows 10 / 11 (x64)","install.win.setup":"<b>Programma di installazione</b> — esegui il file qui sotto. Crea collegamenti nel menu Start e sul desktop e apre i file <code>.pano</code> con Panoraminal.","install.win.portable":"<b>Portatile</b> — estrai lo zip dove vuoi ed esegui <code>panoraminal.exe</code>. Non viene installato nulla.","install.win.note":"I file non sono firmati digitalmente, quindi Windows SmartScreen può avvisare al primo avvio: fai clic su <b>Ulteriori informazioni</b> → <b>Esegui comunque</b>.","install.linux.t":"Linux (x86_64)","install.linux.appimage":"<b>AppImage</b> — funziona sulla maggior parte delle distribuzioni:","install.linux.deb":"<b>.deb</b> — Debian, Ubuntu, Mint e derivate:","install.linux.tar":"<b>.tar.gz</b> — estrailo ed esegui il binario:","install.mac.t":"macOS (Intel e Apple Silicon)","install.mac.zip":"Decomprimi il file e trascina <b>Panoraminal.app</b> in <b>Applicazioni</b>.","install.mac.note":"<b>Gatekeeper:</b> l’app non è firmata con un Apple Developer ID né notarizzata, quindi macOS blocca il primo avvio. Clic destro (o Ctrl+clic) su Panoraminal.app → <b>Apri</b> → <b>Apri</b>. Nelle versioni recenti di macOS usa Impostazioni di Sistema → Privacy e sicurezza → <b>Apri comunque</b>, oppure esegui nel Terminale:","install.req":"<b>Requisiti:</b> è consigliata una GPU con Vulkan, Metal, DirectX 12 o OpenGL 3.3+. Anche i renderer software funzionano, ma lentamente.","install.sha":"Ogni versione include un file <code>SHA256SUMS.txt</code> per verificare il download.","install.get":"Scarica","tour.title":"Tour dell’interfaccia","tour.lead":"Passa il mouse o tocca i numeri per vedere a cosa serve ogni parte della finestra.","tour.1":"<b>Barra dei menu</b> — {{menu.file}}, {{menu.edit}}, {{menu.layer}}, {{menu.view}} e {{menu.help}}.","tour.2":"<b>Strumenti</b> — {{tool.pen}}, {{tool.brush}}, {{tool.airbrush}}, {{tool.custom}}, {{tool.eraser}}, {{tool.eyedropper}} e {{tool.fill}}, con i colori primario e secondario sotto.","tour.3":"<b>Pulsanti rapidi</b> — annulla / ripeti, {{view.sphere}} / {{view.flat}}, {{menu.view.grid}}, {{action.toggle_theme}} e {{menu.help.help}}.","tour.4":"<b>Tela</b> — dipingi con il tasto sinistro; trascina con il tasto destro o centrale per guardarti intorno.","tour.5":"<b>{{panel.color}}</b> — selettore colore, codice esadecimale, {{color.palette}} e {{color.recent}}.","tour.6":"<b>{{help.group.brush}}</b> — {{brush.size}}, {{brush.opacity}}, {{brush.flow}}, {{brush.hardness}} e le opzioni {{brush.advanced}}.","tour.7":"<b>{{panel.layers}}</b> — aggiungi, duplica, unisci e riordina i livelli; {{layer.opacity}}, {{layer.blend}}, visibilità e {{layer.alpha_lock}}.","tour.8":"<b>Barra di stato</b> — strumento e dimensione attivi, longitudine / latitudine del cursore, campo visivo, memoria di annullamento, dimensione del documento e scheda grafica.","guide.title":"Tutorial passo passo","guide.lead":"Dalla prima pennellata a un’immagine 360° pronta da condividere.","s1.t":"Guardati intorno: vista sfera e vista piatta","s1.p":"Panoraminal ha due viste. Nella <b>{{view.sphere}}</b> stai al centro del panorama e dipingi ciò che vedi. La <b>{{view.flat}}</b> mostra l’intera immagine in una volta.","s1.l1":"[[V]] passa da una vista all’altra.","s1.l2":"Trascina con il tasto destro o centrale, o [[Space]] + trascina, per ruotare la vista; funzionano anche i tasti freccia.","s1.l3":"La rotella o [[+]] / [[-]] eseguono lo zoom (campo visivo fino a 120°); pizzica sugli schermi touch.","s1.l4":"[[0]] reimposta la vista, [[G]] mostra la griglia, [[Tab]] nasconde l’interfaccia e [[F11]] attiva lo schermo intero.","s2.t":"Dipingi: strumenti, colori e livelli","s2.p":"Scegli uno strumento nella barra a sinistra. Tutti i pennelli dipingono sulla sfera, quindi i tratti restano corretti sulla giunzione e vicino ai poli.","s2.l1":"[[[]] / [[]]] cambiano la {{brush.size}}; [[{]] / [[}]] cambiano la {{brush.hardness}}.","s2.l2":"[[Shift]] + clic traccia una linea retta dall’ultimo tratto — un cerchio massimo sulla sfera.","s2.l3":"[[Alt]] + clic preleva un colore mentre dipingi; [[X]] scambia i colori primario e secondario.","s2.l4":"{{brush.advanced}}: {{brush.spacing}}, {{brush.smoothing}}, {{brush.polar}} e pressione della penna ({{brush.pressure_size}} / {{brush.pressure_opacity}}).","s2.l5":"{{panel.layers}}: fino a 64, con {{layer.opacity}}, visibilità, riordino trascinando, {{layer.alpha_lock}} e 9 metodi di fusione. [[Ctrl+Shift+N]] {{menu.layer.new}}, [[Ctrl+J]] {{menu.layer.duplicate}}, [[Ctrl+M]] {{menu.layer.merge_down}}.","s2.l6":"[[Ctrl+Z]] annulla, [[Ctrl+Shift+Z]] / [[Ctrl+Y]] ripetono.","s2.blends":"Metodi di fusione","s3.t":"Pennelli personalizzati e importazione .abr / .gbr / .gih","s3.p":"Lo strumento <b>{{tool.custom}}</b> ([[C]]) dipinge con qualsiasi pennello della tua libreria.","s3.l1":"Importa da {{menu.file}} › {{menu.file.import_brushes}} ([[Ctrl+Shift+B]]) o trascina i file nella finestra: <code>.abr</code> di Photoshop (v1/v2 e v6+), <code>.gbr</code> / <code>.gih</code> di GIMP, o qualsiasi immagine PNG / JPEG / WebP come punta.","s3.l2":"La libreria ha miniature, un tratto di anteprima dal vivo, rinomina, categorie, {{brushlib.favorites}} e ricerca.","s3.l3":"{{brushlib.dynamics}}: {{brush.spacing}}, {{brushlib.angle}}, {{brushlib.roundness}}, variazione di dimensione / angolo / rotondità, {{brushlib.scatter}}, {{brushlib.count}}, variazione di opacità / flusso, capovolgimenti casuali e pressione della penna.","s3.l4":"Le funzioni di Photoshop ancora senza equivalente (pennello doppio, texture, bordi bagnati, disturbo…) vengono saltate ed elencate in un avviso sul pennello.","s3.l5":"{{settings.embed_brushes}}: {{settings.embed_brushes_tip}}","s4.t":"Inserisci immagini nella scena","s4.p":"Porta una foto, un logo o una texture nel panorama. Galleggia sopra la scena come oggetto non distruttivo finché non la unisci.","s4.l1":"{{menu.file}} › {{menu.file.insert_image}} ([[Ctrl+Shift+I]]), trascina un file nella finestra, o incolla dagli appunti ([[Ctrl+Shift+V]]).","s4.modes":"Due proiezioni","s5.t":"Trasforma: sposta, scala, ruota","s5.p":"Mentre l’immagine galleggia, le maniglie sulla tela funzionano in entrambe le viste:","s5.l1":"Trascina all’interno dell’immagine per spostarla; trascina un angolo per scalarla (tieni [[Shift]] per la scala libera); la manopola rotonda la ruota ([[Shift]]: passi di 15°).","s5.l2":"Nel pannello laterale: {{place.size}}, {{place.rotation}}, {{place.opacity}}, {{place.flip_h}} e {{place.flip_v}}.","s5.l3":"[[Enter]] — <b>{{place.merge}}</b>: {{place.merge.desc}}","s5.l4":"<b>{{place.as_layer}}</b> la mette invece su un nuovo livello; [[Esc]] annulla, e annulla / ripeti funzionano durante il posizionamento.","s6.t":"Distorci: perni agli angoli (D) e mesh (W)","s6.p":"{{place.distort.desc}} Per pareti e altre superfici piane, usa la proiezione <b>{{place.mode.persistent}}</b> guardando la parete.","s6.l1":"Premi [[D]] mentre posizioni un’immagine: compaiono quattro perni agli angoli. Trascina ciascuno su un angolo della parete, dello schermo o del pavimento.","s6.l2":"<b>{{place.distort.perspective}}</b> — {{place.distort.perspective.desc}}","s6.l3":"[[Shift]] blocca un asse durante il trascinamento; trascina all’interno per spostare tutta la forma; [[D]] torna alla trasformazione.","s6.l4":"<b>{{place.distort.numeric}}</b> — digita posizioni esatte per {{place.pin.tl}}, {{place.pin.tr}}, {{place.pin.br}} e {{place.pin.bl}}.","s6.l5":"[[W]] — <b>{{place.distort.warp}}</b>: {{place.distort.warp.desc}}","s6.l6":"{{place.distort.reset}} / {{place.distort.reset_warp}} ricominciano. I perni che si incrociano o piegano l’immagine vengono rifiutati e resta l’ultima forma valida.","s6.l7":"La distorsione fa parte dell’annullamento del posizionamento e si conserva spostando, scalando, ruotando e cambiando proiezione. [[Enter]] la unisce.","s7.t":"Salva, apri ed esporta","s7.l1":"[[Ctrl+N]] {{menu.file.new}} — scegli una preimpostazione 2:1, da {{new.preset.small}} (2048 × 1024) a {{new.preset.huge}} (8192 × 4096), e uno sfondo.","s7.l2":"[[Ctrl+S]] / [[Ctrl+Shift+S]] salvano un progetto <code>.pano</code>: uno ZIP con ogni livello in PNG, un manifesto JSON e un’anteprima.","s7.l3":"[[Ctrl+O]] apre progetti <code>.pano</code>, immagini (PNG, JPEG, WebP, BMP, TIFF) e vecchi progetti Paint360 (<code>.p360.json</code>); [[Ctrl+I]] {{menu.file.import}}","s7.l4":"Backup automatici e ripristino dopo un crash proteggono il tuo lavoro, e Panoraminal chiede conferma prima di chiudere con modifiche non salvate.","s7.l5":"[[Ctrl+Shift+E]] <b>{{menu.file.export_jpg}}</b> — {{export.desc}} Lascia attivo <b>{{export.gpano}}</b>.","s7.l6":"[[Ctrl+E]] <b>{{menu.file.export_png}}</b> — una normale immagine piatta.","s7.l7":"{{menu.edit}} › <b>{{menu.edit.offset}}</b> — {{offset.desc}} {{menu.edit}} › {{menu.edit.flip}} rispecchia il panorama.","s8.t":"Impostazioni: tema, animazioni e lingua","s8.p":"Apri {{menu.file}} › {{menu.file.settings}} ([[Ctrl+,]]).","s8.l1":"<b>{{settings.theme}}</b>: {{settings.theme.dark}}, {{settings.theme.light}} o {{settings.theme.system}} — il pulsante nella barra in alto cambia al volo.","s8.l2":"<b>{{settings.glow}}</b>: {{settings.glow.full}}, {{settings.glow.reduced}} o {{settings.glow.off}}.","s8.l3":"<b>{{settings.animations}}</b>: {{settings.anim.auto}}, {{settings.anim.on}} o {{settings.anim.off}}. {{settings.anim_tip}}","s8.l4":"<b>{{settings.language}}</b>: 8 lingue, cambiate all’istante; {{settings.language.auto}} segue il sistema.","s8.l5":"Inoltre: {{settings.ui_scale}}, {{settings.splash}}, {{settings.autosave}}, {{settings.undo_memory}}, {{settings.zoom_speed}}, {{settings.pen_pressure}} e {{settings.invert_drag}}.","s8.l6":"[[F1]] apre <b>{{menu.help.help}}</b> (scorciatoie, strumenti e consigli 360°); {{menu.help}} › {{menu.help.about}} contiene i link al sito, al codice sorgente e alle donazioni.","tips":"Consigli dal programma","cap.light":"{{settings.theme.light}} · Português","cap.brushes":"Libreria dei pennelli","cap.distort":"Perni agli angoli di una parete ({{place.mode.persistent}})","cap.merged":"Unita sulla parete","cap.distort_flat":"Perni nella {{view.flat}}","cap.before":"Perni","cap.after":"Unita","keys.title":"Scorciatoie da tastiera","keys.empty":"Nessuna scorciatoia corrisponde.","faq.title":"FAQ e limitazioni note","faq.q1":"Che dimensione deve avere il mio panorama?","faq.a1":"{{help.tip.4}} I documenti arrivano fino a 8192 × 4096 pixel, con fino a 64 livelli.","faq.q2":"Come lo pubblico su Facebook o Google Foto?","faq.a2":"Usa {{menu.file.export_jpg}} con <b>{{export.gpano}}</b> attivo: i metadati GPano fanno mostrare l’immagine come una foto 360° interattiva.","faq.q3":"La pressione della mia penna non funziona.","faq.a3":"La pressione arriva dal sistema operativo. Funziona con penne Windows Ink / pointer e dispositivi con forza tattile; i driver solo Wintab e molte tavolette su X11 / Wayland non la riportano ancora — i tratti usano allora la pressione piena.","faq.q4":"Il mio pennello .abr appare diverso.","faq.a4":"Vengono lette le punte campionate e calcolate e le preimpostazioni comuni. Pennello doppio, texture, punte a setole / erodibili, dinamica del colore, bordi bagnati e disturbo non hanno ancora equivalente e sono elencati in un avviso sul pennello; le punte a colori sono usate come maschere. L’importatore è stato testato con file sintetici — apri una issue con qualsiasi .abr che non si carica.","faq.q5":"La distorsione funziona in modalità {{place.mode.wrap}}?","faq.a5":"Sì, ma la prospettiva è solo approssimativa per immagini grandi — usa {{place.mode.persistent}} per le pareti. La mesh è una griglia fissa 4×4, l’anteprima dal vivo usa al massimo 2048 px (l’unione usa l’immagine completa) e le immagini posizionate sono limitate a 4096 px sul lato più lungo.","faq.q6":"È lento o non si avvia.","faq.a6":"Con un renderer software (llvmpipe, WARP) i documenti grandi sono lenti. All’avvio Panoraminal cambia backend da solo (DirectX 12 → Vulkan → OpenGL su Windows, Vulkan → OpenGL su Linux). Per forzarne uno, imposta <code>WGPU_BACKEND</code> su <code>vulkan</code>, <code>dx12</code>, <code>gl</code> o <code>metal</code>.","faq.q7":"macOS dice che l’app non può essere aperta.","faq.a7":"La versione macOS non è firmata con un Developer ID né notarizzata — segui la nota su Gatekeeper nella sezione installazione.","faq.q8":"È gratuito?","faq.a8":"{{about.license}} Il codice sorgente è su GitHub. Se Panoraminal ti è utile, considera una donazione.","foot.cta.t":"Ti piace Panoraminal?","foot.cta.p":"Panoraminal è libero e open source. Una donazione lo aiuta a continuare a crescere.","foot.made":"Creato da cleitinhodev / bugzinho · licenza MIT","foot.releases":"Versioni"},"ja":{"meta.title":"Panoraminal — チュートリアル","meta.desc":"Panoraminal で 360° パノラマを描く方法：インストール、画面構成、ブラシ、レイヤー、画像の配置、変形、360° 書き出し。","nav.what":"360°とは","nav.install":"インストール","nav.tour":"画面構成","nav.guide":"チュートリアル","nav.keys":"ショートカット","nav.faq":"FAQ","ui.menu":"メニュー","ui.top":"ページの先頭へ","ui.close":"閉じる","ui.copy":"コピー","ui.copied":"コピーしました","ui.zoom":"クリックで拡大","ui.compare":"スライダーをドラッグして比較","ui.filter":"ショートカットを検索…","ui.step":"ステップ {n}","hero.kicker":"公式チュートリアル · バージョン {v}","hero.download":"v{v} をダウンロード","hero.releases":"すべてのリリース","hero.drag":"ドラッグして見回す","hero.s1":"8 言語","hero.s2":"最大 64 レイヤー","hero.s3":"無料・オープンソース","what.title":"360° パノラマとは？","what.p1":"360° パノラマは、ある一点の周囲すべて（前後左右、空と地面）を写した画像です。幅が高さの 2 倍（2:1）の平面画像として保存されます。これが世界地図と同じ<b>正距円筒図法</b>です。","what.p2":"Facebook、Google フォト、VR ヘッドセットなどのビューアーは、この画像をあなたを囲む球体に貼り付けて表示します。平面画像に直接描くのは大変です。線は曲がり、左右の端はつながる必要があり、極は引き伸ばされます。","what.p3":"Panoraminal では<b>球体の内側</b>に立ち、見回しながら見えるものに描けます。すべてのストロークは正しい歪みで正距円筒画像に投影し直されるので、線はまっすぐ、継ぎ目は見えず、極もきれいです。","what.seam":"左端と右端は同じ場所です。画像はぐるりとつながっています。","install.title":"インストール","install.lead":"お使いのシステム用のファイルを選んでください。バージョン {v} が現在の安定版です。すべてのファイルはリリースページにもあります。","install.win.t":"Windows 10 / 11 (x64)","install.win.setup":"<b>インストーラー</b> — 下のファイルを実行します。スタートメニューとデスクトップにショートカットを作成し、<code>.pano</code> ファイルを Panoraminal に関連付けます。","install.win.portable":"<b>ポータブル版</b> — zip を好きな場所に展開して <code>panoraminal.exe</code> を実行します。何もインストールされません。","install.win.note":"ファイルにはコード署名がないため、初回起動時に Windows SmartScreen が警告することがあります。<b>詳細情報</b> → <b>実行</b> をクリックしてください。","install.linux.t":"Linux (x86_64)","install.linux.appimage":"<b>AppImage</b> — ほとんどのディストリビューションで動作:","install.linux.deb":"<b>.deb</b> — Debian、Ubuntu、Mint とその派生:","install.linux.tar":"<b>.tar.gz</b> — 展開してバイナリを実行:","install.mac.t":"macOS（Intel と Apple シリコン）","install.mac.zip":"ファイルを解凍し、<b>Panoraminal.app</b> を<b>アプリケーション</b>フォルダへドラッグします。","install.mac.note":"<b>Gatekeeper:</b> このアプリは Apple Developer ID で署名・公証されていないため、macOS は初回起動をブロックします。Panoraminal.app を右クリック（または Control+クリック）→ <b>開く</b> → <b>開く</b>。最近の macOS では、システム設定 → プライバシーとセキュリティ → <b>このまま開く</b>を使うか、ターミナルで次を実行します:","install.req":"<b>動作環境:</b> Vulkan、Metal、DirectX 12、または OpenGL 3.3 以上に対応した GPU を推奨します。ソフトウェアレンダラーでも動きますが低速です。","install.sha":"各リリースには、ダウンロードを検証するための <code>SHA256SUMS.txt</code> が含まれています。","install.get":"ダウンロード","tour.title":"画面構成","tour.lead":"番号にマウスを重ねるかタップすると、ウィンドウの各部分の役割が表示されます。","tour.1":"<b>メニューバー</b> — {{menu.file}}、{{menu.edit}}、{{menu.layer}}、{{menu.view}}、{{menu.help}}。","tour.2":"<b>ツール</b> — {{tool.pen}}、{{tool.brush}}、{{tool.airbrush}}、{{tool.custom}}、{{tool.eraser}}、{{tool.eyedropper}}、{{tool.fill}}。その下にメインカラーとサブカラー。","tour.3":"<b>クイックボタン</b> — 元に戻す / やり直し、{{view.sphere}} / {{view.flat}}、{{menu.view.grid}}、{{action.toggle_theme}}、{{menu.help.help}}。","tour.4":"<b>キャンバス</b> — 左ボタンで描画、右または中ボタンのドラッグで見回します。","tour.5":"<b>{{panel.color}}</b> — カラーピッカー、16 進コード、{{color.palette}}、{{color.recent}}。","tour.6":"<b>{{help.group.brush}}</b> — {{brush.size}}、{{brush.opacity}}、{{brush.flow}}、{{brush.hardness}}、{{brush.advanced}}設定。","tour.7":"<b>{{panel.layers}}</b> — レイヤーの追加・複製・結合・並べ替え、{{layer.opacity}}、{{layer.blend}}、表示切り替え、{{layer.alpha_lock}}。","tour.8":"<b>ステータスバー</b> — 現在のツールとサイズ、カーソルの経度 / 緯度、視野角、取り消し用メモリ、ドキュメントサイズ、グラフィックアダプター。","guide.title":"ステップごとのチュートリアル","guide.lead":"最初のストロークから、共有できる 360° 画像まで。","s1.t":"見回す: 球体ビューと平面ビュー","s1.p":"Panoraminal には 2 つのビューがあります。<b>{{view.sphere}}</b>ではパノラマの中心に立ち、見えるものに描きます。<b>{{view.flat}}</b>では画像全体を一度に表示します。","s1.l1":"[[V]] で 2 つのビューを切り替えます。","s1.l2":"右または中ボタンでドラッグ、または [[Space]] + ドラッグでビューを回転。矢印キーも使えます。","s1.l3":"マウスホイールまたは [[+]] / [[-]] でズーム（視野角は最大 120°）。タッチ画面ではピンチ操作。","s1.l4":"[[0]] でビューをリセット、[[G]] でグリッド表示、[[Tab]] でインターフェースを隠し、[[F11]] で全画面表示。","s2.t":"描く: ツール、色、レイヤー","s2.p":"左のバーからツールを選びます。すべてのブラシは球体上に描くので、継ぎ目や極の近くでもストロークが正しく表示されます。","s2.l1":"[[[]] / [[]]] で{{brush.size}}、[[{]] / [[}]] で{{brush.hardness}}を変更します。","s2.l2":"[[Shift]] + クリックで最後のストロークから直線を引きます（球面上の大円）。","s2.l3":"[[Alt]] + クリックで描画中に色を拾い、[[X]] でメインカラーとサブカラーを入れ替えます。","s2.l4":"{{brush.advanced}}: {{brush.spacing}}、{{brush.smoothing}}、{{brush.polar}}、ペン筆圧（{{brush.pressure_size}} / {{brush.pressure_opacity}}）。","s2.l5":"{{panel.layers}}: 最大 64 枚。{{layer.opacity}}、表示切り替え、ドラッグ＆ドロップでの並べ替え、{{layer.alpha_lock}}、9 種類の合成モード。[[Ctrl+Shift+N]] {{menu.layer.new}}、[[Ctrl+J]] {{menu.layer.duplicate}}、[[Ctrl+M]] {{menu.layer.merge_down}}。","s2.l6":"[[Ctrl+Z]] で元に戻す、[[Ctrl+Shift+Z]] / [[Ctrl+Y]] でやり直し。","s2.blends":"合成モード","s3.t":"カスタムブラシと .abr / .gbr / .gih の読み込み","s3.p":"<b>{{tool.custom}}</b>ツール（[[C]]）は、ライブラリ内の任意のブラシで描きます。","s3.l1":"{{menu.file}} › {{menu.file.import_brushes}}（[[Ctrl+Shift+B]]）で読み込むか、ファイルをウィンドウにドロップします。Photoshop の <code>.abr</code>（v1/v2 と v6 以降）、GIMP の <code>.gbr</code> / <code>.gih</code>、または任意の PNG / JPEG / WebP 画像をブラシ先端として使えます。","s3.l2":"ライブラリにはサムネイル、ライブプレビュー、名前の変更、カテゴリ、{{brushlib.favorites}}、検索があります。","s3.l3":"{{brushlib.dynamics}}: {{brush.spacing}}、{{brushlib.angle}}、{{brushlib.roundness}}、サイズ / 角度 / 真円率のゆらぎ、{{brushlib.scatter}}、{{brushlib.count}}、不透明度 / フローのゆらぎ、ランダム反転、ペン筆圧。","s3.l4":"まだ対応する機能がない Photoshop の設定（デュアルブラシ、テクスチャ、ウェットエッジ、ノイズなど）はスキップされ、ブラシの注意書きに一覧表示されます。","s3.l5":"{{settings.embed_brushes}}: {{settings.embed_brushes_tip}}","s4.t":"シーンに画像を配置する","s4.p":"写真、ロゴ、テクスチャをパノラマに取り込めます。結合するまでは、非破壊のオブジェクトとしてシーンの上に浮かんでいます。","s4.l1":"{{menu.file}} › {{menu.file.insert_image}}（[[Ctrl+Shift+I]]）、ファイルをウィンドウにドラッグ＆ドロップ、またはクリップボードから貼り付け（[[Ctrl+Shift+V]]）。","s4.modes":"2 つの投影方式","s5.t":"変形: 移動・拡大縮小・回転","s5.p":"画像が浮かんでいる間、キャンバス上のハンドルは両方のビューで使えます:","s5.l1":"画像の内側をドラッグして移動、角をドラッグして拡大縮小（[[Shift]] で自由変形）、丸いノブで回転（[[Shift]]: 15° 刻み）。","s5.l2":"サイドパネル: {{place.size}}、{{place.rotation}}、{{place.opacity}}、{{place.flip_h}}、{{place.flip_v}}。","s5.l3":"[[Enter]] — <b>{{place.merge}}</b>: {{place.merge.desc}}","s5.l4":"<b>{{place.as_layer}}</b>を使うと新しいレイヤーに配置します。[[Esc]] でキャンセル。配置中も元に戻す / やり直しが使えます。","s6.t":"変形: コーナーピン（D）とメッシュワープ（W）","s6.p":"{{place.distort.desc}} 壁などの平らな面には、壁の方を向いて<b>{{place.mode.persistent}}</b>投影を使いましょう。","s6.l1":"画像の配置中に [[D]] を押すと、四隅に 4 つのピンが表示されます。それぞれを壁・画面・床の角へドラッグします。","s6.l2":"<b>{{place.distort.perspective}}</b> — {{place.distort.perspective.desc}}","s6.l3":"[[Shift]] でドラッグ中に軸を固定、内側をドラッグして形全体を移動、[[D]] で変形モードに戻ります。","s6.l4":"<b>{{place.distort.numeric}}</b> — {{place.pin.tl}}、{{place.pin.tr}}、{{place.pin.br}}、{{place.pin.bl}}の正確な位置を入力できます。","s6.l5":"[[W]] — <b>{{place.distort.warp}}</b>: {{place.distort.warp.desc}}","s6.l6":"{{place.distort.reset}} / {{place.distort.reset_warp}}でやり直せます。交差したり画像が折り返したりするピン配置は拒否され、最後の有効な形が保たれます。","s6.l7":"変形は配置の取り消し履歴に含まれ、移動・拡大縮小・回転・投影方式の切り替え後も保持されます。[[Enter]] で結合します。","s7.t":"保存・開く・書き出し","s7.l1":"[[Ctrl+N]] {{menu.file.new}} — 2:1 のプリセット（{{new.preset.small}} 2048 × 1024 〜 {{new.preset.huge}} 8192 × 4096）と背景を選びます。","s7.l2":"[[Ctrl+S]] / [[Ctrl+Shift+S]] で <code>.pano</code> プロジェクトを保存します。各レイヤーの PNG、JSON マニフェスト、プレビューを含む ZIP です。","s7.l3":"[[Ctrl+O]] で <code>.pano</code> プロジェクト、画像（PNG、JPEG、WebP、BMP、TIFF）、旧 Paint360 プロジェクト（<code>.p360.json</code>）を開けます。[[Ctrl+I]] {{menu.file.import}}","s7.l4":"自動バックアップとクラッシュからの復元で作業を守り、未保存の変更があるときは閉じる前に確認します。","s7.l5":"[[Ctrl+Shift+E]] <b>{{menu.file.export_jpg}}</b> — {{export.desc}} <b>{{export.gpano}}</b>はオンのままにしてください。","s7.l6":"[[Ctrl+E]] <b>{{menu.file.export_png}}</b> — 通常の平面画像。","s7.l7":"{{menu.edit}} › <b>{{menu.edit.offset}}</b> — {{offset.desc}} {{menu.edit}} › {{menu.edit.flip}}でパノラマを反転します。","s8.t":"設定: テーマ、アニメーション、言語","s8.p":"{{menu.file}} › {{menu.file.settings}}（[[Ctrl+,]]）を開きます。","s8.l1":"<b>{{settings.theme}}</b>: {{settings.theme.dark}}、{{settings.theme.light}}、{{settings.theme.system}}。上部バーのボタンですばやく切り替えられます。","s8.l2":"<b>{{settings.glow}}</b>: {{settings.glow.full}}、{{settings.glow.reduced}}、{{settings.glow.off}}。","s8.l3":"<b>{{settings.animations}}</b>: {{settings.anim.auto}}、{{settings.anim.on}}、{{settings.anim.off}}。{{settings.anim_tip}}","s8.l4":"<b>{{settings.language}}</b>: 8 言語を即座に切り替え。{{settings.language.auto}}はシステムに従います。","s8.l5":"そのほか: {{settings.ui_scale}}、{{settings.splash}}、{{settings.autosave}}、{{settings.undo_memory}}、{{settings.zoom_speed}}、{{settings.pen_pressure}}、{{settings.invert_drag}}。","s8.l6":"[[F1]] で<b>{{menu.help.help}}</b>（ショートカット、ツール、360° のヒント）を開きます。{{menu.help}} › {{menu.help.about}}にはサイト、ソースコード、寄付へのリンクがあります。","tips":"アプリ内のヒント","cap.light":"{{settings.theme.light}} · Português","cap.brushes":"ブラシライブラリ","cap.distort":"部屋の壁にコーナーピン（{{place.mode.persistent}}）","cap.merged":"壁に結合","cap.distort_flat":"{{view.flat}}でのコーナーピン","cap.before":"ピン","cap.after":"結合後","keys.title":"キーボードショートカット","keys.empty":"一致するショートカットはありません。","faq.title":"FAQ と既知の制限","faq.q1":"パノラマのサイズはどうすればいい？","faq.a1":"{{help.tip.4}} ドキュメントは最大 8192 × 4096 ピクセル、レイヤーは最大 64 枚です。","faq.q2":"Facebook や Google フォトに投稿するには？","faq.a2":"<b>{{export.gpano}}</b>をオンにして{{menu.file.export_jpg}}を使います。GPano メタデータにより、これらのサイトで操作できる 360° 写真として表示されます。","faq.q3":"ペンの筆圧が効きません。","faq.a3":"筆圧は OS から取得します。Windows Ink / ポインターペンや感圧タッチ対応デバイスでは動作しますが、Wintab 専用ドライバーや X11 / Wayland の多くのタブレットはまだ筆圧を報告しません。その場合は最大筆圧で描画されます。","faq.q4":".abr ブラシの見た目が違います。","faq.a4":"サンプルブラシ先端と計算ブラシ先端、一般的なプリセットを読み込みます。デュアルブラシ、テクスチャ、毛ブラシ / 摩耗ブラシ、カラーダイナミクス、ウェットエッジ、ノイズにはまだ対応する機能がなく、ブラシの注意書きに表示されます。カラーの先端はマスクとして使われます。インポーターは合成ファイルでテストしています。読み込めない .abr があれば issue を作成してください。","faq.q5":"{{place.mode.wrap}}モードでも変形できますか？","faq.a5":"できますが、大きな画像では遠近が近似になります。壁には{{place.mode.persistent}}を使ってください。メッシュは 4×4 固定、ライブプレビューは最大 2048 px（結合時はフル解像度）、配置する画像は長辺 4096 px までです。","faq.q6":"動作が遅い / 起動しません。","faq.a6":"ソフトウェアレンダラー（llvmpipe、WARP）では大きなドキュメントが遅くなります。起動時に Panoraminal は自動でバックエンドを切り替えます（Windows: DirectX 12 → Vulkan → OpenGL、Linux: Vulkan → OpenGL）。固定するには <code>WGPU_BACKEND</code> に <code>vulkan</code>、<code>dx12</code>、<code>gl</code>、<code>metal</code> のいずれかを設定します。","faq.q7":"macOS で「開けません」と表示されます。","faq.a7":"macOS 版は Developer ID による署名も公証もされていません。インストールの項にある Gatekeeper の手順に従ってください。","faq.q8":"無料ですか？","faq.a8":"{{about.license}} ソースコードは GitHub にあります。Panoraminal が役に立ったら、ぜひ寄付をご検討ください。","foot.cta.t":"Panoraminal を気に入りましたか？","foot.cta.p":"Panoraminal は無料のオープンソースです。寄付はプロジェクトの成長を支えます。","foot.made":"制作: cleitinhodev / bugzinho · MIT ライセンス","foot.releases":"リリース"},"zh-CN":{"meta.title":"Panoraminal — 教程","meta.desc":"学习用 Panoraminal 绘制 360° 全景图：安装、界面、画笔、图层、放置图像、变形和 360° 导出。","nav.what":"什么是 360°","nav.install":"安装","nav.tour":"界面","nav.guide":"教程","nav.keys":"快捷键","nav.faq":"常见问题","ui.menu":"菜单","ui.top":"返回顶部","ui.close":"关闭","ui.copy":"复制","ui.copied":"已复制！","ui.zoom":"点击放大","ui.compare":"拖动滑块进行对比","ui.filter":"筛选快捷键…","ui.step":"第 {n} 步","hero.kicker":"官方教程 · 版本 {v}","hero.download":"下载 v{v}","hero.releases":"所有版本","hero.drag":"拖动以环顾四周","hero.s1":"8 种语言","hero.s2":"最多 64 个图层","hero.s3":"免费开源","what.title":"什么是 360° 全景图？","what.p1":"360° 全景图记录了某一点周围的一切：前、后、左右两侧、天空和地面。它以宽是高两倍（2:1）的平面图像保存——也就是和世界地图相同的<b>等距柱状投影</b>。","what.p2":"Facebook、Google 相册和 VR 头显等查看器会把这张图像包裹成环绕你的球体。直接在平面图像上绘画很难：线条会弯曲，左右边缘必须对齐，两极会被拉伸。","what.p3":"Panoraminal 让你<b>站在球体内部</b>：环顾四周，看到哪里就画哪里，每一笔都会以正确的变形投影回等距柱状图像——直线笔直、接缝无痕、两极正常。","what.seam":"左边缘和右边缘是同一个位置：图像首尾相连。","install.title":"安装","install.lead":"选择适合你系统的文件。{v} 是当前稳定版本；所有文件也都在版本发布页面上。","install.win.t":"Windows 10 / 11 (x64)","install.win.setup":"<b>安装程序</b>——运行下面的文件。它会在开始菜单和桌面创建快捷方式，并用 Panoraminal 打开 <code>.pano</code> 文件。","install.win.portable":"<b>便携版</b>——将 zip 解压到任意位置并运行 <code>panoraminal.exe</code>，无需安装。","install.win.note":"这些文件没有代码签名，首次运行时 Windows SmartScreen 可能会发出警告：点击<b>更多信息</b> → <b>仍要运行</b>。","install.linux.t":"Linux (x86_64)","install.linux.appimage":"<b>AppImage</b>——适用于大多数发行版：","install.linux.deb":"<b>.deb</b>——Debian、Ubuntu、Mint 及其衍生版：","install.linux.tar":"<b>.tar.gz</b>——解压后运行程序：","install.mac.t":"macOS（Intel 和 Apple 芯片）","install.mac.zip":"解压文件，并将 <b>Panoraminal.app</b> 拖到<b>应用程序</b>文件夹。","install.mac.note":"<b>Gatekeeper：</b>该应用未使用 Apple Developer ID 签名，也未经过公证，因此 macOS 会阻止首次启动。右键点按（或按住 Control 点按）Panoraminal.app → <b>打开</b> → <b>打开</b>。在较新的 macOS 上，请前往系统设置 → 隐私与安全性 → <b>仍要打开</b>，或在终端中运行：","install.req":"<b>系统要求：</b>建议使用支持 Vulkan、Metal、DirectX 12 或 OpenGL 3.3+ 的 GPU。软件渲染器也能运行，只是较慢。","install.sha":"每个版本都附带 <code>SHA256SUMS.txt</code> 文件，用于校验下载。","install.get":"下载","tour.title":"界面导览","tour.lead":"将鼠标悬停在数字上或点按数字，查看窗口各部分的作用。","tour.1":"<b>菜单栏</b>——{{menu.file}}、{{menu.edit}}、{{menu.layer}}、{{menu.view}}和{{menu.help}}。","tour.2":"<b>工具</b>——{{tool.pen}}、{{tool.brush}}、{{tool.airbrush}}、{{tool.custom}}、{{tool.eraser}}、{{tool.eyedropper}}和{{tool.fill}}，下方是主颜色和副颜色。","tour.3":"<b>快捷按钮</b>——撤销 / 重做、{{view.sphere}} / {{view.flat}}、{{menu.view.grid}}、{{action.toggle_theme}}和{{menu.help.help}}。","tour.4":"<b>画布</b>——用左键绘画；用右键或中键拖动来环顾四周。","tour.5":"<b>{{panel.color}}</b>——取色器、十六进制代码、{{color.palette}}和{{color.recent}}。","tour.6":"<b>{{help.group.brush}}</b>——{{brush.size}}、{{brush.opacity}}、{{brush.flow}}、{{brush.hardness}}以及{{brush.advanced}}选项。","tour.7":"<b>{{panel.layers}}</b>——添加、复制、合并和重新排序图层；{{layer.opacity}}、{{layer.blend}}、可见性和{{layer.alpha_lock}}。","tour.8":"<b>状态栏</b>——当前工具和大小、光标经度 / 纬度、视野、撤销内存、文档尺寸和显卡。","guide.title":"分步教程","guide.lead":"从第一笔到可以分享的 360° 图像。","s1.t":"环顾四周：球面视图和平面视图","s1.p":"Panoraminal 有两种视图。在<b>{{view.sphere}}</b>中，你站在全景的中心，在看到的画面上绘画。<b>{{view.flat}}</b>则一次显示整张图像。","s1.l1":"[[V]] 在两种视图之间切换。","s1.l2":"用右键或中键拖动，或 [[Space]] + 拖动，即可旋转视图；方向键也可以。","s1.l3":"鼠标滚轮或 [[+]] / [[-]] 缩放（视野最大 120°）；触摸屏上用双指捏合。","s1.l4":"[[0]] 重置视图，[[G]] 显示网格，[[Tab]] 隐藏界面，[[F11]] 切换全屏。","s2.t":"绘画：工具、颜色和图层","s2.p":"在左侧工具栏中选择工具。所有画笔都在球面上绘画，因此笔触在接缝处和两极附近都保持正确。","s2.l1":"[[[]] / [[]]] 调整{{brush.size}}；[[{]] / [[}]] 调整{{brush.hardness}}。","s2.l2":"[[Shift]] + 点击从上一笔画一条直线——即球面上的大圆。","s2.l3":"[[Alt]] + 点击在绘画时吸取颜色；[[X]] 交换主颜色和副颜色。","s2.l4":"{{brush.advanced}}：{{brush.spacing}}、{{brush.smoothing}}、{{brush.polar}}和笔压（{{brush.pressure_size}} / {{brush.pressure_opacity}}）。","s2.l5":"{{panel.layers}}：最多 64 个，支持{{layer.opacity}}、可见性、拖放排序、{{layer.alpha_lock}}和 9 种混合模式。[[Ctrl+Shift+N]] {{menu.layer.new}}，[[Ctrl+J]] {{menu.layer.duplicate}}，[[Ctrl+M]] {{menu.layer.merge_down}}。","s2.l6":"[[Ctrl+Z]] 撤销，[[Ctrl+Shift+Z]] / [[Ctrl+Y]] 重做。","s2.blends":"混合模式","s3.t":"自定义画笔与 .abr / .gbr / .gih 导入","s3.p":"<b>{{tool.custom}}</b>工具（[[C]]）可以使用画笔库中的任意画笔绘画。","s3.l1":"通过{{menu.file}} › {{menu.file.import_brushes}}（[[Ctrl+Shift+B]]）导入，或将文件拖到窗口中：Photoshop <code>.abr</code>（v1/v2 和 v6+）、GIMP <code>.gbr</code> / <code>.gih</code>，或任意 PNG / JPEG / WebP 图像作为笔尖。","s3.l2":"画笔库提供缩略图、实时预览笔触、重命名、分类、{{brushlib.favorites}}和搜索。","s3.l3":"{{brushlib.dynamics}}：{{brush.spacing}}、{{brushlib.angle}}、{{brushlib.roundness}}、大小 / 角度 / 圆度抖动、{{brushlib.scatter}}、{{brushlib.count}}、不透明度 / 流量抖动、随机翻转和笔压。","s3.l4":"暂无对应功能的 Photoshop 特性（双重画笔、纹理、湿边、杂色等）会被跳过，并在画笔的提示中列出。","s3.l5":"{{settings.embed_brushes}}：{{settings.embed_brushes_tip}}","s4.t":"在场景中放置图像","s4.p":"把照片、标志或纹理带入全景图。在合并之前，它作为非破坏性对象悬浮在场景之上。","s4.l1":"{{menu.file}} › {{menu.file.insert_image}}（[[Ctrl+Shift+I]]），将文件拖放到窗口中，或从剪贴板粘贴（[[Ctrl+Shift+V]]）。","s4.modes":"两种投影","s5.t":"变换：移动、缩放、旋转","s5.p":"图像悬浮时，画布上的控制柄在两种视图中都可使用：","s5.l1":"在图像内部拖动以移动；拖动角点以缩放（按住 [[Shift]] 自由缩放）；拖动圆形旋钮以旋转（[[Shift]]：每次 15°）。","s5.l2":"侧边面板：{{place.size}}、{{place.rotation}}、{{place.opacity}}、{{place.flip_h}}和{{place.flip_v}}。","s5.l3":"[[Enter]]——<b>{{place.merge}}</b>：{{place.merge.desc}}","s5.l4":"<b>{{place.as_layer}}</b>会将其放到新图层；[[Esc]] 取消，放置期间也可以撤销 / 重做。","s6.t":"变形：角点钉（D）和网格变形（W）","s6.p":"{{place.distort.desc}} 对于墙面等平面，请面向墙面并使用<b>{{place.mode.persistent}}</b>投影。","s6.l1":"放置图像时按 [[D]]：四个角上会出现四个钉。把每个钉拖到墙面、屏幕或地面的对应角上。","s6.l2":"<b>{{place.distort.perspective}}</b>——{{place.distort.perspective.desc}}","s6.l3":"拖动时按 [[Shift]] 锁定一个轴；在内部拖动可移动整个形状；[[D]] 返回变换。","s6.l4":"<b>{{place.distort.numeric}}</b>——为{{place.pin.tl}}、{{place.pin.tr}}、{{place.pin.br}}和{{place.pin.bl}}输入精确位置。","s6.l5":"[[W]]——<b>{{place.distort.warp}}</b>：{{place.distort.warp.desc}}","s6.l6":"{{place.distort.reset}} / {{place.distort.reset_warp}}可以重新开始。交叉或使图像折叠的钉位置会被拒绝，并保留上一个有效形状。","s6.l7":"变形属于放置操作的撤销记录，在移动、缩放、旋转和切换投影后都会保留。[[Enter]] 将其合并。","s7.t":"保存、打开和导出","s7.l1":"[[Ctrl+N]] {{menu.file.new}}——选择 2:1 预设，从{{new.preset.small}}（2048 × 1024）到{{new.preset.huge}}（8192 × 4096），并选择背景。","s7.l2":"[[Ctrl+S]] / [[Ctrl+Shift+S]] 保存 <code>.pano</code> 项目：一个包含每个图层 PNG、JSON 清单和预览图的 ZIP。","s7.l3":"[[Ctrl+O]] 可打开 <code>.pano</code> 项目、图像（PNG、JPEG、WebP、BMP、TIFF）以及旧版 Paint360 项目（<code>.p360.json</code>）；[[Ctrl+I]] {{menu.file.import}}","s7.l4":"自动备份和崩溃恢复保护你的作品；有未保存的更改时，Panoraminal 会在关闭前询问。","s7.l5":"[[Ctrl+Shift+E]] <b>{{menu.file.export_jpg}}</b>——{{export.desc}} 请保持<b>{{export.gpano}}</b>开启。","s7.l6":"[[Ctrl+E]] <b>{{menu.file.export_png}}</b>——普通的平面图像。","s7.l7":"{{menu.edit}} › <b>{{menu.edit.offset}}</b>——{{offset.desc}} {{menu.edit}} › {{menu.edit.flip}}可镜像全景图。","s8.t":"设置：主题、动画和语言","s8.p":"打开{{menu.file}} › {{menu.file.settings}}（[[Ctrl+,]]）。","s8.l1":"<b>{{settings.theme}}</b>：{{settings.theme.dark}}、{{settings.theme.light}}或{{settings.theme.system}}——顶部栏中的按钮可快速切换。","s8.l2":"<b>{{settings.glow}}</b>：{{settings.glow.full}}、{{settings.glow.reduced}}或{{settings.glow.off}}。","s8.l3":"<b>{{settings.animations}}</b>：{{settings.anim.auto}}、{{settings.anim.on}}或{{settings.anim.off}}。{{settings.anim_tip}}","s8.l4":"<b>{{settings.language}}</b>：8 种语言，即时切换；{{settings.language.auto}}跟随系统。","s8.l5":"此外还有：{{settings.ui_scale}}、{{settings.splash}}、{{settings.autosave}}、{{settings.undo_memory}}、{{settings.zoom_speed}}、{{settings.pen_pressure}}和{{settings.invert_drag}}。","s8.l6":"[[F1]] 打开<b>{{menu.help.help}}</b>（快捷键、工具和 360° 提示）；{{menu.help}} › {{menu.help.about}}中有网站、源代码和捐赠的链接。","tips":"程序内提示","cap.light":"{{settings.theme.light}} · Português","cap.brushes":"画笔库","cap.distort":"房间墙面上的角点钉（{{place.mode.persistent}}）","cap.merged":"已合并到墙面","cap.distort_flat":"{{view.flat}}中的角点钉","cap.before":"角点钉","cap.after":"合并后","keys.title":"键盘快捷键","keys.empty":"没有匹配的快捷键。","faq.title":"常见问题与已知限制","faq.q1":"全景图应该多大？","faq.a1":"{{help.tip.4}} 文档最大 8192 × 4096 像素，最多 64 个图层。","faq.q2":"如何发布到 Facebook 或 Google 相册？","faq.a2":"使用{{menu.file.export_jpg}}并开启<b>{{export.gpano}}</b>：GPano 元数据会让这些网站把图像显示为可交互的 360° 照片。","faq.q3":"我的笔压不起作用。","faq.a3":"压力数据来自操作系统。Windows Ink / 指针笔和支持压感触控的设备可以使用；仅支持 Wintab 的驱动以及许多 X11 / Wayland 下的数位板目前还不会报告压力——此时笔触使用最大压力。","faq.q4":"我的 .abr 画笔看起来不一样。","faq.a4":"会读取采样笔尖、计算笔尖和常用预设。双重画笔、纹理、毛刷 / 可侵蚀笔尖、颜色动态、湿边和杂色暂无对应功能，会在画笔的提示中列出；彩色笔尖会作为蒙版使用。导入器使用合成文件测试过——如有无法加载的 .abr，请提交 issue。","faq.q5":"{{place.mode.wrap}}模式下可以变形吗？","faq.a5":"可以，但对大图像来说透视只是近似的——墙面请使用{{place.mode.persistent}}。网格固定为 4×4，实时预览最多使用 2048 px（合并时使用完整图像），放置的图像最长边限制为 4096 px。","faq.q6":"运行很慢或无法启动。","faq.a6":"使用软件渲染器（llvmpipe、WARP）时大文档会很慢。启动时 Panoraminal 会自动切换后端（Windows：DirectX 12 → Vulkan → OpenGL；Linux：Vulkan → OpenGL）。要强制指定，请将 <code>WGPU_BACKEND</code> 设为 <code>vulkan</code>、<code>dx12</code>、<code>gl</code> 或 <code>metal</code>。","faq.q7":"macOS 提示无法打开应用。","faq.a7":"macOS 版本未使用 Developer ID 签名，也未经过公证——请按照安装部分的 Gatekeeper 说明操作。","faq.q8":"免费吗？","faq.a8":"{{about.license}} 源代码在 GitHub 上。如果 Panoraminal 对你有帮助，欢迎考虑捐赠。","foot.cta.t":"喜欢 Panoraminal 吗？","foot.cta.p":"Panoraminal 是免费开源软件。你的捐赠能帮助它继续成长。","foot.made":"由 cleitinhodev / bugzinho 制作 · MIT 许可证","foot.releases":"版本发布"}};

<script>
(function(){
'use strict';
const C = PANORAMINAL_CONFIG, doc = document.documentElement;
const LS = {lang:'panoraminal-tutorial-lang',theme:'panoraminal-tutorial-theme',motion:'panoraminal-tutorial-motion'};
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const V = s => String(s == null ? '' : s).split('{version}').join(C.version);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const imgPath = n => (C.imagesPath || 'img/') + n;
const fileName = k => V(C.files[k]).split('/').pop();
const fileUrl = k => { const f = V(C.files[k]); return /^https?:\/\//.test(f) ? f : V(C.files.base) + f; };
let lang = 'pt-BR', mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');

function detect(){
  let q = null; try { q = new URLSearchParams(location.search).get('lang'); } catch(e){}
  const cands = [q, store.get(LS.lang)].concat(navigator.languages || [navigator.language]).filter(Boolean);
  for (const c of cands){
    const l = String(c).toLowerCase();
    let hit = LANGS.find(x => x.code.toLowerCase() === l);
    if (!hit) hit = LANGS.find(x => x.code.toLowerCase().split('-')[0] === l.split('-')[0]);
    if (hit) return hit.code;
  }
  return LANGS.some(x => x.code === C.defaultLanguage) ? C.defaultLanguage : 'pt-BR';
}
const app = k => (APP_TERMS[lang] && APP_TERMS[lang][k]) || APP_TERMS.en[k] || k;
function modKey(p){ if (mac){ if (p === 'Ctrl') return '⌘'; if (p === 'Alt') return 'Option'; } return p; }
function keyChip(s){
  const parts = s === '+' ? ['+'] : s.split('+').map(p => p.trim() || '+');
  return parts.map(p => '<kbd>' + esc(modKey(p)) + '</kbd>').join('<span class="kplus">+</span>');
}
/* {{key}} = term from the app, [[Ctrl+S]] = key chip, {v} = version */
function rich(s, plainTerms){
  return String(s)
    .replace(/\{\{([\w.]+)\}\}/g, (_, k) => { const v = app(k); return plainTerms || v.length > 32 ? esc(v) : '<span class="term">' + esc(v) + '</span>'; })
    .replace(/\[\[(.+?)\]\]/g, (_, k) => keyChip(k))
    .replace(/\{v\}/g, esc(C.version));
}
const t = (k, plain) => { const s = (TEXT[lang] && TEXT[lang][k]) || TEXT.en[k]; return s == null ? k : rich(s, plain); };
const strip = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
const tText = k => strip(t(k, true));

function img(name, alt, eager){
  const n = name.replace('{lang}', lang), m = IMAGES[n] || [1440, 900], has800 = !!IMAGES[n + '-800'];
  const srcset = (has800 ? imgPath(n + '-800.webp') + ' 800w, ' : '') + imgPath(n + '.webp') + ' ' + m[0] + 'w';
  return '<img src="' + imgPath(n + (has800 ? '-800' : '') + '.webp') + '" srcset="' + srcset + '" sizes="(max-width: 980px) 94vw, 660px" width="' + m[0] + '" height="' + m[1] + '" ' + (eager ? '' : 'loading="lazy" ') + 'decoding="async" data-full="' + imgPath(n + '.webp') + '" alt="' + esc(alt) + '">';
}
const fig = (name, cap) => { const c = rich(cap, true); return '<figure class="f">' + img(name, strip(c)) + '<figcaption><span>' + c + '</span><span aria-hidden="true">⤢</span></figcaption></figure>'; };

  tip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>',

  airbrush:'<path d="M3 12h7l3 3h4l3-6h-6l-1-3H7"/><circle cx="20" cy="17" r=".6"/><circle cx="22" cy="20" r=".6"/><circle cx="18" cy="21" r=".6"/>',
  custom:'<path d="M12 2l2.4 5 5.6.8-4 3.9.9 5.5L12 14.6 7.1 17.2l.9-5.5-4-3.9 5.6-.8z"/><path d="M5 21h14"/>',

const Pano = (function(){

  addEventListener('resize', draw);
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible && ok) loop(); }).observe(document.getElementById('hero'));
  return {init, motion(){ if (ok) loop(); else fb.style.animation = ''; }};
})();
