<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página de exemplo</title>
  <meta name="description" content="Exemplo para ver o explorador funcionando. Pode apagar esta pasta.">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.7 ui-monospace, monospace;
           color: #f3e8ff; background: radial-gradient(ellipse at top, #3b0a73, #14012b 60%); }
    main { max-width: 620px; padding: 24px; border: 2px solid #a855f7; box-shadow: 0 0 18px rgba(168,85,247,.5); margin: 16px; }
    h1 { color: #ff1f4b; text-shadow: 0 0 10px rgba(255,31,75,.7); margin-top: 0; }
    code { color: #ff4fa3; }
  </style>
</head>
<body>
  <main>
    <h1>✔ Funcionou!</h1>
    <p>Esta é a página <code>projects/exemplo/</code>. Ela existe só para o explorador não ficar vazio.</p>
    <p>Quando subir a sua primeira página de verdade, pode apagar a pasta <code>projects/exemplo</code>.</p>
  </main>
</body>
</html>
