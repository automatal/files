const TEXTS = {"pt": {"eyebrow": "MANUAL • TUTORIAL • BOAS PRÁTICAS", "hero": "Um lugar para suas melhores ideias.", "intro": "Aprenda a guardar, encontrar e reutilizar prompts no Prompchu. Do primeiro cadastro a coleções independentes, com um passo a passo que acompanha a interface.", "download": "Baixar o aplicativo", "start": "Começar o tutorial", "search": "Buscar neste guia…", "language": "Idioma", "motion": "Animações", "on": "Ligadas", "off": "Desligadas", "menu": "Navegar pelo guia", "close": "Fechar", "zoom": "Ampliar captura", "copy": "Copiar modelo", "copied": "Copiado!", "copyFail": "Selecione o texto e copie manualmente.", "noResults": "Nenhum assunto encontrado. Tente outro termo.", "clear": "Limpar busca", "privacyBadge": "Local não significa criptografado", "version": "Versão documentada", "sectionsLabel": "Neste guia", "screenshotNote": "Capturas reais em inglês com dados fictícios. Alguns avisos do aplicativo ainda podem aparecer em português.", "site": "Site Bugzinho", "repo": "Repositório", "donate": "Apoiar o projeto", "releases": "Releases e downloads", "examplesLink": "Baixar bancos úteis", "top": "Voltar ao topo", "print": "Imprimir / salvar PDF", "exampleTitle": "Modelos prontos para adaptar", "exampleIntro": "Troque os campos entre colchetes. Copie, crie um registro no programa e salve. O Prompchu guarda o texto; você o executa na ferramenta de sua escolha.", "shortcutTitle": "Atalhos do aplicativo", "shortcutNames": ["Novo prompt", "Editar selecionado", "Buscar na tela atual", "Copiar selecionado"], "stats": ["idiomas", "bancos opcionais", "modelos reutilizáveis"], "footer": "Documentação independente para o Prompchu. Sem conta, APIs de tradução ou envio de prompts por esta página. As preferências de idioma e movimento são guardadas apenas neste navegador.", "sections": [["Conheça o Prompchu", "O Prompchu é um organizador desktop de prompts: textos que orientam uma ferramenta de IA ou outro processo. Guarde instruções, contexto, restrições e notas para reutilizar o que funcionou. Ele não gera imagens, vídeos ou respostas, não executa os prompts e não exige chave de API.", "A versão {{VERSION}} reúne biblioteca em cartões, miniaturas, favoritos, prateleiras personalizadas e bancos independentes. O conteúdo fica no computador. Use o programa para tarefas cotidianas; não trate o banco como um cofre de informações."], ["Baixar e abrir", "Abra o link de releases e escolha seu sistema. Windows 10/11 de 64 bits: baixe Windows-AMD64.zip, extraia toda a pasta e abra Prompchu.exe dentro dela. Não execute de dentro do ZIP nem separe o executável dos demais arquivos.", "Linux x86_64: extraia o tar.gz e execute ./Prompchu/Prompchu em um ambiente gráfico com as bibliotecas Qt/X11/OpenGL necessárias. A build usa Ubuntu 22.04 e não é AppImage. macOS Apple Silicon: extraia Darwin-arm64.zip e abra Prompchu.app; alvo macOS 15+, não Intel. Python já está incluído.", "Os pacotes não possuem assinatura Authenticode ou notarização Apple. SHA256SUMS.txt serve para comparar a integridade do download; não é assinatura de autoria. Use os links oficiais. Para começar, abra o programa e selecione seu idioma na tela inicial."], ["Seu primeiro prompt", "Clique em <ui>Novo prompt</ui>. Preencha <ui>Nome *</ui> com um título que descreva o resultado, como “Fotografia de produto — fundo limpo”. Em Prompt, escreva a instrução completa. Esses dois campos são obrigatórios.", "Use <ui>Tags (separadas por vírgula)</ui> para termos como produto, estúdio, reutilizável; <ui>Gêneros (separados por vírgula)</ui> para estilos; <ui>Categoria</ui> para o tipo de tarefa; e <ui>Modelo / ferramenta</ui> para registrar a ferramenta pretendida. Esse campo é apenas uma anotação, não conecta a uma IA.", "Escolha <ui>Prateleira</ui>, preencha <ui>Prompt negativo</ui> se precisar registrar o que evitar, e use <ui>Notas</ui> para variáveis, dicas e resultados dos testes. Clique em <ui>Salvar</ui>. O prompt negativo é armazenado separadamente: copie-o quando a ferramenta de destino permitir esse uso.", "Na tela inicial, selecione o registro para ler suas abas. Use <ui>Copiar prompt</ui> para copiar o texto principal, <ui>Editar</ui> para ajustar, <ui>Duplicar</ui> para experimentar uma variação e <ui>Excluir</ui> para remover após confirmação. Salvar no editor confirma a edição; digitar não é o mesmo que salvar."], ["Explorar a Biblioteca", "Clique em <ui>Biblioteca</ui>. Os cartões mostram título, tags e data de adição; uma imagem é opcional. Clique em um cartão para voltar à tela inicial com o prompt aberto. <ui>Voltar</ui> retorna à tela principal.", "A busca consulta nome, texto e metadados sem distinguir maiúsculas ou acentos. Combine prateleira, categoria, gênero e <ui>Favoritos</ui>. No campo de tags, separe por vírgula: todas as tags informadas precisam estar presentes. Ative <ui>Data de adição</ui> para limitar o intervalo.", "Ordene por <ui>Mais recentes</ui>, <ui>Mais antigos</ui>, <ui>Nome A–Z</ui> ou <ui>Atualizados</ui>. Se algo desaparecer, use <ui>Limpar filtros</ui>. A Biblioteca exibe 24 cartões por página; a lista inicial, 100 registros. <ui>Anterior</ui> e <ui>Próxima</ui> percorrem os resultados. A busca abrange todo o banco, não só a página visível."], ["Prateleiras e miniaturas", "Na lista à esquerda da Biblioteca, clique em <ui>Criar prateleira</ui>. Digite um nome, como “Projetos pessoais”, e confirme em <ui>Salvar</ui>. Ela fica disponível no editor e nos filtros, mesmo vazia. Cada banco mantém suas próprias prateleiras personalizadas.", "Use até 80 caracteres. Nomes vazios ou repetidos, desconsiderando maiúsculas e acentos, não são aceitos. Para colocar um prompt na nova prateleira, abra <ui>Editar</ui>, selecione-a no campo <ui>Prateleira</ui> e salve. Criar a prateleira não move registros automaticamente.", "No editor, <ui>Escolher miniatura</ui> aceita JPG ou PNG de até 20 MB e 40 megapixels. A imagem é reduzida para até 640 × 400 e guardada no SQLite. Você pode mover o arquivo original depois. <ui>Remover miniatura</ui> restaura o cartão padrão; confirme a alteração em <ui>Salvar</ui>."], ["Criar e trocar bancos", "Um banco é um arquivo .sqlite3 que reúne prompts, datas, favoritos, miniaturas e prateleiras. Ele não é uma conta nem uma pasta de imagens. Você pode separar trabalho, estudos e projetos em arquivos diferentes, onde preferir.", "Em <ui>Arquivo</ui>, escolha <ui>Criar banco</ui> para salvar uma coleção vazia em um arquivo novo. <ui>Abrir banco</ui> permite escolher uma coleção existente. A troca acontece na mesma janela; o banco anterior confirma as gravações pendentes antes de abrir o próximo.", "O nome atual aparece abaixo do cabeçalho. Passe o mouse para ver o caminho completo. O programa lembra o último banco aberto. Os filtros da tela são limpos na troca e as opções vêm do banco escolhido. Adições, exclusões e favoritos são gravados automaticamente; uma edição no formulário depende de <ui>Salvar</ui>."], ["Backup, união e transferência", "Para uma cópia completa, use <ui>Arquivo</ui> e <ui>Backup do banco</ui>. Escolha outro arquivo e guarde uma cópia também em outro dispositivo. O backup inclui imagens e prateleiras vazias. Para consultar ou restaurar a cópia, abra-a com <ui>Abrir banco</ui>.", "<ui>Juntar bancos</ui> pede dois arquivos e um destino novo. Os conteúdos são reunidos em um terceiro banco, aberto ao final. Os originais são preservados, assim como datas, favoritos, imagens e prateleiras vazias. Registros repetidos continuam existindo; não há deduplicação automática.", "Para transferir um único item: selecione-o, use <ui>Exportar prompt</ui>, salve o JSON, abra o banco de destino e use <ui>Importar prompt</ui>. A exportação contém apenas o selecionado, com metadados e miniatura. Importar adiciona; não substitui. Reimportar cria cópias e a data de adição passa a ser a data da importação.", "A versão atual importa JSON v1/v2 e exporta v2. O Prompchu 1.2.0 não importa v2. JSON serve para transferir prompts; SQLite serve para abrir uma coleção completa. Faça backup antes de atualizar bancos antigos."], ["Escrever prompts reutilizáveis", "Um bom modelo explica objetivo, contexto, material disponível, restrições e formato de entrega. “Faça um texto bom” é vago; “Resuma [TEXTO] em cinco tópicos para [PÚBLICO], preservando números e marcando lacunas” dá critérios para avaliar a resposta.", "Use campos [ENTRE COLCHETES] e registre nas notas como preenchê-los. O Prompchu não substitui variáveis automaticamente. Separe instruções do material de referência e indique o que a ferramenta deve fazer quando faltar informação. Não peça que invente fontes ou dados para completar a resposta.", "Prefira um objetivo principal por modelo. Teste com exemplos não sensíveis, revise o resultado e use <ui>Duplicar</ui> antes de alterar muito uma versão que já funciona. Nas notas, registre o que mudou e quando funciona melhor. Mais palavras não garantem mais qualidade: instruções concretas e verificáveis ajudam mais."], ["Bancos úteis opcionais", "O pacote {{EXAMPLES_FILE}} contém nove bancos, com 60 registros por área: Imagens, Vídeos, Documentos, Programação, Músicas, Estudos, Marketing, Escrita e Produtividade. São 540 modelos em português: 20 tarefas por área, cada uma em versões para criar, revisar e adaptar.", "Baixe o ZIP separado, extraia e use <ui>Arquivo</ui> e <ui>Abrir banco</ui> para escolher um .sqlite3. Nada é instalado ou importado automaticamente. Substitua os campos antes de usar. As alterações nesses bancos são permanentes; extraia o ZIP novamente para recuperar os exemplos originais.", "O download do aplicativo não preenche sua coleção com esses exemplos. Para levar apenas alguns ao seu banco, use exportação/importação de prompts. Para reunir coleções inteiras, use a união de bancos."], ["Idiomas, aparência e atalhos", "A interface oferece exatamente os dez idiomas do seletor deste tutorial. Na tela inicial, escolha o idioma; isso muda os controles, mas não traduz os prompts, nomes ou notas. Algumas mensagens técnicas do programa ainda aparecem em português.", "<ui>Neon</ui> controla os contornos luminosos e <ui>Animações</ui> controla o movimento. Desligar o movimento permite manter o neon estático. As preferências e o tamanho da janela são lembrados. A opção de animações deste site é independente da opção no aplicativo.", "Os prints deste guia permanecem em inglês. Por isso, os nomes dos controles aparecem em inglês seguidos da tradução no idioma selecionado. Os atalhos abaixo se referem ao aplicativo, não à página."], ["Privacidade: não é um cofre", "Os bancos NÃO são criptografados. Qualquer pessoa com acesso ao arquivo pode ler o conteúdo com uma ferramenta SQLite. Backup, JSON e miniaturas também podem expor informações. O aplicativo não oferece senha de proteção do banco.", "Guarde apenas conteúdos cotidianos: ideias, instruções genéricas, modelos e referências sem dados privados. Não armazene senhas, chaves de API, tokens, documentos pessoais, dados financeiros, médicos ou informações confidenciais de clientes. Para exemplos, use dados fictícios ou anonimizados.", "O Prompchu não envia prompts automaticamente à internet. Mas copiar um texto para uma IA externa, enviar um banco a alguém ou guardá-lo em uma pasta sincronizada pode levar os dados para fora do computador. Revise também notas, negativos e imagens antes de compartilhar.", "No Windows, o banco padrão costuma estar em %APPDATA%\\Bugzinho\\BancoDePrompts\\prompts.sqlite3. Bancos criados por você ficam no local escolhido. Consulte o caminho no programa; mantenha backups em local protegido e não anexe bancos privados a relatos de erro."], ["Resolver dúvidas comuns", "Não encontro um prompt: confirme o banco aberto, use <ui>Limpar filtros</ui> e verifique páginas, favoritos, prateleira e datas. Se o contador mostrar resultados, pode ser necessário avançar de página. Se abriu outro banco, sua coleção anterior continua no arquivo original.", "Não consigo abrir um arquivo: extraia-o do ZIP e confirme que é um SQLite do Prompchu, não um JSON ou outro formato renomeado. Verifique se a pasta permite escrita. Preserve o original e tente abrir uma cópia de backup; não apague seus dados para testar.", "Minha miniatura não aparece: confirme JPG/PNG, tamanho e resolução, depois salve a edição. Cartões sem imagem são normais. Prompt repetido após importar ou unir também é esperado: essas operações não removem duplicatas.", "Em <ui>Sobre</ui>, consulte versão e links oficiais. Ao abrir uma Issue, informe sistema, versão e passos para reproduzir, usando exemplos fictícios. Os links abaixo levam ao repositório, releases, site Bugzinho e doações."]], "examples": [["Imagem de produto", "Crie uma imagem de [PRODUTO] para [FINALIDADE]. Preserve forma, proporções e materiais. Use fundo [FUNDO], luz [ILUMINAÇÃO] e enquadramento [PLANO]. Reserve espaço para texto adicionado depois. Entrega: uma composição em [FORMATO]. Se faltar uma referência essencial, pergunte antes de gerar.", "Prateleira: Imagens • Tags: produto, estúdio, reutilizável"], ["Vídeo de tutorial", "Planeje um tutorial de [DURAÇÃO] para ensinar [TAREFA] a [PÚBLICO]. Use somente estes dados: [MATERIAL]. Entregue uma tabela com tempo estimado, imagem, narração e texto na tela. Inclua pré-requisitos, etapas e uma verificação final. Marque o que precisa ser confirmado; não invente recursos.", "Prateleira: Vídeos • Tags: tutorial, roteiro, educativo"], ["Resumo de reunião", "Transforme [ANOTAÇÕES] em um resumo com: objetivo, decisões, ações, responsáveis e prazos. Não invente nomes nem datas; escreva “não informado” quando faltar algo. Separe decisões de sugestões. Entregue um resumo curto e uma tabela de ações. Use dados fictícios antes de salvar este modelo.", "Prateleira: Documentos • Tags: reunião, resumo, ações"], ["Revisão de código", "Revise [CÓDIGO] em [LINGUAGEM] considerando [COMPORTAMENTO ESPERADO]. Priorize erros de lógica, casos extremos e tratamento de falhas. Para cada achado, explique impacto e correção mínima. Proponha testes observáveis. Se faltar contexto para concluir, diga qual informação é necessária. Não inclua segredos ou credenciais.", "Prateleira: Programação • Tags: revisão, testes, código"]]}, "en": {"eyebrow": "MANUAL • TUTORIAL • GOOD PRACTICES", "hero": "A home for your best ideas.", "intro": "Learn to save, find and reuse prompts in Prompchu. From your first entry to independent collections, with instructions that follow the interface.", "download": "Download the app", "start": "Start the tutorial", "search": "Search this guide…", "language": "Language", "motion": "Animations", "on": "On", "off": "Off", "menu": "Browse the guide", "close": "Close", "zoom": "Enlarge screenshot", "copy": "Copy template", "copied": "Copied!", "copyFail": "Select the text and copy it manually.", "noResults": "No matching topic. Try another term.", "clear": "Clear search", "privacyBadge": "Local does not mean encrypted", "version": "Documented version", "sectionsLabel": "In this guide", "screenshotNote": "Actual English screenshots with fictional data. Some application messages may still appear in Portuguese.", "site": "Bugzinho website", "repo": "Repository", "donate": "Support the project", "releases": "Releases and downloads", "examplesLink": "Download useful databases", "top": "Back to top", "print": "Print / save PDF", "exampleTitle": "Templates you can adapt", "exampleIntro": "Replace the bracketed fields. Copy a template, create an entry in the app and save it. Prompchu stores the text; you run it in your chosen tool.", "shortcutTitle": "Application shortcuts", "shortcutNames": ["New prompt", "Edit selected", "Search current screen", "Copy selected"], "stats": ["languages", "optional databases", "reusable templates"], "footer": "Independent documentation for Prompchu. No account, translation APIs or prompt uploads on this page. Language and motion preferences are stored only in this browser.", "sections": [["Meet Prompchu", "Prompchu is a desktop prompt organizer: a place for instructions that guide an AI tool or another process. Save context, constraints and notes so you can reuse what worked. It does not generate media or answers, execute prompts or require an API key.", "Version {{VERSION}} brings together a card Library, thumbnails, favorites, custom shelves and independent databases. Your content stays on your computer. Use it for everyday tasks; the database is not a vault."], ["Download and launch", "Open the releases link and choose your system. On 64-bit Windows 10/11, download Windows-AMD64.zip, extract the entire folder and open Prompchu.exe inside it. Do not run from inside the ZIP or separate the executable from its other files.", "On Linux x86_64, extract the tar.gz and run ./Prompchu/Prompchu in a graphical environment with the required Qt/X11/OpenGL libraries. Built on Ubuntu 22.04; not an AppImage. On Apple Silicon macOS, extract Darwin-arm64.zip and open Prompchu.app; targets macOS 15+, not Intel. Python is included.", "Packages have no Authenticode signature or Apple notarization. SHA256SUMS.txt checks download integrity, not authorship. Use official links. Launch the application and select your interface language on the main screen."], ["Your first prompt", "Click <ui>Novo prompt</ui>. Give <ui>Nome *</ui> a descriptive title, such as “Product photo — clean background”. Enter the complete instructions in Prompt. Both fields are required.", "Use <ui>Tags (separadas por vírgula)</ui> for terms such as product, studio, reusable; <ui>Gêneros (separados por vírgula)</ui> for styles; <ui>Categoria</ui> for task type; and <ui>Modelo / ferramenta</ui> to record the intended tool. This field is a note, not an AI connection.", "Choose <ui>Prateleira</ui>, use <ui>Prompt negativo</ui> for things to avoid, and <ui>Notas</ui> for variables, tips and test results. Click <ui>Salvar</ui>. Negative instructions are stored separately; copy them when the destination tool supports their use.", "Select the entry on the main screen to read its tabs. <ui>Copiar prompt</ui> copies the main text. Use <ui>Editar</ui> to change it, <ui>Duplicar</ui> to try a variation, and <ui>Excluir</ui> to remove it after confirmation. Typing in the editor is not the same as saving."], ["Explore the Library", "Click <ui>Biblioteca</ui>. Cards show title, tags and date added; an image is optional. Click a card to return to the main screen with that prompt open. <ui>Voltar</ui> also returns to the main screen.", "Search covers names, text and metadata, ignoring case and accents. Combine shelf, category, genre and <ui>Favoritos</ui>. Comma-separated tags must all be present. Enable <ui>Data de adição</ui> to restrict the date range.", "Sort by <ui>Mais recentes</ui>, <ui>Mais antigos</ui>, <ui>Nome A–Z</ui> or <ui>Atualizados</ui>. If entries seem missing, use <ui>Limpar filtros</ui>. The Library displays 24 cards per page; the main list, 100 entries. Use <ui>Anterior</ui> and <ui>Próxima</ui> to browse. Search queries the whole database, not just the visible page."], ["Shelves and thumbnails", "Above the shelf list on the left, click <ui>Criar prateleira</ui>. Enter a name such as “Personal projects” and click <ui>Salvar</ui>. It becomes available in the editor and filters even when empty. Custom shelves belong to the current database.", "Names are limited to 80 characters. Empty or duplicate names, ignoring case and accents, are rejected. To assign a prompt, open <ui>Editar</ui>, select the new <ui>Prateleira</ui> and save. Creating a shelf does not move entries automatically.", "<ui>Escolher miniatura</ui> accepts JPG or PNG up to 20 MB and 40 megapixels. Images are resized to fit within 640 × 400 and stored in SQLite, so you can move the original file afterward. <ui>Remover miniatura</ui> restores the default card; confirm with <ui>Salvar</ui>."], ["Create and switch databases", "A database is a .sqlite3 file containing prompts, dates, favorites, thumbnails and shelves. It is neither an account nor an image folder. Separate work, studies and projects into different files wherever you choose.", "In <ui>Arquivo</ui>, choose <ui>Criar banco</ui> to save an empty collection in a new file. <ui>Abrir banco</ui> selects an existing collection. Switching happens in the same window, committing pending writes in the previous database first.", "The current name appears below the header; hover to see the full path. The last opened database is remembered. Switching clears screen filters and loads the new collection's options. Additions, deletions and favorites are persisted automatically; editor changes require <ui>Salvar</ui>."], ["Backup, merge and transfer", "For a complete copy, use <ui>Arquivo</ui> and <ui>Backup do banco</ui>. Choose a different file and keep another copy on a separate device. Backups include images and empty shelves. Use <ui>Abrir banco</ui> to inspect or restore the copy.", "<ui>Juntar bancos</ui> asks for two source files and a new destination. Their contents are combined into a third database, which opens afterward. Originals, dates, favorites, images and empty shelves are preserved. Duplicate prompts remain; there is no automatic deduplication.", "To transfer one item, select it, use <ui>Exportar prompt</ui>, save the JSON, open the destination database and use <ui>Importar prompt</ui>. Export includes only the selected prompt, its metadata and thumbnail. Import adds rather than replaces. Reimporting creates copies and resets the added date to the import date.", "The current version imports JSON v1/v2 and exports v2. Prompchu 1.2.0 cannot import v2. JSON transfers prompts; SQLite opens a complete collection. Back up older databases before upgrading."], ["Write reusable prompts", "A useful template defines objective, context, available material, constraints and output format. “Write something good” is vague; “Summarize [TEXT] in five bullets for [AUDIENCE], preserving numbers and marking gaps” gives criteria for evaluating the answer.", "Use [BRACKETED FIELDS] and explain them in your notes. Prompchu does not replace variables automatically. Separate instructions from reference material and say what to do when information is missing. Do not ask the tool to invent sources or facts to fill gaps.", "Prefer one main goal per template. Test with non-sensitive examples, review results and use <ui>Duplicar</ui> before heavily changing a working version. Record changes and successful use cases in the notes. More words do not guarantee quality; concrete, checkable instructions help more."], ["Optional useful databases", "{{EXAMPLES_FILE}} contains nine databases with 60 entries each: Images, Videos, Documents, Programming, Music, Studies, Marketing, Writing and Productivity. The 540 templates are in Portuguese: 20 tasks per area, each with create, review and adapt versions.", "Download the separate ZIP, extract it and use <ui>Arquivo</ui> and <ui>Abrir banco</ui> to choose a .sqlite3 file. Nothing is installed or imported automatically. Replace placeholders before use. Changes are permanent; extract the ZIP again to recover the original examples.", "Downloading the app does not fill your collection with these examples. Transfer a few through prompt export/import, or merge databases to combine complete collections."], ["Languages, appearance and shortcuts", "The application offers exactly the ten languages in this tutorial's selector. Choose a language on the main screen; controls change, but prompts, names and notes are not translated. Some technical messages still appear in Portuguese.", "<ui>Neon</ui> controls glowing outlines; <ui>Animações</ui> controls movement. Disabling motion can leave a static neon outline. Preferences and window size are remembered. This website's animation setting is independent of the app's.", "Screenshots stay in English. In other tutorial languages, control names appear in English followed by their translation. The shortcuts below apply to the application, not this webpage."], ["Privacy: not a vault", "Databases are NOT encrypted. Anyone with access to the file can read it using a SQLite tool. Backups, JSON exports and thumbnails can expose information too. The app does not provide database password protection.", "Store everyday content only: ideas, generic instructions, templates and references without private data. Do not store passwords, API keys, tokens, personal documents, financial or medical data, or confidential client information. Use fictional or anonymized examples.", "Prompchu does not automatically upload prompts. But copying text to an external AI, sending someone a database or placing it in a synced folder can move data off your computer. Review notes, negative prompts and images before sharing.", "On Windows, the default database is usually at %APPDATA%\\Bugzinho\\BancoDePrompts\\prompts.sqlite3. Your own databases remain where you saved them. Check the path in the app, protect backups and never attach private databases to bug reports."], ["Common questions", "Cannot find an entry? Check the open database, use <ui>Limpar filtros</ui> and check pages, favorites, shelf and dates. If the counter shows results, you may need another page. Opening another database does not erase the previous file.", "Cannot open a file? Extract it from the ZIP and confirm it is a Prompchu SQLite database, not JSON or a renamed format. Check folder write permissions. Preserve the original and try a backup copy; do not delete your data to troubleshoot.", "Missing thumbnail? Check JPG/PNG format, size and resolution, then save the edit. Cards without images are normal. Duplicates after importing or merging are expected because those operations do not remove repeated entries.", "Open <ui>Sobre</ui> for the version and official links. When reporting an Issue, include your system, version and reproduction steps using fictional data. Links below lead to the repository, releases, Bugzinho website and donations."]], "examples": [["Product image", "Create an image of [PRODUCT] for [PURPOSE]. Preserve shape, proportions and materials. Use [BACKGROUND], [LIGHTING] and [CAMERA ANGLE]. Leave space for text added later. Output one composition in [ASPECT RATIO]. If an essential reference is missing, ask before generating.", "Shelf: Images • Tags: product, studio, reusable"], ["Tutorial video", "Plan a [DURATION] tutorial teaching [TASK] to [AUDIENCE]. Use only this information: [MATERIAL]. Return a table with estimated time, visuals, narration and on-screen text. Include prerequisites, steps and a final check. Flag unconfirmed details; do not invent features.", "Shelf: Videos • Tags: tutorial, script, educational"], ["Meeting summary", "Turn [NOTES] into a summary with goal, decisions, actions, owners and deadlines. Do not invent names or dates; use “not provided” for missing information. Separate decisions from suggestions. Return a short summary and an action table. Use fictional data before saving this template.", "Shelf: Documents • Tags: meeting, summary, actions"], ["Code review", "Review [CODE] in [LANGUAGE] against [EXPECTED BEHAVIOR]. Prioritize logic errors, edge cases and failure handling. Explain impact and the smallest correction for each finding. Suggest observable tests. If context is missing, identify the information needed. Do not include secrets or credentials.", "Shelf: Programming • Tags: review, tests, code"]]}, "es": {"eyebrow": "MANUAL • TUTORIAL • BUENAS PRÁCTICAS", "hero": "Un hogar para tus mejores ideas.", "intro": "Aprende a guardar, encontrar y reutilizar prompts, desde el primer registro hasta colecciones independientes.", "download": "Descargar aplicación", "start": "Comenzar tutorial", "search": "Buscar en esta guía…", "language": "Idioma", "motion": "Animaciones", "on": "Activadas", "off": "Desactivadas", "menu": "Explorar la guía", "close": "Cerrar", "zoom": "Ampliar captura", "copy": "Copiar modelo", "copied": "¡Copiado!", "copyFail": "Selecciona el texto y cópialo manualmente.", "noResults": "No hay temas coincidentes. Prueba otro término.", "clear": "Limpiar búsqueda", "privacyBadge": "Local no significa cifrado", "version": "Versión documentada", "sectionsLabel": "En esta guía", "screenshotNote": "Capturas reales en inglés con datos ficticios. Algunos avisos del programa pueden aparecer en portugués.", "site": "Sitio Bugzinho", "repo": "Repositorio", "donate": "Apoyar el proyecto", "releases": "Releases y descargas", "examplesLink": "Descargar bases útiles", "top": "Volver arriba", "print": "Imprimir / guardar PDF", "exampleTitle": "Modelos para adaptar", "exampleIntro": "Sustituye los campos entre corchetes, copia el modelo y guárdalo como registro. Prompchu conserva el texto; lo ejecutas en la herramienta que elijas.", "shortcutTitle": "Atajos de la aplicación", "footer": "Documentación independiente de Prompchu. Esta página no usa cuentas, APIs de traducción ni envía prompts. Idioma y movimiento se guardan solo en este navegador.", "shortcutNames": ["Nuevo prompt", "Editar seleccionado", "Buscar en pantalla actual", "Copiar seleccionado"], "stats": ["idiomas", "bases opcionales", "modelos reutilizables"], "sections": [["Conoce Prompchu", "Prompchu organiza prompts en el escritorio: instrucciones para una herramienta de IA u otro proceso. Guarda contexto, restricciones y notas para reutilizar lo que funcionó. No genera contenido, no ejecuta prompts y no necesita una clave API.", "La versión {{VERSION}} incluye tarjetas, miniaturas, favoritos, estantes personalizados y bases independientes. Los datos permanecen en el equipo. Úsalo para tareas cotidianas, no como una caja fuerte."], ["Descargar y abrir", "En los releases, elige tu sistema. Windows 10/11 de 64 bits: descarga Windows-AMD64.zip, extrae toda la carpeta y abre Prompchu.exe dentro de ella. No lo ejecutes dentro del ZIP ni separes el ejecutable de sus archivos.", "Linux x86_64: extrae el tar.gz y ejecuta ./Prompchu/Prompchu con entorno gráfico y bibliotecas Qt/X11/OpenGL. Compilado en Ubuntu 22.04; no es AppImage. macOS Apple Silicon: extrae Darwin-arm64.zip y abre Prompchu.app; requiere macOS 15+, no Intel. Python viene incluido.", "No hay firma Authenticode ni notarización Apple. SHA256SUMS.txt verifica integridad, no autoría. Usa los enlaces oficiales y selecciona el idioma en la pantalla inicial."], ["Tu primer prompt", "Pulsa <ui>Novo prompt</ui>. En <ui>Nome *</ui>, escribe un título descriptivo, como “Foto de producto — fondo limpio”. En Prompt, introduce la instrucción completa. Ambos campos son obligatorios.", "Usa <ui>Tags (separadas por vírgula)</ui> para términos separados por comas, <ui>Gêneros (separados por vírgula)</ui> para estilos, <ui>Categoria</ui> para el tipo de tarea y <ui>Modelo / ferramenta</ui> para anotar la herramienta prevista. Este último campo no conecta con una IA.", "Elige <ui>Prateleira</ui>. Registra lo que evitar en <ui>Prompt negativo</ui> y variables, consejos o resultados en <ui>Notas</ui>. Pulsa <ui>Salvar</ui>. El negativo se guarda aparte: cópialo cuando la herramienta de destino admita ese uso.", "Selecciona el registro para leer sus pestañas. <ui>Copiar prompt</ui> copia el texto principal. Usa <ui>Editar</ui>, <ui>Duplicar</ui> para probar variaciones y <ui>Excluir</ui> para eliminar con confirmación. Escribir en el editor no equivale a guardar."], ["Explorar la Biblioteca", "Pulsa <ui>Biblioteca</ui>. Las tarjetas muestran título, etiquetas y fecha; la imagen es opcional. Al pulsar una, vuelves a la pantalla inicial con el prompt abierto. <ui>Voltar</ui> también vuelve.", "La búsqueda consulta nombre, texto y metadatos sin distinguir mayúsculas ni acentos. Combina estante, categoría, género y <ui>Favoritos</ui>. Las etiquetas separadas por comas deben estar todas presentes. Activa <ui>Data de adição</ui> para limitar fechas.", "Ordena por <ui>Mais recentes</ui>, <ui>Mais antigos</ui>, <ui>Nome A–Z</ui> o <ui>Atualizados</ui>. <ui>Limpar filtros</ui> recupera la vista sin restricciones. Hay 24 tarjetas por página y 100 registros por página en la lista inicial. Usa <ui>Anterior</ui> y <ui>Próxima</ui>; la búsqueda abarca toda la base."], ["Estantes y miniaturas", "Pulsa <ui>Criar prateleira</ui> encima de la lista izquierda, escribe un nombre y confirma con <ui>Salvar</ui>. El estante aparece en el editor y los filtros aunque esté vacío. Pertenece a la base abierta.", "Máximo 80 caracteres. No se admiten nombres vacíos ni repetidos, ignorando mayúsculas y acentos. Para asignar un registro, abre <ui>Editar</ui>, elige <ui>Prateleira</ui> y guarda. Crear un estante no mueve registros.", "<ui>Escolher miniatura</ui> admite JPG/PNG de hasta 20 MB y 40 megapíxeles. La imagen se reduce a un máximo de 640 × 400 y se guarda en SQLite; puedes mover el original. <ui>Remover miniatura</ui> restaura la tarjeta predeterminada. Confirma con <ui>Salvar</ui>."], ["Crear y cambiar bases", "Una base es un archivo .sqlite3 con prompts, fechas, favoritos, imágenes y estantes. No es una cuenta ni una carpeta de imágenes. Puedes separar trabajo, estudios y proyectos en distintos archivos.", "En <ui>Arquivo</ui>, <ui>Criar banco</ui> crea una colección vacía en un archivo nuevo. <ui>Abrir banco</ui> abre una existente en la misma ventana, confirmando antes las escrituras pendientes de la anterior.", "El nombre aparece bajo el encabezado; pasa el ratón para ver la ruta. Se recuerda la última base. Al cambiar, los filtros se limpian y sus opciones reflejan la nueva colección. Altas, eliminaciones y favoritos se guardan automáticamente; el formulario requiere <ui>Salvar</ui>."], ["Copia, unión y transferencia", "Usa <ui>Arquivo</ui> y <ui>Backup do banco</ui> para una copia completa en otro archivo. Conserva otra copia en otro dispositivo. Incluye miniaturas y estantes vacíos; ábrela mediante <ui>Abrir banco</ui>.", "<ui>Juntar bancos</ui> pide dos archivos y un destino nuevo. Crea y abre una tercera base, conservando originales, fechas, favoritos, imágenes y estantes vacíos. Los duplicados se mantienen; no hay deduplicación automática.", "Para mover un elemento, selecciónalo, usa <ui>Exportar prompt</ui>, guarda el JSON, abre el destino y usa <ui>Importar prompt</ui>. Exporta solo el seleccionado con metadatos e imagen. Importar añade, no reemplaza; repetir crea copias y la fecha de alta pasa a ser la de importación.", "Importa JSON v1/v2 y exporta v2; Prompchu 1.2.0 no importa v2. JSON transfiere prompts; SQLite abre colecciones completas. Haz una copia antes de actualizar bases antiguas."], ["Prompts reutilizables", "Define objetivo, contexto, materiales, restricciones y formato. “Resume [TEXTO] en cinco puntos para [PÚBLICO], conserva cifras y señala lagunas” permite evaluar el resultado mejor que “haz un buen texto”.", "Usa [CAMPOS ENTRE CORCHETES] y explica su uso en las notas. Prompchu no sustituye variables automáticamente. Separa instrucciones de referencias e indica qué hacer si falta información. No pidas inventar fuentes o datos.", "Prefiere un objetivo principal, prueba con ejemplos no sensibles y revisa la respuesta. Usa <ui>Duplicar</ui> antes de cambiar mucho una versión útil. Anota cambios y situaciones donde funciona mejor. Más palabras no garantizan calidad; ayudan las instrucciones concretas y verificables."], ["Bases útiles opcionales", "{{EXAMPLES_FILE}} contiene nueve bases de 60 registros: Imágenes, Vídeos, Documentos, Programación, Música, Estudios, Marketing, Escritura y Productividad. Son 540 modelos en portugués: 20 tareas por área, con versiones para crear, revisar y adaptar.", "Descarga el ZIP separado, extráelo y elige un .sqlite3 con <ui>Arquivo</ui> y <ui>Abrir banco</ui>. No se instala ni importa nada automáticamente. Sustituye los campos antes de usar. Los cambios se guardan; extrae de nuevo para recuperar los originales.", "Descargar la aplicación no llena tu colección. Transfiere elementos individuales por JSON o une bases para combinar colecciones completas."], ["Idiomas, apariencia y atajos", "La aplicación ofrece los mismos diez idiomas del selector de este tutorial. Cambiar el idioma modifica controles, no prompts, nombres ni notas. Algunos avisos técnicos siguen en portugués.", "<ui>Neon</ui> controla los bordes luminosos y <ui>Animações</ui> el movimiento. Puedes mantener neón estático. Se recuerdan preferencias y tamaño de ventana. La animación de esta página se controla independientemente.", "Las capturas permanecen en inglés; los controles se muestran en inglés con traducción al lado. Los atajos siguientes pertenecen al programa, no a esta página."], ["Privacidad: no es una caja fuerte", "Las bases NO están cifradas. Quien tenga el archivo puede leerlo con SQLite. Copias, JSON y miniaturas también pueden revelar información. No existe protección del banco mediante contraseña.", "Guarda únicamente ideas, instrucciones genéricas y referencias cotidianas sin datos privados. No guardes contraseñas, claves API, tokens, documentos personales, datos financieros o médicos ni información confidencial de clientes. Usa ejemplos ficticios o anonimizados.", "Prompchu no envía prompts automáticamente. Sin embargo, copiarlos a una IA externa, compartir la base o usar una carpeta sincronizada puede sacar datos del equipo. Revisa notas, negativos e imágenes antes de compartir.", "En Windows, la ruta habitual es %APPDATA%\\Bugzinho\\BancoDePrompts\\prompts.sqlite3. Las bases creadas por ti quedan donde elegiste. Consulta la ruta, protege las copias y no adjuntes bases privadas en informes de errores."], ["Resolver dudas", "¿Falta un prompt? Comprueba la base abierta, <ui>Limpar filtros</ui>, páginas, favoritos, estante y fechas. Si hay resultados, avanza de página. Abrir otra base no borra el archivo anterior.", "¿No abre? Extrae el archivo del ZIP y comprueba que es SQLite de Prompchu, no JSON ni un formato renombrado. Revisa permisos de escritura. Conserva el original y prueba una copia; no borres datos para investigar.", "Si falta una miniatura, revisa formato, tamaño y resolución, y guarda la edición. Las tarjetas sin imagen son normales. También son normales los duplicados después de importar o unir.", "En <ui>Sobre</ui> están la versión y enlaces oficiales. Para una Issue, indica sistema, versión y pasos con datos ficticios. Abajo están repositorio, releases, sitio Bugzinho y donaciones."]], "examples": [["Imagen de producto", "Crea una imagen de [PRODUCTO] para [FINALIDAD]. Conserva forma, proporciones y materiales. Usa [FONDO], [ILUMINACIÓN] y [ENCUADRE]. Reserva espacio para texto añadido después. Entrega una composición en [FORMATO]. Si falta una referencia esencial, pregunta antes de generar.", "Estante: Imágenes • Tags: producto, estudio, reutilizable"], ["Vídeo tutorial", "Planifica un tutorial de [DURACIÓN] para enseñar [TAREA] a [PÚBLICO]. Usa solo [MATERIAL]. Entrega una tabla con tiempo estimado, imagen, narración y texto en pantalla. Incluye requisitos, pasos y comprobación final. Señala lo no confirmado; no inventes funciones.", "Estante: Vídeos • Tags: tutorial, guion, educativo"], ["Resumen de reunión", "Convierte [NOTAS] en objetivo, decisiones, acciones, responsables y plazos. No inventes nombres o fechas; usa “no informado” si falta algo. Separa decisiones de sugerencias. Entrega un resumen breve y una tabla de acciones. Usa datos ficticios antes de guardar el modelo.", "Estante: Documentos • Tags: reunión, resumen, acciones"], ["Revisión de código", "Revisa [CÓDIGO] en [LENGUAJE] según [COMPORTAMIENTO ESPERADO]. Prioriza errores lógicos, casos límite y gestión de fallos. Explica impacto y corrección mínima de cada hallazgo. Sugiere pruebas observables. Si falta contexto, indica qué necesitas. No incluyas secretos ni credenciales.", "Estante: Programación • Tags: revisión, pruebas, código"]]}, "fr": {"eyebrow": "MANUEL • TUTORIEL • BONNES PRATIQUES", "hero": "Un espace pour vos meilleures idées.", "intro": "Apprenez à enregistrer, retrouver et réutiliser vos prompts, de la première entrée aux collections indépendantes.", "download": "Télécharger l’application", "start": "Commencer le tutoriel", "search": "Rechercher dans ce guide…", "language": "Langue", "motion": "Animations", "on": "Activées", "off": "Désactivées", "menu": "Parcourir le guide", "close": "Fermer", "zoom": "Agrandir la capture", "copy": "Copier le modèle", "copied": "Copié !", "copyFail": "Sélectionnez le texte et copiez-le manuellement.", "noResults": "Aucun sujet trouvé. Essayez un autre terme.", "clear": "Effacer la recherche", "privacyBadge": "Local ne signifie pas chiffré", "version": "Version documentée", "sectionsLabel": "Dans ce guide", "screenshotNote": "Captures réelles en anglais avec données fictives. Certains messages de l’application peuvent rester en portugais.", "site": "Site Bugzinho", "repo": "Dépôt", "donate": "Soutenir le projet", "releases": "Releases et téléchargements", "examplesLink": "Télécharger les bases utiles", "top": "Retour en haut", "print": "Imprimer / enregistrer en PDF", "exampleTitle": "Des modèles à adapter", "exampleIntro": "Remplacez les champs entre crochets, copiez le modèle et enregistrez une entrée. Prompchu conserve le texte ; vous l’exécutez dans l’outil choisi.", "shortcutTitle": "Raccourcis de l’application", "footer": "Documentation indépendante de Prompchu. Aucun compte, API de traduction ou envoi de prompts sur cette page. Langue et mouvement sont mémorisés uniquement dans ce navigateur.", "shortcutNames": ["Nouveau prompt", "Modifier la sélection", "Rechercher sur l’écran", "Copier la sélection"], "stats": ["langues", "bases facultatives", "modèles réutilisables"], "sections": [["Découvrir Prompchu", "Prompchu organise vos prompts sur ordinateur : des instructions pour un outil d’IA ou un autre processus. Conservez contexte, contraintes et notes pour réutiliser ce qui fonctionne. Il ne génère pas de contenu, n’exécute pas les prompts et ne demande pas de clé API.", "La version {{VERSION}} réunit bibliothèque de cartes, miniatures, favoris, étagères personnalisées et bases indépendantes. Le contenu reste sur votre ordinateur. Réservez-le aux usages courants, pas aux secrets."], ["Télécharger et démarrer", "Choisissez votre système dans les releases. Windows 10/11 64 bits : téléchargez Windows-AMD64.zip, extrayez tout le dossier et ouvrez Prompchu.exe à l’intérieur. Ne lancez pas l’application dans le ZIP et gardez tous les fichiers ensemble.", "Linux x86_64 : extrayez le tar.gz et lancez ./Prompchu/Prompchu avec un environnement graphique et les bibliothèques Qt/X11/OpenGL. Compilation Ubuntu 22.04, pas une AppImage. macOS Apple Silicon : extrayez Darwin-arm64.zip et ouvrez Prompchu.app ; cible macOS 15+, pas Intel. Python est inclus.", "Les paquets ne sont ni signés Authenticode ni notariés par Apple. SHA256SUMS.txt vérifie l’intégrité, pas l’identité de l’auteur. Utilisez les liens officiels et choisissez la langue sur l’écran principal."], ["Votre premier prompt", "Cliquez sur <ui>Novo prompt</ui>. Dans <ui>Nome *</ui>, indiquez un titre précis, par exemple « Photo de produit — fond propre ». Dans Prompt, saisissez les instructions complètes. Ces deux champs sont obligatoires.", "Utilisez <ui>Tags (separadas por vírgula)</ui> pour des mots séparés par des virgules, <ui>Gêneros (separados por vírgula)</ui> pour les styles, <ui>Categoria</ui> pour le type de tâche et <ui>Modelo / ferramenta</ui> pour noter l’outil visé. Ce dernier champ ne connecte aucune IA.", "Choisissez <ui>Prateleira</ui>, indiquez ce qu’il faut éviter dans <ui>Prompt negativo</ui> et les variables, conseils et résultats dans <ui>Notas</ui>. Cliquez sur <ui>Salvar</ui>. Le négatif est séparé : copiez-le si l’outil destinataire le prend en charge.", "Sélectionnez une entrée pour lire ses onglets. <ui>Copiar prompt</ui> copie le texte principal. <ui>Editar</ui> modifie, <ui>Duplicar</ui> permet une variante et <ui>Excluir</ui> supprime après confirmation. Saisir n’est pas enregistrer."], ["Explorer la bibliothèque", "Cliquez sur <ui>Biblioteca</ui>. Chaque carte montre titre, tags et date ; l’image est facultative. Un clic ouvre le prompt sur l’écran principal. <ui>Voltar</ui> permet aussi de revenir.", "La recherche porte sur noms, textes et métadonnées, sans distinguer casse ni accents. Combinez étagère, catégorie, genre et <ui>Favoritos</ui>. Tous les tags séparés par des virgules doivent être présents. Activez <ui>Data de adição</ui> pour limiter les dates.", "Triez avec <ui>Mais recentes</ui>, <ui>Mais antigos</ui>, <ui>Nome A–Z</ui> ou <ui>Atualizados</ui>. Utilisez <ui>Limpar filtros</ui> si des éléments semblent manquer. La bibliothèque affiche 24 cartes par page, la liste principale 100 entrées. <ui>Anterior</ui> et <ui>Próxima</ui> changent de page ; la recherche couvre toute la base."], ["Étagères et miniatures", "Cliquez sur <ui>Criar prateleira</ui> au-dessus de la liste de gauche, saisissez un nom et confirmez avec <ui>Salvar</ui>. L’étagère reste disponible dans l’éditeur et les filtres même vide. Elle appartient à la base ouverte.", "Maximum 80 caractères ; les noms vides ou déjà présents, sans distinction de casse et d’accents, sont refusés. Pour affecter un prompt, utilisez <ui>Editar</ui>, choisissez <ui>Prateleira</ui> et enregistrez. La création ne déplace aucune entrée.", "<ui>Escolher miniatura</ui> accepte JPG/PNG jusqu’à 20 Mo et 40 mégapixels. L’image est réduite à 640 × 400 au maximum et stockée dans SQLite ; vous pouvez déplacer l’original. <ui>Remover miniatura</ui> rétablit la carte standard. Confirmez avec <ui>Salvar</ui>."], ["Créer et changer de base", "Une base est un fichier .sqlite3 contenant prompts, dates, favoris, images et étagères. Ce n’est ni un compte ni un dossier d’images. Séparez travail, études et projets dans différents fichiers.", "Dans <ui>Arquivo</ui>, <ui>Criar banco</ui> crée une collection vide dans un nouveau fichier. <ui>Abrir banco</ui> ouvre une collection existante dans la même fenêtre, après validation des écritures en attente dans la précédente.", "Le nom apparaît sous l’en-tête ; survolez-le pour voir le chemin. La dernière base est mémorisée. Changer de base efface les filtres affichés et recharge ses options. Ajouts, suppressions et favoris sont persistés ; le formulaire exige <ui>Salvar</ui>."], ["Sauvegarder, fusionner et transférer", "Utilisez <ui>Arquivo</ui> puis <ui>Backup do banco</ui> pour une copie complète dans un autre fichier. Gardez aussi une copie sur un autre appareil. Images et étagères vides sont incluses. Ouvrez la sauvegarde via <ui>Abrir banco</ui>.", "<ui>Juntar bancos</ui> demande deux sources et une nouvelle destination. Une troisième base est créée puis ouverte, sans modifier les originaux. Dates, favoris, images et étagères vides sont conservés. Les doublons restent présents.", "Pour transférer un seul élément : sélectionnez-le, utilisez <ui>Exportar prompt</ui>, enregistrez le JSON, ouvrez la destination et utilisez <ui>Importar prompt</ui>. Seul le prompt sélectionné, ses métadonnées et sa miniature sont exportés. L’import ajoute sans remplacer ; le répéter crée des copies et la date d’ajout devient celle de l’import.", "La version actuelle importe JSON v1/v2 et exporte v2. Prompchu 1.2.0 n’importe pas v2. JSON transfère des prompts ; SQLite ouvre des collections complètes. Sauvegardez avant une mise à niveau."], ["Des prompts réutilisables", "Définissez objectif, contexte, ressources, contraintes et format de sortie. « Résume [TEXTE] en cinq points pour [PUBLIC], conserve les nombres et signale les lacunes » est plus vérifiable que « écris un bon texte ».", "Utilisez des [CHAMPS ENTRE CROCHETS] et expliquez-les dans les notes. Prompchu ne remplace pas automatiquement les variables. Séparez consignes et références ; précisez quoi faire s’il manque une information. Ne demandez pas d’inventer des sources ou des faits.", "Gardez un objectif principal, testez avec des exemples non sensibles et vérifiez le résultat. Utilisez <ui>Duplicar</ui> avant de modifier fortement une version utile. Notez les changements et les cas réussis. La longueur ne garantit pas la qualité ; des consignes concrètes et vérifiables sont plus utiles."], ["Bases utiles facultatives", "{{EXAMPLES_FILE}} contient neuf bases de 60 entrées : Images, Vidéos, Documents, Programmation, Musique, Études, Marketing, Écriture et Productivité. Les 540 modèles sont en portugais : 20 tâches par domaine avec variantes créer, réviser et adapter.", "Téléchargez le ZIP séparé, extrayez-le puis choisissez un .sqlite3 avec <ui>Arquivo</ui> et <ui>Abrir banco</ui>. Rien n’est installé ou importé automatiquement. Remplacez les champs avant usage. Les modifications sont conservées ; réextrayez le ZIP pour retrouver les originaux.", "Le téléchargement du programme ne remplit pas votre collection. Transférez quelques éléments par JSON ou fusionnez les bases pour réunir des collections entières."], ["Langues, apparence et raccourcis", "L’application propose les dix langues du sélecteur de ce guide. Changer la langue traduit les commandes, pas les prompts, noms ou notes. Certains messages techniques restent en portugais.", "<ui>Neon</ui> contrôle les contours lumineux ; <ui>Animações</ui> contrôle le mouvement. Le néon peut rester statique. Préférences et taille de fenêtre sont mémorisées. L’animation de ce site possède son propre réglage.", "Les captures restent en anglais ; les commandes sont indiquées en anglais avec leur traduction. Les raccourcis ci-dessous concernent le programme, pas la page."], ["Confidentialité : pas un coffre-fort", "Les bases ne sont PAS chiffrées. Toute personne ayant accès au fichier peut le lire avec SQLite. Sauvegardes, JSON et miniatures peuvent aussi révéler des informations. Le programme ne protège pas la base par mot de passe.", "Stockez uniquement idées, consignes génériques et références courantes sans données privées. N’y placez ni mots de passe, clés API, jetons, documents personnels, données financières ou médicales, ni informations confidentielles de clients. Utilisez des exemples fictifs ou anonymisés.", "Prompchu n’envoie pas automatiquement vos prompts. Cependant, les copier dans une IA externe, partager une base ou utiliser un dossier synchronisé peut les faire sortir de l’ordinateur. Vérifiez notes, négatifs et images avant tout partage.", "Sous Windows, le chemin habituel est %APPDATA%\\Bugzinho\\BancoDePrompts\\prompts.sqlite3. Les autres bases restent à l’emplacement choisi. Consultez le chemin, protégez les sauvegardes et ne joignez jamais de base privée à un rapport de bug."], ["Questions fréquentes", "Un prompt manque ? Vérifiez la base, utilisez <ui>Limpar filtros</ui>, puis contrôlez pages, favoris, étagère et dates. Si le compteur montre des résultats, changez de page. Ouvrir une autre base n’efface pas la précédente.", "Un fichier ne s’ouvre pas ? Extrayez-le du ZIP, vérifiez qu’il s’agit d’un SQLite Prompchu, pas d’un JSON ou d’un format renommé. Vérifiez les droits d’écriture. Conservez l’original et essayez une sauvegarde ; ne supprimez pas vos données pour tester.", "Miniature absente ? Vérifiez format, taille et résolution puis enregistrez. Les cartes sans image sont normales. Les doublons après import ou fusion sont également attendus.", "<ui>Sobre</ui> affiche la version et les liens officiels. Dans une Issue, indiquez système, version et étapes avec des données fictives. Retrouvez ci-dessous dépôt, releases, site Bugzinho et dons."]], "examples": [["Image de produit", "Crée une image de [PRODUIT] pour [OBJECTIF]. Préserve forme, proportions et matériaux. Utilise [FOND], [ÉCLAIRAGE] et [CADRAGE]. Réserve de la place pour un texte ajouté ensuite. Livre une composition en [FORMAT]. Si une référence essentielle manque, pose une question avant de générer.", "Étagère : Images • Tags : produit, studio, réutilisable"], ["Vidéo tutorielle", "Prépare un tutoriel de [DURÉE] pour enseigner [TÂCHE] à [PUBLIC]. Utilise uniquement [MATÉRIEL]. Fournis un tableau avec durée estimée, image, narration et texte à l’écran. Inclus prérequis, étapes et contrôle final. Signale ce qui reste à confirmer ; n’invente pas de fonctions.", "Étagère : Vidéos • Tags : tutoriel, scénario, éducatif"], ["Compte rendu de réunion", "Transforme [NOTES] en objectif, décisions, actions, responsables et délais. N’invente ni noms ni dates ; indique « non renseigné » si nécessaire. Distingue décisions et suggestions. Fournis un bref résumé et un tableau d’actions. Utilise des données fictives avant d’enregistrer ce modèle.", "Étagère : Documents • Tags : réunion, résumé, actions"], ["Revue de code", "Examine [CODE] en [LANGAGE] selon [COMPORTEMENT ATTENDU]. Priorise erreurs logiques, cas limites et gestion des échecs. Pour chaque constat, explique impact et correction minimale. Propose des tests observables. Si le contexte manque, précise les informations nécessaires. N’inclus aucun secret ni identifiant.", "Étagère : Programmation • Tags : revue, tests, code"]]}, "de": {"eyebrow": "HANDBUCH • TUTORIAL • BEWÄHRTE METHODEN", "hero": "Ein Zuhause für deine besten Ideen.", "intro": "Lerne Prompts zu speichern, zu finden und wiederzuverwenden – vom ersten Eintrag bis zu unabhängigen Sammlungen.", "download": "App herunterladen", "start": "Tutorial starten", "search": "In diesem Handbuch suchen…", "language": "Sprache", "motion": "Animationen", "on": "Ein", "off": "Aus", "menu": "Handbuch durchsuchen", "close": "Schließen", "zoom": "Screenshot vergrößern", "copy": "Vorlage kopieren", "copied": "Kopiert!", "copyFail": "Text auswählen und manuell kopieren.", "noResults": "Kein passendes Thema. Versuche einen anderen Begriff.", "clear": "Suche löschen", "privacyBadge": "Lokal bedeutet nicht verschlüsselt", "version": "Dokumentierte Version", "sectionsLabel": "In diesem Handbuch", "screenshotNote": "Echte englische Screenshots mit fiktiven Daten. Einige App-Meldungen können portugiesisch bleiben.", "site": "Bugzinho-Website", "repo": "Repository", "donate": "Projekt unterstützen", "releases": "Releases und Downloads", "examplesLink": "Nützliche Datenbanken laden", "top": "Nach oben", "print": "Drucken / PDF speichern", "exampleTitle": "Vorlagen zum Anpassen", "exampleIntro": "Ersetze die Felder in Klammern, kopiere die Vorlage und speichere einen Eintrag. Prompchu bewahrt den Text auf; du führst ihn im Werkzeug deiner Wahl aus.", "shortcutTitle": "Tastenkürzel der Anwendung", "footer": "Unabhängige Prompchu-Dokumentation. Diese Seite verwendet keine Konten, Übersetzungs-APIs oder Prompt-Uploads. Sprache und Bewegung werden nur in diesem Browser gespeichert.", "shortcutNames": ["Neuer Prompt", "Auswahl bearbeiten", "Aktuelle Ansicht durchsuchen", "Auswahl kopieren"], "stats": ["Sprachen", "optionale Datenbanken", "wiederverwendbare Vorlagen"], "sections": [["Prompchu kennenlernen", "Prompchu verwaltet Prompts auf dem Desktop: Anweisungen für KI-Werkzeuge oder andere Abläufe. Speichere Kontext, Vorgaben und Notizen, um Bewährtes wiederzuverwenden. Die Anwendung erzeugt keine Inhalte, führt keine Prompts aus und benötigt keinen API-Schlüssel.", "Version {{VERSION}} bietet Kartenansicht, Vorschaubilder, Favoriten, eigene Regale und unabhängige Datenbanken. Inhalte bleiben auf deinem Rechner. Nutze sie für alltägliche Aufgaben, nicht als Tresor."], ["Herunterladen und starten", "Wähle bei den Releases dein System. Windows 10/11, 64 Bit: Windows-AMD64.zip herunterladen, vollständig entpacken und Prompchu.exe im Ordner starten. Nicht im ZIP ausführen; alle Dateien zusammenlassen.", "Linux x86_64: tar.gz entpacken und ./Prompchu/Prompchu in einer grafischen Umgebung mit Qt/X11/OpenGL-Bibliotheken starten. Auf Ubuntu 22.04 gebaut, keine AppImage. macOS Apple Silicon: Darwin-arm64.zip entpacken und Prompchu.app öffnen; Ziel macOS 15+, nicht Intel. Python ist enthalten.", "Keine Authenticode-Signatur oder Apple-Notarisierung. SHA256SUMS.txt prüft die Dateiintegrität, nicht die Urheberschaft. Nutze offizielle Links und wähle die Sprache im Hauptfenster."], ["Dein erster Prompt", "Klicke auf <ui>Novo prompt</ui>. Gib unter <ui>Nome *</ui> einen aussagekräftigen Titel wie „Produktfotografie — klarer Hintergrund“ ein. Prompt enthält die vollständige Anweisung. Beide Felder sind Pflicht.", "<ui>Tags (separadas por vírgula)</ui> enthält durch Kommas getrennte Begriffe, <ui>Gêneros (separados por vírgula)</ui> Stile, <ui>Categoria</ui> die Aufgabenart und <ui>Modelo / ferramenta</ui> das vorgesehene Werkzeug. Letzteres ist nur eine Notiz, keine KI-Verbindung.", "Wähle <ui>Prateleira</ui>. Trage Ausschlüsse in <ui>Prompt negativo</ui> und Variablen, Hinweise sowie Testergebnisse in <ui>Notas</ui> ein. Bestätige mit <ui>Salvar</ui>. Negative Anweisungen werden getrennt gespeichert; kopiere sie, wenn das Zielwerkzeug dies unterstützt.", "Wähle einen Eintrag zum Lesen der Registerkarten. <ui>Copiar prompt</ui> kopiert den Haupttext. <ui>Editar</ui> bearbeitet, <ui>Duplicar</ui> erstellt eine Variante, <ui>Excluir</ui> löscht nach Bestätigung. Tippen im Editor ist noch kein Speichern."], ["Die Bibliothek erkunden", "Öffne <ui>Biblioteca</ui>. Karten zeigen Titel, Tags und Datum; ein Bild ist optional. Ein Klick öffnet den Prompt im Hauptfenster. Auch <ui>Voltar</ui> führt zurück.", "Die Suche umfasst Namen, Texte und Metadaten ohne Unterscheidung von Großschreibung oder Akzenten. Kombiniere Regal, Kategorie, Genre und <ui>Favoritos</ui>. Alle durch Kommas angegebenen Tags müssen vorkommen. <ui>Data de adição</ui> begrenzt den Zeitraum.", "Sortiere mit <ui>Mais recentes</ui>, <ui>Mais antigos</ui>, <ui>Nome A–Z</ui> oder <ui>Atualizados</ui>. <ui>Limpar filtros</ui> entfernt Einschränkungen. Pro Seite erscheinen 24 Karten beziehungsweise 100 Einträge in der Hauptliste. <ui>Anterior</ui> und <ui>Próxima</ui> blättern; die Suche erfasst immer die gesamte Datenbank."], ["Regale und Vorschaubilder", "Klicke links oberhalb der Liste auf <ui>Criar prateleira</ui>, gib einen Namen ein und bestätige mit <ui>Salvar</ui>. Das Regal erscheint im Editor und in Filtern, auch leer. Eigene Regale gehören zur geöffneten Datenbank.", "Maximal 80 Zeichen; leere oder bereits vorhandene Namen werden ohne Beachtung von Großschreibung und Akzenten abgelehnt. Zum Zuordnen <ui>Editar</ui> öffnen, <ui>Prateleira</ui> auswählen und speichern. Erstellen verschiebt keine Einträge.", "<ui>Escolher miniatura</ui> akzeptiert JPG/PNG bis 20 MB und 40 Megapixel. Das Bild wird auf höchstens 640 × 400 verkleinert und in SQLite gespeichert; die Originaldatei darf danach verschoben werden. <ui>Remover miniatura</ui> stellt die Standardkarte wieder her. Mit <ui>Salvar</ui> bestätigen."], ["Datenbanken erstellen und wechseln", "Eine Datenbank ist eine .sqlite3-Datei mit Prompts, Datumsangaben, Favoriten, Bildern und Regalen. Sie ist weder Konto noch Bilderordner. Trenne Arbeit, Lernen und Projekte in eigene Dateien.", "Unter <ui>Arquivo</ui> erstellt <ui>Criar banco</ui> eine leere Sammlung in einer neuen Datei. <ui>Abrir banco</ui> öffnet eine vorhandene Sammlung im selben Fenster. Ausstehende Schreibvorgänge der bisherigen Datenbank werden vorher bestätigt.", "Der Name steht unter der Kopfzeile; beim Darüberfahren erscheint der Pfad. Die letzte Datenbank wird gemerkt. Beim Wechsel werden Bildschirmfilter geleert und Optionen neu geladen. Hinzufügen, Löschen und Favoriten werden gespeichert; Editoränderungen benötigen <ui>Salvar</ui>."], ["Sichern, zusammenführen, übertragen", "Über <ui>Arquivo</ui> und <ui>Backup do banco</ui> erstellst du eine vollständige Kopie in einer anderen Datei. Bewahre eine weitere Kopie auf einem anderen Gerät auf. Bilder und leere Regale sind enthalten. Mit <ui>Abrir banco</ui> lässt sich die Sicherung öffnen.", "<ui>Juntar bancos</ui> verlangt zwei Quelldateien und ein neues Ziel. Eine dritte Datenbank wird erstellt und geöffnet; Originale, Daten, Favoriten, Bilder und leere Regale bleiben erhalten. Doppelte Prompts bleiben bestehen.", "Für einen einzelnen Eintrag: auswählen, <ui>Exportar prompt</ui>, JSON speichern, Zieldatenbank öffnen, <ui>Importar prompt</ui>. Exportiert wird nur der ausgewählte Prompt samt Metadaten und Bild. Import fügt hinzu, ersetzt nicht. Wiederholungen erzeugen Kopien; das Hinzufügedatum wird zum Importdatum.", "Import unterstützt JSON v1/v2, Export verwendet v2. Prompchu 1.2.0 kann v2 nicht importieren. JSON überträgt Prompts, SQLite öffnet vollständige Sammlungen. Vor Aktualisierung alter Datenbanken sichern."], ["Wiederverwendbare Prompts schreiben", "Definiere Ziel, Kontext, Material, Einschränkungen und Ausgabeformat. „Fasse [TEXT] in fünf Punkten für [ZIELGRUPPE] zusammen, behalte Zahlen bei und kennzeichne Lücken“ ist überprüfbarer als „Schreibe etwas Gutes“.", "Nutze [FELDER IN KLAMMERN] und erkläre sie in Notizen. Prompchu ersetzt Variablen nicht automatisch. Trenne Anweisungen und Referenzmaterial und lege fest, was bei fehlenden Angaben geschehen soll. Keine erfundenen Quellen oder Fakten verlangen.", "Ein Hauptziel pro Vorlage hilft. Teste mit nicht sensiblen Beispielen und prüfe Ergebnisse. Nutze <ui>Duplicar</ui>, bevor du eine bewährte Version stark änderst. Notiere Änderungen und geeignete Einsatzfälle. Mehr Wörter garantieren keine bessere Qualität; konkrete, prüfbare Vorgaben helfen."], ["Optionale nützliche Datenbanken", "{{EXAMPLES_FILE}} enthält neun Datenbanken mit jeweils 60 Einträgen: Bilder, Videos, Dokumente, Programmierung, Musik, Lernen, Marketing, Schreiben und Produktivität. Die 540 Vorlagen sind auf Portugiesisch: 20 Aufgaben pro Bereich mit Erstellen-, Prüfen- und Anpassen-Varianten.", "Lade das separate ZIP, entpacke es und wähle eine .sqlite3-Datei über <ui>Arquivo</ui> und <ui>Abrir banco</ui>. Nichts wird automatisch installiert oder importiert. Platzhalter vor Gebrauch ersetzen. Änderungen bleiben gespeichert; erneutes Entpacken stellt die Originale bereit.", "Der App-Download befüllt deine Sammlung nicht. Einzelne Prompts lassen sich per JSON übertragen; ganze Sammlungen durch Zusammenführen verbinden."], ["Sprachen, Darstellung und Kürzel", "Die App bietet genau die zehn Sprachen dieses Tutorials. Die Auswahl im Hauptfenster ändert Bedienelemente, nicht Prompts, Namen oder Notizen. Manche technischen Meldungen bleiben portugiesisch.", "<ui>Neon</ui> steuert leuchtende Konturen, <ui>Animações</ui> die Bewegung. Statisches Neon ist möglich. Einstellungen und Fenstergröße werden gemerkt. Die Animation dieser Website wird unabhängig geregelt.", "Screenshots bleiben englisch. Bedienelemente erscheinen auf Englisch mit Übersetzung daneben. Die folgenden Tastenkürzel gelten für die Anwendung, nicht die Webseite."], ["Datenschutz: kein Tresor", "Datenbanken sind NICHT verschlüsselt. Wer die Datei besitzt, kann sie mit SQLite lesen. Sicherungen, JSON und Bilder können ebenfalls Informationen offenlegen. Es gibt keinen Datenbank-Passwortschutz.", "Speichere nur alltägliche Ideen, allgemeine Anweisungen und Referenzen ohne private Daten. Keine Passwörter, API-Schlüssel, Tokens, persönlichen Dokumente, Finanz- oder Gesundheitsdaten oder vertraulichen Kundendaten. Verwende fiktive oder anonymisierte Beispiele.", "Prompchu lädt Prompts nicht automatisch hoch. Kopieren in eine externe KI, Weitergeben einer Datenbank oder ein synchronisierter Ordner können Daten jedoch vom Rechner übertragen. Prüfe Notizen, negative Prompts und Bilder vor dem Teilen.", "Unter Windows lautet der übliche Pfad %APPDATA%\\Bugzinho\\BancoDePrompts\\prompts.sqlite3. Eigene Datenbanken bleiben am gewählten Ort. Prüfe den Pfad, schütze Sicherungen und hänge keine privaten Datenbanken an Fehlerberichte an."], ["Häufige Fragen", "Ein Prompt fehlt? Geöffnete Datenbank, <ui>Limpar filtros</ui>, Seiten, Favoriten, Regal und Datum prüfen. Bei vorhandenen Ergebnissen weiterblättern. Das Öffnen einer anderen Datenbank löscht die vorherige Datei nicht.", "Eine Datei öffnet nicht? ZIP entpacken und sicherstellen, dass es eine Prompchu-SQLite-Datei ist, kein JSON oder umbenanntes Format. Schreibrechte prüfen. Original behalten und eine Sicherung versuchen; keine Daten zur Fehlersuche löschen.", "Fehlendes Vorschaubild: Format, Größe und Auflösung prüfen und speichern. Karten ohne Bild sind normal, ebenso Duplikate nach Import oder Zusammenführung.", "<ui>Sobre</ui> zeigt Version und offizielle Links. Eine Issue sollte System, Version und reproduzierbare Schritte mit fiktiven Daten enthalten. Unten stehen Repository, Releases, Bugzinho-Website und Spendenlink."]], "examples": [["Produktbild", "Erstelle ein Bild von [PRODUKT] für [ZWECK]. Behalte Form, Proportionen und Materialien bei. Nutze [HINTERGRUND], [LICHT] und [PERSPEKTIVE]. Lasse Platz für später ergänzten Text. Liefere eine Komposition in [FORMAT]. Frage vor der Erstellung nach, wenn eine wesentliche Referenz fehlt.", "Regal: Bilder • Tags: Produkt, Studio, wiederverwendbar"], ["Tutorialvideo", "Plane ein [DAUER] langes Tutorial zu [AUFGABE] für [ZIELGRUPPE]. Nutze nur [MATERIAL]. Liefere eine Tabelle mit geschätzter Zeit, Bild, Sprechertext und Bildschirmtext. Nenne Voraussetzungen, Schritte und Abschlussprüfung. Markiere Unbestätigtes; erfinde keine Funktionen.", "Regal: Videos • Tags: Tutorial, Drehbuch, Lernen"], ["Besprechungszusammenfassung", "Forme [NOTIZEN] in Ziel, Entscheidungen, Aufgaben, Verantwortliche und Fristen um. Erfinde keine Namen oder Daten; schreibe bei Lücken „nicht angegeben“. Trenne Entscheidungen von Vorschlägen. Liefere eine kurze Zusammenfassung und Aufgabentabelle. Nutze vor dem Speichern fiktive Daten.", "Regal: Dokumente • Tags: Besprechung, Zusammenfassung, Aufgaben"], ["Codeprüfung", "Prüfe [CODE] in [SPRACHE] anhand von [ERWARTETEM VERHALTEN]. Priorisiere Logikfehler, Grenzfälle und Fehlerbehandlung. Erkläre Auswirkung und kleinste Korrektur jedes Befunds. Schlage überprüfbare Tests vor. Benenne fehlenden Kontext. Keine Geheimnisse oder Zugangsdaten einfügen.", "Regal: Programmierung • Tags: Prüfung, Tests, Code"]]}, "it": {"eyebrow": "MANUALE • TUTORIAL • BUONE PRATICHE", "hero": "Una casa per le tue idee migliori.", "intro": "Impara a salvare, trovare e riutilizzare prompt, dal primo elemento alle raccolte indipendenti.", "download": "Scarica l’app", "start": "Inizia il tutorial", "search": "Cerca nella guida…", "language": "Lingua", "motion": "Animazioni", "on": "Attive", "off": "Disattivate", "menu": "Esplora la guida", "close": "Chiudi", "zoom": "Ingrandisci schermata", "copy": "Copia modello", "copied": "Copiato!", "copyFail": "Seleziona il testo e copialo manualmente.", "noResults": "Nessun argomento trovato. Prova un altro termine.", "clear": "Cancella ricerca", "privacyBadge": "Locale non significa crittografato", "version": "Versione documentata", "sectionsLabel": "In questa guida", "screenshotNote": "Schermate reali in inglese con dati fittizi. Alcuni messaggi dell’app possono restare in portoghese.", "site": "Sito Bugzinho", "repo": "Repository", "donate": "Sostieni il progetto", "releases": "Release e download", "examplesLink": "Scarica database utili", "top": "Torna in alto", "print": "Stampa / salva PDF", "exampleTitle": "Modelli da adattare", "exampleIntro": "Sostituisci i campi tra parentesi quadre, copia il modello e salvalo come voce. Prompchu conserva il testo; lo esegui nello strumento scelto.", "shortcutTitle": "Scorciatoie dell’app", "footer": "Documentazione indipendente di Prompchu. Questa pagina non usa account, API di traduzione né invia prompt. Lingua e movimento sono salvati solo in questo browser.", "shortcutNames": ["Nuovo prompt", "Modifica selezionato", "Cerca nella schermata", "Copia selezionato"], "stats": ["lingue", "database facoltativi", "modelli riutilizzabili"], "sections": [["Scopri Prompchu", "Prompchu organizza prompt sul desktop: istruzioni per strumenti IA o altri processi. Conserva contesto, vincoli e note per riutilizzare ciò che funziona. Non genera contenuti, non esegue prompt e non richiede chiavi API.", "La versione {{VERSION}} include libreria a schede, miniature, preferiti, scaffali personalizzati e database indipendenti. I contenuti restano sul computer. Usalo per attività quotidiane, non come cassaforte."], ["Scaricare e avviare", "Nei release scegli il tuo sistema. Windows 10/11 a 64 bit: scarica Windows-AMD64.zip, estrai tutta la cartella e apri Prompchu.exe al suo interno. Non avviarlo dal ZIP e non separare l’eseguibile dagli altri file.", "Linux x86_64: estrai tar.gz ed esegui ./Prompchu/Prompchu con ambiente grafico e librerie Qt/X11/OpenGL. Compilato su Ubuntu 22.04, non è AppImage. macOS Apple Silicon: estrai Darwin-arm64.zip e apri Prompchu.app; destinato a macOS 15+, non Intel. Python è incluso.", "I pacchetti non hanno firma Authenticode né notarizzazione Apple. SHA256SUMS.txt verifica l’integrità, non l’autore. Usa i link ufficiali e scegli la lingua nella schermata iniziale."], ["Il primo prompt", "Premi <ui>Novo prompt</ui>. In <ui>Nome *</ui> inserisci un titolo descrittivo, come “Foto prodotto — sfondo pulito”. Nel campo Prompt scrivi le istruzioni complete. Entrambi sono obbligatori.", "Usa <ui>Tags (separadas por vírgula)</ui> per termini separati da virgole, <ui>Gêneros (separados por vírgula)</ui> per gli stili, <ui>Categoria</ui> per il tipo di attività e <ui>Modelo / ferramenta</ui> per annotare lo strumento previsto. Quest’ultimo non collega un’IA.", "Scegli <ui>Prateleira</ui>. Registra cosa evitare in <ui>Prompt negativo</ui> e variabili, consigli e risultati in <ui>Notas</ui>. Premi <ui>Salvar</ui>. Il negativo è separato: copialo quando lo strumento di destinazione lo supporta.", "Seleziona una voce per leggerne le schede. <ui>Copiar prompt</ui> copia il testo principale. <ui>Editar</ui> modifica, <ui>Duplicar</ui> crea una variante e <ui>Excluir</ui> elimina dopo conferma. Scrivere nell’editor non significa salvare."], ["Esplorare la Libreria", "Premi <ui>Biblioteca</ui>. Le schede mostrano titolo, tag e data; l’immagine è facoltativa. Un clic apre il prompt nella schermata principale. Anche <ui>Voltar</ui> torna indietro.", "La ricerca comprende nome, testo e metadati, ignorando maiuscole e accenti. Combina scaffale, categoria, genere e <ui>Favoritos</ui>. Tutti i tag separati da virgole devono essere presenti. Attiva <ui>Data de adição</ui> per limitare le date.", "Ordina con <ui>Mais recentes</ui>, <ui>Mais antigos</ui>, <ui>Nome A–Z</ui> o <ui>Atualizados</ui>. Usa <ui>Limpar filtros</ui> se qualcosa sembra mancare. La Libreria mostra 24 schede per pagina, la lista iniziale 100 voci. <ui>Anterior</ui> e <ui>Próxima</ui> cambiano pagina; la ricerca copre tutto il database."], ["Scaffali e miniature", "Premi <ui>Criar prateleira</ui> sopra la lista sinistra, inserisci un nome e conferma con <ui>Salvar</ui>. Lo scaffale appare nell’editor e nei filtri anche se vuoto. Appartiene al database aperto.", "Massimo 80 caratteri. Nomi vuoti o duplicati, senza distinzione di maiuscole e accenti, non sono ammessi. Per assegnare un prompt apri <ui>Editar</ui>, scegli <ui>Prateleira</ui> e salva. Creare uno scaffale non sposta voci.", "<ui>Escolher miniatura</ui> accetta JPG/PNG fino a 20 MB e 40 megapixel. L’immagine viene ridotta entro 640 × 400 e salvata in SQLite; puoi spostare l’originale. <ui>Remover miniatura</ui> ripristina la scheda standard. Conferma con <ui>Salvar</ui>."], ["Creare e cambiare database", "Un database è un file .sqlite3 con prompt, date, preferiti, immagini e scaffali. Non è un account né una cartella di immagini. Separa lavoro, studio e progetti in file diversi.", "In <ui>Arquivo</ui>, <ui>Criar banco</ui> crea una raccolta vuota in un nuovo file. <ui>Abrir banco</ui> apre una raccolta esistente nella stessa finestra, confermando prima le scritture pendenti nel database precedente.", "Il nome compare sotto l’intestazione; passa il mouse per vedere il percorso. L’ultimo database viene ricordato. Il cambio azzera i filtri della schermata e ricarica le opzioni. Aggiunte, eliminazioni e preferiti vengono salvati; il modulo di modifica richiede <ui>Salvar</ui>."], ["Backup, unione e trasferimento", "Usa <ui>Arquivo</ui> e <ui>Backup do banco</ui> per una copia completa in un altro file. Conservane una anche su un altro dispositivo. Sono incluse immagini e scaffali vuoti. Apri la copia con <ui>Abrir banco</ui>.", "<ui>Juntar bancos</ui> richiede due sorgenti e una nuova destinazione. Crea e apre un terzo database, preservando originali, date, preferiti, immagini e scaffali vuoti. I duplicati rimangono; non vengono rimossi automaticamente.", "Per un singolo elemento: selezionalo, usa <ui>Exportar prompt</ui>, salva il JSON, apri la destinazione e usa <ui>Importar prompt</ui>. Si esporta solo il selezionato con metadati e miniatura. L’importazione aggiunge, non sostituisce. Ripeterla crea copie e imposta la data di aggiunta alla data di importazione.", "Importa JSON v1/v2 ed esporta v2; Prompchu 1.2.0 non importa v2. JSON trasferisce prompt, SQLite apre raccolte intere. Esegui un backup prima di aggiornare vecchi database."], ["Scrivere prompt riutilizzabili", "Definisci obiettivo, contesto, materiali, vincoli e formato finale. “Riassumi [TESTO] in cinque punti per [PUBBLICO], mantenendo numeri e segnalando lacune” è più verificabile di “scrivi un buon testo”.", "Usa [CAMPI TRA PARENTESI QUADRE] e spiegali nelle note. Prompchu non sostituisce automaticamente le variabili. Separa istruzioni e riferimenti; indica cosa fare se mancano informazioni. Non chiedere di inventare fonti o fatti.", "Preferisci un obiettivo principale, prova con esempi non sensibili e controlla il risultato. Usa <ui>Duplicar</ui> prima di cambiare molto una versione efficace. Annota modifiche e casi d’uso. Più parole non garantiscono qualità; contano istruzioni concrete e verificabili."], ["Database utili facoltativi", "{{EXAMPLES_FILE}} contiene nove database da 60 voci: Immagini, Video, Documenti, Programmazione, Musica, Studio, Marketing, Scrittura e Produttività. Sono 540 modelli in portoghese: 20 attività per area con versioni per creare, rivedere e adattare.", "Scarica il ZIP separato, estrailo e scegli un .sqlite3 con <ui>Arquivo</ui> e <ui>Abrir banco</ui>. Nulla viene installato o importato automaticamente. Sostituisci i campi prima dell’uso. Le modifiche sono permanenti; estrai di nuovo per recuperare gli originali.", "Scaricare l’app non riempie la raccolta. Usa JSON per pochi elementi oppure unisci database per combinare raccolte complete."], ["Lingue, aspetto e scorciatoie", "L’app offre le dieci lingue del selettore di questo tutorial. La lingua cambia i controlli, non prompt, nomi o note. Alcuni messaggi tecnici restano in portoghese.", "<ui>Neon</ui> controlla i bordi luminosi e <ui>Animações</ui> il movimento. Puoi mantenere il neon statico. Preferenze e dimensioni della finestra vengono ricordate. L’animazione del sito ha un’impostazione indipendente.", "Le immagini restano in inglese; i controlli sono indicati in inglese con traduzione accanto. Le scorciatoie seguenti riguardano l’app, non la pagina."], ["Privacy: non è una cassaforte", "I database NON sono crittografati. Chi ha accesso al file può leggerlo con SQLite. Backup, JSON e miniature possono esporre informazioni. L’app non protegge il database con password.", "Salva soltanto idee, istruzioni generiche e riferimenti quotidiani senza dati privati. Non inserire password, chiavi API, token, documenti personali, dati finanziari o sanitari o informazioni riservate dei clienti. Usa esempi fittizi o anonimizzati.", "Prompchu non invia automaticamente i prompt. Copiarli in un’IA esterna, condividere il database o usare cartelle sincronizzate può però portarli fuori dal computer. Controlla anche note, negativi e immagini prima della condivisione.", "Su Windows il percorso abituale è %APPDATA%\\Bugzinho\\BancoDePrompts\\prompts.sqlite3. I database personali restano dove li salvi. Controlla il percorso, proteggi i backup e non allegare database privati alle segnalazioni."], ["Domande comuni", "Non trovi un prompt? Verifica database, <ui>Limpar filtros</ui>, pagine, preferiti, scaffale e date. Se il contatore indica risultati, passa alla pagina successiva. Aprire un altro database non cancella il precedente.", "Un file non si apre? Estrailo dal ZIP e verifica che sia SQLite di Prompchu, non JSON o un formato rinominato. Controlla i permessi di scrittura. Conserva l’originale e prova un backup; non cancellare dati per fare prove.", "Miniatura assente? Controlla formato, dimensione e risoluzione, poi salva. Le schede senza immagine sono normali, come i duplicati dopo importazione o unione.", "In <ui>Sobre</ui> trovi versione e link ufficiali. In una Issue indica sistema, versione e passaggi con dati fittizi. Sotto trovi repository, release, sito Bugzinho e donazioni."]], "examples": [["Immagine di prodotto", "Crea un’immagine di [PRODOTTO] per [FINALITÀ]. Conserva forma, proporzioni e materiali. Usa [SFONDO], [LUCE] e [INQUADRATURA]. Lascia spazio per testo aggiunto in seguito. Consegna una composizione in [FORMATO]. Se manca un riferimento essenziale, chiedi prima di generare.", "Scaffale: Immagini • Tag: prodotto, studio, riutilizzabile"], ["Video tutorial", "Pianifica un tutorial di [DURATA] per insegnare [ATTIVITÀ] a [PUBBLICO]. Usa solo [MATERIALE]. Restituisci una tabella con tempo stimato, immagine, narrazione e testo sullo schermo. Includi prerequisiti, passaggi e controllo finale. Segnala elementi da confermare, senza inventare funzioni.", "Scaffale: Video • Tag: tutorial, copione, educativo"], ["Riepilogo riunione", "Trasforma [APPUNTI] in obiettivo, decisioni, azioni, responsabili e scadenze. Non inventare nomi o date; scrivi “non indicato” per i dati mancanti. Separa decisioni e suggerimenti. Fornisci un breve riepilogo e una tabella di azioni. Usa dati fittizi prima di salvare il modello.", "Scaffale: Documenti • Tag: riunione, riepilogo, azioni"], ["Revisione del codice", "Esamina [CODICE] in [LINGUAGGIO] rispetto a [COMPORTAMENTO ATTESO]. Dai priorità a errori logici, casi limite e gestione dei fallimenti. Spiega impatto e correzione minima di ogni problema. Proponi test osservabili. Specifica le informazioni mancanti. Non inserire segreti o credenziali.", "Scaffale: Programmazione • Tag: revisione, test, codice"]]}, "ja": {"eyebrow": "マニュアル • チュートリアル • 活用ガイド", "hero": "大切なアイデアを、ひとつの場所に。", "intro": "最初の登録から独立したコレクションまで、プロンプトの保存・検索・再利用を学びましょう。", "download": "アプリをダウンロード", "start": "ガイドを始める", "search": "ガイド内を検索…", "language": "言語", "motion": "アニメーション", "on": "有効", "off": "無効", "menu": "ガイドの目次", "close": "閉じる", "zoom": "画像を拡大", "copy": "テンプレートをコピー", "copied": "コピーしました！", "copyFail": "テキストを選択して手動でコピーしてください。", "noResults": "該当する項目がありません。別の語句を試してください。", "clear": "検索を消去", "privacyBadge": "ローカル保存でも暗号化ではありません", "version": "対象バージョン", "sectionsLabel": "このガイドの内容", "screenshotNote": "架空のデータを使った実際の英語画面です。一部のアプリメッセージはポルトガル語の場合があります。", "site": "Bugzinhoサイト", "repo": "リポジトリ", "donate": "プロジェクトを支援", "releases": "リリースとダウンロード", "examplesLink": "便利なデータベースを入手", "top": "先頭に戻る", "print": "印刷 / PDF保存", "exampleTitle": "用途に合わせるテンプレート", "exampleIntro": "角括弧の項目を置き換え、コピーしてアプリに登録します。Prompchuは文章を保存し、実行は選んだツールで行います。", "shortcutTitle": "アプリのショートカット", "footer": "Prompchuの独立したドキュメントです。このページはアカウント、翻訳API、プロンプト送信を使いません。言語と動作の設定はこのブラウザー内にのみ保存されます。", "shortcutNames": ["新しいプロンプト", "選択項目を編集", "現在の画面で検索", "選択項目をコピー"], "stats": ["言語", "任意のデータベース", "再利用テンプレート"], "sections": [["Prompchuについて", "Prompchuは、AIツールなどに渡す指示文を整理するデスクトップアプリです。目的、背景、条件、メモを保存し、うまくいったプロンプトを再利用できます。コンテンツ生成やプロンプトの実行は行わず、APIキーも不要です。", "バージョン{{VERSION}}にはカード式ライブラリ、サムネイル、お気に入り、独自の棚、個別データベースがあります。内容はパソコンに保存されます。日常的な用途に使い、秘密情報の保管庫として扱わないでください。"], ["ダウンロードと起動", "リリースページでOSに合うファイルを選びます。64ビットWindows 10/11ではWindows-AMD64.zipをすべて展開し、フォルダー内のPrompchu.exeを開きます。ZIP内から起動したり、実行ファイルだけ移動したりしないでください。", "Linux x86_64ではtar.gzを展開し、Qt/X11/OpenGLライブラリとGUI環境で ./Prompchu/Prompchu を実行します。Ubuntu 22.04でビルドされ、AppImageではありません。macOS Apple SiliconではDarwin-arm64.zipを展開してPrompchu.appを開きます。対象はmacOS 15以降で、Intel版ではありません。Pythonは同梱されています。", "Authenticode署名とAppleの公証はありません。SHA256SUMS.txtはダウンロードの整合性確認用で、作者の署名ではありません。公式
