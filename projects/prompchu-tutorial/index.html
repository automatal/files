リンクを利用し、起動後にメイン画面で言語を選択してください。"], ["最初のプロンプト", "<ui>Novo prompt</ui>をクリックします。<ui>Nome *</ui>には「商品写真 — シンプルな背景」など内容が分かる名前を、Promptには指示全文を入力します。この2項目は必須です。", "<ui>Tags (separadas por vírgula)</ui>にはカンマ区切りの検索語、<ui>Gêneros (separados por vírgula)</ui>にはスタイル、<ui>Categoria</ui>には作業の種類、<ui>Modelo / ferramenta</ui>には使うツールを記録します。ツール欄はメモであり、AIへの接続設定ではありません。", "<ui>Prateleira</ui>を選び、避けたい内容は<ui>Prompt negativo</ui>、変数や工夫、試行結果は<ui>Notas</ui>に書きます。<ui>Salvar</ui>で確定します。ネガティブプロンプトは別に保存されるため、対応ツールで必要な場合は別途コピーしてください。", "メイン画面で項目を選ぶと各タブを読めます。<ui>Copiar prompt</ui>は本文をコピーします。<ui>Editar</ui>で編集、<ui>Duplicar</ui>で別案を作成、<ui>Excluir</ui>で確認後に削除します。入力しただけでは編集内容は保存されません。"], ["ライブラリを使う", "<ui>Biblioteca</ui>を開きます。カードには名前、タグ、追加日が表示され、画像は任意です。カードをクリックするとメイン画面に戻ってそのプロンプトが開きます。<ui>Voltar</ui>でも戻れます。", "検索は名前、本文、メタデータを対象とし、大文字小文字やアクセントを区別しません。棚、カテゴリ、ジャンル、<ui>Favoritos</ui>を組み合わせられます。カンマ区切りのタグはすべて含まれる必要があります。<ui>Data de adição</ui>を有効にすると日付範囲を絞れます。", "<ui>Mais recentes</ui>、<ui>Mais antigos</ui>、<ui>Nome A–Z</ui>、<ui>Atualizados</ui>で並べ替えます。見つからない場合は<ui>Limpar filtros</ui>を試してください。ライブラリは1ページ24枚、メイン一覧は100件です。<ui>Anterior</ui>と<ui>Próxima</ui>で移動します。検索は表示中のページだけでなく全件を対象にします。"], ["棚とサムネイル", "左側の一覧上部にある<ui>Criar prateleira</ui>をクリックし、名前を入力して<ui>Salvar</ui>を押します。空でもエディターとフィルターに表示されます。独自の棚は現在のデータベースに属します。", "名前は80文字以内です。空欄や、大文字小文字・アクセントの違いを除いて同じ名前は使えません。プロンプトを入れるには<ui>Editar</ui>で<ui>Prateleira</ui>を選んで保存します。棚の作成だけでは項目は移動しません。", "<ui>Escolher miniatura</ui>は最大20 MB、4,000万画素のJPG/PNGを受け付けます。画像は最大640 × 400に縮小してSQLite内に保存されるため、元画像は後で移動できます。<ui>Remover miniatura</ui>で標準カードに戻り、<ui>Salvar</ui>で確定します。"], ["データベースの作成と切り替え", "データベースはプロンプト、日付、お気に入り、画像、棚をまとめた .sqlite3 ファイルです。アカウントでも画像フォルダーでもありません。仕事、学習、個人制作などを別ファイルに分けられます。", "<ui>Arquivo</ui>の<ui>Criar banco</ui>で新しい空のコレクションを作成します。<ui>Abrir banco</ui>は既存のファイルを同じウィンドウで開きます。切り替える前に、以前のデータベースの保留中の書き込みを確定します。", "現在の名前はヘッダー下に表示され、マウスを重ねると保存先が分かります。最後に開いたデータベースを記憶します。切り替え時は画面のフィルターが解除され、新しい選択肢に更新されます。追加・削除・お気に入りは保存されますが、編集フォームでは<ui>Salvar</ui>が必要です。"], ["バックアップ・結合・転送", "<ui>Arquivo</ui>と<ui>Backup do banco</ui>で別ファイルに全体をコピーします。別の機器にもコピーを保管してください。画像と空の棚も含まれ、<ui>Abrir banco</ui>でバックアップを開いて確認・復元できます。", "<ui>Juntar bancos</ui>では2つの元ファイルと新しい保存先を選びます。3つ目のデータベースが作成されて開き、元ファイル、日付、お気に入り、画像、空の棚は保持されます。重複は自動削除されません。", "1件だけ渡すには、選択して<ui>Exportar prompt</ui>でJSONに保存し、転送先を開いて<ui>Importar prompt</ui>を使います。選択項目のメタデータと画像も含みます。インポートは追加であり置換ではありません。繰り返すとコピーが増え、追加日はインポート日になります。", "JSON v1/v2を読み込み、v2を書き出します。Prompchu 1.2.0はv2を読み込めません。JSONはプロンプトの転送、SQLiteはコレクション全体の利用に使います。古いデータベースの更新前にはバックアップしてください。"], ["再利用しやすい指示を書く", "目的、背景、素材、制約、出力形式を明確にします。「良い文章を書いて」より「[文章]を[対象読者]向けに5項目で要約し、数値を保持して不明点を示して」のほうが評価しやすくなります。", "[角括弧の項目]を使い、メモに埋め方を書きます。Prompchuは変数を自動置換しません。指示と参考資料を分け、不足情報がある場合の対応を指定します。出典や事実を捏造して埋めるよう求めないでください。", "1つの主目的を中心に、機密でない例で試して結果を確認します。うまくいった版を大きく変更する前は<ui>Duplicar</ui>を使い、変更点と適した用途をメモします。長さよりも具体的で検証可能な指示が役立ちます。"], ["任意の便利なサンプル集", "{{EXAMPLES_FILE}}には画像、動画、文書、プログラミング、音楽、学習、マーケティング、執筆、生産性の9データベースがあり、各60件です。540件のテンプレートはポルトガル語で、各分野20タスクに作成・見直し・適応の3版があります。", "別配布のZIPを展開し、<ui>Arquivo</ui>と<ui>Abrir banco</ui>で .sqlite3 を選びます。自動インストールや自動インポートはありません。使う前に括弧内を置き換えてください。編集は保存されます。元に戻したい場合はZIPを再展開します。", "アプリをダウンロードしても個人コレクションに例は追加されません。必要な項目だけJSONで転送するか、全体を結合してください。"], ["言語・表示・ショートカット", "アプリはこのガイドの選択欄と同じ10言語に対応します。メイン画面で言語を変えると操作ラベルは変わりますが、プロンプト、名前、メモは翻訳されません。一部の技術メッセージはポルトガル語のままです。", "<ui>Neon</ui>は発光する輪郭、<ui>Animações</ui>は動きを制御します。動きを止めても静止したネオンを残せます。設定とウィンドウサイズは記憶されます。このサイトのアニメーション設定はアプリとは独立しています。", "画像は英語表示のままです。ガイド中の操作名は英語の後に翻訳を併記します。下のショートカットはウェブページではなくアプリ用です。"], ["プライバシー：保管庫ではありません", "データベースは暗号化されていません。ファイルにアクセスできる人はSQLiteツールで内容を読めます。バックアップ、JSON、画像にも情報が含まれます。データベースをパスワードで保護する機能はありません。", "日常的なアイデア、一般的な指示、私的データを含まない参考資料だけを保存してください。パスワード、APIキー、トークン、個人書類、金融・医療情報、顧客の機密情報は保存しないでください。架空または匿名化した例を使います。", "Prompchuはプロンプトを自動送信しません。ただし外部AIへの貼り付け、他人への共有、同期フォルダーへの保存はデータをパソコン外へ移すことがあります。共有前にメモ、ネガティブ、画像も確認してください。", "Windowsの通常の保存先は %APPDATA%\\Bugzinho\\BancoDePrompts\\prompts.sqlite3 です。自作のデータベースは選んだ場所にあります。アプリでパスを確認し、バックアップを保護し、不具合報告に私的なデータベースを添付しないでください。"], ["よくある疑問", "項目が見つからないときは、開いているデータベース、<ui>Limpar filtros</ui>、ページ、お気に入り、棚、日付を確認します。件数が出ているなら別ページも確認してください。別のデータベースを開いても以前のファイルは消えません。", "ファイルが開かないときはZIPを展開し、JSONや名前を変えただけの別形式ではなくPrompchuのSQLiteか確認します。フォルダーの書き込み権限も確認してください。原本を保ちバックアップで試し、原因調査のためにデータを削除しないでください。", "画像が出ない場合は形式・サイズ・解像度と保存を確認します。画像のないカードは正常です。インポートや結合後の重複も仕様です。", "<ui>Sobre</ui>でバージョンと公式リンクを確認できます。IssueにはOS、版、再現手順を架空のデータで示してください。下部にリポジトリ、リリース、Bugzinhoサイト、寄付リンクがあります。"]], "examples": [["商品画像", "[目的]に使う[商品]の画像を作成してください。形状、比率、素材を保ち、[背景]、[照明]、[構図]を使ってください。後で文字を加える余白を確保し、[縦横比]の構図を1枚出力してください。重要な参考情報が不足する場合は生成前に質問してください。", "棚：画像 • タグ：商品、スタジオ、再利用"], ["解説動画", "[対象者]に[作業]を教える[長さ]の動画を計画してください。[資料]のみを使い、推定時間、映像、ナレーション、画面文字を表にしてください。前提条件、手順、最終確認を含め、不確かな点を示してください。機能を捏造しないでください。", "棚：動画 • タグ：チュートリアル、台本、学習"], ["会議の要約", "[メモ]を目的、決定事項、作業、担当者、期限に整理してください。名前や日付を作らず、不足は「記載なし」としてください。決定と提案を分け、短い要約と作業表を出してください。テンプレートを保存する前に架空のデータを使ってください。", "棚：文書 • タグ：会議、要約、作業"], ["コードレビュー", "[言語]の[コード]を[期待する動作]に照らして確認してください。論理エラー、境界条件、失敗時の処理を優先し、各問題の影響と最小の修正を説明してください。結果を確認できるテストを提案し、不足する背景情報を明示してください。秘密や認証情報を含めないでください。", "棚：プログラミング • タグ：レビュー、テスト、コード"]]}, "ko": {"eyebrow": "매뉴얼 • 튜토리얼 • 활용 안내", "hero": "좋은 아이디어를 한곳에.", "intro": "첫 등록부터 독립된 모음까지, 프롬프트를 저장하고 찾고 재사용하는 방법을 알아보세요.", "download": "앱 다운로드", "start": "튜토리얼 시작", "search": "안내서 검색…", "language": "언어", "motion": "애니메이션", "on": "켜짐", "off": "꺼짐", "menu": "안내서 탐색", "close": "닫기", "zoom": "화면 확대", "copy": "템플릿 복사", "copied": "복사됨!", "copyFail": "텍스트를 선택해 직접 복사하세요.", "noResults": "일치하는 주제가 없습니다. 다른 단어를 입력하세요.", "clear": "검색 지우기", "privacyBadge": "로컬 저장은 암호화가 아닙니다", "version": "설명 대상 버전", "sectionsLabel": "안내서 목차", "screenshotNote": "가상 데이터를 사용한 실제 영어 화면입니다. 일부 앱 메시지는 포르투갈어로 표시될 수 있습니다.", "site": "Bugzinho 사이트", "repo": "저장소", "donate": "프로젝트 후원", "releases": "릴리스와 다운로드", "examplesLink": "유용한 데이터베이스 받기", "top": "맨 위로", "print": "인쇄 / PDF 저장", "exampleTitle": "상황에 맞게 바꿀 템플릿", "exampleIntro": "대괄호 필드를 바꾸고 복사해 앱에 항목으로 저장하세요. Prompchu는 텍스트를 보관하며 실행은 선택한 도구에서 합니다.", "shortcutTitle": "앱 단축키", "footer": "Prompchu 독립 문서입니다. 이 페이지는 계정, 번역 API, 프롬프트 전송을 사용하지 않습니다. 언어와 움직임 설정은 이 브라우저에만 저장됩니다.", "shortcutNames": ["새 프롬프트", "선택 항목 편집", "현재 화면 검색", "선택 항목 복사"], "stats": ["지원 언어", "선택형 데이터베이스", "재사용 템플릿"], "sections": [["Prompchu 소개", "Prompchu는 AI 도구나 다른 작업에 사용할 지시문을 정리하는 데스크톱 앱입니다. 맥락, 제약, 메모를 저장해 잘 작동한 프롬프트를 재사용하세요. 콘텐츠를 생성하거나 프롬프트를 실행하지 않으며 API 키가 필요하지 않습니다.", "{{VERSION}} 버전에는 카드 라이브러리, 썸네일, 즐겨찾기, 사용자 지정 선반과 독립 데이터베이스가 있습니다. 내용은 컴퓨터에 저장됩니다. 일상적인 작업에 사용하고 비밀정보 금고로 여기지 마세요."], ["다운로드와 실행", "릴리스에서 운영체제를 선택하세요. 64비트 Windows 10/11: Windows-AMD64.zip 전체를 풀고 폴더 안의 Prompchu.exe를 실행합니다. ZIP 안에서 실행하거나 실행 파일만 따로 옮기지 마세요.", "Linux x86_64: tar.gz를 풀고 Qt/X11/OpenGL 라이브러리가 있는 그래픽 환경에서 ./Prompchu/Prompchu를 실행합니다. Ubuntu 22.04 빌드이며 AppImage가 아닙니다. macOS Apple Silicon: Darwin-arm64.zip을 풀고 Prompchu.app을 엽니다. macOS 15 이상 대상이며 Intel용이 아닙니다. Python은 포함되어 있습니다.", "Authenticode 서명과 Apple 공증은 없습니다. SHA256SUMS.txt는 다운로드 무결성을 확인하며 작성자 서명이 아닙니다. 공식 링크를 이용하고 메인 화면에서 언어를 선택하세요."], ["첫 프롬프트 만들기", "<ui>Novo prompt</ui>를 누릅니다. <ui>Nome *</ui>에는 “제품 사진 — 깔끔한 배경”처럼 목적이 드러나는 이름을, Prompt에는 전체 지시문을 입력하세요. 두 항목은 필수입니다.", "<ui>Tags (separadas por vírgula)</ui>에는 쉼표로 구분한 검색어, <ui>Gêneros (separados por vírgula)</ui>에는 스타일, <ui>Categoria</ui>에는 작업 종류, <ui>Modelo / ferramenta</ui>에는 사용할 도구를 기록하세요. 도구 항목은 메모일 뿐 AI에 연결하지 않습니다.", "<ui>Prateleira</ui>를 선택하고 피할 내용은 <ui>Prompt negativo</ui>, 변수·팁·시험 결과는 <ui>Notas</ui>에 적습니다. <ui>Salvar</ui>로 확정하세요. 네거티브 지시문은 별도로 저장되므로 대상 도구가 지원할 때 따로 복사하세요.", "메인 화면에서 항목을 선택해 탭을 읽습니다. <ui>Copiar prompt</ui>는 본문을 복사합니다. <ui>Editar</ui>로 수정, <ui>Duplicar</ui>로 변형 생성, <ui>Excluir</ui>로 확인 후 삭제합니다. 편집기에 입력하는 것과 저장하는 것은 다릅니다."], ["라이브러리 탐색", "<ui>Biblioteca</ui>를 엽니다. 카드는 제목, 태그, 추가 날짜를 보여 주며 이미지는 선택 사항입니다. 카드를 누르면 메인 화면에서 해당 프롬프트가 열립니다. <ui>Voltar</ui>로도 돌아갈 수 있습니다.", "검색은 이름·본문·메타데이터 전체를 대상으로 하며 대소문자와 악센트를 구분하지 않습니다. 선반, 범주, 장르, <ui>Favoritos</ui>를 조합하세요. 쉼표로 입력한 태그는 모두 포함되어야 합니다. <ui>Data de adição</ui>를 켜면 날짜 범위를 제한합니다.", "<ui>Mais recentes</ui>, <ui>Mais antigos</ui>, <ui>Nome A–Z</ui>, <ui>Atualizados</ui>로 정렬합니다. 안 보이는 항목은 <ui>Limpar filtros</ui>로 확인하세요. 라이브러리는 페이지당 24개 카드, 메인 목록은 100개 항목입니다. <ui>Anterior</ui>와 <ui>Próxima</ui>로 이동하며 검색은 전체 데이터베이스에 적용됩니다."], ["선반과 썸네일", "왼쪽 목록 위의 <ui>Criar prateleira</ui>를 누르고 이름을 입력한 뒤 <ui>Salvar</ui>를 누릅니다. 비어 있어도 편집기와 필터에서 사용할 수 있습니다. 사용자 지정 선반은 현재 데이터베이스에 속합니다.", "최대 80자이며 빈 이름 또는 대소문자·악센트 차이를 제외한 중복 이름은 거부됩니다. 항목을 넣으려면 <ui>Editar</ui>에서 <ui>Prateleira</ui>를 선택하고 저장하세요. 선반 생성만으로 항목이 이동하지 않습니다.", "<ui>Escolher miniatura</ui>는 최대 20 MB, 4천만 화소의 JPG/PNG를 받습니다. 최대 640 × 400으로 줄여 SQLite에 저장하므로 원본은 나중에 옮겨도 됩니다. <ui>Remover miniatura</ui>로 기본 카드로 되돌리고 <ui>Salvar</ui>로 확정하세요."], ["데이터베이스 만들기와 전환", "데이터베이스는 프롬프트, 날짜, 즐겨찾기, 이미지, 선반을 담은 .sqlite3 파일입니다. 계정이나 이미지 폴더가 아닙니다. 업무, 공부, 개인 프로젝트를 서로 다른 파일로 나누세요.", "<ui>Arquivo</ui>에서 <ui>Criar banco</ui>는 새 파일에 빈 모음을 만듭니다. <ui>Abrir banco</ui>는 기존 모음을 같은 창에서 엽니다. 전환 전에 이전 데이터베이스의 대기 중인 쓰기 작업을 확정합니다.", "현재 이름은 머리글 아래에 있고 마우스를 올리면 전체 경로가 보입니다. 마지막 파일을 기억합니다. 전환하면 화면 필터를 지우고 새 모음의 옵션을 불러옵니다. 추가·삭제·즐겨찾기는 저장되지만 편집 폼은 <ui>Salvar</ui>가 필요합니다."], ["백업·병합·전송", "<ui>Arquivo</ui>와 <ui>Backup do banco</ui>로 다른 파일에 전체 복사본을 만드세요. 다른 장치에도 한 부 보관하세요. 이미지와 빈 선반이 포함되며 <ui>Abrir banco</ui>로 백업을 열어 확인하거나 복원합니다.", "<ui>Juntar bancos</ui>는 원본 두 개와 새 저장 위치를 요청합니다. 세 번째 데이터베이스를 만들고 열며 원본, 날짜, 즐겨찾기, 이미지, 빈 선반을 보존합니다. 중복 항목은 자동 제거되지 않습니다.", "한 항목만 옮기려면 선택 후 <ui>Exportar prompt</ui>로 JSON을 저장하고 대상 데이터베이스를 연 뒤 <ui>Importar prompt</ui>를 사용하세요. 선택 항목의 메타데이터와 이미지도 포함됩니다. 가져오기는 교체가 아닌 추가입니다. 반복하면 복사본이 생기고 추가 날짜는 가져온 날짜가 됩니다.", "JSON v1/v2를 가져오고 v2로 내보냅니다. Prompchu 1.2.0은 v2를 가져오지 못합니다. JSON은 프롬프트 전송용, SQLite는 전체 모음용입니다. 이전 데이터베이스를 갱신하기 전에 백업하세요."], ["재사용하기 좋은 지시문", "목표, 맥락, 자료, 제한, 출력 형식을 정하세요. “좋은 글을 써 줘”보다 “[텍스트]를 [대상]에게 다섯 항목으로 요약하고 숫자를 유지하며 누락 정보를 표시해”가 검토하기 쉽습니다.", "[대괄호 필드]를 사용하고 메모에 채우는 방법을 적으세요. Prompchu는 변수를 자동으로 바꾸지 않습니다. 지시와 참고자료를 나누고 정보가 부족할 때의 행동을 정하세요. 출처나 사실을 만들어 채우도록 요구하지 마세요.", "주요 목표 하나에 집중하고 민감하지 않은 예로 시험한 뒤 결과를 검토하세요. 잘 작동하는 버전을 크게 바꾸기 전에 <ui>Duplicar</ui>를 사용하세요. 변경점과 잘 맞는 상황을 메모하세요. 길이보다는 구체적이고 확인 가능한 지시가 중요합니다."], ["선택형 예제 데이터베이스", "{{EXAMPLES_FILE}}에는 이미지, 영상, 문서, 프로그래밍, 음악, 학습, 마케팅, 글쓰기, 생산성의 9개 데이터베이스가 각각 60개 항목을 담고 있습니다. 540개 템플릿은 포르투갈어이며 분야별 20개 작업에 작성·검토·변형 버전이 있습니다.", "별도 ZIP을 내려받아 풀고 <ui>Arquivo</ui>와 <ui>Abrir banco</ui>에서 .sqlite3를 선택하세요. 자동 설치나 가져오기는 없습니다. 사용 전에 필드를 바꾸세요. 수정은 저장되므로 원본이 필요하면 ZIP을 다시 푸세요.", "앱 다운로드가 개인 모음을 예제로 채우지 않습니다. 일부 항목은 JSON으로 옮기고 전체 모음은 데이터베이스 병합으로 결합하세요."], ["언어·화면·단축키", "앱은 이 안내서와 동일한 10개 언어를 제공합니다. 메인 화면에서 언어를 바꾸면 조작 항목만 바뀌며 프롬프트, 이름, 메모는 번역되지 않습니다. 일부 기술 메시지는 포르투갈어입니다.", "<ui>Neon</ui>은 빛나는 테두리, <ui>Animações</ui>는 움직임을 제어합니다. 정적인 네온을 유지할 수 있습니다. 설정과 창 크기를 기억합니다. 이 웹페이지의 애니메이션 설정은 앱과 별개입니다.", "스크린샷은 영어로 유지됩니다. 조작 이름은 영어와 번역을 함께 표시합니다. 아래 단축키는 웹페이지가 아니라 앱에 적용됩니다."], ["개인정보: 금고가 아닙니다", "데이터베이스는 암호화되지 않습니다. 파일에 접근할 수 있는 사람은 SQLite 도구로 읽을 수 있습니다. 백업, JSON, 썸네일도 정보를 노출할 수 있습니다. 데이터베이스 비밀번호 보호 기능은 없습니다.", "일상적인 아이디어, 일반 지시문, 비공개 데이터 없는 참고자료만 저장하세요. 비밀번호, API 키, 토큰, 개인 서류, 금융·의료 데이터, 고객 기밀은 넣지 마세요. 가상 또는 익명화한 예를 사용하세요.", "Prompchu는 프롬프트를 자동 전송하지 않습니다. 하지만 외부 AI에 붙여 넣거나 파일을 공유하거나 동기화 폴더에 두면 컴퓨터 밖으로 나갈 수 있습니다. 공유 전 메모, 네거티브, 이미지도 검토하세요.", "Windows 기본 위치는 보통 %APPDATA%\\Bugzinho\\BancoDePrompts\\prompts.sqlite3입니다. 직접 만든 데이터베이스는 선택한 위치에 있습니다. 앱에서 경로를 확인하고 백업을 보호하며 오류 보고에 개인 데이터베이스를 첨부하지 마세요."], ["자주 묻는 질문", "항목이 안 보이나요? 열린 데이터베이스, <ui>Limpar filtros</ui>, 페이지, 즐겨찾기, 선반, 날짜를 확인하세요. 결과 수가 있으면 다음 페이지를 보세요. 다른 데이터베이스를 열어도 이전 파일은 지워지지 않습니다.", "파일이 안 열리나요? ZIP을 풀고 JSON이나 이름만 바꾼 다른 형식이 아닌 Prompchu SQLite인지 확인하세요. 폴더 쓰기 권한을 점검하세요. 원본을 보존하고 백업으로 시험하며 문제 해결을 위해 데이터를 삭제하지 마세요.", "썸네일이 없으면 형식·크기·해상도를 확인하고 저장하세요. 이미지 없는 카드는 정상입니다. 가져오기와 병합 뒤 중복도 예상된 동작입니다.", "<ui>Sobre</ui>에서 버전과 공식 링크를 볼 수 있습니다. Issue에는 운영체제, 버전, 재현 단계를 가상 데이터로 알려 주세요. 아래에 저장소, 릴리스, Bugzinho 사이트와 후원 링크가 있습니다."]], "examples": [["제품 이미지", "[목적]을 위한 [제품] 이미지를 만드세요. 형태, 비율, 재질을 유지하고 [배경], [조명], [구도]를 사용하세요. 나중에 글자를 넣을 공간을 남기세요. [화면 비율]의 구성 한 장을 출력하세요. 핵심 참고자료가 없으면 생성 전에 질문하세요.", "선반: 이미지 • 태그: 제품, 스튜디오, 재사용"], ["튜토리얼 영상", "[대상]에게 [작업]을 가르치는 [길이]의 튜토리얼을 계획하세요. [자료]만 사용하세요. 예상 시간, 화면, 내레이션, 화면 문구를 표로 제공하세요. 준비 사항, 단계, 최종 확인을 포함하고 미확인 사항을 표시하세요. 기능을 지어내지 마세요.", "선반: 영상 • 태그: 튜토리얼, 대본, 교육"], ["회의 요약", "[메모]를 목적, 결정, 실행 항목, 담당자, 기한으로 정리하세요. 이름이나 날짜를 만들지 말고 누락은 “제공되지 않음”으로 표시하세요. 결정과 제안을 구분하고 짧은 요약과 실행 표를 제공하세요. 저장 전에 가상 데이터를 사용하세요.", "선반: 문서 • 태그: 회의, 요약, 실행"], ["코드 검토", "[언어]의 [코드]를 [예상 동작]에 맞춰 검토하세요. 논리 오류, 경계 사례, 실패 처리를 우선하세요. 각 문제의 영향과 최소 수정을 설명하고 확인 가능한 테스트를 제안하세요. 맥락이 부족하면 필요한 정보를 명시하세요. 비밀이나 인증정보를 넣지 마세요.", "선반: 프로그래밍 • 태그: 검토, 테스트, 코드"]]}, "zh": {"eyebrow": "手册 • 教程 • 使用建议", "hero": "让好点子有个家。", "intro": "从第一条记录到独立集合，学习保存、查找和复用提示词。", "download": "下载应用", "start": "开始教程", "search": "搜索指南…", "language": "语言", "motion": "动画", "on": "开启", "off": "关闭", "menu": "浏览指南", "close": "关闭", "zoom": "放大截图", "copy": "复制模板", "copied": "已复制！", "copyFail": "请选择文本并手动复制。", "noResults": "没有找到主题，请尝试其他词。", "clear": "清除搜索", "privacyBadge": "本地保存不等于加密", "version": "文档对应版本", "sectionsLabel": "指南目录", "screenshotNote": "使用虚构数据截取的真实英文界面。部分程序消息可能仍为葡萄牙语。", "site": "Bugzinho 网站", "repo": "代码仓库", "donate": "支持项目", "releases": "发布与下载", "examplesLink": "下载实用数据库", "top": "返回顶部", "print": "打印 / 保存 PDF", "exampleTitle": "可调整的模板", "exampleIntro": "替换方括号中的字段，复制并保存为应用中的条目。Prompchu 保存文本，执行需要使用你选择的工具。", "shortcutTitle": "应用快捷键", "footer": "Prompchu 独立文档。本页不使用账号、翻译 API，也不上传提示词。语言和动画偏好仅保存在当前浏览器中。", "shortcutNames": ["新建提示词", "编辑所选项", "搜索当前界面", "复制所选项"], "stats": ["种语言", "个可选数据库", "个可复用模板"], "sections": [["认识 Prompchu", "Prompchu 是桌面提示词管理器，用来保存给 AI 工具或其他流程的指令。记录背景、限制和备注，便于重复使用有效的提示词。它不生成内容、不执行提示词，也不需要 API 密钥。", "{{VERSION}} 版提供卡片式资料库、缩略图、收藏、自定义书架和独立数据库。内容保存在电脑中。适合日常用途，不应当作机密信息保险箱。"], ["下载与启动", "在发布页面选择系统。64 位 Windows 10/11：下载 Windows-AMD64.zip，解压整个文件夹，再运行其中的 Prompchu.exe。不要直接从 ZIP 内启动，也不要单独移动可执行文件。", "Linux x86_64：解压 tar.gz，在具备 Qt/X11/OpenGL 库的图形环境中运行 ./Prompchu/Prompchu。基于 Ubuntu 22.04 构建，不是 AppImage。macOS Apple Silicon：解压 Darwin-arm64.zip 并打开 Prompchu.app；面向 macOS 15 及以上，不支持 Intel。已包含 Python。", "安装包没有 Authenticode 签名或 Apple 公证。SHA256SUMS.txt 用于检查下载完整性，不是作者签名。使用官方链接，启动后在主界面选择语言。"], ["创建第一个提示词", "点击 <ui>Novo prompt</ui>。在 <ui>Nome *</ui> 输入清楚的标题，例如“产品摄影 — 干净背景”；在 Prompt 中输入完整指令。两项均为必填。", "<ui>Tags (separadas por vírgula)</ui> 用于逗号分隔的关键词，<ui>Gêneros (separados por vírgula)</ui> 用于风格，<ui>Categoria</ui> 用于任务类别，<ui>Modelo / ferramenta</ui> 用于记录目标工具。工具字段只是记录，不会连接 AI。", "选择 <ui>Prateleira</ui>；在 <ui>Prompt negativo</ui> 记录要避免的内容，在 <ui>Notas</ui> 记录变量、技巧和测试结果。点击 <ui>Salvar</ui>。负面提示词单独保存，目标工具支持时请另行复制。", "选中条目后可阅读各个标签页。<ui>Copiar prompt</ui> 复制正文；<ui>Editar</ui> 修改，<ui>Duplicar</ui> 创建变体，<ui>Excluir</ui> 确认后删除。在编辑器中输入不等于保存。"], ["浏览资料库", "点击 <ui>Biblioteca</ui>。卡片显示标题、标签和添加日期，图片可选。点击卡片会回到主界面并打开提示词。<ui>Voltar</ui> 也可返回。", "搜索覆盖名称、正文和元数据，不区分大小写和重音。可结合书架、类别、风格及 <ui>Favoritos</ui>。逗号分隔的标签必须全部匹配。启用 <ui>Data de adição</ui> 可限定日期范围。", "使用 <ui>Mais recentes</ui>、<ui>Mais antigos</ui>、<ui>Nome A–Z</ui> 或 <ui>Atualizados</ui> 排序。找不到内容时可用 <ui>Limpar filtros</ui>。资料库每页 24 张卡片，主列表每页 100 条。<ui>Anterior</ui> 与 <ui>Próxima</ui> 翻页；搜索始终针对整个数据库。"], ["书架与缩略图", "点击左侧列表上方的 <ui>Criar prateleira</ui>，输入名称并点击 <ui>Salvar</ui>。即使为空，也会出现在编辑器与筛选器中。自定义书架属于当前数据库。", "名称最多 80 个字符。不接受空名称或忽略大小写与重音后重复的名称。要把提示词放入书架，请用 <ui>Editar</ui> 选择 <ui>Prateleira</ui> 并保存。创建书架不会自动移动条目。", "<ui>Escolher miniatura</ui> 接受不超过 20 MB、4000 万像素的 JPG/PNG。图片缩小至最多 640 × 400 并存入 SQLite，原图之后可移动。<ui>Remover miniatura</ui> 恢复默认卡片，最后用 <ui>Salvar</ui> 确认。"], ["创建与切换数据库", "数据库是包含提示词、日期、收藏、图片和书架的 .sqlite3 文件。它不是账号，也不是图片文件夹。可以把工作、学习与个人项目分成多个文件。", "在 <ui>Arquivo</ui> 中，<ui>Criar banco</ui> 在新文件中创建空集合。<ui>Abrir banco</ui> 在同一窗口打开已有集合。切换前会提交旧数据库中尚未提交的写入。", "当前名称显示在页眉下方，鼠标悬停可查看完整路径。程序记住上次打开的数据库。切换会清除界面筛选并加载新集合的选项。添加、删除和收藏会保存；编辑表单需要点击 <ui>Salvar</ui>。"], ["备份、合并与转移", "用 <ui>Arquivo</ui> 和 <ui>Backup do banco</ui> 将整个数据库复制到另一个文件。另在其他设备保存一份。备份包含图片和空书架，可通过 <ui>Abrir banco</ui> 打开检查或恢复。", "<ui>Juntar bancos</ui> 要求两个源文件和一个新目标路径。它创建并打开第三个数据库，保留原文件、日期、收藏、图片和空书架。重复条目不会自动删除。", "只转移一条时：选中它，用 <ui>Exportar prompt</ui> 保存 JSON，打开目标数据库，再用 <ui>Importar prompt</ui>。仅导出所选提示词及其元数据、图片。导入是追加而非替换；重复导入产生副本，添加日期变为导入日期。", "支持导入 JSON v1/v2，导出为 v2。Prompchu 1.2.0 不能导入 v2。JSON 用于转移提示词，SQLite 用于打开完整集合。升级旧数据库前先备份。"], ["编写可复用提示词", "明确目标、背景、资料、限制和输出格式。“为[读者]将[文本]概括成五点，保留数字并标记缺失信息”比“写得好一点”更便于检验。", "使用[方括号字段]，并在备注说明填写方法。Prompchu 不会自动替换变量。将指令与参考资料分开，说明信息不足时应如何处理，不要要求编造来源或事实。", "每个模板围绕一个主要目标，用不敏感的例子测试并检查结果。大幅修改有效版本前使用 <ui>Duplicar</ui>。在备注记录变化和适用场景。字数多不保证质量，具体且可验证的指令更有用。"], ["可选实用数据库", "{{EXAMPLES_FILE}} 包含图片、视频、文档、编程、音乐、学习、营销、写作和效率九个数据库，每个 60 条。540 个模板以葡萄牙语编写：每个领域 20 项任务，各有创建、审核和改写版本。", "单独下载 ZIP 并解压，用 <ui>Arquivo</ui> 与 <ui>Abrir banco</ui> 选择 .sqlite3。不会自动安装或导入。使用前替换字段。修改会保存；重新解压可恢复原始示例。", "下载程序不会用示例填充个人集合。少量条目可通过 JSON 转移，整个集合可通过合并数据库整合。"], ["语言、外观与快捷键", "应用支持与本教程选择器完全相同的十种语言。主界面切换语言会改变控件，不翻译提示词、名称或备注。部分技术消息仍为葡萄牙语。", "<ui>Neon</ui> 控制发光边框，<ui>Animações</ui> 控制运动。可保留静态霓虹。偏好与窗口大小会记住。此网页的动画设置独立于应用。", "截图始终为英文。操作名称以英文加所选语言译文显示。下列快捷键属于程序，不属于网页。"], ["隐私：不是保险箱", "数据库没有加密。任何能访问文件的人都可以用 SQLite 工具读取。备份、JSON 和缩略图也可能泄露信息。程序不提供数据库密码保护。", "仅保存日常想法、通用指令、不含隐私的模板与参考资料。不要保存密码、API 密钥、令牌、个人证件、财务或医疗数据、客户机密。示例使用虚构或匿名化数据。", "Prompchu 不会自动上传提示词。但粘贴到外部 AI、分享数据库、保存在同步文件夹中，都可能让数据离开电脑。分享前也要检查备注、负面提示词与图片。", "Windows 默认路径通常是 %APPDATA%\\Bugzinho\\BancoDePrompts\\prompts.sqlite3。自建数据库位于你选择的位置。请在程序查看路径，妥善保护备份，不要在错误报告中附上私人数据库。"], ["常见问题", "找不到条目？检查当前数据库、<ui>Limpar filtros</ui>、页码、收藏、书架和日期。计数有结果时可继续翻页。打开别的数据库不会删除原文件。", "文件打不开？先解压 ZIP，确认是 Prompchu SQLite，而不是 JSON 或仅修改扩展名的其他格式。检查文件夹写入权限。保留原文件并尝试备份，不要为排查问题删除数据。", "缩略图缺失？检查格式、大小、分辨率并保存编辑。没有图片的卡片是正常的，导入或合并后的重复条目也符合当前行为。", "<ui>Sobre</ui> 显示版本与官方链接。提交 Issue 时提供系统、版本和复现步骤，使用虚构数据。下方提供仓库、发布页、Bugzinho 网站与捐赠链接。"]], "examples": [["产品图片", "为[用途]创建[产品]图片。保留形状、比例与材质，使用[背景]、[灯光]和[构图]。为后期文字预留空间。输出一张[画面比例]的构图。缺少关键参考资料时，请先提问再生成。", "书架：图片 • 标签：产品、摄影棚、复用"], ["教程视频", "规划一个面向[受众]、教授[任务]、时长为[时长]的教程。仅使用[资料]。以表格给出预计时间、画面、旁白、屏幕文字。包含前提条件、步骤与最终检查。标记待确认事项，不要编造功能。", "书架：视频 • 标签：教程、脚本、教育"], ["会议摘要", "将[笔记]整理为目标、决定、行动、负责人和期限。不要编造姓名或日期，缺失时写“未提供”。区分决定和建议。输出简短摘要与行动表。保存模板前请使用虚构数据。", "书架：文档 • 标签：会议、摘要、行动"], ["代码审核", "根据[预期行为]审核用[语言]编写的[代码]。优先检查逻辑错误、边界情况与失败处理。说明每个问题的影响和最小修复，提出可观察结果的测试。缺少上下文时说明需要什么。不要包含秘密或凭据。", "书架：编程 • 标签：审核、测试、代码"]]}, "ru": {"eyebrow": "РУКОВОДСТВО • ОБУЧЕНИЕ • РЕКОМЕНДАЦИИ", "hero": "Место для лучших идей.", "intro": "Научитесь сохранять, находить и повторно использовать промпты — от первой записи до отдельных коллекций.", "download": "Скачать приложение", "start": "Начать обучение", "search": "Поиск по руководству…", "language": "Язык", "motion": "Анимации", "on": "Включены", "off": "Выключены", "menu": "Разделы руководства", "close": "Закрыть", "zoom": "Увеличить снимок", "copy": "Копировать шаблон", "copied": "Скопировано!", "copyFail": "Выделите текст и скопируйте вручную.", "noResults": "Тема не найдена. Попробуйте другое слово.", "clear": "Очистить поиск", "privacyBadge": "Локально — не значит зашифровано", "version": "Описанная версия", "sectionsLabel": "В руководстве", "screenshotNote": "Реальные английские снимки с вымышленными данными. Некоторые сообщения приложения могут быть на португальском.", "site": "Сайт Bugzinho", "repo": "Репозиторий", "donate": "Поддержать проект", "releases": "Релизы и загрузки", "examplesLink": "Скачать полезные базы", "top": "Наверх", "print": "Печать / сохранить PDF", "exampleTitle": "Шаблоны для адаптации", "exampleIntro": "Замените поля в скобках, скопируйте шаблон и сохраните запись в приложении. Prompchu хранит текст; выполняете его вы в выбранном инструменте.", "shortcutTitle": "Клавиши приложения", "footer": "Независимая документация Prompchu. Здесь нет аккаунтов, API перевода или отправки промптов. Язык и анимации сохраняются только в этом браузере.", "shortcutNames": ["Новый промпт", "Изменить выбранное", "Поиск на экране", "Копировать выбранное"], "stats": ["языков", "необязательных баз", "шаблонов"], "sections": [["Знакомство с Prompchu", "Prompchu — настольный органайзер промптов: инструкций для ИИ-инструментов и других процессов. Сохраняйте контекст, ограничения и заметки, чтобы повторно использовать удачные решения. Программа не создаёт контент, не выполняет промпты и не требует API-ключа.", "В версии {{VERSION}} есть карточная библиотека, миниатюры, избранное, собственные полки и независимые базы. Данные остаются на компьютере. Используйте приложение для повседневных задач, а не как сейф."], ["Загрузка и запуск", "Выберите свою систему на странице релизов. Windows 10/11, 64 бита: скачайте Windows-AMD64.zip, распакуйте всю папку и запустите Prompchu.exe внутри неё. Не запускайте из ZIP и не отделяйте исполняемый файл от остальных.", "Linux x86_64: распакуйте tar.gz и выполните ./Prompchu/Prompchu в графической среде с библиотеками Qt/X11/OpenGL. Сборка на Ubuntu 22.04, это не AppImage. macOS Apple Silicon: распакуйте Darwin-arm64.zip и откройте Prompchu.app; требуется macOS 15+, не Intel. Python включён.", "Пакеты не подписаны Authenticode и не нотарифицированы Apple. SHA256SUMS.txt проверяет целостность, а не авторство. Используйте официальные ссылки и выберите язык на главном экране."], ["Первый промпт", "Нажмите <ui>Novo prompt</ui>. В <ui>Nome *</ui> укажите понятное название, например «Фото товара — чистый фон». В Prompt введите полную инструкцию. Оба поля обязательны.", "<ui>Tags (separadas por vírgula)</ui> — ключевые слова через запятую, <ui>Gêneros (separados por vírgula)</ui> — стили, <ui>Categoria</ui> — тип задачи, <ui>Modelo / ferramenta</ui> — предполагаемый инструмент. Последнее поле только для записи и не подключает ИИ.", "Выберите <ui>Prateleira</ui>. В <ui>Prompt negativo</ui> запишите, чего избегать, в <ui>Notas</ui> — переменные, советы и результаты проверок. Нажмите <ui>Salvar</ui>. Негативная инструкция хранится отдельно: копируйте её, если целевой инструмент поддерживает такой ввод.", "Выберите запись для чтения вкладок. <ui>Copiar prompt</ui> копирует основной текст. <ui>Editar</ui> редактирует, <ui>Duplicar</ui> создаёт вариант, <ui>Excluir</ui> удаляет после подтверждения. Ввод текста в редактор ещё не означает сохранение."], ["Работа с библиотекой", "Откройте <ui>Biblioteca</ui>. Карточки показывают название, теги и дату; изображение необязательно. Щелчок открывает промпт на главном экране. Вернуться можно и через <ui>Voltar</ui>.", "Поиск охватывает названия, текст и метаданные без учёта регистра и диакритики. Сочетайте полку, категорию, жанр и <ui>Favoritos</ui>. Все теги через запятую должны присутствовать. <ui>Data de adição</ui> включает ограничение по датам.", "Сортируйте по <ui>Mais recentes</ui>, <ui>Mais antigos</ui>, <ui>Nome A–Z</ui> или <ui>Atualizados</ui>. Если записи пропали, попробуйте <ui>Limpar filtros</ui>. На странице библиотеки 24 карточки, в главном списке 100 записей. <ui>Anterior</ui> и <ui>Próxima</ui> переключают страницы; поиск работает по всей базе."], ["Полки и миниатюры", "Нажмите <ui>Criar prateleira</ui> над левым списком, введите имя и подтвердите <ui>Salvar</ui>. Полка доступна в редакторе и фильтрах даже пустой. Пользовательские полки принадлежат открытой базе.", "Максимум 80 символов. Пустые и повторные имена без учёта регистра и диакритики отклоняются. Чтобы назначить полку записи, откройте <ui>Editar</ui>, выберите <ui>Prateleira</ui> и сохраните. Создание полки не перемещает записи.", "<ui>Escolher miniatura</ui> принимает JPG/PNG до 20 МБ и 40 мегапикселей. Изображение уменьшается до 640 × 400 и хранится в SQLite; исходник затем можно переместить. <ui>Remover miniatura</ui> возвращает стандартную карточку. Подтвердите через <ui>Salvar</ui>."], ["Создание и смена баз", "База — файл .sqlite3 с промптами, датами, избранным, изображениями и полками. Это не аккаунт и не папка картинок. Разделяйте работу, учёбу и личные проекты на разные файлы.", "В <ui>Arquivo</ui> команда <ui>Criar banco</ui> создаёт пустую коллекцию в новом файле. <ui>Abrir banco</ui> открывает существующую в том же окне. Перед переключением подтверждаются незавершённые записи в предыдущую базу.", "Имя видно под заголовком; наведите курсор для полного пути. Последняя база запоминается. При смене экранные фильтры очищаются, а варианты загружаются из новой коллекции. Добавления, удаления и избранное сохраняются; форма редактирования требует <ui>Salvar</ui>."], ["Копии, объединение и перенос", "Через <ui>Arquivo</ui> и <ui>Backup do banco</ui> сохраните полную копию в другой файл. Держите дополнительную копию на другом устройстве. Включены картинки и пустые полки. Откройте копию через <ui>Abrir banco</ui> для проверки или восстановления.", "<ui>Juntar bancos</ui> запрашивает два источника и новый путь. Создаёт и открывает третью базу, сохраняя исходники, даты, избранное, изображения и пустые полки. Дубликаты автоматически не удаляются.", "Для одной записи: выберите её, используйте <ui>Exportar prompt</ui>, сохраните JSON, откройте целевую базу и нажмите <ui>Importar prompt</ui>. Экспортируется только выбранный промпт с метаданными и миниатюрой. Импорт добавляет, не заменяет. Повторный импорт создаёт копии; датой добавления становится дата импорта.", "Поддерживается импорт JSON v1/v2 и экспорт v2. Prompchu 1.2.0 не импортирует v2. JSON переносит промпты, SQLite открывает целые коллекции. Перед обновлением старых баз сделайте резервную копию."], ["Многоразовые промпты", "Укажите цель, контекст, материалы, ограничения и формат ответа. «Суммируй [ТЕКСТ] в пяти пунктах для [АУДИТОРИЯ], сохрани числа и отметь пробелы» проверяемее, чем «напиши хороший текст».", "Используйте [ПОЛЯ В СКОБКАХ] и объясняйте их в заметках. Prompchu не подставляет переменные автоматически. Отделяйте инструкции от материалов и задавайте поведение при нехватке информации. Не просите выдумывать источники или факты.", "Одна главная цель на шаблон, проверки на нечувствительных примерах и оценка результата полезнее лишнего объёма. Перед серьёзной переработкой удачного варианта нажмите <ui>Duplicar</ui>. Запишите изменения и подходящие случаи использования. Длина сама по себе не гарантирует качество."], ["Необязательные полезные базы", "{{EXAMPLES_FILE}} содержит девять баз по 60 записей: изображения, видео, документы, программирование, музыка, учёба, маркетинг, письмо и продуктивность. Все 540 шаблонов на португальском: 20 задач на область с вариантами создания, проверки и адаптации.", "Скачайте отдельный ZIP, распакуйте и выберите .sqlite3 через <ui>Arquivo</ui> и <ui>Abrir banco</ui>. Ничего не устанавливается и не импортируется автоматически. Замените поля перед использованием. Изменения сохраняются; повторная распаковка вернёт исходные примеры.", "Загрузка приложения не наполняет вашу коллекцию. Переносите отдельные записи через JSON или объединяйте базы целиком."], ["Языки, оформление и клавиши", "В приложении те же десять языков, что в переключателе руководства. Выбор языка меняет элементы интерфейса, но не промпты, имена и заметки. Некоторые технические сообщения остаются на португальском.", "<ui>Neon</ui> управляет светящимися контурами, <ui>Animações</ui> — движением. Можно оставить статичный неон. Настройки и размер окна запоминаются. Анимация сайта настраивается отдельно от приложения.", "Скриншоты остаются английскими; названия команд даны на английском с переводом рядом. Следующие сочетания клавиш относятся к приложению, а не странице."], ["Конфиденциальность: это не сейф", "Базы НЕ зашифрованы. Любой с доступом к файлу может прочитать его средствами SQLite. Копии, JSON и миниатюры тоже могут раскрыть информацию. Защиты базы паролем нет.", "Храните только повседневные идеи, общие инструкции и материалы без личных данных. Не сохраняйте пароли, API-ключи, токены, личные документы, финансовые и медицинские сведения или тайны клиентов. Используйте вымышленные или обезличенные примеры.", "Prompchu не отправляет промпты автоматически. Но вставка во внешний ИИ, передача базы или синхронизируемая папка могут вынести данные за пределы компьютера. Проверяйте заметки, негативные промпты и изображения перед передачей.", "Обычный путь Windows: %APPDATA%\\Bugzinho\\BancoDePrompts\\prompts.sqlite3. Ваши базы находятся там, где вы их сохранили. Проверяйте путь, защищайте копии и не прикладывайте частные базы к сообщениям об ошибках."], ["Частые вопросы", "Не находите запись? Проверьте открытую базу, <ui>Limpar filtros</ui>, страницы, избранное, полку и даты. При ненулевом счётчике пролистайте страницы. Открытие другой базы не удаляет предыдущий файл.", "Файл не открывается? Распакуйте ZIP, убедитесь, что это SQLite Prompchu, а не JSON или переименованный формат. Проверьте право записи в папку. Сохраните оригинал и попробуйте резервную копию; не удаляйте данные ради проверки.", "Не видно миниатюру? Проверьте формат, размер, разрешение и сохраните изменения. Карточки без изображений нормальны, как и дубликаты после импорта или объединения.", "В <ui>Sobre</ui> есть версия и официальные ссылки. Для Issue укажите систему, версию и шаги воспроизведения с вымышленными данными. Ниже — репозиторий, релизы, сайт Bugzinho и пожертвования."]], "examples": [["Изображение товара", "Создай изображение [ТОВАРА] для [ЦЕЛИ]. Сохрани форму, пропорции и материалы. Используй [ФОН], [СВЕТ] и [РАКУРС]. Оставь место для текста, который добавят позже. Выдай одну композицию в [ФОРМАТЕ]. Если важного референса не хватает, спроси до генерации.", "Полка: Изображения • Теги: товар, студия, шаблон"], ["Обучающее видео", "Спланируй урок длительностью [ВРЕМЯ], обучающий [ЗАДАЧЕ] аудиторию [АУДИТОРИЯ]. Используй только [МАТЕРИАЛ]. Дай таблицу с примерным временем, изображением, озвучкой и экранным текстом. Включи условия, шаги и итоговую проверку. Отметь неподтверждённое, не выдумывай функции.", "Полка: Видео • Теги: обучение, сценарий, урок"], ["Итоги встречи", "Преобразуй [ЗАМЕТКИ] в цель, решения, действия, ответственных и сроки. Не придумывай имена или даты; при отсутствии пиши «не указано». Отдели решения от предложений. Дай краткое резюме и таблицу действий. Перед сохранением шаблона используй вымышленные данные.", "Полка: Документы • Теги: встреча, резюме, действия"], ["Проверка кода", "Проверь [КОД] на [ЯЗЫКЕ] относительно [ОЖИДАЕМОГО ПОВЕДЕНИЯ]. Приоритет — логические ошибки, граничные случаи и обработка сбоев. Для каждого замечания объясни влияние и минимальное исправление. Предложи проверяемые тесты. Укажи недостающий контекст. Не включай секреты и учётные данные.", "Полка: Программирование • Теги: проверка, тесты, код"]]}};

const IDS = ['overview','install','first-prompt','library','shelves','databases','transfer','prompt-design','examples','appearance','privacy','help'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storage = {get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const param = new URLSearchParams(location.search).get('lang');
let lang = [param,storage.get('prompchu-guide-lang'),CONFIG.DEFAULT_LANGUAGE].find(x=>Object.hasOwn(TEXTS,x)) || 'pt';
let motion = storage.get('prompchu-guide-motion')!=='off' && !matchMedia('(prefers-reduced-motion: reduce)').matches;
let observer,toastTimer;
function ui(key){const entry=UI[key];const english=entry.en;const local=entry[lang];return `<span class="ui-term">${esc(english)}${lang!=='en'?' ('+esc(local)+')':''}</span>`}
function markup(text){return esc(text.replaceAll('{{VERSION}}',CONFIG.APP_VERSION).replaceAll('{{EXAMPLES_FILE}}',CONFIG.EXAMPLES_FILE)).replace(/&lt;ui&gt;(.*?)&lt;\/ui&gt;/g,(_,key)=>ui(key))}
function url(key){return esc(CONFIG[key])}
function link(key,label,primary=false){return `<a class="btn ${primary?'primary':'secondary'}" href="${url(key)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`}
function shot(name,title,small=false){const t=TEXTS[lang];return `<figure${small?' class="smallshot"':''}><button type="button" class="shot" data-image="${name}" data-title="${esc(title)}" aria-label="${esc(t.zoom+': '+title)}"><img src="${IMAGES[name]}" alt="${esc(title)}" loading="lazy" decoding="async"></button><figcaption>${esc(t.screenshotNote)} ${esc(t.zoom)}.</figcaption></figure>`}
function templates(){const t=TEXTS[lang];return `<h3>${esc(t.exampleTitle)}</h3><p>${esc(t.exampleIntro)}</p><div class="model-grid">${t.examples.map((e,i)=>`<article class="model"><h3>${esc(e[0])}</h3><pre id="prompt-${i}">${esc(e[1])}</pre><small>${esc(e[2])}</small><button type="button" data-copy="${i}">${esc(t.copy)}</button></article>`).join('')}</div>`}
function shortcuts(){const t=TEXTS[lang];return `<h3>${esc(t.shortcutTitle)}</h3><table aria-label="${esc(t.shortcutTitle)}"><tbody>${['Ctrl+N','Ctrl+E','Ctrl+F','Ctrl+Shift+C'].map((k,i)=>`<tr><td><kbd>${k}</kbd></td><td>${esc(t.shortcutNames[i])}</td></tr>`).join('')}</tbody></table>`}
function extras(i,t){if(i===1)return `<div class="section-actions">${link('RELEASES_URL',t.releases,true)}</div>`;if(i===2)return shot('home-en',t.sections[i][0]);if(i===3)return shot('library-en',t.sections[i][0]);if(i===5)return shot('file-en',t.sections[i][0],true);if(i===7)return templates();if(i===8)return `<div class="section-actions">${link('EXAMPLES_URL',t.examplesLink,true)}</div>`;if(i===9)return shortcuts();if(i===11)return `<div class="resource-links">${link('REPOSITORY_URL',t.repo)}${link('RELEASES_URL',t.releases)}${link('WEBSITE_URL',t.site)}${link('DONATE_URL',t.donate,true)}</div>`;return ''}

applyMotion();$('#search').addEventListener('input',search);$('#clearSearch').onclick=()=>{$('#search').value='';search();$('#search').focus()};$('.mobile-menu').onclick=e=>{const open=$('.rail').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(open))};$('#print').onclick=()=>window.print();
if(observer)observer.disconnect();if('IntersectionObserver'in window){observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){document.querySelectorAll('#toc a').forEach(a=>{const active=a.hash==='#'+e.target.id;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current')})}},{rootMargin:'-110px 0px -55% 0px',threshold:0});document.querySelectorAll('.chapter').forEach(e=>observer.observe(e))}
}
function fold(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function search(){const q=fold($('#search').value.trim());let count=0;document.querySelectorAll('.chapter').forEach((section,i)=>{const match=!q||fold(section.textContent).includes(q);section.hidden=!match;document.querySelectorAll('#toc a')[i].hidden=!match;if(match)count++});$('#empty').hidden=!!count}
function applyMotion(){document.documentElement.classList.toggle('no-motion',!motion);$('#motion').textContent=`${TEXTS[lang].motion}: ${motion?TEXTS[lang].on:TEXTS[lang].off}`;$('#motion').setAttribute('aria-pressed',String(motion))}
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3000)}
$('#language').innerHTML=Object.entries(LANGUAGES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('#language').onchange=e=>{const anchor=location.hash;lang=e.target.value;storage.set('prompchu-guide-lang',lang);render();if(anchor&&document.getElementById(anchor.slice(1)))document.getElementById(anchor.slice(1)).scrollIntoView({behavior:'instant'})};
$('#motion').onclick=()=>{motion=!motion;storage.set('prompchu-guide-motion',motion?'on':'off');applyMotion()};
$('#app').addEventListener('click',async e=>{const image=e.target.closest('[data-image]');if(image){$('#lightboxImage').src=IMAGES[image.dataset.image];$('#lightboxImage').alt=image.dataset.title;$('#lightboxTitle').textContent=image.dataset.title;$('#lightbox').showModal();return}const copy=e.target.closest('[data-copy]');if(copy){const text=TEXTS[lang].examples[Number(copy.dataset.copy)][1];try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(text);toast(TEXTS[lang].copied)}catch{const range=document.createRange();range.selectNodeContents(document.getElementById('prompt-'+copy.dataset.copy));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);toast(TEXTS[lang].copyFail)}}});
